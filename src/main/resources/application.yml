yona:
  smtp:
    # 알림 메일의 보내는 주소: `user@domain`(domain을 비우면 사이트 호스트 이름). 접속 정보는 spring.mail.*로 설정한다.
    user: yona
    domain: yona.local

# OpenAPI 문서(X-31, D-50). 외부 API 이름 공간(`/-_-api`) 안에 두어 사용자 이름 예약어를 더하지 않는다.
springdoc:
  paths-to-match: /-_-api/**
  api-docs:
    path: /-_-api/docs/openapi
  swagger-ui:
    path: /-_-api/docs

spring:
  autoconfigure:
    exclude:
      # 스프링 시큐리티가 임시 사용자와 비밀번호를 만들어 WARN 로그로 남긴다. 이 앱은 쓰지 않는 값이지만 로그에 비밀번호가 찍히고 OTLP 로그로 수집기에 나간다(X-10)
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  web:
    error:
      # 스프링 부트의 오류 화면 주소를 바꾼다. 기본값 `/error`는 v1.6에서 `/:user` 라우트(사용자 `error`)라서 같은 응답이 나와야 한다.
      path: /-_-error
  thymeleaf:
    servlet:
      # 템플릿을 끝까지 그린 뒤 한꺼번에 내보낸다(Play 템플릿과 같다). 기본값(`true`)은 그리는 대로 응답 작성기에 쓰는데, springdoc이 Jackson 2를 클래스패스에
      # 끌어오면 타임리프가 `th:inline="javascript"`를 Jackson으로 직렬화하며 작성기를 비워(`flush`) 응답이 커밋되고, 이어지는 사용자 메뉴가 세션을 만들려다
      # "Cannot create a session after the response has been committed"로 실패해 화면이 3KB쯤에서 끊겼다(X-31, A-273).
      produce-partial-output-while-processing: false
  application:
    name: yona
  config:
    # 최초 기동 화면(`welcome/secret`)이 정한 사이트 비밀 키(`yona.secret`)를 읽는다. 파일이 없으면 건너뛴다.
    import: "optional:file:${yona.data-dir:${yona.data:.}}/config/secret.properties"
  datasource:
    # 기본 프로파일은 개발과 테스트를 위한 인메모리 H2이다.
    url: jdbc:h2:mem:yona;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  servlet:
    multipart:
      # 데이터 올리기(`/sites/import`)는 DB 전체 파일이라 크기를 제한하지 않는다(v1.6도 제한하지 않는다).
      max-file-size: -1
      max-request-size: -1
  messages:
    # v1.6(Play 2.3)의 conf/messages* 파일을 그대로 쓴다. Play는 인자가 없는 메시지도 MessageFormat으로
    # 해석하므로(작은따옴표는 두 번 쓴다) Spring도 모든 메시지를 MessageFormat으로 해석해야 한다.
    # messages: v1.6의 conf/messages, messages-play: Play 기본 검증 메시지(앞의 파일이 우선한다)
    basename: messages,messages-play
    encoding: UTF-8
    always-use-message-format: true
    # 메시지 키가 없으면 Play처럼 키 이름을 그대로 보여 준다(Spring 기본은 `??키_로캘??`). v1.6 영어 메시지에 없는 키가 있다.
    use-code-as-default-message: true
    # 번역이 없으면 서버의 시스템 로캘이 아니라 기본(영어) 메시지를 쓴다.
    fallback-to-system-locale: false
  jpa:
    hibernate:
      # 스키마는 엔티티에서 생성한다(v1.6의 Play evolutions를 대체). 구조는 V16Schema*Test가 보증한다.
      ddl-auto: update
    open-in-view: false
    properties:
      # `value`처럼 DB마다 예약어인 컬럼 이름(property.value)을 자동으로 따옴표 처리한다.
      hibernate.auto_quote_keyword: true
      # 즉시 로딩(EAGER) 연관을 한 번의 조인으로 읽는 깊이를 제한한다. 이슈 댓글처럼 연관이 깊은 엔티티를 id로 읽을 때
      # 조인 표가 늘어 MariaDB의 61개 한도를 넘는 문제를 막는다. 깊이를 넘는 연관은 별도 조회로 읽으므로 결과는 같다.
      hibernate.max_fetch_depth: 2

# 톰캣 스레드 풀 지표(tomcat.threads.*)를 켠다. 긴 git 요청이 스레드를 점유해 풀이 고갈되는 것을 보려는 것이다(X-10 C5a).
server:
  tomcat:
    mbeanregistry:
      enabled: true

# SpringDoc이 기동마다 "운영에서는 이 엔드포인트를 끄라"는 안내를 WARN으로 남긴다. 로그 대시보드(Loki)의 WARN 이상 패널이 이 안내로만 채워져 진짜 경고가 묻히므로
# 안내 로그의 수준만 올린다(엔드포인트는 그대로 켜 둔다. v1.6 동작이 아니라 추가 항목의 OpenAPI 문서 X-31이다).
logging:
  level:
    org.springdoc.core.events.SpringDocAppInitializer: ERROR

# 관측성(X-10, D-64). 상태 확인만 열고 상세를 숨긴다. 기본 경로 `/actuator`는 v1.6의 `/:user` 라우트(사용자 이름 actuator)와 겹치므로
# 오류 경로(`/-_-error`)처럼 `-_-` 이름 공간에 둔다. 지표, 추적, 로그의 OTLP 내보내기를 켜고 끄는 일은 `ObservabilityActivation`이 한다: 수집기 주소
# (`OTEL_EXPORTER_OTLP_ENDPOINT`)가 없으면 모두 끄고 있으면 켠다. 직접 정한 `management.*.enabled`가 우선한다.
management:
  metrics:
    distribution:
      # p95를 histogram_quantile로 계산하려면 히스토그램 버킷을 내보내야 한다. 대시보드와 알림이 쓰는 타이머만 켠다(시리즈 수를 아끼려고 모두 켜지 않는다)
      percentiles-histogram:
        http.server.requests: true
        yona.vcs.request: true
        yona.vcs.operation.duration: true
        yona.job.duration: true
        yona.background.duration: true
        yona.ldap.authenticate: true
        yona.search.duration: true
      # git과 svn 요청, 스케줄 작업, 백그라운드 일은 수 분까지 걸릴 수 있다
      maximum-expected-value:
        yona.vcs.request: 10m
        yona.job.duration: 10m
        yona.background.duration: 10m
      minimum-expected-value:
        yona.vcs.request: 5ms
  endpoints:
    web:
      base-path: /-_-actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        # readiness: DB와 데이터 디렉터리(쓰기, 여유 용량)만 본다. 메일, LDAP, 감사 스트리밍 대상이 죽었다고 서버를 트래픽에서 빼지 않는다(D-64 5번)
        readiness:
          include: readinessState,db,dataDirectory
  health:
    # 외부 의존은 상태 확인에서 빼고 지표로만 본다(D-64 5번)
    mail:
      enabled: false
    ldap:
      enabled: false
    diskspace:
      enabled: false

---
# PostgreSQL 프로파일: docker-compose.yml로 띄운 컨테이너에 연결한다.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:25432/yona
    username: yona
    password: yona
  mail:
    host: localhost
    port: 21025
