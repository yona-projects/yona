<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-1(decisions.md D-71): OAuth 앱 만들기와 수정 화면. 종류(공개, 기밀)는 만든 뒤 바꿀 수 없다
  모델: title, client(수정이면 id, clientId, confidential), form(Form), formError(오류의 메시지 키), scopeChoices(고를 수 있는 범위)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::oauthPage})}">
<th:block th:fragment="oauthPage">
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{oauth.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('oauth-apps')}"></th:block>
        <div class="two-factor-page">
        <div th:if="${formError != null}" class="alert alert-danger" th:text="#{${formError}}"></div>
        <h4 th:text="${client == null} ? #{oauth.form.title.new} : #{oauth.form.title.edit}"></h4>
        <p th:if="${client != null}" class="mb-3"><span th:text="#{oauth.apps.clientId}"></span>: <code id="edit-client-id" th:text="${client.clientId}"></code></p>
        <form id="oauth-app-form" method="post" th:action="${client == null} ? @{/user/oauth-apps} : @{/user/oauth-apps/{id}(id=${client.id})}">
            <div class="mb-3">
                <label for="oauth-name" class="form-label" th:text="#{oauth.form.name}"></label>
                <input id="oauth-name" type="text" name="name" maxlength="100" class="form-control tf-wide" th:value="${form.name}">
            </div>
            <div class="mb-3">
                <label for="oauth-description" class="form-label" th:text="#{oauth.form.description}"></label>
                <input id="oauth-description" type="text" name="description" maxlength="500" class="form-control tf-wide" th:value="${form.description}">
            </div>
            <div class="mb-3">
                <label for="oauth-home" class="form-label" th:text="#{oauth.form.homeUrl}"></label>
                <input id="oauth-home" type="text" name="homeUrl" maxlength="500" class="form-control tf-wide" th:value="${form.homeUrl}" placeholder="https://example.com">
            </div>
            <div class="mb-3">
                <label for="oauth-redirects" class="form-label" th:text="#{oauth.form.redirectUris}"></label>
                <textarea id="oauth-redirects" name="redirectUris" rows="4" class="form-control tf-wide font-monospace" spellcheck="false" th:text="${form.redirectUris}"></textarea>
                <div class="form-text" th:text="#{oauth.form.redirectUris.help}"></div>
            </div>
            <div class="mb-3">
                <span class="form-label d-block" th:text="#{oauth.form.type}"></span>
                <div class="form-check" th:each="t : ${ {'public', 'confidential'} }">
                    <input class="form-check-input" type="radio" name="type" th:id="'oauth-type-' + ${t}" th:value="${t}" th:checked="${t == 'confidential'} == ${form.confidential}" th:disabled="${client != null}">
                    <label class="form-check-label" th:for="'oauth-type-' + ${t}" th:text="#{'oauth.type.' + ${t}}"></label>
                </div>
                <div class="form-text" th:text="#{oauth.form.type.help}"></div>
            </div>
            <div class="mb-3">
                <span class="form-label d-block" th:text="#{oauth.form.scopes}"></span>
                <div class="form-check" th:each="s : ${scopeChoices}">
                    <input class="form-check-input" type="checkbox" name="scope" th:id="'oauth-scope-' + ${s}" th:value="${s}" th:checked="${form.scopes.contains(s)}">
                    <label class="form-check-label" th:for="'oauth-scope-' + ${s}"><code th:text="${s}"></code> <span class="text-body-secondary" th:text="#{'apiToken.scope.' + ${s}}"></span></label>
                </div>
                <div class="form-text" th:text="#{oauth.form.scopes.help}"></div>
            </div>
            <div class="tf-actions">
                <button type="submit" class="btn btn-success" th:text="${client == null} ? #{oauth.form.create} : #{oauth.form.save}"></button>
                <a th:href="@{/user/editform/oauth-apps}" class="btn btn-outline-secondary cancel" th:text="#{button.cancel}"></a>
            </div>
        </form>
        <section class="tf-section" th:if="${client != null and client.confidential}">
            <h4 th:text="#{oauth.secret.title}"></h4>
            <p th:text="#{oauth.secret.regenerate.help}"></p>
            <form method="post" th:action="@{/user/oauth-apps/{id}/secret(id=${client.id})}" th:attr="onsubmit='return confirm(\'' + #{oauth.secret.regenerate.confirm} + '\');'">
                <button type="submit" class="btn btn-secondary" th:text="#{oauth.secret.regenerate}"></button>
            </form>
        </section>
        </div>
    </div>
</div>
</th:block>
</html>
