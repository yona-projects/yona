<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-1(decisions.md D-71): 설정의 OAuth 앱 화면. 한 화면에 내가 만든 앱과 승인한 앱이 있다
  모델: title, apps(AppRow 목록), authorized(AuthorizedRow 목록), userAppsEnabled, urls(OAuthAppUrls)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::oauthPage})}">
<th:block th:fragment="oauthPage">
<div class="site-breadcrumb-outer" id="pageTitle">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{oauth.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap shell user-screen">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('oauth-apps')}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>
        <div class="two-factor-page oauth-screen">
        <p class="text-body-secondary mb-4" th:text="#{oauth.description}"></p>

        <th:block th:replace="~{oauth/partial-apps :: mine(${apps}, ${urls}, ${userAppsEnabled}, 'oauth.apps.mine', 'oauth.apps.mine.empty')}"></th:block>

        <section class="tf-section">
            <h4 th:text="#{oauth.apps.authorized}"></h4>
            <p th:text="#{oauth.apps.authorized.description}"></p>
            <div id="authorized-empty" class="tf-empty" th:if="${#lists.isEmpty(authorized)}" th:text="#{oauth.apps.authorized.empty}"></div>
            <ul id="authorized-apps" class="item-cards list-unstyled" th:if="${!#lists.isEmpty(authorized)}">
                <li th:each="x : ${authorized}" class="item-card authorized-row">
                    <div class="item-card-head"><span class="item-card-name" th:text="${x.name}"></span></div>
                    <dl class="item-card-meta">
                        <dt th:text="#{oauth.apps.by}"></dt><dd th:text="${x.ownerOrganization != null} ? #{oauth.apps.byOrganization(${x.ownerOrganization})} : (${x.ownerLoginId != null} ? ${x.ownerLoginId} : ${x.host})"></dd>
                        <dt th:text="#{oauth.apps.scopes}"></dt><dd><code th:each="s : ${x.scopes}" th:text="${s}" class="me-1"></code></dd>
                        <dt th:text="#{oauth.apps.approvedDate}"></dt><dd th:text="${x.approvedText}"></dd>
                    </dl>
                    <div class="item-card-actions">
                        <form method="post" th:action="@{/user/oauth-apps/authorized/{id}/revoke(id=${x.clientRowId})}" th:attr="onsubmit='return confirm(\'' + #{oauth.apps.authorized.revoke.confirm} + '\');'">
                            <button type="submit" class="btn btn-danger btn-sm" th:text="#{oauth.apps.authorized.revoke}"></button>
                        </form>
                    </div>
                </li>
            </ul>
        </section>
        </div>
    </div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
