  추가 개발 항목 X-2(decisions.md D-69): 2단계 인증 목록 화면. 인증 앱, 백업 코드, 알려진 기기를 한 화면에서 다룬다
  모델: title, enabled, backupRemaining, devices(DeviceRow 목록)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::twoFactorPage})}">
<th:block th:fragment="twoFactorPage">
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{twoFactor.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('two-factor')}"></th:block>
        <p class="text-body-secondary" th:text="#{twoFactor.description}"></p>

        <p th:if="${!enabled}" id="two-factor-off" class="empty" th:text="#{twoFactor.list.empty}"></p>
        <form th:if="${!enabled}" method="post" th:action="@{/user/two-factor/begin}">
            <button type="submit" class="btn btn-success" th:text="#{twoFactor.add}"></button>
        </form>

        <th:block th:if="${enabled}">
        <table id="two-factor-list" class="table table-striped">
            <thead><tr><th th:text="#{twoFactor.method}"></th><th></th></tr></thead>
            <tbody>
            <tr>
                <td th:text="#{twoFactor.method.totp}"></td>
                <td>
                    <form method="post" th:action="@{/user/two-factor/disable}" th:attr="onsubmit='return confirm(\'' + #{twoFactor.delete.confirm} + '\');'">
                        <button type="submit" class="btn btn-danger btn-sm" th:text="#{twoFactor.delete}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <h4 class="mt-4" th:text="#{twoFactor.backup.title}"></h4>
        <p id="backup-remaining" th:text="#{twoFactor.backup.remaining(${backupRemaining})}"></p>
        <form method="post" th:action="@{/user/two-factor/backup-codes}" th:attr="onsubmit='return confirm(\'' + #{twoFactor.backup.regenerate.confirm} + '\');'">
            <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{twoFactor.backup.regenerate}"></button>
        </form>

        <h4 class="mt-4" th:text="#{twoFactor.devices.title}"></h4>
        <p class="text-body-secondary" th:text="#{twoFactor.devices.description}"></p>
        <table id="device-list" class="table table-striped" th:if="${!#lists.isEmpty(devices)}">
            <thead><tr><th th:text="#{twoFactor.devices.name}"></th><th th:text="#{twoFactor.devices.ip}"></th><th th:text="#{twoFactor.devices.lastUsed}"></th><th th:text="#{twoFactor.devices.expires}"></th><th></th></tr></thead>
            <tbody>
            <tr th:each="d : ${devices}" class="device-row">
                <td th:text="${d.name}"></td><td th:text="${d.ip}"></td><td th:text="${d.lastUsedText}"></td><td th:text="${d.expiresText}"></td>
                <td>
                    <form method="post" th:action="@{/user/two-factor/devices/{id}/delete(id=${d.id})}">
                        <button type="submit" class="btn btn-danger btn-sm" th:text="#{twoFactor.devices.delete}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(devices)}" class="empty" th:text="#{twoFactor.devices.empty}"></p>
        </th:block>
    </div>
</div>
</th:block>
</html>
