<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="issueRow(row)"
          th:with="issue=${row.item}, base=${#paths.project(row.owner, row.project)}, url=${#paths.project(row.owner, row.project) + '/issue/' + row.item.number}">
    <li class="post-item title row align-items-start" th:id="'issue-item-' + ${issue.id}" th:href="@{${url}}">
        <div class="col-lg-12 span-hard-wrap row align-items-start">
            <div class="col-lg-2 project-name-in-my-issues fixed-height-my-issues-list">
                <span class="infos-item project-name">
                    <a th:href="@{${base}}" class="title project" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{project.name}" th:text="${row.project}"></a>
                </span>
                <span class="infos-item post-id" th:text="'#' + ${issue.number}"></span>
            </div>
            <div class="title-wrap col-lg-5">
                <span class="title-cell">
                    <a th:href="@{${url}}" class="title" th:text="${issue.title}"></a>
                    <span th:if="${issue.commentCount > 0 or issue.voterCount > 0}" class="item-count-groups">
                        <th:block th:if="${issue.commentCount > 0}"><th:block th:replace="~{common/comment-count :: commentCount(@{${url + '#comments'}}, ${issue.commentCount}, false)}"></th:block></th:block>
                        <th:block th:if="${issue.voterCount > 0}"><th:block th:replace="~{common/vote-count :: voteCount(@{${url + '#vote'}}, ${issue.voterCount}, false)}"></th:block></th:block>
                    </span>
                    <span class="for-subtask-progressbar">
                        <th:block th:if="${issue.subtask != null}">
                            <div class="subtask-progress upload-progress" th:classappend="${issue.subtask.percent == 100} ? 'done-outline' : 'red-outline'">
                                <div class="bar" th:classappend="${issue.subtask.percent == 100} ? 'done' : 'red'" th:style="'width: ' + ${issue.subtask.percent} + '%;'" title="Subtask"></div>
                            </div>
                            <span class="subtask-progress completion-ratio" th:classappend="${issue.subtask.percent == 100} ? 'txt-green'"><th:block th:if="${issue.subtask.percent != 100}" th:text="${issue.subtask.closed} + '/'"></th:block><th:block th:text="${issue.subtask.total}"></th:block></span>
                        </th:block>
                        <span th:if="${issue.parent != null}" class="infos-item subtask">
                            <a th:href="@{${#paths.project(issue.parent.owner, issue.parent.project) + '/issue/' + issue.parent.number}}" th:text="${issue.parent.label}"></a>
                        </span>
                    </span>
                    <a th:each="label : ${issue.labels}" th:href="@{${base + '/issues?state=open&labelIds=' + label.id}}" class="badge issue-label list-label bg-secondary" th:attr="data-label-id=${label.id}" th:style="'background:' + ${label.color}" th:text="${label.name}"></a>
                    <div class="child-issue-list hide">
                        <div th:if="${!issue.children.isEmpty()}" class="child-issues">
                            <th:block th:each="child : ${issue.children}">
                            <div class="issue-item child-issue" th:classappend="${child.selected} ? 'selected-child'">
                                <span class="state-label" th:classappend="${child.state}"><i th:if="${child.state == 'closed'}" class=" yobicon-checkmark"></i></span>
                                <a class="twoColumeModeTarget" th:href="@{${#paths.project(child.owner, child.project) + '/issue/' + child.number}}">
                                    <span class="item-name">
                                        <span class="subtask-number"><span th:if="${child.draft}" class="draft-number" th:text="'#' + #{issue.state.draft}"></span><th:block th:unless="${child.draft}" th:text="'#' + ${child.number}"></th:block></span>
                                        <span th:text="${child.title}"></span>
                                        <span th:if="${child.assigneeName != null}" th:text="'- ' + ${child.assigneeName}"></span>
                                    </span>
                                </a>
                                <span class="font12 no-border-at-child">
                                    <span th:if="${child.commentCount > 0 or child.voterCount > 0}" class="item-count-groups">
                                        <th:block th:if="${child.commentCount > 0}"><th:block th:replace="~{common/comment-count :: commentCount(@{${base + '/issue/' + child.number + '#comments'}}, ${child.commentCount}, true)}"></th:block></th:block>
                                        <th:block th:if="${child.voterCount > 0}"><th:block th:replace="~{common/vote-count :: voteCount(@{${base + '/issue/' + child.number + '#vote'}}, ${child.voterCount}, true)}"></th:block></th:block>
                                    </span>
                                </span>
                                <a th:each="label : ${child.labels}" th:href="@{${#paths.project(child.owner, child.project) + '/issues?state=open'}(labelIds=${label.id})}" class="badge issue-label list-label active twoColumeModeTarget bg-secondary" th:attr="data-category-id=${label.categoryId}, data-label-id=${label.id}" th:style="'background:' + ${label.color}" th:text="${label.name}"></a>
                                <span class="child-issue-date" th:title="${child.createdTitle}" th:text="${child.createdAgo}"></span>
                            </div>
                            </th:block>
                        </div>
                    </div>
                </span>
            </div>
            <div class="col-lg-1 hide-in-mobile author project-name-in-my-issues fixed-height-my-issues-list">
                <a th:if="${row.authorPureName != null}" th:href="@{/{u}(u=${row.authorLoginId})}" class="infos-item infos-link-item author-cell" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="${row.authorLoginId}" th:text="${row.authorPureName}"></a>
                <span th:unless="${row.authorPureName != null}" class="infos-item" th:text="#{issue.noAuthor}"></span>
            </div>
            <div class="col-lg-1 hide-in-mobile author project-name-in-my-issues fixed-height-my-issues-list">
                <a th:if="${row.assigneePureName != null}" th:href="@{/{u}(u=${issue.assigneeLoginId})}" class="infos-item infos-link-item author-cell" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="${issue.assigneeLoginId}" th:text="${row.assigneePureName}"></a>
                <span th:unless="${row.assigneePureName != null}" class="infos-item"></span>
            </div>
            <div class="infos col-lg-3 meta">
                <span class="meta-cell">
                    <span class="hide show-in-mobile">
                        <a th:if="${row.assigneePureName != null}" th:href="@{/{u}(u=${issue.assigneeLoginId})}" class="infos-item infos-link-item author-cell" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="${issue.assigneeLoginId}" th:text="${row.assigneePureName}"></a>
                        <span th:unless="${row.assigneePureName != null}" class="infos-item"></span>
                    </span>
                    <span class="infos-item" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="${row.timeTitle}" th:text="${row.timeText}"></span>

                    <span th:if="${row.milestoneVisible}" class="mileston-tag">
                        <a th:href="@{${base + '/milestone/' + issue.milestoneId}}" data-bs-toggle="tooltip" data-bs-placement="bottom" th:title="#{milestone}" th:text="${issue.milestoneTitle}"></a>
                    </span>

                    <span th:if="${issue.due != null}" class="float-end" th:classappend="${row.overdue} ? 'overdue'" data-bs-toggle="tooltip" data-bs-placement="top" th:title="'Due date: ' + ${row.dueDateString}">
                        <i class="yobicon-clock2"></i>
                        <th:block th:text="${issue.due.text}"></th:block>
                    </span>
                </span>
            </div>
        </div>
    </li>
</th:block>
