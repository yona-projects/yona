<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::editPage})}">
<th:block th:fragment="editPage">
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{userinfo.accountSetting}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('profile')}"></th:block>

        <form id="frmBasic" method="post" th:action="@{/user/edit}" class="float-start">
        <dl>
            <dt th:text="#{user.loginId}"></dt>
            <dd class="mt10">
                <input type="text" class="text form-control" th:value="${account.loginId}" readonly>
            </dd>
          <dt th:text="#{user.name}"></dt>
          <dd class="mt10">
            <input type="text" name="name" class="text form-control" th:value="${account.name}">
          </dd>
          <dt th:text="#{user.email}"></dt>
          <dd class="mt10">
            <input type="email" name="email" class="text form-control" th:value="${account.email}">
          </dd>
          <dd>
            <button type="submit" class="ybtn ybtn-success" th:text="#{userinfo.editProfile}"></button>
          </dd>
        </dl>
        </form>

        <form id="frmAvatar" method="post" th:action="@{/user/edit}" class="float-start" style="margin-left:50px; padding-left:50px; border-left:1px solid #ddd;">
          <input type="hidden" name="name" th:value="${account.rawName}">
          <input type="hidden" name="email" th:value="${account.email}">

          <div class="avatar-frm">
            <div class="avatar-wrap xlarge">
              <img th:src="${account.avatarUrl256}" style="width:128px; max-width:none;" />
            </div>
            <div class="upload-progress avatar" style="display:none;"><div class="bar orange"></div></div>
            <div class="btn-wrap mt10 center-txt">
              <div class="ybtn ybtn-small fake-file-wrap btnUploadAvatar">
                <th:block th:text="#{userinfo.changeAvatar}"></th:block><!--
                --><input id="avatarFile" type="file" class="file form-control" name="filePath" accept="image/*">
              </div>
            </div>
          </div>
        </form>

        <div class="reset-user-visited-list">
            <hr/>
            <form method="post" th:action="@{/user/resetVisitedList}">
                <button type="submit" class="ybtn" th:text="#{userinfo.reset.visited.project.list}"></button>
            </form>
        </div>
        <div id="avatarCropWrap" class="modal" role="dialog" data-bs-backdrop="static"><div class="modal-dialog"><div class="modal-content">
          <div class="modal-header center-txt">
            <div class="avatar-wrap xlarge">
              <img style="width:128px; max-width:none;"/>
            </div>
          </div>
          <div class="modal-body">
            <img style="max-width:500px;">
            <canvas width="128" height="128" class="hide"></canvas>
          </div>
          <div class="modal-footer">
            <button type="button" class="ybtn ybtn-default" data-bs-dismiss="modal" th:text="#{button.cancel}"></button>
            <button type="button" class="ybtn ybtn-success btnSubmitCrop" th:text="#{button.save}"></button>
          </div>
        </div></div></div>

        <link rel="stylesheet" type="text/css" th:href="@{/assets/stylesheets/jcrop/jquery.Jcrop.css}" />
        <script type="text/javascript" th:src="@{/assets/javascripts/lib/jquery/jquery.Jcrop.min.js}"></script>
        <script type="text/javascript" th:src="@{/assets/javascripts/lib/canvas-to-blob.js}"></script>
    </div>
</div>
<script type="text/javascript">
    $(function(){
        $yobi.loadModule("user.Setting");
    });
</script>
</th:block>
</html>
