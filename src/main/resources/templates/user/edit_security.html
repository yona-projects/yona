<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{site/layout :: head(#{userinfo.security})}">
</head>
<body class="theme-default">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div class="site-breadcrumb-outer">
        <div class="site-breadcrumb-inner">
            <h3 th:text="#{userinfo.security}">보안</h3>
        </div>
    </div>
    <div class="page-wrap-outer">
        <div class="page-wrap">
            <div th:replace="~{user/partial_edit_tabmenu :: tabmenu('security')}"></div>

            <!--
             GitHub "Settings > Password and authentication" 화면과 동일한 구성 — 등록된 2FA
             방식(보안 키/TOTP) 목록 + 추가/삭제 버튼 + 백업 코드 재발급 + 전체 비활성화.
            -->

            <div th:if="${totpAdded != null}" class="alert alert-success mt20">
                <span th:text="#{security.totp.add.success}">TOTP가 활성화되었습니다.</span>
            </div>
            <div th:if="${twoFactorDisabled != null}" class="alert alert-success mt20">
                <span th:text="#{security.disable.success}">2단계 인증이 비활성화되었습니다.</span>
            </div>
            <div th:if="${disableError != null}" class="alert alert-error mt20">
                <span th:text="#{security.disable.error}">비밀번호가 일치하지 않습니다.</span>
            </div>
            <div th:if="${deleteError != null}" class="alert alert-error mt20">
                <span th:text="#{security.delete.error}">비밀번호가 일치하지 않아 삭제되지 않았습니다.</span>
            </div>

            <h4 class="mt20">
                <span th:text="#{security.webauthn.title}">보안 키 / 생체 인증</span>
                <a th:href="@{/user/editform/security/webauthn/new}" class="ybtn ybtn-success pull-right" th:text="#{security.webauthn.add}">보안 키 추가</a>
            </h4>
            <table class="table" th:if="${webauthnCredentials != null and !webauthnCredentials.isEmpty()}">
                <thead>
                <tr>
                    <th th:text="#{security.field.label}">이름</th>
                    <th th:text="#{security.field.createdAt}">등록일</th>
                    <th th:text="#{security.field.lastUsedAt}">마지막 사용일</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cred : ${webauthnCredentials}">
                    <td th:text="${cred.label}">보안 키</td>
                    <td th:text="${cred.createdAt}">2026-01-01</td>
                    <td th:text="${cred.lastUsedAt != null ? cred.lastUsedAt : '-'}">-</td>
                    <td>
                        <form method="post" th:action="@{/user/editform/security/webauthn/{id}/delete(id=${cred.id})}"
                              th:attr="data-confirm-message=#{security.webauthn.delete.confirm}" class="security-delete-form">
                            <input type="password" name="password" th:placeholder="#{security.delete.passwordLabel}" required style="width: 140px;">
                            <button type="submit" class="ybtn ybtn-small ybtn-danger" th:text="#{security.delete}">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${webauthnCredentials == null or webauthnCredentials.isEmpty()}" th:text="#{security.webauthn.empty}">등록된 보안 키가 없습니다.</p>

            <h4 class="mt20">
                <span th:text="#{security.totp.title}">인증 앱(TOTP)</span>
                <a th:href="@{/user/editform/security/totp/new}" class="ybtn ybtn-success pull-right" th:text="#{security.totp.add}">TOTP 추가</a>
            </h4>
            <table class="table" th:if="${totpCredentials != null and !totpCredentials.isEmpty()}">
                <thead>
                <tr>
                    <th th:text="#{security.field.label}">이름</th>
                    <th th:text="#{security.field.activatedAt}">활성화일</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cred : ${totpCredentials}">
                    <td th:text="${cred.label}">인증 앱</td>
                    <td th:text="${cred.activatedAt}">2026-01-01</td>
                    <td>
                        <form method="post" th:action="@{/user/editform/security/totp/{id}/delete(id=${cred.id})}"
                              th:attr="data-confirm-message=#{security.totp.delete.confirm}" class="security-delete-form">
                            <input type="password" name="password" th:placeholder="#{security.delete.passwordLabel}" required style="width: 140px;">
                            <button type="submit" class="ybtn ybtn-small ybtn-danger" th:text="#{security.delete}">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${totpCredentials == null or totpCredentials.isEmpty()}" th:text="#{security.totp.empty}">등록된 TOTP가 없습니다.</p>

            <h4 class="mt20" th:text="#{security.backupCodes.title}">백업 코드</h4>
            <p th:text="${hasBackupCodes} ? #{security.backupCodes.exists} : #{security.backupCodes.none}">백업 코드가 발급되어 있습니다.</p>
            <form method="post" th:action="@{/user/editform/security/backup-codes/regenerate}"
                  th:attr="data-confirm-message=#{security.backupCodes.regenerate.confirm}" class="security-delete-form">
                <button type="submit" class="ybtn" th:text="#{security.backupCodes.regenerate}">백업 코드 재발급</button>
            </form>

            <h4 class="mt20" th:text="#{security.disable.title}">2단계 인증 비활성화</h4>
            <form method="post" th:action="@{/user/editform/security/disable}"
                  th:attr="data-confirm-message=#{security.disable.confirm}" class="security-delete-form">
                <div class="mt10">
                    <label th:text="#{security.disable.passwordLabel}">현재 비밀번호</label>
                    <input type="password" name="password" class="text" required style="width: 260px;">
                </div>
                <div class="mt10">
                    <button type="submit" class="ybtn ybtn-danger" th:text="#{security.disable.submit}">2단계 인증 끄기</button>
                </div>
            </form>
        </div>
    </div>
    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
<script type="text/javascript">
    document.addEventListener('submit', function(e) {
        var form = e.target.closest('.security-delete-form');
        if (!form) { return; }
        var message = form.getAttribute('data-confirm-message');
        if (message && !confirm(message)) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
