<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{site/layout :: head(#{userinfo.gpgKeys})}">
</head>
<body class="theme-default">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div class="site-breadcrumb-outer">
        <div class="site-breadcrumb-inner">
            <h3 th:text="#{userinfo.gpgKeys}">GPG 키</h3>
        </div>
    </div>
    <div class="page-wrap-outer">
        <div class="page-wrap">
            <div th:replace="~{user/partial_edit_tabmenu :: tabmenu('gpg-keys')}"></div>

            <!--
             yona-wiki P3-03 Step7/Step9 — GitHub의 "Settings > SSH and GPG keys" 화면의 GPG 키
             섹션과 동일한 구성. 등록 시 UID 이메일 중 계정 소유로 인증된 이메일과 일치하는 것만
             표시한다(실제 서명 검증에 쓰이는 값과 동일 — GpgKeyServiceImpl 참고).
            -->

            <div th:if="${gpgKeyError != null}" class="alert alert-error mt20">
                <span th:text="${gpgKeyError}">Error</span>
            </div>

            <h4 class="mt20" th:text="#{gpgkey.list.title}">등록된 GPG 키</h4>
            <table class="table" th:if="${gpgKeys != null and !gpgKeys.isEmpty()}">
                <thead>
                <tr>
                    <th th:text="#{gpgkey.field.title}">키 ID</th>
                    <th th:text="#{gpgkey.field.uids}">사용자 ID</th>
                    <th th:text="#{gpgkey.field.createdAt}">등록일</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="key : ${gpgKeys}">
                    <td th:text="${key.keyId}">ABCDEF1234567890</td>
                    <td>
                        <span th:each="email : ${key.verifiedEmails}" class="label-head mr5" th:text="${email}">user@example.com</span>
                    </td>
                    <td th:text="${key.createdAt}">2026-01-01</td>
                    <td>
                        <form method="post" th:action="@{/user/editform/gpg-keys/{id}/delete(id=${key.id})}"
                              th:attr="data-confirm-message=#{gpgkey.delete.confirm}" class="gpgkey-delete-form">
                            <button type="submit" class="ybtn ybtn-small ybtn-danger" th:text="#{gpgkey.delete}">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${gpgKeys == null or gpgKeys.isEmpty()}" th:text="#{gpgkey.list.empty}">등록된 GPG 키가 없습니다.</p>

            <h4 class="mt20" th:text="#{gpgkey.add.title}">새 GPG 키 추가</h4>
            <form id="frmGpgKeyAdd" method="post" th:action="@{/user/editform/gpg-keys}" class="mt10">
                <div class="mt10">
                    <label th:text="#{gpgkey.field.armoredKey}">공개키</label>
                    <textarea name="armoredPublicKey" style="width: 90%;" rows="10" required="required"
                              th:placeholder="#{gpgkey.field.armoredKey.placeholder}"></textarea>
                </div>
                <div class="mt10">
                    <button type="submit" class="ybtn ybtn-success" th:text="#{gpgkey.add}">GPG 키 추가</button>
                </div>
            </form>
        </div>
    </div>
    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
<script type="text/javascript">
    document.addEventListener('submit', function(e) {
        var form = e.target.closest('.gpgkey-delete-form');
        if (!form) {
            return;
        }
        var message = form.getAttribute('data-confirm-message');
        if (message && !confirm(message)) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
