<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="pullRequestRow(pull)"
          th:with="base=${#paths.project(pull.projectOwner, pull.projectName)}, url=${#paths.project(pull.projectOwner, pull.projectName) + '/pullRequest/' + pull.number}">
<li class="post-item row align-items-start">
    <div class="col-lg-10">
        <a th:href="@{${base}}" class="avatar-wrap mlarge">
            <img th:src="@{${pull.projectLogoUrl}}" th:alt="${pull.projectOwner} + ' / ' + ${pull.projectName}">
        </a>
        <div class="title-wrap">
            <a th:href="@{${base}}" class="title project" th:text="${pull.projectName}"></a>
            <span class="post-id" th:text="${pull.number}"></span>
            <a th:href="@{${url}}" class="title" th:classappend="${pull.conflict} ? 'conflict'" th:text="${pull.title}"></a>
            <a th:each="l : ${pull.labels}" th:href="@{${url}}" class="badge issue-label active list-label bg-secondary" th:attr="data-label-id=${l.id}" th:style="'background:' + ${l.color}" th:text="${l.name}"></a>
        </div>
        <div class="infos">
            <a th:if="${pull.contributorName != null}" th:href="@{/{u}(u=${pull.contributorLoginId})}" class="infos-item infos-link-item" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${pull.contributorLoginId}" th:text="${pull.contributorName}"></a>
            <span th:unless="${pull.contributorName != null}" class="infos-item" th:text="#{issue.noAuthor}"></span>
            <span class="infos-item" th:title="${pull.createdTitle}" th:text="${pull.createdText}"></span>
            <a th:if="${pull.threadCount > 0}" th:href="@{${url + '#comments'}}" class="infos-item infos-icon-link">
                <i class="yobicon-comments"></i>
                <span class="size" th:text="${pull.threadCount}"></span>
            </a>
        </div>
    </div>
    <div class="col-lg-2">
        <div class="mt5 float-end">
            <a th:if="${pull.assigneeLoginId != null}" th:href="@{/{u}(u=${pull.assigneeLoginId})}" class="avatar-wrap assignee" data-bs-toggle="tooltip" data-bs-placement="top" th:attr="data-bs-original-title=#{issue.assignee} + ': ' + ${pull.assigneeName}" th:title="#{issue.assignee} + ': ' + ${pull.assigneeName}">
                <img th:src="@{${pull.assigneeAvatarUrl}}" width="32" height="32" th:alt="${pull.assigneeName}">
            </a>
            <a th:if="${pull.receiverLoginId != null}" th:href="@{/{u}(u=${pull.receiverLoginId})}" class="avatar-wrap assinee" data-bs-toggle="tooltip" data-bs-placement="top" title="" th:attr="data-bs-original-title=${pull.receiverName}">
                <img th:src="@{${pull.receiverAvatarUrl}}" width="32" height="32" th:alt="${pull.receiverName}">
            </a>
            <div th:unless="${pull.receiverLoginId != null or pull.assigneeLoginId != null}" class="empty-avatar-wrap">&nbsp;</div>
        </div>
        <div class="state float-end" th:classappend="${pull.stateClass}" th:text="#{${pull.stateKey}}"></div>
    </div>
</li>
</th:block>
