<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{site/layout :: head(#{oauthapp.register.title})}">
</head>
<body class="theme-default">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div class="site-breadcrumb-outer">
        <div class="site-breadcrumb-inner">
            <h3 th:text="#{oauthapp.register.title}">새 OAuth 앱 등록</h3>
        </div>
    </div>
    <div class="page-wrap-outer">
        <div class="page-wrap">
            <div th:replace="~{user/partial_edit_tabmenu :: tabmenu('oauth-apps-owned')}"></div>

            <!--
             edit_oauth_apps_owned.html(목록)에서 분리된 등록 폼 화면. 검증 실패 시
             (registerOwnedOAuthApp의 IllegalArgumentException — 앱 이름/Redirect URI 공백)
             목록이 아니라 이 화면으로 되돌아와 입력값과 오류 메시지를 함께 보여준다.
            -->

            <div th:if="${oauthAppError != null}" class="alert alert-error mt20">
                <span th:text="${oauthAppError}">Error</span>
            </div>

            <form id="frmOAuthAppRegister" method="post" th:action="@{/user/editform/oauth-apps-owned/register}" class="mt10">
                <div class="mt10">
                    <label th:text="#{oauthapp.field.name}">앱 이름</label>
                    <input type="text" name="clientName" class="text" style="width: 90%;" required="required"
                           th:value="${submittedClientName}">
                </div>

                <div class="mt10">
                    <label th:text="#{oauthapp.field.redirectUri}">Redirect URI</label>
                    <input type="text" name="redirectUri" class="text" style="width: 90%;" required="required"
                           th:placeholder="#{oauthapp.field.redirectUri.placeholder}"
                           th:value="${submittedRedirectUri}">
                </div>

                <div class="mt10">
                    <label th:text="#{oauthapp.field.clientType}">클라이언트 종류</label>
                    <div>
                        <label class="radio inline">
                            <input type="radio" name="confidential" value="false" th:checked="${!submittedConfidential}">
                            <span th:text="#{oauthapp.field.clientType.public}">Public</span>
                        </label>
                        <label class="radio inline ml10">
                            <input type="radio" name="confidential" value="true" th:checked="${submittedConfidential}">
                            <span th:text="#{oauthapp.field.clientType.confidential}">Confidential</span>
                        </label>
                    </div>
                </div>

                <div class="mt10">
                    <label th:text="#{oauthapp.field.scopes}">허용할 API 스코프</label>
                    <div>
                        <!--
                         availableScopes에는 API 스코프(예: issues:read)와 identity 스코프
                         (openid/profile/email, 콜론이 없다)가 함께 들어있다(register()의
                         화이트리스트 검증이 이 목록 하나만 기준으로 삼기 때문, OAuthAppRegistrationService
                         참고) — 여기서는 콜론이 있는 것만(API 스코프) 걸러서 보여주고, identity
                         스코프는 아래 별도 섹션에서 사람이 읽을 수 있는 설명과 함께 보여준다.
                        -->
                        <label class="checkbox inline" th:each="scope : ${availableScopes}"
                               th:if="${#strings.contains(scope, ':')}">
                            <input type="checkbox" name="scopes" th:value="${scope}"
                                   th:checked="${submittedScopes != null and submittedScopes.contains(scope)}">
                            <span th:text="${scope} + ' '">issues:read</span>
                        </label>
                    </div>
                    <p class="description" th:text="#{oauthapp.field.scopes.description}">설명</p>
                </div>

                <div class="mt10">
                    <label th:text="#{oauthapp.field.identityScopes}">Sign in with yona (OpenID Connect)</label>
                    <div>
                        <label class="checkbox inline">
                            <input type="checkbox" name="scopes" value="openid"
                                   th:checked="${submittedScopes != null and submittedScopes.contains('openid')}">
                            <span th:text="#{oauthapp.field.identityScopes.openid}">로그인 위임(openid) 허용</span>
                        </label>
                        <label class="checkbox inline ml10">
                            <input type="checkbox" name="scopes" value="profile"
                                   th:checked="${submittedScopes != null and submittedScopes.contains('profile')}">
                            <span th:text="#{oauthapp.field.identityScopes.profile}">이름·아바타 제공(profile)</span>
                        </label>
                        <label class="checkbox inline ml10">
                            <input type="checkbox" name="scopes" value="email"
                                   th:checked="${submittedScopes != null and submittedScopes.contains('email')}">
                            <span th:text="#{oauthapp.field.identityScopes.email}">이메일 주소 제공(email)</span>
                        </label>
                    </div>
                    <p class="description" th:text="#{oauthapp.field.identityScopes.description}">설명</p>
                </div>

                <div class="mt10">
                    <button type="submit" class="ybtn ybtn-success" th:text="#{oauthapp.register}">앱 등록</button>
                    <a th:href="@{/user/editform/oauth-apps-owned}" class="ybtn ml10" th:text="#{button.cancel}">취소</a>
                </div>
            </form>
        </div>
    </div>
    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
</body>
</html>
