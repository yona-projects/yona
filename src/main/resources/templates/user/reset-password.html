<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NONE', ~{::resetPasswordPage})}">
<th:block th:fragment="resetPasswordPage">
<div class="page full">
  <div class="center-wrap tag-line-wrap reset-password">
    <h1 class="title" th:utext="#{title.resetPasswordFor(${site.siteName})}">
    </h1>
    <p class="tag-line" th:text="#{app.description}"></p>
  </div>

  <div class="login-form-wrap frm-wrap">
    <form th:action="@{/resetPassword}" method="post" name="passwordReset">
      <input type="hidden" name="hashString" th:value="${hashString}">
      <dl>
        <dd>
          <input id="password" type="password" name="password" class="text password form-control" th:placeholder="#{user.password}" autocomplete="off">
        </dd>
        <dd>
          <input id="retypedPassword" type="password" name="retypedPassword" class="text password form-control" th:placeholder="#{validation.retypePassword}" autocomplete="off">
        </dd>
      </dl>

      <div class="btns-row">
        <button type="submit" class="ybtn ybtn-primary ybtn-fullsize" th:text="#{button.confirm}"></button>
      </div>
    </form>
  </div>
</div>

<script type="text/javascript" th:src="@{/assets/javascripts/lib/validate.js}"></script>
<script type="text/javascript">
    $(document).ready(function() {
        $yobi.loadModule("resetPassword");
    });
</script>
</th:block>
</html>
