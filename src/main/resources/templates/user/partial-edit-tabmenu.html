<!--/*
  이식 원본: app/views/user/partial_edit_tabmenu.scala.html
  매개변수: tabId(현재 탭: profile, password, notifications, emails, token)
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="tabmenu(tabId)">
<ul class="nav nav-tabs mt20 mb-3">
  <li class="nav-item">
    <a th:href="@{/user/editform}" th:text="#{userinfo.editProfile}" class="nav-link" th:classappend="${tabId == 'profile'} ? 'active'"></a>
  </li>
  <li class="nav-item">
    <a th:href="@{/user/editform/password}" th:text="#{userinfo.changePassword}" class="nav-link" th:classappend="${tabId == 'password'} ? 'active'"></a>
  </li>
  <li class="nav-item">
    <a th:href="@{/user/editform/notifications}" th:text="#{userinfo.changeNotifications}" class="nav-link" th:classappend="${tabId == 'notifications'} ? 'active'"></a>
  </li>
  <li class="nav-item">
    <a th:href="@{/user/editform/emails}" th:text="#{userinfo.changeEmails}" class="nav-link" th:classappend="${tabId == 'emails'} ? 'active'"></a>
  </li>
  <li class="nav-item">
    <a th:href="@{/user/editform/token}" th:text="#{userinfo.token}" class="nav-link" th:classappend="${tabId == 'token'} ? 'active'"></a>
  </li>
</ul>
</th:block>
