<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::notificationsPage})}">
<th:block th:fragment="notificationsPage">
<div class="site-breadcrumb-outer" id="pageTitle">
  <div class="site-breadcrumb-inner">
    <h3 th:text="#{userinfo.accountSetting}"></h3>
  </div>
</div>
<div class="page-wrap-outer">
  <div class="page-wrap shell user-screen">
    <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('notifications')}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>

    <div class="row align-items-start">
      <div class="col-lg-3 mr20">
      <input id="notification-project-filter" type="search" class="form-control form-control-sm" autocomplete="off" th:placeholder="#{notification.project.filter}">
      <ul id="notification-projects" role="tablist" class="list-unstyled lst-stacked">
        <li th:each="project, stat : ${notificationProjects}" th:class="${stat.first} ? 'active'">
          <a th:href="'#' + ${project.id}" data-bs-toggle="tab"><th:block th:text="${project.owner}"></th:block> / <th:block th:text="${project.name}"></th:block></a>
        </li>
      </ul>
      <div id="notification-project-empty" class="text-body-secondary small" hidden th:text="#{notification.project.filter.empty}"></div>
      </div>
      <div class="tab-content col">
        <div th:each="project, stat : ${notificationProjects}" th:id="${project.id}" th:class="'tab-pane ' + (${stat.first} ? 'active' : '')">
          <table class="table table-striped table-bordered">
            <tr th:each="row : ${project.rows}">
              <th th:text="#{${row.descrKey}}"></th>
              <td>
                <div class="switch" data-on-label="On" data-off-label="Off">
                  <input class="notiUpdate form-check-input" th:attr="data-href=@{/noti/toggle/{id}/{type}(id=${project.id},type=${row.type})}" type="checkbox" data-toggle="switch" th:checked="${row.enabled}">
                </div>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  <script type="module" th:inline="javascript">
/* 본문 교체 때도 모듈 등록이 끝난 뒤 초기화하도록 모듈을 먼저 불러온다(D-136) */
await import([[@{/assets/javascripts/esm/service/user.Setting.js}]]);
await import([[@{/assets/javascripts/esm/service/user.NotificationFilter.js}]]);
    $(function(){
        $yona.loadModule("user.Setting");
        $yona.loadModule("user.NotificationFilter");
    });
</script>
</div><!--/* .shell-main */-->
  </div>
</div>
</th:block>
</html>
