  추가 개발 항목 X-2(decisions.md D-69): 로그인의 2단계 화면. 비밀번호를 확인한 사용자가 인증 앱 코드나 백업 코드를 입력한다
  모델: title(문서 제목 메시지 키)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NONE', ~{::twoFactorPage})}">
<th:block th:fragment="twoFactorPage">
<div class="page full">
  <div class="center-wrap tag-line-wrap login">
    <h1 class="title" th:text="#{user.twoFactor.title}"></h1>
    <p class="tag-line" th:text="#{user.twoFactor.help}"></p>
  </div>
  <div class="login-form-wrap frm-wrap">
    <form id="two-factor-form" th:action="@{/users/login/2fa}" method="POST">
      <dl>
        <dd>
          <input id="two-factor-code" name="code" type="text" class="text form-control" autocomplete="one-time-code" inputmode="text" autofocus
                 th:placeholder="#{user.twoFactor.code}">
        </dd>
      </dl>
      <div class="remember-me-wrap">
        <input id="remember-device" type="checkbox" name="rememberDevice" value="true" class="checkbox form-check-input">
        <label for="remember-device" class="bg-checkbox" th:text="#{user.twoFactor.rememberDevice}"></label>
      </div>
      <div class="btns-row">
        <button type="submit" class="ybtn ybtn-primary ybtn-large ybtn-fullsize" th:text="#{user.twoFactor.submit}"></button>
      </div>
      <div th:if="${securityKey}" id="security-key-login" class="btns-row" style="display: none;">
        <button type="button" id="security-key-use" class="ybtn ybtn-large ybtn-fullsize" th:text="#{twoFactor.securityKey.use}"></button>
      </div>
      <div id="security-key-error" class="error" style="display: none;"></div>
      <div class="act-row mt5">
        <div class="links-wrap float-end">
          <a th:href="@{/users/loginform}" th:text="#{user.twoFactor.cancel}"></a>
        </div>
      </div>
    </form>
  </div>
</div>
<script th:if="${securityKey}" type="text/javascript" th:src="@{/assets/javascripts/common/yona.webauthn.js}"></script>
<script th:if="${securityKey}" type="text/javascript" th:inline="javascript">
    $(function () {
        if (!window.YonaWebAuthn || !YonaWebAuthn.supported()) { return; }
        $("#security-key-login").show();
        $("#security-key-use").on("click", function () {
            $("#security-key-error").hide();
            $.post(/*[[@{/users/login/2fa/webauthn/options}]]*/ "", null, null, "text").then(function (options) {
                return YonaWebAuthn.authenticate(options);
            }).then(function (credential) {
                return $.post(/*[[@{/users/login/2fa/webauthn}]]*/ "", { credential: credential, rememberDevice: $("#remember-device").is(":checked") }, null, "json");
            }).then(function (result) {
                location.href = result.redirect;
            }).catch(function (e) {
                $("#security-key-error").text(Messages(e && e.responseJSON && e.responseJSON.message ? e.responseJSON.message : "user.twoFactor.invalid")).show();
            });
        });
    });
</script>
</th:block>
</html>
