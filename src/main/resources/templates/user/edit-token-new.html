  추가 개발 항목 X-5(decisions.md D-36): 개인용 API 토큰 만들기 화면(이름, 만료, 범위). 목록(edit-token.html)과 따로 둔다
  모델: title, account, scopeOptions, maxDays, tokenError(입력 오류의 메시지 키)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::tokenPage})}">
<th:block th:fragment="tokenPage">
<style th:replace="~{user/partial-token-form :: tokenStyle}"></style>
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{apiToken.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('token')}"></th:block>
        <div th:if="${tokenError != null}" class="alert alert-danger" th:text="#{${tokenError}}"></div>
        <form id="token-create" method="post" th:action="@{/user/token}">
            <div class="token-card">
                <div class="token-card-head" th:text="#{apiToken.create}"></div>
                <div class="token-card-body">
                    <div th:replace="~{user/partial-token-form :: nameField('')}"></div>
                    <div th:replace="~{user/partial-token-form :: expiryField(${maxDays})}"></div>
                    <div th:replace="~{user/partial-token-form :: scopeField(${scopeOptions}, ${ {} })}"></div>
                    <div class="token-actions">
                        <button type="submit" class="ybtn ybtn-success" th:text="#{apiToken.create}"></button>
                        <a th:href="@{/user/editform/token}" class="ybtn" th:text="#{button.cancel}"></a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<th:block th:replace="~{user/partial-token-form :: tokenScripts}"></th:block>
</th:block>
</html>
