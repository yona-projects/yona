  추가 개발 항목 X-5(decisions.md D-36): 개인용 API 토큰의 목록, 만들기(이름, 만료, 범위), 삭제
  모델: title, account, tokens(TokenRow 목록), scopeOptions, maxDays, newToken(만든 직후 한 번만), tokenError(입력 오류의 메시지 키)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::tokenPage})}">
<th:block th:fragment="tokenPage">
<style th:replace="~{user/partial-token-form :: tokenStyle}"></style>
<div class="site-breadcrumb-outer" id="pageTitle">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{apiToken.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap shell user-screen">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('token')}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>
        <p class="token-meta" th:text="#{apiToken.description}"></p>

        <!--/* 방금 만든 토큰은 이 응답에서 한 번만 보이고 다시 볼 수 없다 */-->
        <div th:if="${newToken != null}" class="alert alert-success">
            <p th:text="#{apiToken.created.once}"></p>
            <input id="new-token-value" type="text" readonly class="text form-control" size="60" style="width: 90%"
                   onClick="this.setSelectionRange(0, this.value.length)" th:value="${newToken}">
            <span class="hide" th:text="${newToken}"></span>
        </div>

        <!--/* A-581: 토큰 목록은 카드이다(토큰마다 이름, 앞부분, 범위, 만든 날, 마지막 사용, 만료, 삭제) */-->
        <ul id="token-list" class="item-cards list-unstyled" th:if="${!#lists.isEmpty(tokens)}">
            <li th:each="t : ${tokens}" class="item-card token-row" th:attr="data-id=${t.id}">
                <div class="item-card-head">
                    <a class="item-card-name token-edit" th:href="@{/user/editform/token/{id}(id=${t.id})}" th:text="${t.name}"></a>
                </div>
                <div th:if="${t.legacy}" class="legacy-warning alert alert-warning">
                    <strong th:text="#{apiToken.legacy}"></strong> <span th:text="#{apiToken.legacy.warning}"></span>
                </div>
                <dl class="item-card-meta">
                    <dt th:text="#{apiToken.prefix}"></dt><dd><code class="token-prefix" th:text="${t.prefix}"></code></dd>
                    <dt th:text="#{apiToken.scopes}"></dt>
                    <dd><span th:if="${t.unrestricted}" class="token-scope badge text-bg-warning" th:text="#{apiToken.scopes.unrestricted}"></span><span th:each="s : ${t.scopes}" class="token-scope badge bg-secondary" th:text="${s}" th:title="#{'apiToken.scope.' + ${s}}"></span></dd>
                    <dt th:text="#{apiToken.createdDate}"></dt><dd th:text="${t.createdText}"></dd>
                    <dt th:text="#{apiToken.lastUsed}"></dt><dd th:text="${t.lastUsedText != null} ? ${t.lastUsedText} : #{apiToken.neverUsed}"></dd>
                    <dt th:text="#{apiToken.expires}"></dt>
                    <dd>
                        <span th:if="${t.expiresText == null}" th:text="#{apiToken.noExpiration}"></span>
                        <span th:if="${t.expiresText != null}"><th:block th:text="${t.expiresText}"></th:block> <em th:if="${t.expired}" th:text="'(' + #{apiToken.expired} + ')'"></em></span>
                    </dd>
                </dl>
                <div class="item-card-actions">
                    <form method="post" th:action="@{/user/token/{id}/delete(id=${t.id})}" th:attr="onsubmit='return confirm(\'' + #{apiToken.delete.confirm} + '\');'">
                        <button type="submit" class="btn btn-danger btn-sm" th:text="#{apiToken.delete}"></button>
                    </form>
                </div>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(tokens)}" class="empty" th:text="#{apiToken.list.empty}"></p>

        <a th:href="@{/user/editform/token/new}" id="token-new" class="ybtn ybtn-success" th:text="#{apiToken.create}"></a>
    <script type="module" th:inline="javascript">
/* 본문 교체 때도 모듈 등록이 끝난 뒤 초기화하도록 모듈을 먼저 불러온다(D-136) */
await import([[@{/assets/javascripts/esm/service/user.Setting.js}]]);
    $(function(){
        $yona.loadModule("user.Setting");
    });
</script>
</div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
