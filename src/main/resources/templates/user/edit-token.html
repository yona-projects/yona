  추가 개발 항목 X-5(decisions.md D-36): 개인용 API 토큰의 목록, 만들기(이름, 만료, 범위), 삭제
  모델: title, account, tokens(TokenRow 목록), scopeOptions, maxDays, newToken(만든 직후 한 번만), tokenError(입력 오류의 메시지 키)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::tokenPage})}">
<th:block th:fragment="tokenPage">
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{apiToken.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('token')}"></th:block>
        <p class="help-block" th:text="#{apiToken.description}"></p>

        <!--/* 방금 만든 토큰은 이 응답에서 한 번만 보이고 다시 볼 수 없다 */-->
        <div th:if="${newToken != null}" class="alert alert-success">
            <p th:text="#{apiToken.created.once}"></p>
            <input id="new-token-value" type="text" readonly class="text" size="60" style="width: 90%"
                   onClick="this.setSelectionRange(0, this.value.length)" th:value="${newToken}">
            <span class="hide" th:text="${newToken}"></span>
        </div>

        <table id="token-list" class="table table-striped" th:if="${!#lists.isEmpty(tokens)}">
            <thead>
            <tr>
                <th th:text="#{apiToken.name}"></th><th th:text="#{apiToken.prefix}"></th><th th:text="#{apiToken.scopes}"></th>
                <th th:text="#{apiToken.createdDate}"></th><th th:text="#{apiToken.lastUsed}"></th><th th:text="#{apiToken.expires}"></th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tokens}" class="token-row" th:attr="data-id=${t.id}">
                <td>
                    <span th:text="${t.name}"></span>
                    <div th:if="${t.legacy}" class="legacy-warning alert alert-warning" style="margin-top:5px;">
                        <strong th:text="#{apiToken.legacy}"></strong> <span th:text="#{apiToken.legacy.warning}"></span>
                    </div>
                </td>
                <td><code class="token-prefix" th:text="${t.prefix}"></code></td>
                <td><span th:each="s : ${t.scopes}" class="token-scope label" style="margin-right:3px;" th:text="${s}" th:title="#{'apiToken.scope.' + ${s}}"></span></td>
                <td th:text="${t.createdText}"></td>
                <td th:text="${t.lastUsedText != null} ? ${t.lastUsedText} : #{apiToken.neverUsed}"></td>
                <td>
                    <span th:if="${t.expiresText == null}" th:text="#{apiToken.noExpiration}"></span>
                    <span th:if="${t.expiresText != null}"><th:block th:text="${t.expiresText}"></th:block> <em th:if="${t.expired}" th:text="'(' + #{apiToken.expired} + ')'"></em></span>
                </td>
                <td>
                    <form method="post" th:action="@{/user/token/{id}/delete(id=${t.id})}" th:attr="onsubmit='return confirm(\'' + #{apiToken.delete.confirm} + '\');'">
                        <button type="submit" class="ybtn ybtn-danger ybtn-small" th:text="#{apiToken.delete}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(tokens)}" class="empty" th:text="#{apiToken.list.empty}"></p>

        <a th:href="@{/user/editform/token/new}" id="token-new" class="ybtn ybtn-success" th:text="#{apiToken.create}"></a>
    </div>
</div>
<script type="text/javascript">
    $(function(){
        $yobi.loadModule("user.Setting");
    });
</script>
</th:block>
</html>
