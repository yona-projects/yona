<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::passwordPage})}">
<th:block th:fragment="passwordPage">
<div class="site-breadcrumb-outer">
  <div class="site-breadcrumb-inner">
    <h3 th:text="#{userinfo.accountSetting}"></h3>
  </div>
</div>
<div class="page-wrap-outer">
  <div class="page-wrap">
    <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('password')}"></th:block>

    <form id="frmPassword" method="post" th:action="@{/user/resetPassword}">
      <input type="hidden" name="loginId" th:value="${account.loginId}" />
      <dl>
        <dt th:text="#{user.currentPassword}"></dt>
        <dd class="mt10">
          <input class="w-50 form-control" type="password" id="oldPassword" name="oldPassword" value="" autocomplete="off" />
        </dd>
        <dt th:text="#{user.newPassword}"></dt>
        <dd class="mt10">
          <input class="w-50 form-control" type="password" id="password" name="password" value="" autocomplete="off" />
        </dd>
        <dt th:text="#{validation.retypePassword}"></dt>
        <dd class="mt10">
          <input class="w-50 form-control" type="password" id="retypedPassword" name="retypedPassword" value="" autocomplete="off" />
        </dd>
        <dd>
          <button type="submit" class="ybtn ybtn-success" th:text="#{userinfo.changePassword}"></button>
        </dd>
      </dl>
    </form>
    <hr/>
    <div class="mt10">
        <dl>
          <dt th:text="#{site.resetPasswordEmail.desc}"></dt>
          <dd class="mt10">
            <a th:href="@{/lostPassword}" class="ybtn ybtn-fail" th:text="#{site.resetPasswordEmail.title}"></a>
          </dd>
        </dl>
      </div>
  </div>
</div>
<script type="text/javascript">
    $(function(){
        $yobi.loadModule("user.Setting");
    });
</script>
</th:block>
</html>
