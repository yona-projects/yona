<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::passwordPage})}">
<th:block th:fragment="passwordPage">
<div class="site-breadcrumb-outer" id="pageTitle">
  <div class="site-breadcrumb-inner">
    <h3 th:text="#{userinfo.accountSetting}"></h3>
  </div>
</div>
<div class="page-wrap-outer">
  <div class="page-wrap shell user-screen">
    <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('password')}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>

    <form id="frmPassword" method="post" th:action="@{/user/resetPassword}">
      <input type="hidden" name="loginId" th:value="${account.loginId}" />
      <dl>
        <dt th:text="#{user.currentPassword}"></dt>
        <dd class="mt10">
          <input class="w-25 form-control" type="password" id="oldPassword" name="oldPassword" value="" autocomplete="off" />
        </dd>
        <dt th:text="#{user.newPassword}"></dt>
        <dd class="mt10">
          <input class="w-25 form-control" type="password" id="password" name="password" value="" autocomplete="off" />
        </dd>
        <dt th:text="#{validation.retypePassword}"></dt>
        <dd class="mt10">
          <input class="w-25 form-control" type="password" id="retypedPassword" name="retypedPassword" value="" autocomplete="off" />
        </dd>
        <dd>
          <button type="submit" class="ybtn ybtn-success" th:text="#{userinfo.changePassword}"></button>
        </dd>
      </dl>
    </form>
    <hr/>
    <div class="mt10">
        <dl>
          <dt th:text="#{site.resetPasswordEmail.desc}"></dt>
          <dd class="mt10">
            <a th:href="@{/lostPassword}" class="ybtn ybtn-fail" th:text="#{site.resetPasswordEmail.title}"></a>
          </dd>
        </dl>
      </div>
  <script type="module" th:inline="javascript">
/* 본문 교체 때도 모듈 등록이 끝난 뒤 초기화하도록 모듈을 먼저 불러온다(D-136) */
await import([[@{/assets/javascripts/esm/service/user.Setting.js}]]);
    $(function(){
        $yona.loadModule("user.Setting");
    });
</script>
</div><!--/* .shell-main */-->
  </div>
</div>
</th:block>
</html>
