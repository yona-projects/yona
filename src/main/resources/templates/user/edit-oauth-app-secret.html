  추가 개발 항목 X-1(decisions.md D-71): 기밀 앱의 클라이언트 비밀 값 화면. 만든 직후와 다시 만든 직후에 한 번만 보인다
  모델: title, clientName, clientId, secret, noticeKey(안내의 메시지 키), appId
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::oauthPage})}">
<th:block th:fragment="oauthPage">
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{oauth.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('oauth-apps')}"></th:block>
        <div class="two-factor-page">
        <div class="alert alert-success" th:text="#{${noticeKey}}"></div>
        <h4 th:text="${clientName}"></h4>
        <p class="mb-1 text-body-secondary" th:text="#{oauth.apps.clientId}"></p>
        <p><code id="client-id" th:text="${clientId}"></code></p>
        <p class="mb-1 text-body-secondary" th:text="#{oauth.secret.value}"></p>
        <p><code id="client-secret" class="tf-secret-value" th:text="${secret}"></code></p>
        <p class="text-body-secondary" th:text="#{oauth.secret.once}"></p>
        <div class="tf-actions">
            <a th:href="@{/user/editform/oauth-apps/{id}(id=${appId})}" class="btn btn-success" th:text="#{oauth.secret.done}"></a>
        </div>
        </div>
    </div>
</div>
</th:block>
</html>
