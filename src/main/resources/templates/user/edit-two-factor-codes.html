  추가 개발 항목 X-2(decisions.md D-69): 백업 코드 화면. 만든 직후 한 번만 보이며 서버에는 해시만 남는다
  모델: title, codes(백업 코드 문자열 목록), noticeKey(안내의 메시지 키)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::twoFactorPage})}">
<th:block th:fragment="twoFactorPage">
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{twoFactor.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('two-factor')}"></th:block>
        <div class="alert alert-success" th:text="#{${noticeKey}}"></div>
        <h4 th:text="#{twoFactor.backup.title}"></h4>
        <p th:text="#{twoFactor.backup.help}"></p>
        <ul id="backup-codes" class="list-unstyled font-monospace fs-5">
            <li th:each="c : ${codes}" th:text="${c}"></li>
        </ul>
        <a th:href="@{/user/editform/two-factor}" class="btn btn-success" th:text="#{twoFactor.backup.done}"></a>
    </div>
</div>
</th:block>
</html>
