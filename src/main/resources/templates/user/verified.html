<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NONE', ~{::verifiedPage})}">
<th:block th:fragment="verifiedPage">
<div class="page full">
  <div class="center-wrap tag-line-wrap reset-password">
    <h1 class="title" th:utext="#{user.verified}">
    </h1>
    <p th:text="${loginId}"></p>
    <hr />
    <p class="tag-line" th:text="#{user.verified.detail}"></p>
  </div>
</div>
</th:block>
</html>
