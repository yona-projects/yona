<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-3(decisions.md D-66): SSH 키 목록 화면. 행 동작은 삭제 버튼 하나뿐이다(편집과 상세 없음). 추가는 별도 화면(edit-ssh-new.html)에서 한다
  모델: title, keys(SshKeyRow 목록)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'USER', ~{::sshPage})}">
<th:block th:fragment="sshPage">
<div class="site-breadcrumb-outer" id="pageTitle">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{sshKey.title}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="page-wrap shell user-screen">
        <th:block th:replace="~{user/partial-edit-tabmenu :: tabmenu('ssh')}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>
        <p class="text-body-secondary" th:text="#{sshKey.description}"></p>

        <!--/* A-581: SSH 키 목록은 카드이다 */-->
        <ul id="ssh-list" class="item-cards list-unstyled" th:if="${!#lists.isEmpty(keys)}">
            <li th:each="k : ${keys}" class="item-card ssh-row" th:attr="data-id=${k.id}">
                <div class="item-card-head">
                    <span class="item-card-name ssh-name" th:text="${k.name}"></span>
                    <span class="item-card-type"><code class="ssh-key-type" th:text="${k.keyType}"></code></span>
                </div>
                <dl class="item-card-meta">
                    <dt th:text="#{sshKey.fingerprint}"></dt><dd><code class="ssh-fingerprint" th:text="${k.fingerprint}"></code></dd>
                    <dt th:text="#{sshKey.createdDate}"></dt><dd th:text="${k.createdText}"></dd>
                </dl>
                <div class="item-card-actions">
                    <form method="post" th:action="@{/user/ssh/{id}/delete(id=${k.id})}" th:attr="onsubmit='return confirm(\'' + #{sshKey.delete.confirm} + '\');'">
                        <button type="submit" class="btn btn-danger btn-sm" th:text="#{sshKey.delete}"></button>
                    </form>
                </div>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(keys)}" class="empty" th:text="#{sshKey.list.empty}"></p>

        <a th:href="@{/user/editform/ssh/new}" id="ssh-new" class="btn btn-success" th:text="#{sshKey.add}"></a>
    </div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
