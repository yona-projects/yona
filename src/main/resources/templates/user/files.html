<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(#{user.files}, 'SITE_HOME', ~{::filesPage})}">
<th:block th:fragment="filesPage">
<link rel="stylesheet" type="text/css" media="all" th:href="@{/assets/stylesheets/filetype.css}">
<div class="page-wrap-outer">
    <div class="page-wrap">
        <th:block th:replace="~{common/my-series-menu-tab :: mySeriesMenuTab(${menuTab})}"></th:block>
        <form th:action="@{/user/files}">
        <div class="user-file-search search search-bar">
            <input name="filter" class="textbox" type="text" th:placeholder="#{search.title}" value="">
            <button type="submit" class="search-btn"><i class="yobicon-search"></i></button>
        </div>
        </form>
        <div class="attachment-files">
            <div class="attachment-files-header row">
                <div class="col-lg-1 header-preview">Preview</div>
                <div class="col-lg-5 header-file-name">Filename</div>
                <div class="col-lg-1 header-size">Size</div>
                <div class="col-lg-1">Download</div>
                <div class="col-lg-2 file-date">Date</div>
                <div class="col-lg-4 header-location">Location</div>
            </div>
            <div class="attachment-file-detail row" th:each="row : ${rows}">
                <div class="file-preview col-lg-1"><a th:href="@{/files/{id}(id=${row.id})}" target="_blank"><img th:if="${row.image}" th:src="@{/files/{id}(id=${row.id})}"></a></div>
                <div class="col-lg-5 file-name"><a th:href="@{/files/{id}(id=${row.id})}" target="_blank"><i class="icon text-icon"></i><th:block th:text="${row.name}"></th:block></a></div>
                <div class="col-lg-1 file-size" th:text="${helper.humanReadableByteCount(row.size, true)}"></div>
                <div class="col-lg-1 file-download"><a th:href="@{/files/{id}(id=${row.id},action='download')}"><button type="button" class="ybtn"><i class="yobicon-cloud-download"></i></button> </a></div>
                <div class="col-lg-2 file-date" th:text="${helper.dateString(row.createdDate, 'yyyy-MM-dd h:mm a')}"></div>
                <div class="col-lg-4 file-location"><a th:if="${row.location != null}" th:href="@{${row.location}}" target="_blank" th:text="@{${row.location}}"></a></div>
            </div>
        </div>
    </div>
    <!-- pagination.js will fill here. -->
    <div id="pagination"></div>
</div>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/filetype.js}"></script>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        $(".attachment-file-detail").hover(
                function() {
                    $(this).addClass('hover');
                }, function () {
                    $(this).removeClass("hover");
                }
        );
        $('.file-name').each(function(){
            var that = $(this);
            fileType.some(function(item){
                if( item[0].test(that.text()) ) {
                    that.find('i').removeClass('text-icon').addClass(item[1] + " font-larger");
                    return true;
                }
            });
        });

        $('.user-file-search > button').on('submit', function () {
            console.log('searche!');
        });

        yobi.Pagination.update($("#pagination"), [[${totalPages}]]);
    });
</script>
</th:block>
</html>
