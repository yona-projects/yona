<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{site/layout :: head(#{security.backupCodes.title})}">
</head>
<body class="theme-default">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div class="site-breadcrumb-outer">
        <div class="site-breadcrumb-inner">
            <h3 th:text="#{security.backupCodes.title}">백업 코드</h3>
        </div>
    </div>
    <div class="page-wrap-outer">
        <div class="page-wrap">
            <div th:replace="~{user/partial_edit_tabmenu :: tabmenu('security')}"></div>

            <!-- 발급 직후 딱 한 번만 평문으로 노출한다(GitHub 관례) — flash attribute라 새로고침하면
                 사라지고, 서버에는 해시만 저장돼 있어 이 화면을 벗어나면 다시 볼 방법이 없다. -->
            <div class="alert alert-warning mt20">
                <span th:text="#{security.backupCodes.warning}">이 코드는 지금만 볼 수 있습니다. 안전한 곳에 보관하세요.</span>
            </div>
            <ul>
                <li th:each="code : ${freshBackupCodes}"><code th:text="${code}">XXXXX-XXXXX</code></li>
            </ul>
            <a th:href="@{/user/editform/security}" class="ybtn ybtn-primary" th:text="#{button.confirm}">확인</a>
        </div>
    </div>
    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
</body>
</html>
