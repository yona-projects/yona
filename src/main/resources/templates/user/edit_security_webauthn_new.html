<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{site/layout :: head(#{security.webauthn.add})}">
</head>
<body class="theme-default">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div class="site-breadcrumb-outer">
        <div class="site-breadcrumb-inner">
            <h3 th:text="#{security.webauthn.add}">보안 키 추가</h3>
        </div>
    </div>
    <div class="page-wrap-outer">
        <div class="page-wrap">
            <div th:replace="~{user/partial_edit_tabmenu :: tabmenu('security')}"></div>

            <div id="webauthnRegisterError" class="alert alert-error mt20" style="display:none;"></div>

            <div class="mt10">
                <label th:text="#{security.webauthn.labelInput}">별명(예: YubiKey, 노트북 지문인식)</label>
                <input id="webauthnLabel" type="text" class="text" style="width: 300px;">
            </div>
            <div class="mt10">
                <button type="button" id="webauthnRegisterBtn" class="ybtn ybtn-success" th:text="#{security.webauthn.register}">보안 키 등록</button>
                <a th:href="@{/user/editform/security}" class="ybtn ml10" th:text="#{button.cancel}">취소</a>
            </div>
        </div>
    </div>
    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
<script type="text/javascript" th:inline="javascript">
    function base64urlToBuffer(base64url) {
        var padded = base64url.replace(/-/g, '+').replace(/_/g, '/');
        while (padded.length % 4 !== 0) { padded += '='; }
        var binary = atob(padded);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
        return bytes.buffer;
    }

    function bufferToBase64url(buffer) {
        var bytes = new Uint8Array(buffer);
        var binary = '';
        for (var i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    document.getElementById('webauthnRegisterBtn').addEventListener('click', function() {
        var errorEl = document.getElementById('webauthnRegisterError');
        errorEl.style.display = 'none';
        var label = document.getElementById('webauthnLabel').value || /*[[#{security.webauthn.defaultLabel}]]*/ '보안 키';

        if (!window.PublicKeyCredential) {
            errorEl.textContent = /*[[#{security.webauthn.unsupported}]]*/ '이 브라우저는 보안 키를 지원하지 않습니다.';
            errorEl.style.display = 'block';
            return;
        }

        fetch('/user/editform/security/webauthn/options', { method: 'POST', credentials: 'same-origin' })
            .then(function(res) { return res.json(); })
            .then(function(options) {
                options.challenge = base64urlToBuffer(options.challenge);
                options.user.id = base64urlToBuffer(options.user.id);
                if (options.excludeCredentials) {
                    options.excludeCredentials.forEach(function(cred) { cred.id = base64urlToBuffer(cred.id); });
                }
                return navigator.credentials.create({ publicKey: options });
            })
            .then(function(credential) {
                var body = {
                    label: label,
                    credential: {
                        id: credential.id,
                        type: credential.type,
                        rawId: bufferToBase64url(credential.rawId),
                        clientExtensionResults: {},
                        response: {
                            clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
                            attestationObject: bufferToBase64url(credential.response.attestationObject),
                            transports: (credential.response.getTransports ? credential.response.getTransports() : [])
                        }
                    }
                };
                return fetch('/user/editform/security/webauthn', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            })
            .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
            .then(function(result) {
                if (result.ok) {
                    window.location.href = '/user/editform/security';
                } else {
                    errorEl.textContent = result.data.error || /*[[#{security.webauthn.failed}]]*/ '등록에 실패했습니다.';
                    errorEl.style.display = 'block';
                }
            })
            .catch(function(err) {
                errorEl.textContent = (err && err.message) || /*[[#{security.webauthn.failed}]]*/ '등록에 실패했습니다.';
                errorEl.style.display = 'block';
            });
    });
</script>
</body>
</html>
