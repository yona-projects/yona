<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head('알림 - Yona')}">
</head>
<body class="theme-default">
<div id="main" class="main">
  <div th:replace="~{site/layout :: gnb}"></div>

  <!-- 메인 컨텐츠 영역 -->
  <div class="page full">
    <div sec:authorize="isAuthenticated()" class="page-wrap-outer">
        <div class="page-wrap">
            <div class="site-guide-outer hide">
                <h3>
                    <span th:text="#{app.welcome('Yona')} + ' - ' + #{app.description}">Tada! Welcome to Yona!</span>
                </h3>
                <table class="welcome-table table borderless">
                    <tr>
                        <td>
                            <a href="/projectform" class="ybtn ybtn-success" th:text="#{button.newProject}">Create new project</a>
                        </td>
                        <td th:text="#{app.welcome.project.desc}">Create your own project</td>
                    </tr>
                    <tr>
                        <td>
                            <a href="/organizations/new" class="ybtn ybtn-success" th:text="#{button.newGroup}">New Group</a>
                        </td>
                        <td th:text="#{app.welcome.group.desc}">Create a group</td>
                    </tr>
                    <tr>
                        <td>
                            <a href="/projects" class="ybtn ybtn-success" th:text="#{title.projectList}">Project list</a>
                        </td>
                        <td th:text="#{app.welcome.searchProject.desc}">Find a project</td>
                    </tr>
                </table>
            </div>
            <div class="guide-toggle">
                <button class="btn-transparent" id="toggleIntro"><i class="yobicon-resizev"></i></button>
            </div>
            <div class="page on-fold-intro">
                <div class="row-fluid content-container">
                    <div class="span8 main-stream">
                        <div th:replace="~{common/mySeriesMenuTab :: menu('notifications')}"></div>
                        <ul class="activity-streams notification-wrap unstyled" id="notifications-list">
                            <!-- partial_notifications 조각 렌더링 -->
                            <th:block th:replace="~{index/partial_notifications :: html}"></th:block>
                        </ul>
        	        </div>
                    <div class="span4 index-menu right-menu span-hard-wrap">
                        <!-- 우측 사이드바 등이 들어갈 수 있는 공간 -->
        	        </div>
                </div>
            </div>
        </div>
</div>
</div>
<!-- 공통 스크립트 블록 포함 -->
<th:block th:replace="~{site/layout :: scripts}"></th:block>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function(){
        // _contentHeight: jQuery .height()(콘텐츠 박스 높이, padding/border 제외)와 동일 - 라운드5에서
        // 확립한 헬퍼와 동일한 계산(index.html과 동일 패턴).
        function _contentHeight(el) {
            var style = getComputedStyle(el);
            return el.clientHeight - parseFloat(style.paddingTop || 0) - parseFloat(style.paddingBottom || 0);
        }

        var elToggleIntro = document.getElementById("toggleIntro");
        if (elToggleIntro) {
            elToggleIntro.addEventListener("click", function(){
                var elOuterGuide = document.querySelector(".site-guide-outer");
                if (elOuterGuide) {
                    elOuterGuide.classList.toggle("hide");
                    localStorage.setItem("yona-intro", !elOuterGuide.classList.contains("hide"));
                }
            });
        }

        if(localStorage.getItem("yona-intro") != "false"){
            var elSiteGuideOuter = document.querySelector(".site-guide-outer");
            if (elSiteGuideOuter) { elSiteGuideOuter.classList.remove("hide"); }
        }

        var elNotificationWrap = document.querySelector('.notification-wrap');
        if (elNotificationWrap) {
            elNotificationWrap.addEventListener('click', function(event) {
                var matched = event.target.closest('[data-toggle="learnmore"]');
                if (!matched || !elNotificationWrap.contains(matched)) { return; }

                var elMore = matched.querySelector(".more");
                if (elMore) {
                    elMore.style.display = (getComputedStyle(elMore).display === "none") ? "block" : "none";
                }
                var sTargetId = matched.dataset.target;
                var welMessage = document.getElementById(sTargetId);
                var nHeight;

                if(event.target.localName =='a' || event.target.localName =='img') {
                    return ;
                }

                if (!welMessage) { return; }
                welMessage.classList.toggle('nowrap');

                if (welMessage.classList.contains('nowrap')) {
                    nHeight = '';
                } else {
                    var elMessage = welMessage.querySelector('.message');
                    nHeight = elMessage ? _contentHeight(elMessage) : '';
                }

                welMessage.style.minHeight = (nHeight === '') ? '' : (nHeight + 'px');
            });
        }

        function checkOverflow(el) {
            var curOverflow = el.style.overflow;

            if (!curOverflow || curOverflow === "visible")
                el.style.overflow = "hidden";

            var isOverflowing = el.clientWidth < el.scrollWidth
                    || el.clientHeight < el.scrollHeight;

            el.style.overflow = curOverflow;

            return isOverflowing;
        }

        document.querySelectorAll(".message-wrap").forEach(function(el){
            if(checkOverflow(el)){
                el.insertAdjacentHTML("afterend", "<div class='more'>...</div>");
            }
        });
    });
</script>
</body>
</html>
