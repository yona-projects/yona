<!--/* 조직 묶음 안의 프로젝트 줄: 즐겨찾기한 것은 항상 보이고 나머지는 숨겨 둔다(검색하면 나타난다). */-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="allProject(project, last)">
<li class="user-li" th:classappend="(${last} ? 'favored ' : '') + (${project.favored} ? 'show-always' : 'hide')" th:attr="data-location=${'/' + project.owner + '/' + project.name + '/go'}">
    <div class="project-list project-flex-container" data-toggle="popover" data-trigger="hover" data-placement="right" data-content="" th:attrappend="data-content=${project.overview}">
        <div class="project-item project-item-container">
            <div class="flex-item site-logo all-project-names">
                <i class="project-avatar"><img th:if="${project.logoUrl != null}" class="logo" th:src="${project.logoUrl}"><span th:unless="${project.logoUrl != null}" class="dummy-25px"> </span></i>
            </div>
            <div class="projectName-owner flex-item">
                <div class="project-name flex-item"><th:block th:text="${project.name}"></th:block> <i th:if="${project.priv}" class="yobicon-lock yobicon-small"></i></div>
            </div>
        </div>
        <div class="star-project flex-item" th:attr="data-project-id=${project.id}">
            <i class="star material-icons" th:classappend="${project.favored} ? 'starred'">star</i>
        </div>
    </div>
</li>
</th:block>

<!--/* 프로젝트 탭과 기타 즐겨찾기의 줄: 소유자 링크가 보인다. */-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="myProject(project, last)">
<li class="user-li" th:classappend="${last} ? 'favored'" th:attr="data-location=${'/' + project.owner + '/' + project.name + '/go'}">
    <div class="project-list project-flex-container">
        <div class="project-item project-item-container">
            <div class="flex-item site-logo">
                <i class="project-avatar"><img th:if="${project.logoUrl != null}" class="logo" th:src="${project.logoUrl}"><span th:unless="${project.logoUrl != null}" class="dummy-25px"> </span></i>
            </div>
            <div class="projectName-owner flex-item">
                <div class="project-name flex-item"><th:block th:text="${project.name}"></th:block> <i th:if="${project.priv}" class="yobicon-lock yobicon-small"></i></div>
                <div class="project-owner flex-item"><a th:href="'/' + ${project.owner}" th:text="${project.owner}"></a></div>
            </div>
        </div>
        <div class="star-project flex-item" th:attr="data-project-id=${project.id}">
            <i class="star material-icons" th:classappend="${project.favored} ? 'starred'">star</i>
        </div>
    </div>
</li>
</th:block>
