  메뉴종류는 v1.6 utils.MenuType의 이름(문자열)이다.

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="siteLayout(title, menu, content)"
          th:replace="~{layout/layout :: layout(${title}, '', ~{layout/site-layout :: siteBody(${menu}, ${content})})}">
</th:block>

<th:block th:fragment="siteBody(menu, content)">
    <th:block th:replace="~{common/navbar :: navbar(${menu}, null, null)}"></th:block>

    <th:block th:replace="${content}"></th:block>

    <th:block th:replace="~{common/footer :: footer}"></th:block>
</th:block>
