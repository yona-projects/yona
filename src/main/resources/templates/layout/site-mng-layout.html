  이식 원본: app/views/site/siteMngLayout.scala.html
  사용법: <html th:replace="~{layout/site-mng-layout :: siteMngLayout(제목, 본문프래그먼트)}">
  왼쪽 사이드바는 새 셸의 사이드바(shell/sidebar, D-141)이고 항목은 ShellNav.siteAdmin이 정한다. 활성 항목은 현재 요청 경로에서 판정하므로 상세 화면에서도 켜진다.
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="siteMngLayout(title, content)"
          th:replace="~{layout/site-layout :: siteLayout(${title}, 'SITE_SETTING', ~{layout/site-mng-layout :: siteMngBody(${content})})}">
</th:block>

<th:block th:fragment="siteMngBody(content)">
<div class="page-wrap-outer">
    <div class="shell" th:with="shellMenu=${@shellNavs.siteAdmin(versionToUpdate != null)}">
        <th:block th:replace="~{shell/sidebar :: sidebar(${shellMenu}, #{site.sidebar}, 'shellSidebar', null)}"></th:block>
        <div class="shell-main site-setting-wrap"><!--/* 옛 본문 스타일(title_area, listhead 등)이 .site-setting-wrap 아래에 묶여 있어 클래스를 유지한다(P4에서 풀어낸다) */-->
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>
</div>
</th:block>
