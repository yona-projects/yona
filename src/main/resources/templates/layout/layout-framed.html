<!DOCTYPE html>
<!--/*

  https://yona.io

  이식 원본: app/views/layout_framed.scala.html, siteLayout_framed.scala.html
  사이드바를 왼쪽에 고정한 화면의 뼈대이다. 본문은 `iframePath` 주소를 보여 주는 프레임이며, 페이지 템플릿이 넘기는 본문 조각은 v1.6처럼 그리지 않는다.
  모델: title, menu(UserMenuModel), iframePath
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:with="titleText=${#messages.msgOrNull(title) ?: title}, titleArray=${titleText.split(' [|]:[|] ')}"
      th:lang="${currentUser.preferredLanguage}">
<head>
<meta charset="utf-8">
<title th:text="${titleArray[0]}">Yona</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta property="og:title" th:content="${titleArray[0]}" />
<meta property="og:url" th:content="${requestPath}" />
<meta property="og:type" content="website" />
<meta property="og:description" th:content="${titleArray[titleArray.length - 1]}" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" th:content="${titleArray[0]}" />
<meta name="twitter:url" th:content="${requestPath}" />
<meta name="twitter:description" th:content="${titleArray[titleArray.length - 1]}" />
<link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">
<link rel="stylesheet" type="text/css" media="all" th:href="@{/assets/bootstrap/css/bootstrap.css}">
<link rel="stylesheet" type="text/css" media="all" th:href="@{/assets/stylesheets/yobicon/style.css}">
<link rel="stylesheet" type="text/css" media="all" th:href="@{/assets/javascripts/lib/select2/select2.css}"/>
<link rel="stylesheet" type="text/css" media="all" th:href="@{/assets/javascripts/lib/pikaday/pikaday.css}" />
<link rel="stylesheet" type="text/css" media="all" th:href="@{/assets/stylesheets/usermenu.css}">
<link rel="stylesheet" type="text/css" media="all" th:href="@{/assets/stylesheets/yobi.css}">
<link rel='stylesheet' th:href="@{/assets/javascripts/lib/nprogress/nprogress.css}"/>
<link rel="stylesheet" th:href="@{/assets/javascripts/lib/magnific-popup/magnific-popup.css}" />
<script type="text/javascript" th:src="@{/assets/javascripts/yona-layout.js}"></script>
</head>

<body class="framed-body" id="html-body">
    <div id="sidebar" class="sidebar hide-in-mobile">
        <th:block th:if="${!currentUser.anonymous}">
            <th:block th:replace="~{common/sidebar :: sidebar}"></th:block>
        </th:block>
    <div id="sidebar-bottom" class="sidebar-bottom" style="
        position: absolute;
        bottom: 8px;
        right: 15px;
        color: gray;
    ">Yona, made by <i class="yobicon-hearts" style="
        color: red;
        vertical-align: middle;
    "></i></div>
    </div>
    <div id="mainFrame" class="show-in-mobile-100vh">
        <iframe name="mainFrame" id="mainFrameId" frameborder="0" class="mainFrame" height="100%" width="100%" th:src="${iframePath}"></iframe>
        <th:block th:replace="~{common/scripts :: scripts}"></th:block>
    </div>

    <script type="text/javascript">
        $(function() {
            NProgress.configure({minimum: 0.7});

            $('[data-toggle="popover"]').popover();
        });
    </script>
    <script type="text/javascript" th:inline="javascript">
        //Following values are used for common/yona.Usermenu.js
        var UsermenuToggleFavoriteProjectUrl = [[@{/user/favoriteProjects/}]];
        var UsermenuToggleFoveriteOrganizationUrl = [[@{/user/favoriteOrganizations/}]];
        var UsermenuGetFoveriteProjectsUrl = [[@{/user/favoriteProjects}]];
        var UsermenuToggleFavoriteIssueUrl = [[@{/user/favoriteIssues/}]];
        var UsermenuGetFoveriteIssuesUrl = [[@{/user/favoriteIssues}]];
        var UsermenuUrl = [[@{/user/usermenuTabContentList}]];
    </script>
    <script type="text/javascript" th:src="@{/assets/javascripts/common/yona.Usermenu.js}"></script>

    <th:block th:replace="~{common/analytics :: gtag('left_sidebar')}"></th:block>
</body>
</html>
