<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="search"
          th:with="counts=${search.counts}, current=${search.searchType.type}">
<div class="site-breadcrumb-outer">
    <div class="site-breadcrumb-inner">
        <h3 th:text="#{title.search}"></h3>
    </div>
</div>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="project-page-wrap">
            <div class="row">
                <div class="col-lg-2">
                    <ul class="lst-stacked list-unstyled search-category-wrap">
                        <li th:class="${current == 'issue' ? 'active' : ''} + ' ' + ${counts.issues == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="issue"><th:block th:text="#{search.menu.issues}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.issues}"></span>
                            </a>
                        </li>
                        <li th:class="${current == 'user' ? 'active' : ''} + ' ' + ${counts.users == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="user"><th:block th:text="#{search.menu.users}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.users}"></span>
                            </a>
                        </li>
                        <li th:unless="${search.projectScoped}" th:class="${current == 'project' ? 'active' : ''} + ' ' + ${counts.projects == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="project"><th:block th:text="#{search.menu.projects}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.projects}"></span>
                            </a>
                        </li>
                        <li th:class="${current == 'post' ? 'active' : ''} + ' ' + ${counts.posts == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="post"><th:block th:text="#{search.menu.boards}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.posts}"></span>
                            </a>
                        </li>
                        <li th:class="${current == 'milestone' ? 'active' : ''} + ' ' + ${counts.milestones == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="milestone"><th:block th:text="#{search.menu.milestones}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.milestones}"></span>
                            </a>
                        </li>
                        <li th:class="${current == 'issue_comment' ? 'active' : ''} + ' ' + ${counts.issueComments == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="issue_comment"><th:block th:text="#{search.menu.issue.comments}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.issueComments}"></span>
                            </a>
                        </li>
                        <li th:class="${current == 'post_comment' ? 'active' : ''} + ' ' + ${counts.postComments == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="post_comment"><th:block th:text="#{search.menu.board.comments}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.postComments}"></span>
                            </a>
                        </li>
                        <li th:class="${current == 'review' ? 'active' : ''} + ' ' + ${counts.reviews == 0 ? 'empty' : ''}">
                            <a href="#" data-toggle="search-category" data-type="review"><th:block th:text="#{search.menu.reviews}"></th:block>
                                <span class="num-badge float-right" th:text="${counts.reviews}"></span>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="col-lg-10">
                    <div class="search-box-wrap">
                        <form id="searchInnerForm" method="get" th:action="@{${search.action}}">
                            <input type="hidden" name="searchType" th:value="${current}">
                            <input type="text" id="searchKeyword" name="keyword" class="col-lg-11" th:value="${search.keyword}">
                            <button type="submit" class="ybtn" th:text="#{title.search}"></button>
                        </form>

                        <h3 class="search-result-title">
                            <th:block th:utext="#{search.result.title(${search.currentCount}, #{${
                                current == 'issue' ? 'search.menu.issues' : current == 'user' ? 'search.menu.users' : current == 'project' ? 'search.menu.projects'
                                : current == 'post' ? 'search.menu.boards' : current == 'milestone' ? 'search.menu.milestones' : current == 'issue_comment' ? 'search.menu.issue.comments'
                                : current == 'post_comment' ? 'search.menu.board.comments' : 'search.menu.reviews'}})}"></th:block>
                        </h3>
                    </div>
                    <div class="search-result-wrap">
                        <th:block th:switch="${current}">
                            <th:block th:case="'user'"><th:block th:replace="~{search/partial-users :: users}"></th:block></th:block>
                            <th:block th:case="'project'"><th:block th:replace="~{search/partial-projects :: projects}"></th:block></th:block>
                            <th:block th:case="'milestone'"><th:block th:replace="~{search/partial-milestones :: milestones}"></th:block></th:block>
                            <th:block th:case="*"><th:block th:replace="~{search/partial-items :: items}"></th:block></th:block>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
$(function(){
    $('.search-category-wrap').on('click', 'a[data-toggle="search-category"]', function(event) {
        event.preventDefault();
        $('#searchInnerForm').find('input[name="searchType"]').val($(this).data('type'));
        $('#searchInnerForm').submit();
    });

    $('.search-content-body, .title').each(function() {
        var content = $(this).html();
        var matchKeyword = $.trim($('#searchKeyword').val())
                            .replace(/[-[\]{}()*+?.,\\^$|#\s]/g, "\\$&");
        var matchRegx = new RegExp(matchKeyword, "ig");

        content = content.replace(matchRegx, function(match) {
            return "<strong class=\"keyword\">"+ match +"</strong>";
        });

        $(this).html(content);
    })
});
</script>
</th:block>
