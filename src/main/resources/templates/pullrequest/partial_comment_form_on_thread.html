<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<!--
 legacy partial_comment_form_on_thread.scala.html 대응 (그룹11 #187). 기존 스레드에 답글을 달거나
 스레드 상태(open/close)를 바꾸는 폼. 작성 권한이 없으면 상태 토글 버튼만 보여준다.
 실제 POST 대상은 ReviewViewController.newPullRequestComment/newCommitComment (기존 폼 제출
 방식 그대로 살아있는 REST 엔드포인트) — legacy와 동일하게 실제 <form method="post"> 그대로 재사용.
-->
<th:block th:fragment="form(thread, project, pull, currentUser)">
    <th:block th:with="canCreate=${currentUser != null and @accessControl.isProjectResourceCreatable(currentUser, project, T(com.github.yonaprojects.yona.domain.enumeration.ResourceType).REVIEW_COMMENT)}">
        <div class="write-comment-form" th:if="${canCreate}">
            <form th:action="${pull != null}
                    ? @{/{owner}/{projectName}/pullRequest/{pullRequestId}/comments(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pull.id}, commitId=${thread.commitId})}
                    : @{/{owner}/{projectName}/commit/{commitId}/comments(owner=${project.owner}, projectName=${project.name}, commitId=${thread.commitId})}"
                  method="post" enctype="multipart/form-data" class="review-form" style="display:block;">
                <input type="hidden" name="thread.id" th:value="${thread.id}">
                <div class="author-info-wrap pull-left hide-in-mobile">
                    <div class="author-info">
                        <a th:href="@{/user/{loginId}(loginId=${currentUser.loginId})}" class="avatar-wrap medium" th:title="${currentUser.name}" data-toggle="tooltip" data-placement="top">
                            <img th:src="${currentUser.avatarUrl}" width="32" height="32">
                        </a>
                    </div>
                </div>
                <div class="write-comment-box">
                    <div class="write-comment-wrap">
                        <div th:replace="~{site/layout :: markdownEditor('contents', '', 'code-review-body')}"></div>

                        <div th:replace="~{common/uploadForm :: uploadForm(${T(com.github.yonaprojects.yona.domain.enumeration.ResourceType).REVIEW_COMMENT}, null, null)}"></div>

                        <div class="right-txt">
                            <button th:if="${@accessControl.isAllowed(currentUser, project, thread, T(com.github.yonaprojects.yona.domain.enumeration.Operation).UPDATE)}"
                                    type="button" th:data-request-method="post"
                                    th:data-request-uri="${thread.state.name() == 'OPEN'} ? @{/threads/{id}/close(id=${thread.id})} : @{/threads/{id}/open(id=${thread.id})}"
                                    class="ybtn ybtn-default ybtn-small"
                                    th:text="${thread.state.name() == 'OPEN'} ? #{commentThread.close} : #{commentThread.open}">스레드 상태 변경</button>
                            <button type="submit" class="ybtn ybtn-success ybtn-small" th:text="#{button.comment.new}">댓글 등록</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <p class="thread-actrow" th:unless="${canCreate}">
            <button th:if="${currentUser != null and @accessControl.isAllowed(currentUser, project, thread, T(com.github.yonaprojects.yona.domain.enumeration.Operation).UPDATE)}"
                    type="button" th:data-request-method="post"
                    th:data-request-uri="${thread.state.name() == 'OPEN'} ? @{/threads/{id}/close(id=${thread.id})} : @{/threads/{id}/open(id=${thread.id})}"
                    class="ybtn ybtn-default ybtn-small"
                    th:text="${thread.state.name() == 'OPEN'} ? #{commentThread.close} : #{commentThread.open}">스레드 상태 변경</button>
        </p>
    </th:block>
</th:block>
</body>
</html>
