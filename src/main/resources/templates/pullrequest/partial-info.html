<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="info">
<div class="board-header issue">
    <div class="pull-right mr10 mt10">
        <div class="date" th:title="${header.agoTitle}" th:text="${header.ago}"></div>
        <span th:class="'badge nm ' + ${header.badgeClass}" th:text="#{${header.badgeKey}}"></span>
    </div>
    <div class="title">
        <strong class="board-id" th:text="'#' + ${header.number}"></strong> <th:block th:text="${header.title}"></th:block>
    </div>
</div>

<div class="pull-right">
    <th:block th:if="${header.reviewers != null}">
        <div id="reviewers" style="display:inline-block; margin-right:5px;">
            <span style="font-size: 13px; vertical-align: middle; margin: 0 10px;" th:utext="${header.reviewers.labelHtml}"></span>
            <th:block th:utext="${header.reviewers.avatarsHtml}"></th:block>
        </div>
        <a th:if="${header.reviewers.reviewUrl != null}" th:class="'ybtn ' + (${header.reviewers.reviewButtonSuccess} ? 'ybtn-success' : 'ybtn-default')" th:href="${header.reviewers.reviewUrl}" th:text="#{pullRequest.review}"></a>
    </th:block>

    <th:block th:if="${header.accept != null}">
        <!--/* 병합 상자(추가 항목 X-28, decisions.md D-41). GitHub, Forgejo처럼 분할 단추와 방식 목록(부트스트랩 드롭다운)으로 방식을 고르고, 단추를 누르면 기록될 커밋 제목과 본문을 미리 채운 확인 칸이 열린다. 할 수 없는 방식은 이유와 함께 막는다 */-->
        <style th:if="${header.accept.enabled}">
            #merge-box .btn-group > .ybtn { margin-left: 0; }
            #merge-box .btn-group > .ybtn + .ybtn { margin-left: -1px; }
            #merge-box .btn-group > .ybtn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
            #merge-box .btn-group > .dropdown-toggle { border-top-left-radius: 0; border-bottom-left-radius: 0; }
        </style>
        <div th:if="${header.accept.enabled}" id="merge-box" style="display:inline-block; vertical-align:top; text-align:left; position:relative;">
            <div class="btn-group">
                <button type="button" id="btnAccept" class="ybtn ybtn-success" th:data-url="${header.accept.formAction}" th:text="${header.accept.label ?: #messages.msg('pullRequest.merge')}"></button>
                <button type="button" id="btnMergeOptions" th:if="${#lists.size(header.accept.methods) > 1}" class="ybtn ybtn-success dropdown-toggle" data-toggle="dropdown" th:title="#{pullRequest.merge.options}"></button>
                <ul id="merge-method-menu" th:if="${#lists.size(header.accept.methods) > 1}" class="dropdown-menu pull-right" style="min-width:320px;">
                    <li th:each="option : ${header.accept.methods}" class="merge-method-item" th:data-method="${option.code}" th:data-label="${option.buttonLabel}"
                        th:data-title="${option.defaultTitle}" th:data-message="${option.defaultMessage}"
                        th:classappend="${!option.available} ? 'disabled'" th:title="${option.reason}">
                        <a href="#" style="white-space:normal;">
                            <strong th:text="${option.label}"></strong>
                            <span class="merge-method-check" th:if="${option.code == header.accept.defaultMethod}">&#10003;</span>
                            <small class="muted" style="display:block;" th:text="${option.reason ?: option.description}"></small>
                        </a>
                    </li>
                </ul>
            </div>
            <form id="merge-options" method="post" th:action="${header.accept.formAction}" class="well" style="display:none; position:absolute; right:0; top:100%; z-index:1000; width:420px; margin:4px 0 0; background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.18);">
                <input type="hidden" name="method" th:value="${header.accept.defaultMethod}">
                <div id="merge-message-fields">
                    <input type="text" name="commitTitle" class="input-block-level" maxlength="255" th:value="${header.accept.defaultOption?.defaultTitle}">
                    <textarea name="commitMessage" rows="6" class="input-block-level" style="resize:vertical;" th:text="${header.accept.defaultOption?.defaultMessage}"></textarea>
                </div>
                <button type="submit" id="btnMergeSubmit" class="ybtn ybtn-success" th:text="${header.accept.label ?: #messages.msg('pullRequest.merge')}"></button>
                <button type="button" id="btnMergeCancel" class="ybtn ybtn-default" th:text="#{button.cancel}"></button>
            </form>
            <script>
                (function () {
                    var box = document.getElementById('merge-box');
                    var form = document.getElementById('merge-options');
                    var main = document.getElementById('btnAccept');
                    var submit = document.getElementById('btnMergeSubmit');
                    var fields = document.getElementById('merge-message-fields');
                    main.addEventListener('click', function () { form.style.display = form.style.display === 'none' ? 'block' : 'none'; });
                    document.getElementById('btnMergeCancel').addEventListener('click', function () { form.style.display = 'none'; });
                    Array.prototype.forEach.call(box.querySelectorAll('.merge-method-item'), function (item) {
                        item.querySelector('a').addEventListener('click', function (e) {
                            e.preventDefault();
                            if (item.classList.contains('disabled')) { e.stopPropagation(); return; }
                            var method = item.getAttribute('data-method');
                            form.elements['method'].value = method;
                            form.elements['commitTitle'].value = item.getAttribute('data-title');
                            form.elements['commitMessage'].value = item.getAttribute('data-message');
                            main.textContent = submit.textContent = item.getAttribute('data-label');
                            fields.style.display = method === 'rebase' ? 'none' : 'block';
                            Array.prototype.forEach.call(box.querySelectorAll('.merge-method-item'), function (other) {
                                var check = other.querySelector('.merge-method-check');
                                if (check) { check.style.display = other === item ? '' : 'none'; }
                            });
                        });
                    });
                })();
            </script>
        </div>
        <span th:if="${header.accept.bypassNote != null}" id="accept-bypass-note" class="help-block" style="display:inline-block; margin-right:5px;" th:text="${header.accept.bypassNote}"></span>
        <button th:if="${!header.accept.enabled}" class="ybtn ybtn-disabled" data-toggle="tooltip" data-placement="top" th:title="${header.accept.disabledReason}" th:text="#{pullRequest.merge}"></button>
    </th:block>
</div>

<ul class="nav nav-tabs nm">
    <li th:class="${header.activeTab == 'overview'} ? 'active'">
        <a th:href="${header.overviewUrl}" th:text="#{pullRequest.menu.overview}"></a>
    </li>
    <li th:class="${header.activeTab == 'changes'} ? 'active'">
        <a th:href="${header.changesUrl}"><th:block th:text="#{pullRequest.menu.changes}"></th:block>
            <span class="num-badge" th:if="${header.openThreadCount > 0}" th:text="${header.openThreadCount}"></span>
        </a>
    </li>
</ul>
</th:block>
