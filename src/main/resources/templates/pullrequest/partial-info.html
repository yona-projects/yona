<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="info">
<div class="board-header issue">
    <div class="pull-right mr10 mt10">
        <div class="date" th:title="${header.agoTitle}" th:text="${header.ago}"></div>
        <span th:class="'badge nm ' + ${header.badgeClass}" th:text="#{${header.badgeKey}}"></span>
    </div>
    <div class="title">
        <strong class="board-id" th:text="'#' + ${header.number}"></strong> <th:block th:text="${header.title}"></th:block>
    </div>
</div>

<div class="pull-right">
    <th:block th:if="${header.reviewers != null}">
        <div id="reviewers" style="display:inline-block; margin-right:5px;">
            <span style="font-size: 13px; vertical-align: middle; margin: 0 10px;" th:utext="${header.reviewers.labelHtml}"></span>
            <th:block th:utext="${header.reviewers.avatarsHtml}"></th:block>
        </div>
        <a th:if="${header.reviewers.reviewUrl != null}" th:class="'ybtn ' + (${header.reviewers.reviewButtonSuccess} ? 'ybtn-success' : 'ybtn-default')" th:href="${header.reviewers.reviewUrl}" th:text="#{pullRequest.review}"></a>
    </th:block>

    <th:block th:if="${header.accept != null}">
        <a th:if="${header.accept.enabled}" id="btnAccept" th:href="${header.accept.url}" data-request-method="post" class="ybtn ybtn-success" th:text="${header.accept.label ?: #messages.msg('pullRequest.merge')}"></a>
        <!--/* 병합 방식 선택과 커밋 제목, 본문 직접 쓰기(추가 항목 X-28, decisions.md D-41). 허용한 방식만 보이고 할 수 없는 방식은 이유와 함께 막는다 */-->
        <a th:if="${header.accept.enabled}" id="btnMergeOptions" href="#" class="ybtn ybtn-success" style="margin-left:-5px;" th:title="#{pullRequest.merge.options}"
           onclick="var p=document.getElementById('merge-options'); p.style.display = (p.style.display === 'none' ? 'block' : 'none'); return false;">&#9662;</a>
        <div th:if="${header.accept.enabled}" id="merge-options" style="display:none; margin-top:8px; padding:10px; border:1px solid #ddd; background:#fff; text-align:left;">
            <form method="post" th:action="${header.accept.formAction}">
                <div th:each="option : ${header.accept.methods}">
                    <label th:title="${option.reason}">
                        <input type="radio" name="method" th:value="${option.code}" th:checked="${option.code == header.accept.defaultMethod}" th:disabled="${!option.available}">
                        <span th:text="${option.label}"></span>
                        <span th:if="${option.reason != null}" class="note" th:text="${option.reason}"></span>
                    </label>
                </div>
                <details class="mt10">
                    <summary th:text="#{pullRequest.merge.message.edit}"></summary>
                    <input type="text" name="commitTitle" class="form-control" maxlength="255" th:placeholder="#{pullRequest.merge.message.title}">
                    <textarea name="commitMessage" rows="4" class="form-control mt5" th:placeholder="#{pullRequest.merge.message.body}"></textarea>
                </details>
                <button type="submit" id="btnMergeSubmit" class="ybtn ybtn-success mt10" th:text="#{pullRequest.merge}"></button>
            </form>
        </div>
        <span th:if="${header.accept.bypassNote != null}" id="accept-bypass-note" class="help-block" style="display:inline-block; margin-right:5px;" th:text="${header.accept.bypassNote}"></span>
        <button th:if="${!header.accept.enabled}" class="ybtn ybtn-disabled" data-toggle="tooltip" data-placement="top" th:title="${header.accept.disabledReason}" th:text="#{pullRequest.merge}"></button>
    </th:block>
</div>

<ul class="nav nav-tabs nm">
    <li th:class="${header.activeTab == 'overview'} ? 'active'">
        <a th:href="${header.overviewUrl}" th:text="#{pullRequest.menu.overview}"></a>
    </li>
    <li th:class="${header.activeTab == 'changes'} ? 'active'">
        <a th:href="${header.changesUrl}"><th:block th:text="#{pullRequest.menu.changes}"></th:block>
            <span class="num-badge" th:if="${header.openThreadCount > 0}" th:text="${header.openThreadCount}"></span>
        </a>
    </li>
</ul>
</th:block>
