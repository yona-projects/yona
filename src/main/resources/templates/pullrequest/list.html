<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${projectView.project.name + ' - ' + #messages.msg(title)}, ${projectView}, 'PULL_REQUEST', ~{::listPage})}">
<th:block th:fragment="listPage">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PULL_REQUEST', 'main-menu-only')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{pullrequest/partial-search :: search}"></th:block>
    </div>
</div>

<th:block th:replace="~{common/select2 :: select2}"></th:block>

<script type="text/javascript" th:src="@{/assets/javascripts/lib/jquery.pageslide.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/service/yona.twoColumnMode.js}"></script>
<script type="text/javascript">
    $(document).ready(function(){
        _initTwoColumnMode();

        var isFirefox = navigator.userAgent.toLowerCase().indexOf('firefox') > -1;
        var isSafari = navigator.userAgent.indexOf('Safari') != -1 && navigator.userAgent.indexOf('Chrome') == -1;
        // Workaround for pjax bug result from bfcache
        // https://developer.mozilla.org/en-US/docs/Using_Firefox_1.5_caching
        if(isFirefox || isSafari){
            return;
        }

        var htPjaxOptions = {
            "fragment": "div[pjax-container]",
            "timeout" : 3000
        };

        if($.support.pjax) {
            $.pjax.defaults.maxCacheLength = 0;
        }

        // on click pagination
        $(document).on("click", "a[pjax-page]", function(weEvt) {
            $.pjax.click(weEvt, "div[pjax-container]", htPjaxOptions);
        });

        // on submit search form
        $(document).on("submit", "form[name='search']", function(weEvt) {
            $.pjax.submit(weEvt, "div[pjax-container]", htPjaxOptions);
        });

        // show spinners
        $(document).on({
            "pjax:send": function(){
                NProgress.start();
            },
            "pjax:complete": function(){
                NProgress.done();
            }
        });
    });
</script>
</th:block>
</html>
