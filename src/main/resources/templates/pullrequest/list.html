<!DOCTYPE html>
<!--/*

  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  이식 원본: app/views/git/list.scala.html
  모델: title, projectView, 그 밖의 값은 pullrequest/partial-search 참고
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${projectView.project.name + ' - ' + #messages.msg(title)}, ${projectView}, 'PULL_REQUEST', ~{::listPage})}">
<th:block th:fragment="listPage">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PULL_REQUEST', 'main-menu-only')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{pullrequest/partial-search :: search}"></th:block>
    </div>
</div>

<!--/* 담당자와 라벨 필터가 고른 라벨을 색으로 그린다(추가 항목 X-14) */-->
<link th:if="${hasLabels}" rel="stylesheet" type="text/css" media="screen" th:href="${#paths.project(projectView.project.owner, projectView.project.name) + '/issue/labels.css'}">
<th:block th:replace="~{common/select2 :: select2}"></th:block>

<script type="text/javascript" th:src="@{/assets/javascripts/service/yona.twoColumnMode.js}"></script>
<script type="text/javascript">
    $(document).ready(function(){
        _initTwoColumnMode();
    });
</script>
</th:block>
</html>
