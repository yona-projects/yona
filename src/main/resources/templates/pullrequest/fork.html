<!DOCTYPE html>
<!--/*

  이식 원본: app/views/git/fork.scala.html
  모델: title, projectView(원본), original, forkAction, cancelUrl, forkOwner, forkName, owners(ForkOwnerOption), existing(ExistingFork), protectedAllowed
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PULL_REQUEST', ~{::forkPage})}">
<th:block th:fragment="forkPage">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PULL_REQUEST', 'main-menu-only')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="content-wrap frm-wrap">
            <form th:action="${forkAction}" method="post" class="form-horizontal nm">
                <input type="hidden" name="owner" th:value="${forkOwner}" />
                <fieldset>
                    <legend>
                        <h4 style="padding-top:10px;"><th:block th:text="${original}"></th:block> <th:block th:text="#{fork}"></th:block></h4>
                    </legend>
                    <div id="helpMessage" class="card card-body">
                        <div class="row">
                        <th:block th:if="${#lists.isEmpty(existing)}">
                            <div class="float-left">
                                <img class="img-thumbnail" th:src="@{/assets/images/fork-pull/fork.jpg}"><br>
                            </div>
                            <div class="float-left help-messages">
                                <p class="lead" th:text="#{fork.help.title}"></p>
                                <p th:text="#{fork.help.message.1}"></p>
                                <p th:text="#{fork.help.message.2}"></p>
                            </div>
                        </th:block>
                        <th:block th:unless="${#lists.isEmpty(existing)}">
                            <div class="help-messages center-txt">
                                <i class="ico ico-err2"></i>
                                <p th:text="#{fork.already.exist}"></p>
                                <p th:each="f : ${existing}">
                                    <strong class="vmiddle" th:text="${original}"></strong>
                                    <i class="yobicon-right vmiddle"></i>
                                    <a th:href="${f.href}" class="vmiddle primary-txt" th:text="${f.label}"></a>
                                </p>
                            </div>
                        </th:block>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-form-label" for="inputOwner" th:text="#{project.owner}"></label>
                        <div>
                            <select id="project-owner" name="owner">
                                <option th:each="o : ${owners}" th:attr="data-url=${o.url}" th:value="${o.value}" th:selected="${o.selected}" th:text="${o.value}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-form-label" for="inputName" th:text="#{project.name}"></label>
                        <div>
                            <input type="text" id="inputName" name="name" th:value="${forkName}" />
                            <span class="d-inline-block align-middle pl-1 text-muted" th:text="#{project.name.alert}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="col-form-label" th:text="#{project.shareOption}"></label>
                        <div>
                            <input name="projectScope" type="radio" id="public" value="PUBLIC" class="radio-btn" checked="checked">
                            <label for="public" class="bg-radiobtn label-public" th:text="#{project.public}"></label>
                            <th:block th:if="${protectedAllowed}">
                                <input name="projectScope" type="radio" id="protected" value="PROTECTED" class="radio-btn">
                                <label for="protected" class="bg-radiobtn label-protected" th:text="#{project.protected}"></label>
                            </th:block>
                            <input name="projectScope" type="radio" id="private" value="PRIVATE" class="radio-btn">
                            <label for="private" class="bg-radiobtn label-private" th:text="#{project.private}"></label>
                        </div>
                    </div>
                    <div class="form-group">
                        <div>
                            <button type="submit" class="ybtn ybtn-info" th:text="#{fork}"></button>
                            <a th:href="${cancelUrl}" class="ybtn" th:text="#{button.cancel}"></a>
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
<script type="text/javascript">
$(document).ready(function() {
    $yobi.loadModule("project.Fork");
});
</script>
</th:block>
</html>
