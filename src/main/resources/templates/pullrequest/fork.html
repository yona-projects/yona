<!DOCTYPE html>
<!--/*

  이식 원본: app/views/git/fork.scala.html
  모델: title, projectView(원본), original, forkAction, cancelUrl, forkOwner, forkName, owners(ForkOwnerOption), existing(ExistingFork), protectedAllowed
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PULL_REQUEST', ~{::forkPage})}">
<th:block th:fragment="forkPage">
<div class="page-wrap-outer">
    <div class="project-page-wrap shell shell-below-banner">
        <th:block th:replace="~{project/menu :: sidebar(${projectView}, 'PULL_REQUEST')}"></th:block>
        <div class="shell-main">
        <div class="content-wrap frm-wrap">
            <form th:action="${forkAction}" method="post" class="form-horizontal nm">
                <input type="hidden" name="owner" th:value="${forkOwner}" />
                <fieldset>
                    <legend>
                        <h4 style="padding-top:10px;"><th:block th:text="${original}"></th:block> <th:block th:text="#{fork}"></th:block></h4>
                    </legend>
                    <div id="helpMessage" class="card card-body">
                        <div class="">
                        <th:block th:if="${#lists.isEmpty(existing)}">
                            <div class="float-start">
                                <img class="img-thumbnail" th:src="@{/assets/images/fork-pull/fork.jpg}"><br>
                            </div>
                            <div class="float-start help-messages">
                                <p class="lead" th:text="#{fork.help.title}"></p>
                                <p th:text="#{fork.help.message.1}"></p>
                                <p th:text="#{fork.help.message.2}"></p>
                            </div>
                        </th:block>
                        <th:block th:unless="${#lists.isEmpty(existing)}">
                            <div class="help-messages center-txt">
                                <i class="ico ico-err2"></i>
                                <p th:text="#{fork.already.exist}"></p>
                                <p th:each="f : ${existing}">
                                    <strong class="vmiddle" th:text="${original}"></strong>
                                    <i class="yobicon-right vmiddle"></i>
                                    <a th:href="${f.href}" class="vmiddle primary-txt" th:text="${f.label}"></a>
                                </p>
                            </div>
                        </th:block>
                        </div>
                    </div>
                    <!--/* A-568: 프로젝트 만들기 폼처럼 라벨이 입력란 위에 있고 입력란은 전체 폭이다. 입력 이름, id, 값은 그대로이다 */-->
                    <dl class="fork-fields">
                        <dt><label for="project-owner" th:text="#{project.owner}"></label></dt>
                        <dd>
                            <select class="w-100 form-select" id="project-owner" name="owner">
                                <option th:each="o : ${owners}" th:attr="data-url=${o.url}" th:value="${o.value}" th:selected="${o.selected}" th:text="${o.value}"></option>
                            </select>
                        </dd>
                        <dt><label for="inputName" th:text="#{project.name}"></label></dt>
                        <dd>
                            <input class="w-100 form-control" type="text" id="inputName" name="name" th:value="${forkName}" />
                            <span class="note d-block mt-1" th:text="#{project.name.alert}"></span>
                        </dd>
                        <dt th:text="#{project.shareOption}"></dt>
                        <dd>
                            <ul class="list-unstyled project-scopes">
                                <li>
                                    <input name="projectScope" type="radio" id="public" value="PUBLIC" class="radio-btn float-start form-check-input" checked="checked">
                                    <label for="public"><strong class="ml5" th:text="#{project.public}"></strong><span class="note" th:utext="#{project.public.notice}"></span></label>
                                </li>
                                <li th:if="${protectedAllowed}" class="mt-2">
                                    <input name="projectScope" type="radio" id="protected" value="PROTECTED" class="radio-btn float-start form-check-input">
                                    <label for="protected"><strong class="ml5" th:text="#{project.protected}"></strong><span class="note" th:utext="#{project.protected.notice}"></span></label>
                                </li>
                                <li class="mt-2">
                                    <input name="projectScope" type="radio" id="private" value="PRIVATE" class="radio-btn float-start form-check-input">
                                    <label for="private"><strong class="ml5" th:text="#{project.private}"></strong><span class="note" th:utext="#{project.private.notice}"></span></label>
                                </li>
                            </ul>
                        </dd>
                    </dl>
                    <div class="fork-actions">
                        <button type="submit" class="ybtn ybtn-success" th:text="#{fork}"></button>
                        <a th:href="${cancelUrl}" class="ybtn" th:text="#{button.cancel}"></a>
                    </div>
                </fieldset>
            </form>
        </div>
    
        </div><!--/* .shell-main */-->
    </div>
</div>
<script type="module" th:src="@{/assets/javascripts/esm/service/project.Fork.js}"></script>
<script type="text/javascript">
$(document).ready(function() {
    $yona.loadModule("project.Fork");
});
</script>
</th:block>
</html>
