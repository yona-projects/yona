<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko"
      th:with="pullRequestMenuLabel=#{menu.pullRequest}, pageTitle=${pr.title + ' - ' + pullRequestMenuLabel}">
<head th:replace="~{site/layout :: head(title=${pageTitle})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'pullRequest')}"></div>
    <link rel="stylesheet" th:href="@{/{owner}/{projectName}/issue/labels.css(owner=${project.owner}, projectName=${project.name})}" type="text/css" />

    <!--
     legacy git/view.scala.html("overview") + git/viewChanges.scala.html("changes") 대응.
     두 legacy 화면은 서로 다른 URL이지만 pullrequest/view.html 하나로 합쳐 tab 모델
     속성(overview|changes)에 따라 분기한다 — URL 라우팅은 legacy와 동일하게 별도로 유지된다
     (/pull/{number} = overview, /pull/{number}/changes[/{commitId}] = changes, 컨트롤러 참고).
    -->
    <div class="page-wrap-outer">
        <div class="project-page-wrap" th:classappend="${tab == 'changes'} ? 'code-browse-wrap' : ''">

            <div th:replace="~{pullrequest/partial_info :: info(${project}, ${pr}, ${currentUser}, ${tab}, ${openThreadCount}, ${isAcceptable}, ${disabledAcceptReason})}"></div>

            <!-- ===================== OVERVIEW 탭 (legacy git/view.scala.html) ===================== -->
            <th:block th:if="${tab == 'overview'}">
                <div class="board-body">
                    <div class="author-info left-txt" style="margin-top:20px;">
                        <a th:href="@{/user/{loginId}(loginId=${pr.contributor.loginId})}" class="usf-group pull-left">
                            <span class="avatar-wrap smaller">
                                <img th:src="${pr.contributor.avatarUrl}" width="32" height="32">
                            </span>
                            <strong class="name" th:text="${pr.contributor.name}">보낸 사람</strong>
                            <span class="loginid"> <strong>@</strong><span th:text="${pr.contributor.loginId}">loginId</span></span>
                        </a>
                        <div th:replace="~{pullrequest/partial_branch :: branch(${pr})}"></div>
                    </div>
                    <div class="content markdown-wrap" th:utext="${markdownService.render(pr.body, true, project)}">본문 내용</div>
                    <div class="attachments" id="attachments" th:data-attachments="${attachmentsJson}"></div>
                </div>

                <!-- PR 담당자/라벨 표시·편집. 백엔드(PullRequestService.setAssignee/addLabel/removeLabel,
                     PullRequestApiController)는 먼저 만들어져 있었고 화면은 이후에 추가됐다. issue/
                     view.html의 담당자 dl/dt/dd 마크업(usf-group/avatar-wrap/name/loginid 클래스)과
                     라벨 프래그먼트(issue/partial_select_label, issue/partial_show_selected_label)를
                     그대로 재사용한다. 다만 담당자 입력만은 그대로 재사용하지 않았다 — Issue의
                     담당자 select2는 로그인ID 기반 AJAX 검색(yonaAssgineeModule, Issue 전용
                     assignableUsers/assignees 엔드포인트)인데 PR의 setAssignee REST API는
                     숫자 userId를 받는 별도 계약이라 그대로 이어붙일 수 없다 — 대신 같은 화면의
                     마일스톤 select(정적 <option> + data-toggle="tomselect")와 동일한 패턴으로 프로젝트
                     멤버 목록을 서버 렌더링한다. 라벨은 백엔드 계약이 issue와 동일(라벨 ID)해 프래그먼트를
                     100% 그대로 재사용했다. 편집 가능 여부는 PullRequestController.checkWritePermission()
                     (프로젝트 멤버 여부)과 동일한 @templateHelper.isMember()로 게이트한다. -->
                <div class="issue-info pr-assignee-label-info"
                     th:with="prAssigneeLabelEditable=${currentUser != null and @templateHelper.isMember(project, currentUser)}">
                    <dl>
                        <dt th:text="#{issue.assignee}">담당자</dt>
                        <dd>
                            <select th:if="${prAssigneeLabelEditable}" id="pr-assignee-select" name="assigneeUserId"
                                    data-toggle="tomselect" data-container-css-class="fullsize" style="width: 100%;">
                                <option value="" th:selected="${pr.assignee == null}" th:text="#{issue.noAssignee}">담당자 없음</option>
                                <option th:each="pu : ${project.projectUsers}" th:value="${pu.user.id}"
                                        th:selected="${pr.assignee != null and pr.assignee.user.id == pu.user.id}"
                                        th:text="${pu.user.name}">멤버</option>
                            </select>
                            <th:block th:unless="${prAssigneeLabelEditable}">
                                <a th:if="${pr.assignee != null}" th:href="@{/{loginId}(loginId=${pr.assignee.user.loginId})}" class="usf-group">
                                    <span class="avatar-wrap smaller"><img th:src="${pr.assignee.user.avatarUrl}" width="20" height="20"></span>
                                    <strong class="name" th:text="${pr.assignee.user.name}">이름</strong>
                                    <span class="loginid"> <strong>@</strong><span th:text="${pr.assignee.user.loginId}">loginId</span></span>
                                </a>
                                <div th:unless="${pr.assignee != null}" th:text="#{issue.noAssignee}">담당자 없음</div>
                            </th:block>
                        </dd>
                    </dl>

                    <th:block th:with="projectLabels=${@templateHelper.getProjectLabels(project)}">
                        <div th:if="${projectLabels != null and !projectLabels.isEmpty()}">
                            <div th:if="${prAssigneeLabelEditable}">
                                <div th:replace="~{issue/partial_select_label :: selectLabel(${projectLabels}, ${pr.labels}, '', '', ${project})}"></div>
                            </div>
                            <div th:unless="${prAssigneeLabelEditable}">
                                <div th:replace="~{issue/partial_show_selected_label :: showLabel(${pr.labels}, '')}"></div>
                            </div>
                        </div>
                    </th:block>
                </div>

                <!-- 연동된 자동 닫기 이슈 정보(legacy에는 없는 yona 확장 — 기존 세션에서 이미 정착됨, 유지) -->
                <div th:if="${referredIssues != null and !referredIssues.isEmpty()}" class="alert alert-info" style="margin-top:15px;">
                    <strong>이 풀 리퀘스트가 병합되면 다음 이슈가 자동으로 닫힙니다:</strong>
                    <ul style="margin-bottom:0;">
                        <li th:each="issue : ${referredIssues}">
                            <a th:href="@{/{owner}/{projectName}/issue/{number}(owner=${project.owner}, projectName=${project.name}, number=${issue.number})}"
                               th:text="'#' + ${issue.number} + ' ' + ${issue.title}">#123 이슈 제목</a>
                        </li>
                    </ul>
                </div>

                <div id="state" class="pullRequest-stateInfo">
                    <div th:replace="~{pullrequest/partial_state :: state(${project}, ${pr}, ${currentUser}, ${canDeleteBranch}, ${canRestoreBranch})}"></div>
                </div>

                <div class="board-footer board-actrow">
                    <div class="pull-left">
                        <button th:if="${currentUser != null}" id="watch-button" type="button" class="ybtn" th:classappend="${isWatching} ? 'ybtn-watching' : ''"
                                data-toggle="button" th:data-watching="${isWatching}"
                                th:text="${isWatching} ? #{project.unwatch} : #{project.watch}">지켜보기</button>
                    </div>

                    <div class="mr5" style="display:inline-block;">
                        <a th:if="${currentUser != null and @accessControl.isAllowed(currentUser, project, pr, T(com.github.yonaprojects.yona.domain.enumeration.Operation).UPDATE)}"
                           th:href="@{/{owner}/{projectName}/pull/{number}/edit(owner=${project.owner}, projectName=${project.name}, number=${pr.number})}" class="ybtn" th:text="#{button.edit}">수정</a>
                        <a th:if="${pr.state.name() == 'OPEN' and currentUser != null and @accessControl.isAllowed(currentUser, project, pr, T(com.github.yonaprojects.yona.domain.enumeration.Operation).CLOSE)}"
                           data-request-method="post" th:data-request-uri="@{/api/projects/{projectId}/pullrequests/{number}/state(projectId=${project.id}, number=${pr.number}, state='CLOSED')}" class="ybtn" th:text="#{pullRequest.close}">보류</a>
                        <a th:if="${pr.state.name() == 'CLOSED' and currentUser != null and @accessControl.isAllowed(currentUser, project, pr, T(com.github.yonaprojects.yona.domain.enumeration.Operation).REOPEN)}"
                           data-request-method="post" th:data-request-uri="@{/api/projects/{projectId}/pullrequests/{number}/state(projectId=${project.id}, number=${pr.number}, state='OPEN')}" class="ybtn" th:text="#{pullRequest.reopen}">다시 열기</a>
                    </div>
                </div>

                <hr class="nm">

                <div class="board-comment-wrap">
                    <ul class="comments" id="comments" th:if="${timeline != null and !timeline.isEmpty()}">
                        <th:block th:each="item : ${timeline}">
                            <div th:replace="~{pullrequest/partial_pull_request_event :: event(${project}, ${pr}, ${item.event})}"></div>
                        </th:block>
                    </ul>
                </div>

                <!-- PR 승인/변경요청 워크플로 — GitHub PR 페이지의 리뷰 판정
                     (Approve/Request changes/Comment) 이력 + 제출 폼. addReviewer/removeReviewer
                     (위 #reviewers 자기등록)와는 완전히 별개 액션이다: "리뷰어로 등록"과 "리뷰 판정을
                     내림"은 GitHub에서도 서로 다른 개념이라 API/버튼을 분리했다. -->
                <div id="pr-reviews" class="board-comment-wrap" th:if="${reviews != null}">
                    <h4 style="margin:15px 0 10px;" th:text="#{pullRequest.review.total}">전체 리뷰</h4>

                    <div th:if="${reviews.isEmpty()}" class="alert alert-info" th:text="#{pullRequest.review.verdict.list.empty}">아직 리뷰가 없습니다</div>

                    <div class="review-list-item" th:each="rv : ${reviews}">
                        <a th:href="@{/user/{loginId}(loginId=${rv.reviewer.loginId})}" class="avatar-wrap smaller">
                            <img th:src="${rv.reviewer.avatarUrl}">
                        </a>
                        <strong th:text="${rv.reviewer.name}">리뷰어</strong>
                        <span class="review-verdict-label review-verdict-approve" th:if="${rv.state.name() == 'APPROVE'}" th:text="#{pullRequest.review.verdict.state.approve}">승인함</span>
                        <span class="review-verdict-label review-verdict-request-changes" th:if="${rv.state.name() == 'REQUEST_CHANGES'}" th:text="#{pullRequest.review.verdict.state.requestChanges}">변경을 요청함</span>
                        <span class="review-verdict-label" th:if="${rv.state.name() == 'COMMENT'}" th:text="#{pullRequest.review.verdict.state.comment}">코멘트를 남김</span>
                        <span class="date" style="margin-left:8px;" th:title="${@templateHelper.getDateString(rv.createdDate)}" th:text="${@templateHelper.agoOrDateString(rv.createdDate)}">방금 전</span>
                        <div class="content markdown-wrap" th:if="${rv.body != null and !rv.body.isEmpty()}" th:utext="${markdownService.render(rv.body, true, project)}" style="margin-top:6px;">리뷰 내용</div>
                    </div>

                    <div id="pr-review-submit" th:if="${currentUser != null and pr.state.name() == 'OPEN'}" style="margin-top:15px;">
                        <textarea id="pr-review-body" class="span12" rows="3" th:placeholder="#{pullRequest.review.verdict.bodyPlaceholder}"></textarea>
                        <div class="mt5">
                            <button type="button" id="btn-review-approve" class="ybtn ybtn-success" th:if="${canApproveOrRequestChanges}" th:text="#{pullRequest.review.verdict.approve}">승인</button>
                            <button type="button" id="btn-review-request-changes" class="ybtn ybtn-danger" th:if="${canApproveOrRequestChanges}" th:text="#{pullRequest.review.verdict.requestChanges}">변경 요청</button>
                            <button type="button" id="btn-review-comment" class="ybtn ybtn-default" th:text="#{pullRequest.review.verdict.comment}">코멘트</button>
                        </div>
                    </div>
                </div>

                <div class="right-txt">
                    <a href="#helpMessage" class="ybtn ybtn-inverse ybtn-mini" data-toggle="modal" th:text="#{title.help}">도움말</a>
                </div>
            </th:block>

            <!-- ===================== CHANGES 탭 (legacy git/viewChanges.scala.html) ===================== -->
            <th:block th:if="${tab == 'changes'}">
                <div class="board-body mb20">
                    <div class="author-info right-txt" style="margin-top:20px;">
                        <a th:href="@{/user/{loginId}(loginId=${pr.contributor.loginId})}" class="usf-group pull-left">
                            <span class="avatar-wrap smaller">
                                <img th:src="${pr.contributor.avatarUrl}" width="32" height="32">
                            </span>
                            <strong class="name" th:text="${pr.contributor.name}">보낸 사람</strong>
                            <span class="loginid"> <strong>@</strong><span th:text="${pr.contributor.loginId}">loginId</span></span>
                        </a>
                        <div th:replace="~{pullrequest/partial_branch :: branch(${pr})}"></div>
                    </div>
                </div>

                <div class="codediff-wrap mt10" th:classappend="${commentThreads == null or commentThreads.isEmpty()} ? 'diffs-only' : ''">
                    <button th:if="${commentThreads != null and !commentThreads.isEmpty()}" type="button" class="ybtn ybtn-default btn-show-reviewcards">
                        <i class="yobicon-restore"></i>
                    </button>
                    <div id="changes" class="diffs-wrap"
                         th:with="reviewCommentResourceType=${T(com.github.yonaprojects.yona.domain.enumeration.ResourceType).REVIEW_COMMENT},
                                  reviewCommentPostUrl=@{/{owner}/{projectName}/pullRequest/{pullRequestId}/comments(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pr.id})},
                                  canReviewComment=${currentUser != null and @accessControl.isProjectResourceCreatable(currentUser, project, T(com.github.yonaprojects.yona.domain.enumeration.ResourceType).REVIEW_COMMENT)}"
                         th:data-can-review-comment="${canReviewComment}"
                         th:data-review-comment-post-url="${reviewCommentPostUrl}"
                         th:data-commit-id="${commitId}"
                         th:data-markdown-render-url="@{/markdown/{owner}/{name}(owner=${project.owner}, name=${project.name})}"
                         th:data-mention-url="@{/api/{owner}/{name}/mentionList(owner=${project.owner}, name=${project.name})}">
                        <div id="commits" class="btn-group auto mb10">
                            <button class="btn dropdown-toggle auto" data-toggle="dropdown">
                                <span class="d-label" th:text="${commitId == null} ? #{pullRequest.changes.all} : ${commitId}">전체</span>
                                <span class="d-caret"><span class="caret"></span></span>
                            </button>
                            <ul class="dropdown-menu">
                                <li data-value="All"><a th:href="@{/{owner}/{projectName}/pull/{number}/changes(owner=${project.owner}, projectName=${project.name}, number=${pr.number})}" th:text="#{pullRequest.changes.all}">전체</a></li>
                            </ul>
                        </div>

                        <div class="diff-body diffs-wrap-scroll">
                            <div th:replace="~{pullrequest/partial_state :: state(${project}, ${pr}, ${currentUser}, false, false)}"></div>
                            <div th:if="${diffs != null and !diffs.isEmpty()}" th:replace="~{pullrequest/partial_diff :: diff(${diffs}, ${commentThreads}, ${project}, ${pr.toProject}, ${pr.toProject})}"></div>
                            <div class="alert alert-info" th:if="${diffs == null or diffs.isEmpty()}" th:text="#{pullRequest.diff.noChanges}">변경 내역이 없습니다.</div>
                            <div class="btnPop"><button type="button" class="ybtn ybtn-info ybtn-small"><i class="yobicon-post2"></i></button></div>
                            <!-- 4단계 복원: legacy CodeCommentBox(플로팅 마크다운 에디터+첨부파일
                                 팝업). code/diff.html과 동일한 이유로 되살린다 - 이전엔 매번 새
                                 <textarea> 폼을 tr 뒤에 끼워 넣는 훨씬 단순화된 대체 구현이었다.
                                 이 위 227~236줄 주석에 남아있던 "P3-55에서 CodeCommentBox.js를
                                 완전히 제거하기로 결정했다"는 기록은 legacy 재조사 결과 뒤집혔다
                                 (project_code_diff_restoration_plan 메모 4단계 참고, 사용자
                                 확인 완료) - 단, "범위 없는 PR 전체 댓글"(common/commentForm)은
                                 legacy에서도 이 팝업과 무관한 별개 상시 폼이라 그대로 둔다. -->
                            <th:block th:if="${canReviewComment}">
                                <div th:replace="~{common/reviewForm :: reviewForm(${project}, ${reviewCommentResourceType}, ${reviewCommentPostUrl})}"></div>
                            </th:block>
                        </div>

                        <div class="board-comment-wrap">
                            <div class="non-ranged-threads-wrap">
                                <!-- th:if와 th:replace를 같은 태그에 함께 쓰면 Thymeleaf의 처리
                                     우선순위(fragment inclusion이 conditional evaluation보다
                                     먼저 처리됨)상 th:if가 false여도 프래그먼트가 이미 삽입돼
                                     버려서 ranged 스레드까지 이 영역에 중복 렌더링되는 버그가
                                     있었다(스레드 중복 렌더링 원인) - th:if를 별도 th:block으로
                                     감싸 분리해 수정. -->
                                <th:block th:if="${commentThreads != null}" th:each="thread : ${commentThreads}">
                                    <th:block th:if="${thread instanceof T(com.github.yonaprojects.yona.domain.pullrequest.NonRangedCodeCommentThread)}">
                                        <div th:replace="~{pullrequest/partial_comment_thread :: thread(${thread}, ${project}, ${pr})}"></div>
                                    </th:block>
                                </th:block>
                            </div>
                            <!--
                             P3-55: legacy 재조사 결과, board-comment-wrap 안에서 "범위 없는
                             일반 댓글 작성"을 담당하던 것은 reviewForm이 아니라 완전히 별도
                             파일인 common.commentForm(container, resourceType, action)이었다
                             (legacy git/viewChanges.scala.html 145줄 - common/commentForm
                             .scala.html 호출, non-ranged-threads-wrap 바로 다음). reviewForm은
                             board-comment-wrap 밖의 "BlockComment" 섹션에서 diff 라인/스레드로
                             yona.CodeCommentBox.js가 동적으로 옮겨 재사용하던 별개의 팝오버
                             템플릿이었다(그래서 죽은 코드로 판단해 common/reviewForm.html +
                             yona.CodeCommentBox.js를 완전히 제거했다 - code/diff.html이 이미
                             별도 vanilla JS 패턴으로 대체한 것과 동일 판단, P3-52). 포팅
                             과정에서 commentForm에 대응하는 파일이 통째로 누락돼 있던 것을
                             새로 만들었다(common/commentForm.html) - legacy와 동일 위치에 배치.
                            -->
                            <th:block th:with="reviewCommentResourceType=${T(com.github.yonaprojects.yona.domain.enumeration.ResourceType).REVIEW_COMMENT},
                                               commentFormAction=@{/{owner}/{projectName}/pullRequest/{pullRequestId}/comments(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pr.id})}">
                                <div th:replace="~{common/commentForm :: commentForm(${project}, ${reviewCommentResourceType}, ${commentFormAction}, ${currentUser}, ${canReviewComment}, ${commitId})}"></div>
                            </th:block>
                        </div>
                    </div>

                    <div class="review-wrap" th:if="${commentThreads != null and !commentThreads.isEmpty()}">
                        <div class="review-container">
                            <button type="button" class="ybtn ybtn-default btn-hide-reviewcards"><i class="yobicon-maximize"></i></button>

                            <ul class="nav nav-tabs" style="margin-bottom:10px;" th:with="openThreads=${commentThreads.?[state.name() == 'OPEN']}, closedThreads=${commentThreads.?[state.name() == 'CLOSED']}">
                                <li class="active"><a href="#reviewcards-open" data-toggle="tab" th:text="#{issue.state.open} + ' ' + ${openThreads.size()}">열림</a></li>
                                <li><a href="#reviewcards-closed" data-toggle="tab" th:text="#{issue.state.closed} + ' ' + ${closedThreads.size()}">닫힘</a></li>
                            </ul>

                            <div class="tab-content review-list" th:with="openThreads=${commentThreads.?[state.name() == 'OPEN']}, closedThreads=${commentThreads.?[state.name() == 'CLOSED']}">
                                <div id="reviewcards-open" class="tab-pane active">
                                    <div th:replace="~{pullrequest/partial_reviewlist :: reviewlist(${openThreads}, ${project}, ${pr})}"></div>
                                </div>
                                <div id="reviewcards-closed" class="tab-pane">
                                    <div th:replace="~{pullrequest/partial_reviewlist :: reviewlist(${closedThreads}, ${project}, ${pr})}"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>

            <!-- code.Diff.js의 미니맵(스크롤 위치에 리뷰 스레드 표시) - code/diff.html에서 이미
                 이식한 것과 동일한 마크업. legacy git/viewChanges.scala.html에는 있었는데 PR
                 "Changes" 탭 이식 시 통째로 빠져있었다. -->
            <div id="minimap" class="minimap-outer" th:if="${tab == 'changes'}">
                <div class="minimap-wrap">
                    <div class="minimap-curr"></div>
                    <div class="minimap-links"></div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:with="commentsContainerSelector=${tab == 'changes' ? '#changes' : '#comments'}">
        <div th:replace="~{common/commentDeleteModal :: commentDeleteModal(${commentsContainerSelector})}"></div>
    </th:block>

    <div id="helpMessage" class="modal hide fade pullreq-info" th:if="${tab == 'overview'}">
        <div class="modal-header">
            <h5 th:text="#{pullRequest.merge.help.1}">도움말</h5>
        </div>
        <div class="modal-body">
            <div class="row-fluid">
                <div class="pull-left help-messages mt10">
                    <p th:text="#{pullRequest.merge.help.2}"></p>
                    <p th:text="#{pullRequest.merge.help.3}"></p>
                    <p th:text="#{pullRequest.merge.help.4}"></p>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="ybtn ybtn-info ybtn-small" data-dismiss="modal" th:text="#{button.confirm}">확인</button>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<!-- P3-46 #6+7: markdown fragment(yona.Markdown.js 로드 포함)를 반드시 scripts fragment
     (yona-lib.js 포함, 구버전 yona.Markdown 사본이 박혀있음) 뒤로 옮겨야 새 정의가 번들의
     구식 정의를 덮어쓴다 — 원래 이 페이지는 순서가 반대였다(다른 모든 페이지는 이미 scripts가
     먼저였음). 자세한 경위는 site/layout.html::markdown(project) fragment의 주석 참고. -->
<th:block th:replace="~{site/layout :: markdown(${project})}"></th:block>
<th:block th:replace="~{common/tomselect :: tomselect}"></th:block>
<!-- 3단계: 드래그 다중행 범위선택 - common/yona.CodeCommentBlock.js는 이미 완전한 vanilla
     포팅으로 존재했지만 어느 템플릿도 로드하지 않아 죽어 있었다. -->
<script src="/javascripts/common/yona.CodeCommentBlock.js"></script>
<script src="/javascripts/common/yona.CodeCommentBox.js"></script>
<!-- P3-69: legacy service/yobi.git.View.js의 #state 폴링(10초 간격) 대응 — overview 탭에서만
     초기화한다(아래 loadModule 호출의 tab 분기 참고). -->
<script src="/javascripts/service/yona.pullrequest.View.js"></script>
<script type="text/javascript" th:inline="javascript">
  document.addEventListener("DOMContentLoaded", function() {
      var projectId = [[${project.id}]];
      var prNumber = [[${pr.number}]];
      var tab = [[${tab}]];

      function _errorMessageFrom(text, fallback) {
          try {
              var parsed = JSON.parse(text);
              if (parsed && (parsed.message || parsed.error)) { return parsed.message || parsed.error; }
          } catch(e) {}
          return text || fallback || '';
      }
      function _formEncode(obj) {
          return Object.keys(obj).map(function(k){
              return encodeURIComponent(k) + "=" + encodeURIComponent(obj[k]);
          }).join("&");
      }

      // P3-69: legacy service/yobi.git.View.js의 _setStateUpdateTimer() 대응 — overview 탭에서만
      // #state/#pr-accept-button을 10초 간격으로 폴링한다. PR이 이미 CLOSED/MERGED거나 병합
      // 진행 중(isMerging)이면 shouldPoll=false로 넘겨 애초에 타이머를 만들지 않는다
      // (partial_state.html의 최상위 조건 분기 참고 — 이 상태들에서는 더 이상 바뀌지 않는다).
      if (tab === 'overview') {
          $yona.loadModule("pullrequest.View", {
              "stateUrl": [[@{/{owner}/{projectName}/pull/{number}/state(owner=${project.owner}, projectName=${project.name}, number=${pr.number})}]],
              "shouldPoll": [[${pr.state.name() != 'CLOSED' and pr.state.name() != 'MERGED' and pr.isMerging != true}]]
          });
      }

      // legacy git/view.scala.html $yona.loadModule("git.View", {...}) 대응 — watch 토글
      var elWatchButton = document.getElementById("watch-button");
      if (elWatchButton) {
          elWatchButton.addEventListener("click", function() {
              var watching = elWatchButton.dataset.watching === "true";
              var url = watching ? "/unwatch" : "/watch";
              fetch(url, {
                  method: "POST",
                  headers: {"Content-Type": "application/x-www-form-urlencoded; charset=UTF-8"},
                  body: _formEncode({ "resource.type": "PULL_REQUEST", "resource.id": String([[${pr.id}]]) })
              }).then(function() { window.location.reload(); });
          });
      }

      // legacy partial_info.scala.html의 accept 버튼(#btnAccept) 대응. P3-69: 폴링이 상태
      // 갱신 시 이 버튼(#pr-accept-button 내부)을 통째로 다시 렌더링해 DOM에서 교체하므로,
      // 폴링 이후에도 클릭이 계속 동작하도록 직접 바인딩이 아닌 위임(delegated) 방식으로 건다.
      document.addEventListener("click", function(e) {
          var matched = e.target.closest("#btnAccept");
          if (!matched) { return; }
          e.preventDefault();
          if (!confirm([[#{pullRequest.merge}]] + '?')) { return; }
          fetch('/api/projects/' + projectId + '/pullrequests/' + prNumber + '/merge', {method: 'POST'})
              .then(function(response) {
                  if (response.ok) {
                      window.location.reload();
                  } else {
                      return response.text().then(function(text) {
                          alert([[#{pullRequest.merge}]] + ' failed: ' + _errorMessageFrom(text));
                      });
                  }
              });
      });

      // 담당자 변경. PullRequestApiController의
      // PUT/DELETE .../assignee에 위임한다(userId 기반 계약, 위 select 주석 참고).
      var elPrAssigneeSelect = document.getElementById('pr-assignee-select');
      if (elPrAssigneeSelect) {
          elPrAssigneeSelect.addEventListener('change', function() {
              var userId = elPrAssigneeSelect.value;
              var url = '/api/projects/' + projectId + '/pullrequests/' + prNumber + '/assignee';
              var req = userId
                  ? fetch(url, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: parseInt(userId, 10) }) })
                  : fetch(url, { method: 'DELETE' });
              req.then(function(response) {
                  if (response.ok) { window.location.reload(); }
                  else { alert('담당자 변경에 실패했습니다.'); }
              });
          });
      }

      // 라벨 추가/제거. issue/partial_select_label.html의 select2 다중선택 마크업을 그대로
      // 재사용하되, 이슈의 massUpdate 폼 제출과 달리 PR은 라벨 전용 REST 엔드포인트
      // (PullRequestApiController POST/DELETE .../labels)라 select2 change 이벤트에서 이전
      // 선택값과의 diff를 계산해 추가/삭제 요청을 각각 보낸다.
      var elLabelIds = document.getElementById('labelIds');
      var prevLabelIds = (elLabelIds ? Array.prototype.map.call(elLabelIds.selectedOptions, function(o){ return o.value; }) : []).map(String);
      if (elLabelIds) {
          elLabelIds.addEventListener('change', function() {
              var current = Array.prototype.map.call(elLabelIds.selectedOptions, function(o){ return o.value; }).map(String);
              var added = current.filter(function(id) { return prevLabelIds.indexOf(id) === -1; });
              var removed = prevLabelIds.filter(function(id) { return current.indexOf(id) === -1; });
              if (added.length === 0 && removed.length === 0) { return; }
              var base = '/api/projects/' + projectId + '/pullrequests/' + prNumber + '/labels';
              var requests = [];
              added.forEach(function(id) {
                  requests.push(fetch(base, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ labelId: parseInt(id, 10) }) }));
              });
              removed.forEach(function(id) {
                  requests.push(fetch(base + '/' + id, { method: 'DELETE' }));
              });
              Promise.all(requests).then(function(responses) {
                  if (responses.every(function(r){ return r.ok; })) {
                      window.location.reload();
                  } else {
                      alert('라벨 변경에 실패했습니다.');
                  }
              }, function() { alert('라벨 변경에 실패했습니다.'); });
          });
      }

      // 리뷰 참여/취소 버튼(legacy ReviewApp.review/unreview)
      var elBtnReview = document.getElementById("btn-review");
      if (elBtnReview) {
          elBtnReview.addEventListener("click", function() {
              fetch([[@{/api/{owner}/{projectName}/pullRequest/{pullRequestId}/review(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pr.id})}]], {method: "POST"})
                  .then(function() { window.location.reload(); });
          });
      }
      var elBtnUnreview = document.getElementById("btn-unreview");
      if (elBtnUnreview) {
          elBtnUnreview.addEventListener("click", function() {
              fetch([[@{/api/{owner}/{projectName}/pullRequest/{pullRequestId}/unreview(owner=${project.owner}, projectName=${project.name}, pullRequestId=${pr.id})}]], {method: "POST"})
                  .then(function() { window.location.reload(); });
          });
      }

      // Approve/Request changes/Comment 판정 제출.
      // 위 btn-review/btn-unreview(자기등록/취소)와는 완전히 별개 액션이다. 서버가
      // 자기 자신의 PR에 대한 APPROVE/REQUEST_CHANGES를 400 + {"error": "..."}로 거부하면
      // (SelfReviewException) 그 메시지를 그대로 alert로 보여준다.
      function submitPullRequestReview(state) {
          var elPrReviewBody = document.getElementById('pr-review-body');
          var body = elPrReviewBody ? elPrReviewBody.value : undefined;
          fetch('/api/projects/' + projectId + '/pullrequests/' + prNumber + '/reviews', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ state: state, body: body })
          }).then(function(response) {
              if (response.ok) {
                  window.location.reload();
              } else {
                  return response.text().then(function(text) {
                      alert(_errorMessageFrom(text, '리뷰 등록에 실패했습니다.'));
                  });
              }
          });
      }
      var elBtnReviewApprove = document.getElementById('btn-review-approve');
      var elBtnReviewRequestChanges = document.getElementById('btn-review-request-changes');
      var elBtnReviewComment = document.getElementById('btn-review-comment');
      if (elBtnReviewApprove) { elBtnReviewApprove.addEventListener('click', function() { submitPullRequestReview('APPROVE'); }); }
      if (elBtnReviewRequestChanges) { elBtnReviewRequestChanges.addEventListener('click', function() { submitPullRequestReview('REQUEST_CHANGES'); }); }
      if (elBtnReviewComment) { elBtnReviewComment.addEventListener('click', function() { submitPullRequestReview('COMMENT'); }); }

      // [data-request-method] 범용 처리(닫기/다시열기/브랜치 삭제·복구 등). P3-69: 브랜치
      // 삭제/복구 버튼은 #state 안(pullrequest/partial_state)에 있어 폴링이 갱신할 때마다
      // DOM에서 새로 그려지므로, 위 #btnAccept와 동일한 이유로 위임 방식으로 건다.
      document.addEventListener('click', function(e) {
          var matched = e.target.closest('[data-request-method]');
          if (!matched || matched.id === 'btnAccept') { return; }
          e.preventDefault();
          fetch(matched.dataset.requestUri || matched.getAttribute('href'), {
              method: matched.dataset.requestMethod.toUpperCase()
          }).then(function(response) {
              if (response.ok) { window.location.reload(); }
              else { alert('요청을 처리하지 못했습니다.'); }
          });
      });

      // legacy git/viewChanges.scala.html의 btn-show-reviewcards / btn-hide-reviewcards 토글
      document.querySelectorAll('.btn-show-reviewcards').forEach(function(el){
          el.addEventListener('click', function() {
              document.querySelectorAll('.review-wrap').forEach(function(w){ w.classList.add('show'); });
          });
      });
      document.querySelectorAll('.btn-hide-reviewcards').forEach(function(el){
          el.addEventListener('click', function() {
              document.querySelectorAll('.review-wrap').forEach(function(w){ w.classList.remove('show'); });
          });
      });

      // P3-52 항목4 — code/diff.html에는 있던 "diff 줄 클릭 -> 그 줄에 새 리뷰 댓글 작성 폼"
      // UI가 PR 코드리뷰(changes 탭)에는 없었다(기존 스레드는 partial_diff_comment_on_line로
      // 잘 보이지만 "시작"하는 UI 자체가 없었음 — 백엔드 POST .../pullRequest/{id}/comments는
      // 이미 codeRange를 받을 수 있어 프론트엔드 배선만 빠져 있었다). code/diff.html과 동일한
      // 패턴(네이티브 <form> 삽입 + 실제 POST/Redirect/GET, AJAX 아님 — ReviewViewController.
      // newPullRequestComment()도 "redirect:..."를 반환하는 고전적 패턴)으로 이식한다.
      var changesRoot = document.getElementById('changes');
      // P3-70 라운드1: jQuery .data()는 문자열 "true"/"false"를 실제 boolean으로 자동 변환하지만
      // 네이티브 dataset은 항상 문자열을 돌려준다 - data-can-review-comment="false"가 dataset
      // 접근 시 그대로 truthy한 "false" 문자열이 되어 게이트가 깨지는 것을 막기 위해 명시적으로
      // 문자열 "true"와 비교한다.
      if (changesRoot && changesRoot.dataset.canReviewComment === 'true') {
          var reviewCommentCommitId = changesRoot.dataset.commitId;

          changesRoot.querySelectorAll('tr[data-line]').forEach(function(tr) {
              var btnCell = tr.querySelector('.add-comment-btn-cell');
              if (!btnCell) { return; }
              btnCell.style.cursor = 'pointer';
              tr.addEventListener('mouseenter', function() { btnCell.style.color = '#0366d6'; });
              tr.addEventListener('mouseleave', function() { btnCell.style.color = 'transparent'; });
          });

          // ===== 3~4단계 복원: 드래그 다중행 범위선택(CodeCommentBlock) + 플로팅 댓글 상자
          // (CodeCommentBox) ===== code/diff.html과 완전히 동일한 이유·패턴으로 연결한다 -
          // common/yona.CodeCommentBlock.js는 이미 완전한 vanilla 포팅으로 존재했지만 로드하는
          // 템플릿이 없어 죽어 있었다. 위 224~234줄의 "P3-55에서 CodeCommentBox.js를 완전히
          // 제거하기로 결정했다"는 기록은 legacy 재조사 결과 뒤집혔다(project_code_diff_
          // restoration_plan 메모 4단계 참고, 사용자 확인 완료) - 매번 새 <textarea> 폼을 tr
          // 뒤에 끼워 넣던 이전 구현(insertReviewCommentForm)을 legacy와 동일한 "단일 팝업
          // 재사용" 아키텍처로 교체했다.
          var diffBodyEl = changesRoot.querySelector('.diff-body');
          var btnPopEl = changesRoot.querySelector('.btnPop');
          if (diffBodyEl && btnPopEl && typeof yona !== 'undefined' && yona.CodeCommentBlock && yona.CodeCommentBox) {
              yona.CodeCommentBlock.init({
                  'welContainer': diffBodyEl,
                  'welPopButtonOnBlock': btnPopEl
              });
              yona.CodeCommentBox.init();

              // commitId가 있는 화면(특정 커밋 보기)이면 팝업 폼에 고정 hidden input을 한 번만
              // 추가해둔다 - CodeCommentBox._setReviewFormFields()는 이미 있는 필드는 값만
              // 갱신하고 지우지 않으므로, 매번 새로 만들 필요 없이 계속 재사용된다.
              if (reviewCommentCommitId) {
                  var elReviewForm = document.getElementById('review-form');
                  var elCommitIdField = document.createElement('input');
                  elCommitIdField.type = 'hidden';
                  elCommitIdField.name = 'commitId';
                  elCommitIdField.value = reviewCommentCommitId;
                  elReviewForm.querySelector('form').prepend(elCommitIdField);
              }

              function getTargetTr(sPath, sLineNum, sLineSide) {
                  var targetTable = diffBodyEl.querySelector('table.diff-container[data-file-path="' + sPath + '"]');
                  return targetTable ? targetTable.querySelector('tr[data-line="' + sLineNum + '"][data-side="' + sLineSide + '"]') : null;
              }

              // 드래그 다중행 범위선택 후 "댓글 달기" 팝업 버튼(.btnPop) 클릭 -
              // legacy _onClickBtnAddBlockComment 대응.
              btnPopEl.addEventListener('click', function(){
                  var htBlockInfo = yona.CodeCommentBlock.getData();
                  yona.CodeCommentBlock.block(htBlockInfo);

                  var sLineNum = htBlockInfo.bIsReversed ? htBlockInfo.nStartLine : htBlockInfo.nEndLine;
                  var sLineSide = htBlockInfo.bIsReversed ? htBlockInfo.sStartSide : htBlockInfo.sEndSide;
                  var targetTr = getTargetTr(htBlockInfo.sFilePath, sLineNum, sLineSide);
                  if (!targetTr) { return; }

                  yona.CodeCommentBox.show(targetTr, {
                      'sPlacement': htBlockInfo.bIsReversed ? 'top' : 'bottom',
                      'htBlockInfo': htBlockInfo
                  });
              });

              // 라인 번호 셀 클릭 -> 그 줄 전체를 선택 상태로 만들고 CodeCommentBlock의 mouseup
              // 핸들러를 재사용해 단일 라인 범위를 계산한다(legacy _onClickLineNumA와 동일
              // 트릭). PR쪽 마크업은 라인번호 칸이 항상 add-comment-btn-cell 하나뿐이라(반대쪽은
              // 빈 칸) 그 셀만 대상으로 한다.
              changesRoot.addEventListener('click', function(e){
                  var target = e.target.closest('tr[data-line] .add-comment-btn-cell');
                  if (!target || !changesRoot.contains(target)) { return; }

                  e.stopPropagation();
                  window.getSelection().removeAllRanges();
                  var elPre = target.closest('tr').querySelector('td.code pre');
                  if (!elPre || !elPre.childNodes[0]) { return; }
                  var elNode = elPre.childNodes[0];
                  var oRange = document.createRange();
                  oRange.setStart(elNode, 0);
                  oRange.setEnd(elNode, elNode.length);
                  window.getSelection().addRange(oRange);

                  diffBodyEl.dispatchEvent(new MouseEvent('mouseup'));
                  btnPopEl.click();
              });

              // diff-body 바깥(팝업/스레드 제외) 마우스다운 시 팝업 숨김 - legacy
              // _onMouseDownDiffBody.
              diffBodyEl.addEventListener('mousedown', function(weEvt){
                  if (weEvt.button !== 0) { return; }
                  if (weEvt.target.closest('.btnPop')) { return; }
                  if (weEvt.target.closest('.comment-thread-wrap, .review-form')) { return; }

                  if (document.getSelection().toString().length === 0) {
                      yona.CodeCommentBox.hide();
                  }
              });

              window.addEventListener('CodeCommentBox:afterhide', function(){
                  yona.CodeCommentBlock.unblock();
              });

              // 스레드 mouseover/leave 하이라이트 - legacy _onMouseOverCodeCommentThread/
              // _onMouseLeaveCodeCommentThread.
              changesRoot.querySelectorAll('[data-toggle="CodeCommentThread"]').forEach(function(elThread){
                  elThread.addEventListener('mouseenter', function(weEvt){
                      if (weEvt.buttons !== 0) { return; }
                      yona.CodeCommentBlock.block({
                          'sPath': elThread.getAttribute('data-range-path'),
                          'sStartSide': elThread.getAttribute('data-range-startside'),
                          'nStartLine': parseInt(elThread.getAttribute('data-range-startline'), 10),
                          'nStartColumn': parseInt(elThread.getAttribute('data-range-startcolumn'), 10),
                          'sEndSide': elThread.getAttribute('data-range-endside'),
                          'nEndLine': parseInt(elThread.getAttribute('data-range-endline'), 10),
                          'nEndColumn': parseInt(elThread.getAttribute('data-range-endcolumn'), 10)
                      });
                  });
                  elThread.addEventListener('mouseleave', function(){
                      yona.CodeCommentBlock.unblock();

                      if (yona.CodeCommentBox.isVisible()) {
                          var htBlockInfo = yona.CodeCommentBlock.getData();
                          if (htBlockInfo) { yona.CodeCommentBlock.block(htBlockInfo); }
                      }
                  });
              });
          }
      }

      // ===== code.Diff.js 1단계 복원: 미니맵/해시 딥링크/스레드 접기·펴기/리뷰 사이드바 sticky =====
      // code/diff.html에 이식한 것과 동일한 기능 - "changes" 탭에서만 의미가 있다(다른 탭엔
      // #minimap/.comment-thread-wrap/.review-container 자체가 없다). project_code_diff_
      // restoration_plan 메모의 1단계, code/diff.html과 동일한 로직을 이 화면 구조(data-line/
      // data-side는 partial_diff_line.html이 이미 legacy와 동일하게 갖추고 있다)에 맞춰 반복한다.
      if ([[${tab == 'changes'}]]) {
        (function(){
          var elMiniMap = document.getElementById("minimap");
          if (!elMiniMap) { return; }
          var elMiniMapWrap = elMiniMap.querySelector(".minimap-wrap");
          var elMiniMapCurr = elMiniMapWrap.querySelector(".minimap-curr");
          var elMiniMapLinks = elMiniMapWrap.querySelector(".minimap-links");
          var sTplMiniMapLink = '<a href="#${id}" style="top:${top}px; height:${height}px;"></a>';
          var nMiniMapRatio = 1;

          function setMiniMapRatio(){
            nMiniMapRatio = elMiniMapWrap.offsetHeight / document.documentElement.scrollHeight;
          }
          function updateMiniMapCurr(){
            elMiniMapCurr.style.top = Math.ceil(document.documentElement.scrollTop * nMiniMapRatio) + "px";
          }
          function resizeMiniMapCurr(){
            elMiniMapCurr.style.height = Math.ceil(window.innerHeight * nMiniMapRatio) + "px";
          }
          function updateMiniMap(){
            var aTargets = document.querySelectorAll(".comment-thread-wrap[id]");
            if (aTargets.length > 0) {
              var aLinks = [];
              aTargets.forEach(function(el){
                var rect = el.getBoundingClientRect();
                aLinks.push($yona.tmpl(sTplMiniMapLink, {
                  "id": el.id,
                  "top": Math.ceil((rect.top + window.scrollY) * nMiniMapRatio),
                  "height": Math.ceil(rect.height * nMiniMapRatio)
                }));
              });
              elMiniMapLinks.innerHTML = aLinks.join("");
              elMiniMap.style.display = "block";
            } else {
              elMiniMap.style.display = "none";
            }
          }
          function initMiniMap(){ setMiniMapRatio(); updateMiniMap(); resizeMiniMapCurr(); }

          window.addEventListener("resize", initMiniMap);
          window.addEventListener("scroll", updateMiniMapCurr);
          initMiniMap();
        })();

        (function(){
          function getTargetLineByThread(elThread){
            var sEndLine = elThread.getAttribute("data-range-endline");
            var sEndSide = elThread.getAttribute("data-range-endside");
            return document.querySelector('tr[data-line="' + sEndLine + '"][data-side="' + sEndSide + '"]');
          }
          function setBtnThreadHerePosition(elButton){
            var elThread = elButton.closest(".comment-thread-wrap");
            var nPadding = 10;
            var aSiblings = Array.prototype.slice.call(elThread.parentElement.children).filter(function(el){
              return el.classList && el.classList.contains("comment-thread-wrap");
            });
            elButton.style.right = ((aSiblings.indexOf(elThread) * elButton.offsetWidth) + nPadding) + "px";

            var elEndLine = getTargetLineByThread(elThread);
            if (elEndLine) {
              var rect = elEndLine.getBoundingClientRect();
              elButton.style.top = (rect.top + window.scrollY - nPadding) + "px";
            }
          }
          function setAllBtnThreadHerePosition(){
            document.querySelectorAll(".btn-thread-here").forEach(setBtnThreadHerePosition);
          }

          document.addEventListener("click", function(weEvt){
            var elBtn = weEvt.target.closest(".btn-thread-minimize");
            if (!elBtn) { return; }
            elBtn.closest(".comment-thread-wrap").classList.toggle("fold");
            setAllBtnThreadHerePosition();
          });

          setAllBtnThreadHerePosition();
          window.__setAllBtnThreadHerePosition = setAllBtnThreadHerePosition;
        })();

        (function(){
          function getThread(elTarget){
            return elTarget.classList.contains("comment-thread-wrap") ? elTarget : elTarget.closest(".comment-thread-wrap");
          }
          function isFoldedThread(elThread){
            return elThread.classList.contains("fold") && elThread.querySelector(".btn-thread-here") !== null;
          }
          function showReviewCardsTabByState(sState){
            if (sState === "open" || sState === "closed") {
              var elTab = document.querySelector('a[href="#reviewcards-' + sState + '"]');
              if (elTab) { $yona.tabShow(elTab); }
            }
          }
          function scrollToAndHighlight(elTarget){
            var elThread = elTarget ? getThread(elTarget) : null;
            if (!elTarget || !elThread) { return; }

            if (isFoldedThread(elThread)) {
              elThread.classList.remove("fold");
              if (typeof window.__setAllBtnThreadHerePosition === "function") {
                window.__setAllBtnThreadHerePosition();
              }
            }

            showReviewCardsTabByState(elThread.getAttribute("data-state"));
            window.scrollTo(0, elTarget.getBoundingClientRect().top + window.scrollY - 50);

            elTarget.style.transition = "background-color 0.3s ease";
            var sOriginalBg = elTarget.style.backgroundColor;
            elTarget.style.backgroundColor = "#fff9c4";
            setTimeout(function(){ elTarget.style.backgroundColor = sOriginalBg; }, 1000);
          }
          function onHashChange(){
            if (location.hash) {
              scrollToAndHighlight(document.getElementById(location.hash.substring(1)));
            }
          }

          document.querySelectorAll("a.review-card").forEach(function(elCard){
            elCard.addEventListener("click", function(weEvt){
              var sThreadId = elCard.getAttribute("href").split("#").pop();
              if (!document.getElementById(sThreadId)) { return; }

              var sPreviousHash = location.hash;
              location.hash = sThreadId;
              if (sPreviousHash === location.hash) { onHashChange(); }
              weEvt.preventDefault();
            });
          });

          window.addEventListener("hashchange", onHashChange);
          if (location.hash) { onHashChange(); }
        })();

        // 이 IIFE는 Bootstrap2 jQuery 플러그인 .affix()에 의존한다 - position:sticky로는
        // 부모 컨테이너(.codediff-wrap) 범위를 벗어나 고정될 수 없어(issue/list.html의
        // 동일한 기존 판단 참고) 대체하지 못했다. 라운드9(Bootstrap2 플러그인 호출부 대체)까지
        // 의도적으로 jQuery 객체를 유지한다 - 이번 라운드(P3-70 라운드6)는 손대지 않는다.
        (function(){
          var welReviewContainer = $(".review-container");
          if (welReviewContainer.length === 0) { return; }

          welReviewContainer.affix({ offset: { top: welReviewContainer.offset().top - 10 } });

          function setReviewListHeight(){
            var welContainer = $(".codediff-wrap");
            var welReviewList = $(".review-list");
            if (welReviewList.length === 0) { return; }
            var nMaxHeight;

            if (welReviewContainer.hasClass("affix")) {
              var nCodeDiffWrapOffsetBottom = welContainer.position().top + welContainer.outerHeight();
              var nReviewListOffsetBottom = welReviewList.offset().top + welReviewList.outerHeight();
              var nReviewListDefaultMarginBottom = 15;
              var nDiffWrapBottomPadding = 90;

              if (nCodeDiffWrapOffsetBottom <= nReviewListOffsetBottom + nReviewListDefaultMarginBottom) {
                nMaxHeight = nCodeDiffWrapOffsetBottom - $(document).scrollTop() + nDiffWrapBottomPadding;
              } else {
                nMaxHeight = $(window).height() - welReviewList.position().top - nReviewListDefaultMarginBottom;
              }
            } else {
              nMaxHeight = welContainer.outerHeight() - welReviewList.position().top;
            }
            welReviewList.css("max-height", nMaxHeight + "px");
          }

          $(window).on("resize scroll", setReviewListHeight);
          setReviewListHeight();
        })();
      }
  });
</script>
</body>
</html>
