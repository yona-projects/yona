<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  이식 원본: app/views/git/view.scala.html
  모델: title, projectView, header, contributor, branchInfo, bodyHtml, attachments, state, canWatch, watching, watchUrl, unwatchUrl, stateUrl,
        canEdit, assigneeArea, labelArea(담당자와 라벨, X-14), editUrl, canClose, closeUrl, canReopen, reopenUrl, timeline, commentable, mentionUrl
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${#messages.msg(title)}, ${projectView}, 'PULL_REQUEST', ~{::viewPage})}">
<th:block th:fragment="viewPage" th:with="project=${projectView.project}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PULL_REQUEST', 'main-menu-only')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{pullrequest/partial-info :: info}"></th:block>

        <!--/* 이슈 화면과 같은 2단 구성(추가 항목 X-14, decisions.md D-34 16번): 왼쪽에 본문, 상태, 타임라인, 오른쪽 열에 담당자와 라벨 */-->
        <div class="board-body row-fluid">
            <div class="span9 span-left-pane">
                <div class="author-info left-txt" style="margin-top:20px;">
                    <a th:href="${contributor.href}" class="usf-group pull-left">
                        <span class="avatar-wrap smaller">
                            <img th:src="${contributor.avatarUrl}" width="32" height="32">
                        </span>
                        <strong class="name" th:text="${contributor.name}"></strong>
                        <span class="loginid"> <strong>@</strong><th:block th:text="${contributor.loginId}"></th:block></span>
                    </a>
                    <th:block th:replace="~{pullrequest/partial-branch :: branch}"></th:block>
                </div>
                <div class="content markdown-wrap" th:utext="${bodyHtml}"></div>
                <div class="attachments" th:attr="data-attachments=${attachments}"></div>

                <div id="state" class="pullRequest-stateInfo">
                    <th:block th:replace="~{pullrequest/partial-state :: state}"></th:block>
                </div>

                <div class="board-footer board-actrow">
                    <div class="pull-left">
                        <button th:if="${canWatch}" id="watch-button" type="button" th:class="'ybtn' + (${watching} ? ' ybtn-watching' : '')" data-toggle="button" th:attr="data-watching=${watching}"
                                th:text="${watching} ? #{project.unwatch} : #{project.watch}"></button>
                    </div>

                    <div class="mr5" style="display:inline-block;">
                        <a th:if="${canEdit}" th:href="${editUrl}" class="ybtn" th:text="#{button.edit}"></a>
                        <a th:if="${canClose}" data-request-method="post" th:href="${closeUrl}" class="ybtn" th:text="#{pullRequest.close}"></a>
                        <a th:if="${canReopen}" data-request-method="post" th:href="${reopenUrl}" class="ybtn" th:text="#{pullRequest.reopen}"></a>
                    </div>
                </div>

                <hr class="nm">

                <div class="board-comment-wrap">
                    <ul class="comments" id="comments" th:if="${!#lists.isEmpty(timeline)}">
                        <th:block th:replace="~{pullrequest/partial-timeline :: timeline}"></th:block>
                    </ul>
                </div>

                <!--/* 리뷰 판정 폼(추가 항목 X-12, decisions.md D-35). 로그인한 사용자에게만 보이고 선택지는 권한과 요청 상태를 따른다 */-->
                <form id="review-form" th:if="${reviewArea.formUrl != null}" th:action="${reviewArea.formUrl}" method="post" class="pr-review-form mt20">
                    <h5 th:text="#{pullRequest.review.form.title}"></h5>
                    <textarea name="contents" rows="4" class="textbox span12" th:placeholder="#{pullRequest.review.form.placeholder}"></textarea>
                    <div class="review-verdicts">
                        <label th:each="v : ${reviewArea.verdictOptions}" class="radio inline">
                            <input type="radio" name="verdict" th:value="${v}" th:checked="${v == 'COMMENTED'}">
                            <th:block th:text="#{'pullRequest.review.form.' + ${#strings.toLowerCase(v)}}"></th:block>
                        </label>
                    </div>
                    <button type="submit" class="ybtn ybtn-success mt10" th:text="#{pullRequest.review.form.submit}"></button>
                </form>
            </div>

            <div class="span3 span-right-pane mb20">
                <!--/* 리뷰어별 최신 판정(추가 항목 X-12, decisions.md D-35) */-->
                <div id="review-area" class="issue-info mb10">
                    <dl>
                        <dt th:text="#{pullRequest.review.area.title}"></dt>
                        <dd th:if="${reviewArea.countText != null}" class="review-count" th:text="${reviewArea.countText}"></dd>
                        <dd th:if="${reviewArea.authorNote}" class="review-author-note" th:text="#{pullRequest.review.author.not.counted}"></dd>
                        <dd th:if="${#lists.isEmpty(reviewArea.rows) and #lists.isEmpty(reviewArea.pending)}" class="empty" th:text="#{pullRequest.review.area.empty}"></dd>
                        <!--/* 리뷰 요청이 대기 중인 사람(추가 항목 X-27, decisions.md D-37). 편집 권한자에게는 취소 단추가 있다 */-->
                        <dd th:each="r : ${reviewArea.pending}" class="reviewer-row pending" th:attr="data-login-id=${r.loginId}">
                            <a th:href="${r.href}" class="usf-group">
                                <span class="avatar-wrap smaller"><img th:src="${r.avatarUrl}" width="20" height="20"></span>
                                <strong class="name" th:text="${r.name}"></strong>
                            </a>
                            <span class="verdict verdict-pending" th:text="#{pullRequest.review.state.pending}"></span>
                            <button th:if="${r.cancelUrl != null}" type="button" class="ybtn ybtn-mini review-cancel" th:attr="data-url=${r.cancelUrl}" th:title="#{pullRequest.review.request.cancel}"><i class="yobicon-removefriend"></i></button>
                        </dd>
                        <dd th:each="r : ${reviewArea.rows}" class="reviewer-row" th:attr="data-login-id=${r.loginId}, data-verdict=${r.verdict}">
                            <a th:href="${r.href}" class="usf-group">
                                <span class="avatar-wrap smaller"><img th:src="${r.avatarUrl}" width="20" height="20"></span>
                                <strong class="name" th:text="${r.name}"></strong>
                            </a>
                            <span th:class="'verdict verdict-' + ${#strings.toLowerCase(r.verdict)}" th:text="#{'pullRequest.review.state.' + ${#strings.toLowerCase(r.verdict)}}" th:title="${r.agoTitle}"></span>
                            <span th:if="${r.dismissed}" class="dismissed" th:title="${r.systemDismissed} ? #{pullRequest.review.dismissed.stale} : ${r.dismissedReason}" th:text="#{pullRequest.review.dismissed.label}"></span>
                            <button th:if="${r.rerequestUrl != null}" type="button" class="ybtn ybtn-mini review-rerequest" th:attr="data-url=${r.rerequestUrl}, data-reviewer=${r.loginId}" th:title="#{pullRequest.review.request.again}"><i class="yobicon-sync"></i></button>
                            <form th:if="${r.dismissUrl != null}" th:action="${r.dismissUrl}" method="post" class="review-dismiss">
                                <input type="text" name="message" class="text span12" maxlength="255" th:placeholder="#{pullRequest.review.dismiss.reason}">
                                <button type="submit" class="ybtn ybtn-mini" th:text="#{pullRequest.review.dismiss}"></button>
                            </form>
                        </dd>
                        <!--/* 리뷰 요청 선택 상자: 수정 권한이 있고 열린 풀 리퀘스트일 때만. 고르는 즉시 Ajax로 보낸다(yona.pullrequest.Reviewers.js) */-->
                        <dd th:if="${reviewArea.requestUrl != null}" class="review-request-box">
                            <input type="hidden" class="bigdrop" id="review-request" th:placeholder="#{pullRequest.review.request.placeholder}" style="width:100%"
                                   th:attr="data-request-url=${reviewArea.requestUrl}, data-candidates-url=${reviewArea.candidatesUrl}, data-timeline-url=${assigneeArea != null ? assigneeArea.timelineUrl : ''}">
                        </dd>
                    </dl>
                </div>
                <!--/* 담당자와 라벨. 수정 권한이 있으면 고르는 즉시 Ajax로 보내고(yona.pullrequest.Meta.js) 없으면 읽기만 한다 */-->
                <div id="pr-meta" class="issue-info" th:if="${assigneeArea != null}"
                     th:attr="data-assignees-url=${assigneeArea.assigneesUrl}, data-labels-url=${labelArea.labelsUrl}, data-timeline-url=${assigneeArea.timelineUrl}, data-candidates-url=${assigneeArea.candidatesUrl}">
                    <dl class="pr-assignee">
                        <dt th:text="#{issue.assignee}"></dt>
                        <dd>
                            <input th:if="${assigneeArea.canEdit}" type="hidden" class="bigdrop" id="assignee" name="assigneeLoginId" th:placeholder="#{issue.noAssignee}"
                                   th:value="${assigneeArea.current?.loginId}" th:attr="data-name=${assigneeArea.current?.name}, data-avatar-url=${assigneeArea.current?.avatarUrl}" style="width: 100%" title="">
                            <th:block th:unless="${assigneeArea.canEdit}">
                                <a th:if="${assigneeArea.current != null}" th:href="${assigneeArea.current.href}" class="usf-group">
                                    <span class="avatar-wrap smaller"><img th:src="${assigneeArea.current.avatarUrl}" width="20" height="20"></span>
                                    <strong class="name" th:text="${assigneeArea.current.displayName}"></strong>
                                    <span class="loginid"> <strong>@</strong><th:block th:text="${assigneeArea.current.loginId}"></th:block></span>
                                </a>
                                <div th:if="${assigneeArea.current == null}" th:text="#{issue.noAssignee}"></div>
                            </th:block>
                        </dd>
                    </dl>
                    <th:block th:if="${labelArea.canEdit and labelArea.hasLabels}">
                        <th:block th:replace="~{issue/partial-select-label :: selectLabel(${labelArea.groups}, ${labelArea.selectedIds}, 'pr-labels', null, ${projectView})}"></th:block>
                    </th:block>
                    <dl th:if="${!labelArea.canEdit and !#lists.isEmpty(labelArea.tags)}" class="pr-labels">
                        <dt th:text="#{label}"></dt>
                        <dd>
                            <a th:each="l : ${labelArea.tags}" th:href="${labelArea.listUrl} + '?labelIds=' + ${l.id}" class="label issue-label active static"
                               th:attr="data-label-id=${l.id}" th:style="'background:' + ${l.color}" th:text="${l.name}"></a>
                        </dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="right-txt">
            <a href="#helpMessage" class="ybtn ybtn-inverse ybtn-mini" data-toggle="modal" th:text="#{title.help}"></a>
        </div>
    </div>
</div>
<th:block th:replace="~{common/markdown :: markdown(${project})}"></th:block>
<th:block th:replace="~{common/comment-delete-modal :: commentDeleteModal('#comments')}"></th:block>
<div id="helpMessage" class="modal hide fade pullreq-info">
    <div class="modal-header">
        <h5 th:text="#{pullRequest.merge.help.1}"></h5>
    </div>
    <div class="modal-body">
        <div class="row-fluid">
            <div class="pull-left">
                <img class="img-polaroid" th:src="@{/assets/images/fork-pull/merge.jpg}"><br>
            </div>
            <div class="pull-left help-messages mt10">
                <p th:text="#{pullRequest.merge.help.2}"></p>
                <p th:text="#{pullRequest.merge.help.3}"></p>
                <p th:text="#{pullRequest.merge.help.4}"></p>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="ybtn ybtn-info ybtn-small" data-dismiss="modal" th:text="#{button.confirm}"></button>
    </div>
</div>
<th:block th:if="${reviewArea.requestUrl != null or #lists.size(reviewArea.rows) > 0 or #lists.size(reviewArea.pending) > 0}">
<th:block th:replace="~{common/select2 :: select2}"></th:block>
<script type="text/javascript" th:src="@{/assets/javascripts/service/yona.pullrequest.Reviewers.js}"></script>
</th:block>
<th:block th:if="${assigneeArea != null and (assigneeArea.canEdit or labelArea.canEdit)}">
<link rel="stylesheet" type="text/css" media="screen" th:href="${#paths.project(project.owner, project.name) + '/issue/labels.css'}">
<th:block th:replace="~{common/select2 :: select2}"></th:block>
<script type="text/javascript" th:src="@{/assets/javascripts/service/yona.pullrequest.Meta.js}"></script>
</th:block>
<script type="text/javascript">
    // 타임라인 라벨 상자의 글자색을 배경색에 맞춘다(이슈 화면과 같다). 밝은 라벨 색에서도 글자가 보이게 한다
    $(function () {
        $("#comments .event > .label").each(function () {
            var $label = $(this);
            $label.removeClass("dimgray white").addClass($yobi.getContrastColor($label.css("background-color")));
        });
    });
</script>
<link rel="stylesheet" type="text/css" media="screen" th:href="@{/assets/javascripts/lib/atjs/jquery.atwho.css}">
<script type="text/javascript" th:src="@{/assets/javascripts/lib/atjs/jquery.caret.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/atjs/jquery.atwho.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/diff.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/common/yobi.Interval.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/common/yobi.CodeCommentBox.js}"></script>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function() {
        $yobi.loadModule("git.View", {
            "sWatchUrl"  : "[(${#strings.replace(watchUrl, '&', '&amp;')})]",
            "sUnwatchUrl": "[(${#strings.replace(unwatchUrl, '&', '&amp;')})]",
            "sStateUrl"  : /*[[${stateUrl}]]*/ "",
            "bCommentable" : /*[[${commentable} ? 'true' : 'false']]*/ "false"
        });

        yobi.Mention({
            target:'textarea[id^=editor-]',
            url : "[(${mentionUrl})]"
        });

        $("button.moreBtn").on("click", function(){
            $(this).next("pre.commitMsg.desc").toggleClass("hidden");
        });

        // detect comment which contains mention at me
        $(".comment-body:contains('[(${helper.escape(currentUser.pureName)})]')").closest(".comment").addClass("mentioned");
        $(".user-link:contains('[(${helper.escape(currentUser.pureName)})]')").addClass("me");
    });
</script>
</th:block>
</html>
