<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko"
      th:with="forkLabel=#{fork}, pageTitle=${project.owner + '/' + project.name + ' - ' + forkLabel}">
<head th:replace="~{site/layout :: head(title=${pageTitle})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'pullRequest')}"></div>

    <!--
     legacy git/clone.scala.html 대응(그룹11 #172). ProjectApp.fork()가 이름 중복만 검사한 뒤
     즉시 렌더링하는 "복제 중입니다" 인터스티셜 화면 — 실제 git clone + 프로젝트 생성은 이 화면의
     JS가 로드 3초 후 doClone()을 호출해 수행한다(legacy와 동일한 2단계 흐름,
     ProjectViewController.fork()/doClone() 참고).
    -->
    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <div class="content-wrap frm-wrap">
                <legend th:text="#{fork.forking(${project.owner}, ${project.name}, ${forkOwner}, ${forkName})}">프로젝트를 복사하는 중입니다.</legend>
                <p th:text="#{fork.forking.message.1}">시간이 걸릴 수 있습니다.</p>
                <p th:text="#{fork.forking.message.2}">완료되면 자동으로 이동합니다.</p>
            </div>
        </div>
    </div>
    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script type="text/javascript" th:inline="javascript">
    $(function(){
        if (typeof NProgress !== 'undefined') { NProgress.start(); }
        setTimeout(function(){
            var cloneUrl = "[[@{/api/{owner}/{projectName}/doClone(owner=${project.owner}, projectName=${project.name})}]]";
            var cloneParam = { owner: "[[${forkOwner}]]", name: "[[${forkName}]]", projectScope: "[[${forkProjectScope}]]" };

            $.post(cloneUrl, cloneParam, function(data){
                if (data.status === "failed") {
                    alert("[[#{fork.failed}]]");
                    location.replace(data.url);
                } else {
                    location.replace(data.url);
                }
            });
        }, 3000);
    });
</script>
</body>
</html>
