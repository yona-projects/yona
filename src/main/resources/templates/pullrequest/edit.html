<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  이식 원본: app/views/git/edit.scala.html
  모델: title, projectView(받는 프로젝트), markdownProject(보내는 프로젝트), action, pullRequestId, fromLabel, fromProjectId, fromBranch, toLabel, toProjectId, toBranch,
        fromBranches, toBranches(BranchChoice), state, open, prTitle, body, mergeResultUrl, mentionUrl
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PULL_REQUEST', ~{::editPage})}">
<th:block th:fragment="editPage">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PULL_REQUEST', 'main-menu-only')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="content-wrap frm-wrap">
            <form th:action="${action}" method="post" enctype="multipart/form-data" class="nm">
                <div class="pull-request-wrap">
                    <!-- from -->
                    <div class="pull-left">
                        <label for="fromProjectId" class="field-title" th:text="#{pullRequest.from}"></label>
                        <select id="fromProjectId" name="fromProjectId" data-toggle="select2" class="mr5" disabled>
                            <option th:value="${fromProjectId}" selected th:text="${fromLabel}"></option>
                        </select>
                        <select id="fromBranch" name="fromBranch" data-toggle="select2" data-format="branch" disabled
                                data-dropdown-css-class="branches" th:attr="data-placeholder=#{pullRequest.select.branch}">
                            <option></option>
                            <option th:each="b : ${fromBranches}" th:value="${b.name}" th:selected="${b.selected}" th:text="${b.name}"></option>
                        </select>

                        <input type="hidden" name="fromProjectId" th:value="${fromProjectId}">
                        <input type="hidden" name="fromBranch" th:value="${fromBranch}">
                    </div>
                    <!-- // -->

                    <div class="arrow">
                        <i class="yobicon-right-2"></i>
                    </div>

                    <!-- to -->
                    <div class="pull-right">
                        <label for="toProjectId" class="field-title" th:text="#{pullRequest.to}"></label>
                        <select id="toProjectId" name="toProjectId" data-toggle="select2" class="mr5" disabled>
                            <option th:value="${toProjectId}" selected th:text="${toLabel}"></option>
                        </select>
                        <select id="toBranch" name="toBranch" data-toggle="select2" data-format="branch" disabled
                                data-dropdown-css-class="branches" th:attr="data-placeholder=#{pullRequest.select.branch}">
                            <option></option>
                            <option th:each="b : ${toBranches}" th:value="${b.name}" th:selected="${b.selected}" th:text="${b.name}"></option>
                        </select>

                        <input type="hidden" name="toProjectId" th:value="${toProjectId}">
                        <input type="hidden" name="toBranch" th:value="${toBranch}">
                    </div>
                    <!-- // -->
                </div>

                <span id="pullRequestState" th:attr="data-value=${state}"></span>
                <div th:if="${open}" id="status" class="alert mt20 mb20" th:text="#{pullRequest.is.merging}"></div>

                <div>
                    <input type="text" id="title" name="title" maxlength="255" class="text" th:value="${prTitle}" th:placeholder="#{title}" data-is-user-has-typed="true">
                    <div style="position: relative;">
                        <th:block th:replace="~{common/editor :: editor('body', ${body}, 'data-is-user-has-typed=true', 'content-body', false)}"></th:block>
                    </div>
                    <th:block th:replace="~{common/file-uploader :: fileUploader('PULL_REQUEST', ${pullRequestId})}"></th:block>
                    <th:block th:replace="~{common/markdown :: markdown(${markdownProject.project})}"></th:block>

                    <div class="actions">
                        <button type="submit" class="ybtn ybtn-success" th:text="#{button.save}"></button>
                        <a href="javascript:history.back();" class="ybtn" th:text="#{button.cancel}"></a>
                    </div>
                </div>

                <ul class="nav nav-tabs mt20">
                    <li class="active">
                        <a href="#__commits" data-toggle="tab">
                            <span class="vmiddle-inline" th:text="#{pullRequest.menu.commit}"></span>
                            <span id="numOfCommits" class="num-badge vmiddle-inline"></span>
                        </a>
                    </li>
                </ul>

                <div class="tab-content">
                    <div id="__commits" class="code-browse-wrap tab-pane active">
                    <!--/* 이 영역은 페이지를 불러온 뒤 yobi.git.Write.js가 병합 결과로 비동기로 바꾼다. */-->
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{common/select2 :: select2}"></th:block>

<link rel="stylesheet" type="text/css" media="screen" th:href="@{/assets/javascripts/lib/atjs/jquery.atwho.css}">
<script type="text/javascript" th:src="@{/assets/javascripts/lib/atjs/jquery.caret.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/atjs/jquery.atwho.js}"></script>
<script type="text/javascript" th:inline="javascript">
$(function(){
    $yobi.loadModule("git.Write", {
        "mergeResultURL": /*[[${mergeResultUrl}]]*/ "",
        "fromProject" : $("#fromProjectId"),
        "toProject"   : $("#toProjectId"),
        "fromBranch"  : $("#fromBranch"),
        "toBranch"    : $("#toBranch"),
        "state"       : $("#pullRequestState").data("value")
    });

    // yobi.Mention
    yobi.Mention({
        "target": "textarea[id^=editor-]",
        "url"   : /*[[${mentionUrl}]]*/ ""
    });
});
</script>
</th:block>
</html>
