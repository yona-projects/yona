  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-1, X-39(decisions.md D-71, D-78): OAuth 앱 화면의 공통 조각. 사용자 설정과 조직 설정이 같은 양식을 쓴다
  모든 조각의 urls는 OAuthAppUrls(목록, 만들기, 수정, 비밀 값, 지우기의 주소)이다
*/-->
<th:block xmlns:th="http://www.thymeleaf.org">

<!--/* 소유자가 만든 앱의 목록과 만들기 단추. 모델: apps(AppRow 목록), urls, userAppsEnabled, titleKey와 emptyKey(제목과 빈 목록 안내의 메시지 키) */-->
<th:block th:fragment="mine(apps, urls, userAppsEnabled, titleKey, emptyKey)">
        <section>
            <h4 th:text="#{${titleKey}}"></h4>
            <div id="my-apps-empty" class="tf-empty" th:if="${#lists.isEmpty(apps)}" th:text="#{${emptyKey}}"></div>
            <table id="my-apps" class="table table-striped" th:if="${!#lists.isEmpty(apps)}">
                <thead><tr><th th:text="#{oauth.form.name}"></th><th th:text="#{oauth.apps.clientId}"></th><th th:text="#{oauth.form.type}"></th><th th:text="#{sshKey.createdDate}"></th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${apps}" class="app-row">
                    <td><a th:href="@{${urls.edit(a.id)}}" th:text="${a.name}"></a></td>
                    <td><code th:text="${a.clientId}"></code></td>
                    <td th:text="${a.confidential} ? #{oauth.type.confidential} : #{oauth.type.public}"></td>
                    <td th:text="${a.createdText}"></td>
                    <td class="text-end">
                        <form method="post" th:action="@{${urls.delete(a.id)}}" th:attr="onsubmit='return confirm(\'' + #{oauth.apps.delete.confirm} + '\');'">
                            <button type="submit" class="btn btn-danger btn-sm" th:text="#{oauth.apps.delete}"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="tf-actions">
                <a id="oauth-app-new" class="btn btn-success" th:if="${userAppsEnabled}" th:href="@{${urls.new}}" th:text="#{oauth.apps.new}"></a>
                <span id="user-apps-disabled" class="text-body-secondary" th:unless="${userAppsEnabled}" th:text="#{oauth.apps.disabled}"></span>
            </div>
        </section>
</th:block>

<!--/* 앱 만들기와 수정 양식. 모델: client, form, formError, scopeChoices, oidcInfo, urls */-->
<th:block th:fragment="appForm(client, form, formError, scopeChoices, oidcInfo, urls)">
        <div th:if="${formError != null}" class="alert alert-danger" th:text="#{${formError}}"></div>
        <h4 th:text="${client == null} ? #{oauth.form.title.new} : #{oauth.form.title.edit}"></h4>
        <p th:if="${client != null}" class="mb-3"><span th:text="#{oauth.apps.clientId}"></span>: <code id="edit-client-id" th:text="${client.clientId}"></code></p>
        <section id="oidc-info" class="tf-section mb-3" th:if="${oidcInfo != null}">
            <h5 th:text="#{oauth.oidc.title}"></h5>
            <p class="text-body-secondary" th:text="#{oauth.oidc.help}"></p>
            <dl class="row mb-0">
                <dt class="col-sm-3" th:text="#{oauth.oidc.issuer}"></dt><dd class="col-sm-9"><code th:text="${oidcInfo.issuer}"></code></dd>
                <dt class="col-sm-3" th:text="#{oauth.oidc.discovery}"></dt><dd class="col-sm-9"><code th:text="${oidcInfo.discovery}"></code></dd>
            </dl>
        </section>
        <form id="oauth-app-form" method="post" th:action="${client == null} ? @{${urls.create}} : @{${urls.update(client.id)}}">
            <div class="mb-3">
                <label for="oauth-name" class="form-label" th:text="#{oauth.form.name}"></label>
                <input id="oauth-name" type="text" name="name" maxlength="100" class="form-control tf-wide" th:value="${form.name}">
            </div>
            <div class="mb-3">
                <label for="oauth-description" class="form-label" th:text="#{oauth.form.description}"></label>
                <input id="oauth-description" type="text" name="description" maxlength="500" class="form-control tf-wide" th:value="${form.description}">
            </div>
            <div class="mb-3">
                <label for="oauth-home" class="form-label" th:text="#{oauth.form.homeUrl}"></label>
                <input id="oauth-home" type="text" name="homeUrl" maxlength="500" class="form-control tf-wide" th:value="${form.homeUrl}" placeholder="https://example.com">
            </div>
            <div class="mb-3">
                <label for="oauth-redirects" class="form-label" th:text="#{oauth.form.redirectUris}"></label>
                <textarea id="oauth-redirects" name="redirectUris" rows="4" class="form-control tf-wide font-monospace" spellcheck="false" th:text="${form.redirectUris}"></textarea>
                <div class="form-text" th:text="#{oauth.form.redirectUris.help}"></div>
            </div>
            <div class="mb-4">
                <span class="form-label d-block" th:text="#{oauth.form.type}"></span>
                <div class="tf-choices tf-group">
                    <label class="tf-choice" th:each="t : ${ {'public', 'confidential'} }" th:for="'oauth-type-' + ${t}">
                        <input class="form-check-input" type="radio" name="type" th:id="'oauth-type-' + ${t}" th:value="${t}" th:checked="${t == 'confidential'} == ${form.confidential}" th:disabled="${client != null}">
                        <span class="tf-choice-text"><strong th:text="#{'oauth.type.' + ${t}}"></strong><small th:text="#{'oauth.type.' + ${t} + '.help'}"></small></span>
                    </label>
                </div>
            </div>
            <div class="mb-4">
                <span class="form-label d-block" th:text="#{oauth.form.scopes}"></span>
                <div class="form-text mb-2" th:text="#{oauth.form.scopes.help}"></div>
                <div class="tf-choices tf-group tf-scopes">
                    <label class="tf-choice" th:each="s : ${scopeChoices}" th:for="'oauth-scope-' + ${s}">
                        <input class="form-check-input" type="checkbox" name="scope" th:id="'oauth-scope-' + ${s}" th:value="${s}" th:checked="${form.scopes.contains(s)}">
                        <span class="tf-choice-text"><strong><code th:text="${s}"></code></strong><small th:text="#{'apiToken.scope.' + ${s}}"></small></span>
                    </label>
                </div>
            </div>
            <div class="tf-actions">
                <button type="submit" class="btn btn-success" th:text="${client == null} ? #{oauth.form.create} : #{oauth.form.save}"></button>
                <a th:href="@{${urls.list}}" class="btn btn-outline-secondary cancel" th:text="#{button.cancel}"></a>
            </div>
        </form>
        <section class="tf-section" th:if="${client != null and client.confidential}">
            <h4 th:text="#{oauth.secret.title}"></h4>
            <p th:text="#{oauth.secret.regenerate.help}"></p>
            <form method="post" th:action="@{${urls.secret(client.id)}}" th:attr="onsubmit='return confirm(\'' + #{oauth.secret.regenerate.confirm} + '\');'">
                <button type="submit" class="btn btn-secondary" th:text="#{oauth.secret.regenerate}"></button>
            </form>
        </section>
</th:block>

<!--/* 기밀 앱의 비밀 값 화면. 모델: clientName, clientId, secret, noticeKey, appId, urls */-->
<th:block th:fragment="secret(clientName, clientId, secret, noticeKey, appId, urls)">
        <div class="alert alert-success" th:text="#{${noticeKey}}"></div>
        <h4 th:text="${clientName}"></h4>
        <p class="mb-1 text-body-secondary" th:text="#{oauth.apps.clientId}"></p>
        <p><code id="client-id" th:text="${clientId}"></code></p>
        <p class="mb-1 text-body-secondary" th:text="#{oauth.secret.value}"></p>
        <p><code id="client-secret" class="tf-secret-value" th:text="${secret}"></code></p>
        <p class="text-body-secondary" th:text="#{oauth.secret.once}"></p>
        <div class="tf-actions">
            <a th:href="@{${urls.edit(appId)}}" class="btn btn-success" th:text="#{oauth.secret.done}"></a>
        </div>
</th:block>

</th:block>
