<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  이식 원본: app/views/common/editor.scala.html
  매개변수:
    editorName   입력란 이름. `이름-식별자` 형식이면 앞이 textarea의 name, 뒤가 영역 식별자이다. 식별자가 없으면 무작위 8자 영문이다.
    textValue    처음 내용 (null이면 빈 내용)
    additionalAttr  textarea에 더할 속성 문자열. v1.6 호출부가 쓰는 `tabindex=N`, `style=...`, `data-is-user-has-typed=true`를 읽는다
    editorMode   `content-body` 등 편집 모드
    viaEmail     이메일로 보이는 모양인지
*/-->
<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="editor(editorName, textValue, additionalAttr, editorMode, viaEmail)"
          th:with="nameParts=${#strings.arraySplit(editorName, '-')},
                   wrapId=${#arrays.length(nameParts) > 1 ? nameParts[1] : T(dev.yona.web.TemplateHelper).randomAlphabetic(8)},
                   textareaName=${nameParts[0]}">
<div data-toggle="markdown-editor" class="mt10">
    <ul class="nav nav-tabs nm small mb-3">
        <li class="nav-item">
            <a th:href="'#edit-' + ${wrapId}" data-bs-toggle="tab" data-mode="edit" th:text="#{common.editor.edit}" class="nav-link active"></a>
        </li>
        <li class="nav-item">
            <a th:href="'#preview-' + ${wrapId}" data-bs-toggle="tab" data-mode="preview" th:text="#{common.editor.preview}" class="nav-link"></a>
        </li>
        <li>
            <div class="task-list-button"><button type="button" class="add-task-list-button ybtn ybtn-small ybtn-danger-no-outline"><i class="yobicon-list task-list-icon"></i> <th:block th:text="#{button.add.checklist}"></th:block></button></div>
        </li>
        <li>
            <div class="editor-clear-temporary">
                <div class="editor-clear-temporary-button"><button type="button" id="button-clear-temporary" class="ybtn ybtn-small ybtn-warning" th:text="#{button.clear.temporary}"></button></div>
            </div>
        </li>
        <li>
            <div class="editor-notice-label"></div>
        </li>
    </ul>

    <div class="tab-content" style="position:relative;overflow: visible;">
        <th:block th:replace="~{help/markdown :: markdown}"></th:block>

        <div th:id="'edit-' + ${wrapId}" class="tab-pane active">
            <!--/* 서식 단추(D-105, 추가 개발 항목): 눌린 단추가 아래 textarea의 선택 범위에 마크다운 문법을 넣는다. 체크리스트 추가는 v1.6의 단추를 그대로 쓴다 */-->
            <markdown-toolbar class="md-toolbar" th:attr="for=${'editor-' + textareaName + '-' + wrapId}">
                <md-header th:title="#{common.editor.toolbar.header}" th:aria-label="#{common.editor.toolbar.header}">H</md-header>
                <md-bold th:title="#{common.editor.toolbar.bold}" th:aria-label="#{common.editor.toolbar.bold}">B</md-bold>
                <md-italic th:title="#{common.editor.toolbar.italic}" th:aria-label="#{common.editor.toolbar.italic}">I</md-italic>
                <md-quote th:title="#{common.editor.toolbar.quote}" th:aria-label="#{common.editor.toolbar.quote}">&#10077;</md-quote>
                <md-code th:title="#{common.editor.toolbar.code}" th:aria-label="#{common.editor.toolbar.code}">&lt;/&gt;</md-code>
                <md-link th:title="#{common.editor.toolbar.link}" th:aria-label="#{common.editor.toolbar.link}">&#128279;</md-link>
                <md-unordered-list th:title="#{common.editor.toolbar.unorderedList}" th:aria-label="#{common.editor.toolbar.unorderedList}">&#8226;</md-unordered-list>
                <md-ordered-list th:title="#{common.editor.toolbar.orderedList}" th:aria-label="#{common.editor.toolbar.orderedList}">1.</md-ordered-list>
                <md-mention th:title="#{common.editor.toolbar.mention}" th:aria-label="#{common.editor.toolbar.mention}">@</md-mention>
                <md-ref th:title="#{common.editor.toolbar.ref}" th:aria-label="#{common.editor.toolbar.ref}">#</md-ref>
            </markdown-toolbar>
            <div class="textarea-box">
                <textarea th:name="${textareaName}" class="editorSeries content comment nm form-control" th:attr="data-editor-mode=${editorMode}" markdown="true" th:id="'editor-' + ${textareaName} + '-' + ${wrapId}"
                    th:tabindex="${additionalAttr != null and #strings.startsWith(additionalAttr, 'tabindex=')} ? ${#strings.substringAfter(additionalAttr, 'tabindex=')}"
                    th:style="${additionalAttr != null and #strings.startsWith(additionalAttr, 'style=')} ? ${#strings.substringAfter(additionalAttr, 'style=')}"
                    th:data-is-user-has-typed="${additionalAttr != null and #strings.startsWith(additionalAttr, 'data-is-user-has-typed=')} ? ${#strings.substringAfter(additionalAttr, 'data-is-user-has-typed=')}"
                    th:text="${textValue}"></textarea>
            </div>
        </div>

        <div th:id="'preview-' + ${wrapId}" class="tab-pane">
            <div class="markdown-preview markdown-wrap" th:classappend="${editorMode}" th:attr="data-via-email=${viaEmail}"></div>
        </div>
        <div class="notification-receiver">
            <span class="notification-receiver-title" th:text="#{notification.receiver.list.title}"></span>
            <span class="notification-receiver-list"></span>
        </div>
    </div>
</div>
</th:block>
