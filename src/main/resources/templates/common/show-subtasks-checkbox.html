<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="showSubtasksCheckbox">
<div class="show-subtasks mr10" id="two-column-mode-checkbox" data-toggle="popover" data-trigger="hover" data-placement="top" th:title="#{common.show.subtasks}" th:attr="data-content=#{common.show.subtasks.desc}">
    <div class="checkbox"><label>
        <div class="show-subtasks-button-border">
            <input id="toggle-show-subtasks" type="checkbox"><span class="show-subtasks-text" th:text="#{common.show.subtasks}"></span>
        </div>
    </label></div>
</div>
</th:block>
