<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="scripts">

    <div class="message">
        <div class="center-text">
            <p class="msg"></p>
            <p class="desc"></p>

</div></div></div>

<th:block th:if="${currentUser.anonymous}">
<th:block th:replace="~{common/login-dialog :: loginDialog}"></th:block>
</th:block>

<script type="text/javascript" th:src="@{/assets/javascripts/common/yona.Csrf.js}"></script>
<script type="text/javascript" th:src="@{/messages.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/yona-common.js}"></script>
<!--/* Bootstrap 5 번들(Popper 2 포함). jQuery가 먼저 있으면 `$().modal()` 같은 jQuery 인터페이스도 함께 등록된다(X-38d). */-->
<script type="text/javascript" th:src="@{/assets/bootstrap/js/bootstrap.bundle.min.js}"></script>
<!--/* 드롭다운은 기본으로 Popper가 메뉴 위치를 정한다. v1.6 화면은 CSS 위치(top:100%, left:0)를 쓰므로 정적 배치로 둔다(X-38c, A-290) */-->
<script type="text/javascript">bootstrap.Dropdown.Default.display = "static";</script>
<script type="text/javascript" th:src="@{/assets/bootstrap/js/bootstrap-switch.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/autosize/autosize.min.js}"></script>
<script type="module" th:src="@{/assets/javascripts/esm/Tabs.js}"></script>
<script type="module" th:src="@{/assets/javascripts/esm/KeyControl.js}"></script>
<script type="module" th:src="@{/assets/javascripts/esm/Clipboard.js}"></script>
<!--/* 본문 멘션 자동완성(GitHub text-expander-element 2.9.4, D-106). 번들 없이 모듈로 불러온다. 요소 파일이 가져오는 `@github/combobox-nav`의 경로는 `common/importmap.html`(레이아웃 `<head>`)이 알려 준다 */-->
<script type="module" th:src="@{/assets/javascripts/esm/index.js}"></script>
<script type="module" th:src="@{/assets/javascripts/lib/text-expander/text-expander-element.js}"></script>
<!--/* 편집기 서식 단추(GitHub markdown-toolbar-element 2.2.3, D-105). 번들 없이 모듈 하나를 불러오며 `<markdown-toolbar>`, `<md-*>` 요소를 정의한다 */-->
<script type="module" th:src="@{/assets/javascripts/lib/markdown-toolbar/markdown-toolbar-element.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/tippy/popper.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/tippy/tippy-bundle.umd.min.js}"></script>

<script type="text/javascript" th:inline="javascript">
    $yona.setScriptPath([[@{/assets/javascripts/}]]);

    /*[- 현재 요청의 언어를 스크립트에 알린다. 달력(yona.ui.Calendar)의 월과 요일 이름이 이 값을 따른다. 영어 화면에 한국어가 나가지 않도록 Thymeleaf 주석으로 쓴다 -]*/
    window.yona = window.yona || {};
    window.yona.language = [[${#locale.language}]];

    $(document).ready(function(){
        // tooltip
        $(document.body).on("mouseenter", "[data-bs-toggle=tooltip]", function(){
            bootstrap.Tooltip.getOrCreateInstance(this).show();
        });

        /*[- 상대 시각("3일 전")을 이 언어로 그린다(esm/dates.js). 예전에는 moment.locale에 같은 값을 넘겼다. 이 주석은 렌더링 때 사라진다 -]*/
        window.yonaLanguage = [[${#locale.language}]];

     	// yona.Dropdown
     	var sActivation;
        $(".btn-group[data-name]").each(function(i, el){
        	sActivation = $(el).attr("data-activate");
        	if(typeof sActivation == "undefined" || sActivation != "manual"){
        		(new yona.ui.Dropdown({"elContainer":el}));
        	}
        });

        // yona.ShortcutKey
        // Set CTRL+ENTER as submit form on INPUT/TEXTAREA
        yona.ShortcutKey.attach("CTRL+ENTER", function(htInfo){
            if(htInfo.bFormInput){
                $(htInfo.welTarget.parents("form").get(0)).submit();
            }
        });
        /*[# th:if="${currentUser.sessionLoginId != null}"]*/
        yona.ShortcutKey.setKeymapLink({
            "U": [[@{'/' + ${currentUser.sessionLoginId}}]]
        });
        /*[/]*/

        yona.ShortcutKey.setKeymapLink({
            "A": [[@{/user/issues}]]
        });

        // yona.Files
        yona.Files.init({
            "sListURL"  : [[@{/files}]],
            "sUploadURL": [[@{/files}]],
            "maxFileSize": "[[${site.maxFileSize}]]"  // 2Gb
        });

        // Inner link URL preview tooltip
        $(".issueLink").each(function(index) {
            var $this = $(this);
            var url = decodeURI($this.attr("href"));

            tippy($this[0], {
                content: url,
                delay: [1000, 100],
                placement: 'top-start',
                theme: 'light-border',
                maxWidth: 'none',
                arrow: false
            });
        })

        if(navigator.userAgent.match(/MSIE ([0-9])\./)){
           $('.unsupported').show();
        }

        // notify flash messages
        /*[# th:each="notice : ${flashMessages.notices}"]*/
        $yona.notify("[(${notice})]", 5000);
        /*[/]*/
        /*[# th:if="${flashMessages.alertTitle != null}"]*/
        $yona.alert("[(${flashMessages.alertTitle})]", null,
                    "[(${flashMessages.alertDescription})]");
        /*[/]*/

        $('[data-toggle="search-scope"]').on('click', function() {
            $('form[name="gnb-search-form"]').attr('action', $(this).data('action'));
            $('#gnb-search-scope-title').text($(this).text());
        });

        yona.OriginalMessage.hide($("[data-via-email]"));

        $('.logo, .title > a, .project-menu-nav > li > a, .show-progress-bar, .project-breadcrumb > span > a, .project-name > a, a[class="title"]').on('click.progressbar', function () {
            NProgress.set(0.7);
            NProgress.start();
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                NProgress.done();
            }
        });

        // judge whether contents link is internal or external
        $('.markdown-wrap').find('a[href]').each(function () {
            var $link = $(this);
            var linkUrl = $link.attr("href");
            // `mailto:`와 `tel:`은 새 창을 열 대상이 아니다. v1.6은 이것도 바깥 링크로 보아 빈 새 탭이 떴다(shell-F26)
            if (linkUrl && linkUrl.match("^[^./#]") && !/^(mailto|tel):/i.test(linkUrl)) {
                var location = window.location;
                if (linkUrl.indexOf(location.protocol + "//" + location.host) !== 0) {
                    $(this).attr("target", "_blank");
                }
            }
        });

        autosize($('textarea'));

        addTaskListButtonListener();
        function addTaskListButtonListener() {
            $(".add-task-list-button").on('click', function () {
                var tasklistTemplate = "\n- [ ] Todo A\n- [ ] Todo B\n- [ ] Todo C";
                var $textarea = $(this).closest("form").find("textarea");
                var cursorPos = $textarea.prop('selectionStart');
                var text = $textarea.val();

                if(cursorPos === 0 && text && text.length > 0){
                    cursorPos = text.length;
                }

                var textBefore = text.substring(0, cursorPos);
                var textAfter  = text.substring(cursorPos, text.length);

                $textarea.val(textBefore + tasklistTemplate + textAfter);
                $textarea.focus();
                $textarea.get(0).setSelectionRange(cursorPos + tasklistTemplate.length, cursorPos + tasklistTemplate.length);
            });
        }

        // when to click a link in the iframe page, match browser URL
        if (window.parent !== window) {
            $("a.ago, .head-anchor, .share-link").on("click", function () {
                var $this = $(this);
                if (!history.state) {
                    window.parent.history.pushState({ startPath: location.pathname }, $this.text(), $this.attr("href"));
                } else {
                    window.parent.history.replaceState(history.state, $this.text(), $this.attr("href"));
                }
            });
        }
    });
</script>
</th:block>
