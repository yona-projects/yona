<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<!--
 댓글 인라인 수정 폼(legacy common/commentUpdateForm.scala.html 대응) - 기본은 숨김
 (.comment-update-form은 CSS로 display:none, "수정" 버튼 클릭 시 JS가 comment-body를 감추고
 이 폼을 보여준다).

 legacy는 풀 페이지 POST 제출 방식이지만, yona 백엔드는 REST(PUT /api/projects/{projectId}/
 issues|posts/{number}/comments/{commentId})만 제공하므로 이 폼은 실제 제출을 막고(JS가
 preventDefault) fetch PUT으로 대체한다.

 "알림 메일 받기" 체크박스는 댓글 작성자 본인에게만 노출되지만, 작성자가 아닌 사람이 수정하면
 체크박스와 무관하게 COMMENT_UPDATED 알림이 항상 발행된다(legacy IssueApp/BoardApp.saveComment()와
 동일 동작).
-->
<!--
 th:action은 REST JSON API(apiBase)가 아니라 legacy 호환 bare 경로
 (CommentController.updateIssueCommentLegacyPath/updatePostingCommentLegacyPath, PUT/PATCH 허용,
 {content, original} 필드명)를 가리켜야 한다 - yona.Tasklist.js가 댓글 본문 체크박스 클릭 시
 정확히 이 폼의 action으로 PATCH를 보내고 {content, original} JSON을 싣기 때문. 호출부(issue/board
 view)가 owner/project/번호로 미리 계산해 contentPatchUrl로 넘긴다(issue/post 양쪽에서 URL
 세그먼트 이름이 달라 여기선 직접 계산할 수 없음).
-->
<div th:fragment="updateForm(comment, apiBase, isAllowedUpdate, resourceType, attachments, contentPatchUrl)" th:id="'comment-editform-' + ${comment.id}" class="comment-update-form">
    <form th:id="'comment-update-form-' + ${comment.id}" th:action="${contentPatchUrl}" th:data-api-base="${apiBase}" th:data-comment-id="${comment.id}" th:data-original="${comment.contents}">
        <div class="write-comment-box">
            <div class="write-comment-wrap">
                <div th:replace="~{site/layout :: markdownEditor('contents-' + ${comment.id}, ${comment.contents}, 'update-comment-body')}"></div>

                <!-- <yona-attachments>가 드롭존/업로드 버튼/카드 목록을 자체 소유한다. 기존
                     첨부파일은 resourceType/resourceId 기반 네트워크 조회 대신(백엔드
                     AccessControl.isAllowedAttachment()가 ISSUE_COMMENT/NONISSUE_COMMENT를 지원하지
                     않아 항상 403) 서버가 이미 렌더링해둔 마커(common/attachmentFile.html, 화면엔
                     안 보임)를 마운트 시점에 한 번만 읽어 채운다. 외부 textarea 연결(붙여넣기/
                     드래그/링크 삽입)은 "수정" 버튼 클릭 시 1회 configure()로 지연 배선한다
                     (issue/board view.html의 [data-toggle="comment-edit"] 핸들러 참고). -->
                <yona-attachments>
                    <th:block th:each="attachment : ${attachments}">
                        <div th:replace="~{common/attachmentFile :: attachmentFile(${attachment})}"></div>
                    </th:block>
                </yona-attachments>

                <div class="right-txt comment-update-button">
                    <span th:if="${currentUser != null and comment.authorId == currentUser.id}" class="send-notification-check" data-toggle="popover" data-trigger="hover" data-placement="top" th:data-content="#{notification.send.mail.warning}">
                        <label class="checkbox inline">
                            <input type="checkbox" class="send-notification-checkbox" name="notificationMail" value="yes" checked="checked">
                            <strong th:text="#{notification.send.mail}">수정 알림 메일 발송</strong>
                        </label>
                    </span>
                    <button type="button" class="ybtn ybtn-cancel" th:data-comment-id="${comment.id}" th:text="#{button.cancel}">취소</button>
                    <button th:if="${isAllowedUpdate}" type="submit" class="ybtn ybtn-info" th:text="#{button.save}">저장</button>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
