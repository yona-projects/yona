<!--/*
  이식 원본: app/views/common/loginDialog.scala.html
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="loginDialog">
<div id="loginDialog" class="modal loginDialog" tabindex="-1" role="dialog"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-body">
    <div class="float-end">
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <form th:action="@{/users/login}" method="post" class="frm-wrap login-form-wrap" th:attr="data-two-factor-action=@{/users/login/2fa}">
      <div class="two-factor-step tf-challenge" style="display: none;">
        <h4 th:text="#{user.twoFactor.title}"></h4>
        <p th:text="#{user.twoFactor.help}"></p>
        <input id="two-factor-codeD" name="code" type="text" class="form-control tf-code" autocomplete="one-time-code" th:placeholder="#{user.twoFactor.code}">
        <label class="tf-remember" for="remember-deviceD">
          <input id="remember-deviceD" type="checkbox" name="rememberDevice" class="form-check-input">
          <span th:text="#{user.twoFactor.rememberDevice}"></span>
        </label>
        <button type="submit" class="ybtn ybtn-primary tf-btn" th:text="#{user.twoFactor.submit}"></button>
        <div class="security-key-step" style="display: none;">
          <button type="button" class="ybtn tf-btn security-key-use" th:text="#{twoFactor.securityKey.use}"
                  th:attr="data-options-uri=@{/users/login/2fa/webauthn/options},data-submit-uri=@{/users/login/2fa/webauthn}"></button>
        </div>
      </div>
      <div class="login-step">
      <div th:if="${site.socialLoginOnly}" class="btns-row nm" th:text="#{app.warn.support.social.login.only}">
      </div>
      <th:block th:unless="${site.socialLoginOnly}">
      <dl>
        <dd>
          <input id="loginIdOrEmailD" name="loginIdOrEmail" type="text" class="text email form-control" autocomplete="off" th:placeholder="#{user.login.key}">
        </dd>
        <dd>
          <input id="passwordD" name="password" type="password" class="text password form-control" autocomplete="off" th:placeholder="#{user.password}">
        </dd>
      </dl>

      </th:block>
      </div>
      <div class="error">
        <i class="yobicon-error"></i>
        <span class="error-message"></span>
      </div>
      <div class="login-step">
      <th:block th:unless="${site.socialLoginOnly}">
      <div class="btns-row nm">
        <button type="submit" class="ybtn ybtn-primary fullsize" th:text="#{button.login}"></button>
      </div>
      </th:block>

      <div class="btns-row nm">
        <th:block th:if="${!socialLoggedIn}">
          <div th:if="${socialLoginSupported and !site.socialLoginOnly}" class="social-login-title-line" th:text="' ' + #{title.or} + ' '"></div>
          <a th:each="provider : ${socialProviders}" th:href="@{'/authenticate/' + ${provider.key}}" class="ybtn oauth-login-btn" th:utext="${provider.html}"></a>
        </th:block>
        <th:block th:if="${socialLoggedIn}">
          <div th:if="${currentUser.anonymous}" class="cache-warning" th:text="#{browser.cache.refresh.message}"></div>
          <a th:href="@{/logout}" class="ybtn oauth-login-btn" th:text="#{title.logout}"></a>
        </th:block>
      </div>
      <div class="act-row right-txt mt20" th:unless="${site.socialLoginOnly}">
        <div class="float-start">
          <input id="remember-meD" type="checkbox" name="rememberMe" class="checkbox form-check-input" checked>
          <label for="remember-meD" class="bg-checkbox" th:text="#{title.rememberMe}"></label>
        </div>

        <a th:href="@{/lostPassword}" th:text="#{title.resetPassword}"></a>
        <span class="gray-txt ml10 mr10">|</span>
        <a th:href="@{/users/signupform}" th:text="#{title.signup}"></a>
      </div>
      </div>
      </form>
  </div>
</div></div></div>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/jquery/jquery-ui-1.10.4.custom.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/common/yona.webauthn.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/common/yobi.LoginDialog.js}"></script>
</th:block>
