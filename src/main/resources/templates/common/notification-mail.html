<th:block xmlns:th="http://www.thymeleaf.org"><div style="font-family:'Helvetica Neue','Helvetica','Arial','나눔고딕','NanumGothic','NanumGothicOTF','Apple SD Gothic Neo','맑은 고딕',sans-serif;" th:utext="${message}"></div>

<hr style="border:0; border-bottom:1px solid #ddd; margin:20px 0;">

<th:block th:if="${urlToView != null}"><th:block th:utext="${acceptsReply} ? #{notification.replyOrLinkToViewHtml(${siteName},${urlToView},'_blank')} : #{notification.linkToViewHtml(${siteName},${urlToView},'_blank')}"></th:block></th:block>

<div style="max-width:410px;margin-top:20px;color:#989898;text-align:justify;word-break:break-all;font-size:11px;font-family:'Helvetica Neue','Helvetica','Arial','나눔고딕','NanumGothic','NanumGothicOTF','Apple SD Gothic Neo','맑은 고딕',sans-serif;"><th:block th:utext="#{notification.off.unwatch(${unwatchLink})}"></th:block><br><th:block th:utext="#{notification.off.settings(${settingsLink})}"></th:block></div>
</th:block>
