<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="history(historyHtml)">
<div id="-yona-posting-history" class="modal"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <h5 class="nm" th:text="#{change.history}"></h5>
    </div>
    <div class="modal-body">
        <p th:utext="${historyHtml}"></p>
    </div>
    <div class="modal-footer">
        <button class="ybtn ybtn-info ybtn-small" data-bs-dismiss="modal" aria-hidden="true" th:text="#{button.confirm}"></button>
    </div>
</div></div></div>
</th:block>
