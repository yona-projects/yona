<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="attachmentFile(file)">
<div class="attached-file attached-file-marker" th:attr="data-name=${file.get('name')}, data-href='/files/' + ${file.get('id')}, data-mime=${file.get('mimeType')}">
    <i class="mimetype"></i>
    <strong class="name" th:text="${file.get('name')}"></strong>
    <span class="size" th:text="${helper.binaryPrefix(T(java.lang.Double).parseDouble(file.get('size')))}"></span>
    <button type="button" class="btn-transparent btn-delete" th:attr="data-id=${file.get('id')}">&times;</button>
</div>
</th:block>
