<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="commentDeleteModal(commentsContainer)">
<div id="comment-delete-modal" class="modal fade"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <h3 th:text="#{common.comment.delete}"></h3>
  </div>
  <div class="modal-body">
    <p th:text="#{common.comment.delete.confirm}"></p>
  </div>
  <div class="modal-footer">
    <button id="comment-delete-confirm" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}"></button>
    <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}"></button>
  </div>
</div></div></div>
<script type="text/javascript" th:src="@{/assets/javascripts/common/yobi.Comment.js}"></script>
<script type="text/javascript" th:inline="javascript">
    $(function () {
        yobi.Comment.init({'sContainer' : '[(${#strings.escapeXml(commentsContainer)})]'});
    });
</script>
</th:block>
