<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="uploadForm(resourceType, resourceId, formId)">
<div class="upload-wrap content-footer" th:attr="data-resource-type=${resourceType}, data-resource-id=${resourceId}, id=${formId}">
    <div class="attach-wrap">
        <span class="help help-droppable" th:text="#{common.attach.drophere}"></span>
        <div class="btn-wrap">
            <div class="nbtn medium white fake-file-wrap">
                <i class="yobicon-upload"></i> <th:block th:text="#{button.upload}"></th:block>
                <input type="file" class="file" name="filePath" multiple="multiple">
            </div>
        </div>
        <span class="plain" th:text="#{common.attach.clickbutton}"></span>
        <span class="help help-pastable" th:text="#{common.attach.pastehere}"></span>
    </div>

    <ul class="attached-files unstyled"></ul>
    <p class="right-txt help">
        <i class="yobicon-supportrequest"></i> <th:block th:text="#{common.attach.attachIfYouSave}"></th:block>
    </p>
</div>
</th:block>
