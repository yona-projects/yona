<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<!--
  Select2(v3) -> Tom Select 교체. 기존 jQuery 템플릿(#tplSelect2*) 5종은 yona.ui.TomSelect.js/
  yona.issue.Assginee.js가 $.tmpl 없이 순수 JS 문자열 + Tom Select의 escape() 헬퍼로 동일한
  HTML을 직접 만들어내도록 재작성되면서 불필요해져 제거했다.

  select2_locale_ko.js/ja.js가 하던 전역 문자열 오버라이드는 Tom Select의 대응 개념
  (render.no_results/not_loading/loading)에 맞춰 로케일별 인라인 스크립트로
  window.YONA_TOMSELECT_I18N을 채워 넘긴다. formatInputTooLong/formatSelectionTooBig은 이
  프로젝트에서 해당 min/maxLength 제약을 쓰는 인스턴스가 없어 이식하지 않았다.
-->
<th:block th:fragment="tomselect">
    <script type="text/javascript" src="/javascripts/lib/tomselect/tom-select.complete.min.js"></script>

    <th:block th:if="${#locale.language == 'ko'}">
        <script type="text/javascript">
            window.YONA_TOMSELECT_I18N = {
                noResults: "결과 없음",
                searching: "검색 중…",
                tooShort: function(n){ return "너무 짧습니다. " + n + "글자 더 입력해주세요."; }
            };
        </script>
    </th:block>
    <th:block th:if="${#locale.language == 'ja'}">
        <script type="text/javascript">
            window.YONA_TOMSELECT_I18N = {
                noResults: "該当なし",
                searching: "検索中･･･",
                tooShort: function(n){ return "後" + n + "文字入れてください"; }
            };
        </script>
    </th:block>

    <script type="text/javascript" src="/javascripts/common/yona.ui.TomSelect.js"></script>
</th:block>
</body>
</html>
