<!--/*
  이식 원본: app/views/common/select2.scala.html 
  select2 라이브러리와 로캘 파일, 항목 모양 템플릿을 불러온다.
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="select2">
<script th:src="@{/assets/javascripts/lib/select2/select2.js}"></script>
<!--/* select2 3.x는 원본 요소의 클래스를 컨테이너에 복사한다. BS5 `form-select`가 복사되면 컨테이너에 화살표 배경이 겹쳐 그려지므로 복사에서 뺀다(X-38i, D-56). */-->
<script>$.fn.select2.defaults.adaptContainerCssClass = function (c) { return (c === "form-select" || c === "form-control") ? null : c; };</script>
<script th:src="@{/assets/javascripts/common/yobi.ui.Select2.js}"></script>
<script th:if="${#locale.language == 'ko'}" th:src="@{/assets/javascripts/lib/select2/select2_locale_ko.js}"></script>
<script th:if="${#locale.language == 'ja'}" th:src="@{/assets/javascripts/lib/select2/select2_locale_ja.js}"></script>
<script id="tplSelect2FormatUser" type="text/x-jquery-tmpl">
<div class="usf-group" title="${name} ${loginId}">
    <span class="avatar-wrap smaller"><img src="${avatarURL}" width="20" height="20"></span>
    <strong class="name">${name}</strong>
    <span class="loginid">${loginId}</span>
</div>
</script>
<script id="tplSelect2FormatMilestone" type="text/x-jquery-tmpl">
<div title="[${stateLabel}] ${name}">
    ${name}
</div>
</script>
<script id="tplSelect2Projects" type="text/x-jquery-tmpl">
<div class="usf-group" title="${name}">
    <span class="avatar-wrap smaller"><img src="${avatarURL}" width="16" height="16"></span>
    <span class="loginid">${owner}</span>
    <span class="name">${name}</span>
</div>
</script>
<script id="tplSelect2ProjectsWithoutAvatar" type="text/x-jquery-tmpl">
<div class="usf-group" title="${name}">
    <span class="width25px"></span>
    <span class="loginid">${owner}</span>
    <span class="name">${name}</span>
</div>
</script>

<script id="tplSelect2FormatIssues" type="text/x-jquery-tmpl">
<div title="${name}">
    ${name}
</div>
</script>
</th:block>
