<!--/*
  이식 원본: app/views/common/select2.scala.html 
  select2 라이브러리와 로캘 파일, 항목 모양 템플릿을 불러온다.
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="select2">
<script th:src="@{/assets/javascripts/lib/select2/select2.js}"></script>
<!--/* select2 4.x는 원본 요소의 클래스를 컨테이너에 복사하지 않는다. v1.6(3.x)의 복사는 yona.ui.Select2.js가 같은 규칙으로 한다(D-95). */-->
<script type="module" th:src="@{/assets/javascripts/esm/ui/Select2.js}"></script>
<!--/* 문구는 공식 select2 4.1.0의 i18n 파일을 쓴다(D-99). 공식 파일이 있는 한국어, 일본어, 러시아어는 그 언어를, 없는 언어(우즈베크어)와 영어는 영어를 싣고,
        공식 파일은 기본 언어를 정해 주지 않으므로 아래 줄이 정한다. */-->
<th:block th:with="s2lang=${#locale.language == 'ko' or #locale.language == 'ja' or #locale.language == 'ru' ? #locale.language : 'en'}">
<script th:src="@{/assets/javascripts/lib/select2/i18n/{lang}.js(lang=${s2lang})}"></script>
<script th:inline="javascript">$.fn.select2.defaults.set("language", /*[[${s2lang}]]*/ "en");</script>
</th:block>
<script id="tplSelect2FormatUser" type="text/x-mustache">
<div class="usf-group" title="{{name}} {{loginId}}">
    <span class="avatar-wrap smaller"><img src="{{avatarURL}}" width="20" height="20"></span>
    <strong class="name">{{name}}</strong>
    <span class="loginid">{{loginId}}</span>
</div>
</script>
<script id="tplSelect2FormatMilestone" type="text/x-mustache">
<div title="[{{stateLabel}}] {{name}}">
    {{name}}
</div>
</script>
<script id="tplSelect2Projects" type="text/x-mustache">
<div class="usf-group" title="{{name}}">
    <span class="avatar-wrap smaller"><img src="{{avatarURL}}" width="16" height="16"></span>
    <span class="loginid">{{owner}}</span>
    <span class="name">{{name}}</span>
</div>
</script>
<script id="tplSelect2ProjectsWithoutAvatar" type="text/x-mustache">
<div class="usf-group" title="{{name}}">
    <span class="width25px"></span>
    <span class="loginid">{{owner}}</span>
    <span class="name">{{name}}</span>
</div>
</script>

<script id="tplSelect2FormatIssues" type="text/x-mustache">
<div title="{{name}}">
    {{name}}
</div>
</script>
</th:block>
