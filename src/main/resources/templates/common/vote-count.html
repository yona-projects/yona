<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="voteCount(linkUrl, countNumber, showColorAlways)">
<a th:href="${linkUrl}" class="vote-count" th:classappend="${showColorAlways} ? 'vote-color'">
    <span class="count-groups item-icon">
        <i class="yobicon-hearts"></i>
    </span><span class="count-groups item-count strong" th:text="${countNumber}"></span></a>
</th:block>
