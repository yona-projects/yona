<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar">
<th:block th:if="${currentUser.anonymous}" th:with="remembered=${@socialSession.rememberOriginalUrl()}"></th:block>
<div class="row user-menu-wrap">
    <span class="user-menu"><a th:href="'/' + ${currentUser.loginId}" target="mainFrame">
        <span class="avatar-wrap smaller">
            <img th:src="${currentUser.avatarUrl(32)}" />
        </span>
        <span class="caret-text hide-in-mobile" th:text="${currentUser.pureName}"></span>
    </a></span>
    <span class="user-menu"><a th:href="@{/user/editform}" target="mainFrame" th:text="#{userinfo.accountSetting}"></a></span>
    <a th:href="${socialLoggedIn} ? @{/logout} : @{/users/logout}"><span class="user-menu logout badge bg-secondary" th:text="#{title.logout}"></span></a>
    <div class="pin-in-sidebar" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Sidebar"><i class="yobicon-arrow-left"></i></div>
</div>
<ul class="nav nav-tabs nm mb-3">
    <li class="nav-item myOrganizationList">
        <a href="#myOrganizationList" data-bs-toggle="tab" th:text="#{title.favorite}" class="nav-link"></a>
    </li>
    <li class="nav-item myProjectList">
        <a href="#myProjectList" data-bs-toggle="tab" th:text="#{title.project}" class="nav-link"></a>
    </li>
    <li class="nav-item myRecentIssueList">
        <a href="#myRecentIssueList" data-bs-toggle="tab" th:text="#{title.recently.visited.issue}" class="nav-link"></a>
    </li>
    <li>
        <div class=""><i class="yobicon-refresh refresh-button"></i></div>
    </li>
</ul>
<div class="tab-content tab-box">
    <div id="usermenu-tab-content-list" class="tab-content">
        <div class="tab-pane user-project-list" id="myOrganizationList">
            <th:block th:replace="~{index/my-organization-list :: myOrganizationList}"></th:block>
        </div>
        <div class="tab-pane user-project-list" id="myProjectList">
            <th:block th:replace="~{index/my-project-list :: myProjectList}"></th:block>
        </div>
        <div class="tab-pane user-project-list" id="myRecentIssueList">
            <th:block th:replace="~{index/my-recent-issue-list :: myRecentIssueList}"></th:block>
        </div>
    </div>
</div>
<script>
     $(function(){
         var activeMenu = localStorage.getItem('sidebarActiveMenu')
         if (activeMenu == null) {
            $('.myOrganizationList > a').addClass('active');
             $('#myOrganizationList').addClass('active');
         } else {
             $('.'+activeMenu+' > a').addClass('active');
             $('#'+activeMenu).addClass('active');
         }

         $('.refresh-button').on('click', function(){
             window.location.reload();
         });

         $('.myOrganizationList').on('click', function(){
             localStorage.setItem('sidebarActiveMenu', 'myOrganizationList');
             $(".sidebar-bottom").hide();
         })
         $('.myProjectList').on('click', function(){
             localStorage.setItem('sidebarActiveMenu', 'myProjectList');
             $(".sidebar-bottom").hide();
         })
         $('.myRecentIssueList').on('click', function(){
             localStorage.setItem('sidebarActiveMenu', 'myRecentIssueList');
             $(".sidebar-bottom").show();
         })


         // sidebar pin click
         $(".pin-in-sidebar").on("click", function () {
             localStorage.setItem('shallWeOpenLeftNavigation', "false");
             window.location = window.location.href;
         });

     })
</script>
</th:block>
