  이식 원본: app/views/common/navbar.scala.html
  매개변수: menu(MenuType 이름), project(프로젝트 또는 null), org(조직 또는 null)
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="navbar(menu, project, org)"
          th:with="searchLink=${project != null ? '/' + project.owner + '/' + project.name + '/search'
                              : (org != null ? '/organizations/' + org.name + '/search' : '/search')}">
<div class="unsupported hidden">
    <div class="unsupported-inner">
        <p id="unsupported-content">
            <!-- v1.6에서도 주석 처리되어 있다: <i class="yobicon-alert"></i> error.unsupported.ie -->
        </p>
    </div>
</div>
<header class="gnb-outer" th:classappend="${project != null or org != null} ? 'project-header'">
    <div class="gnb-inner">
        <div class="pin" data-toggle="tooltip" data-placement="bottom" title="Sidebar"><i class="yobicon-arrow-left"></i><i class="yobicon-arrow-right"></i></div>
        <ul class="gnb-nav">
            <li>
                <a th:href="@{/}" class="logo logo-letter">Y</a>
            </li>
            <th:block th:if="${!site.hideProjectListing and !currentUser.guest}">
                <li th:class="${menu == 'PROJECTS'} ? 'active'">
                    <a th:href="@{/projects}" class="show-progress-bar" th:text="#{title.list}"></a>
                </li>
                <li class="divider"></li>
            </th:block>
            <li th:if="${!#strings.isEmpty(site.feedbackUrl)}">
                <a th:href="${site.feedbackUrl}" target="_blank" th:text="#{title.yobi.feedback}"></a>
            </li>
            <li>
                <form th:action="@{${searchLink}}" class="input-prepend gnb-search-form" name="gnb-search-form">
                <input type="hidden" name="searchType" value="auto">
                    <div class="btn-group" th:if="${project != null or org != null}">
                        <button class="ybtn dropdown-toggle" data-toggle="dropdown" type="button" id="gnb-search-scope-title">
                            <th:block th:if="${project != null}" th:text="#{search.scope.project}"></th:block>
                            <th:block th:if="${project == null}" th:text="#{search.scope.group}"></th:block>
                        </button>
                        <ul class="dropdown-menu flat right">
                            <th:block th:if="${project != null}">
                            <li>
                                <a href="#" data-toggle="search-scope" th:data-action="@{'/' + ${project.owner} + '/' + ${project.name} + '/search'}" th:text="#{search.scope.project}">
                                </a>
                            </li>
                            <li th:if="${project.hasGroup}">
                                <a href="#" data-toggle="search-scope" th:data-action="@{'/organizations/' + ${project.owner} + '/search'}" th:text="#{search.scope.group}">
                                </a>
                            </li>
                            </th:block>
                            <th:block th:if="${org != null}">
                                <th:block th:if="${site.hideProjectListing or currentUser.guest}">
                                    <li th:if="${currentUser.memberOf(org) or currentUser.adminOf(org)}">
                                        <a href="#" data-toggle="search-scope" th:data-action="@{'/organizations/' + ${org.name} + '/search'}" th:text="#{search.scope.group}">
                                        </a>
                                    </li>
                                </th:block>
                            </th:block>
                            <li th:if="${(!site.hideProjectListing and !currentUser.guest) or currentUser.siteManager}">
                                <a href="#" data-toggle="search-scope" th:data-action="@{/search}" th:text="#{search.scope.all}">
                                </a>
                            </li>
                        </ul>
                    </div>
                    <div class="search-box" th:classappend="${project != null or org != null} ? 'select'">
                        <input type="text" name="keyword" autocomplete="off" accesskey="S">
                        <button type="submit"><i class="yobicon-search"></i></button>
                    </div>
                </form>
            </li>
        </ul>
        <th:block th:replace="~{common/usermenu :: usermenu}"></th:block>
    </div>
</header>
</th:block>
