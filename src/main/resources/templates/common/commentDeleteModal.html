<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
<!--
 legacy common/commentDeleteModal.scala.html 대응 (그룹2 #26, 그룹11에서 실제 착수). 댓글/코드리뷰
 댓글 삭제 확인 모달 + 삭제 버튼 클릭 위임 스크립트. legacy는 yobi.Comment.js를 로드해서
 [data-toggle="comment-delete"] 클릭을 위임 처리하지만, 그런 정적 자산이 yona에는 없어(신규
 이식 시 확인) 동등한 동작을 인라인 스크립트로 직접 구현한다 — data-request-uri에 담긴 URL로
 DELETE 요청을 보내고 성공하면 해당 댓글의 <li>/<div id="comment-N">를 DOM에서 제거한다.
-->
<div th:fragment="commentDeleteModal(commentsContainer)">
    <div id="comment-delete-modal" class="modal hide fade">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h3 th:text="#{common.comment.delete}">댓글 삭제</h3>
        </div>
        <div class="modal-body">
            <p th:text="#{common.comment.delete.confirm}">정말 이 댓글을 삭제하시겠습니까?</p>
        </div>
        <div class="modal-footer">
            <button id="comment-delete-confirm" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}">예</button>
            <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}">아니요</button>
        </div>
    </div>
    <script type="text/javascript" th:inline="javascript">
        (function() {
            var sContainer = /*[[${commentsContainer != null ? commentsContainer : '#comments'}]]*/ '#comments';
            var elPendingTrigger = null;

            document.addEventListener('click', function(e) {
                var trigger = e.target.closest('[data-toggle="comment-delete"]');
                if (!trigger) {
                    return;
                }
                e.preventDefault();
                elPendingTrigger = trigger;
                $('#comment-delete-modal').modal('show');
            });

            document.getElementById('comment-delete-confirm').addEventListener('click', function() {
                if (!elPendingTrigger) {
                    return;
                }
                var sRequestUri = elPendingTrigger.getAttribute('data-request-uri');
                var elComment = elPendingTrigger.closest('li.comment, div.comment, [id^="comment-"]');
                fetch(sRequestUri, { method: 'DELETE' }).then(function(res) {
                    if (res.ok) {
                        if (elComment) {
                            elComment.remove();
                        }
                        $('#comment-delete-modal').modal('hide');
                    } else {
                        alert('[[#{common.comment.delete}]] failed');
                    }
                });
            });
        })();
    </script>
</div>
</body>
</html>
