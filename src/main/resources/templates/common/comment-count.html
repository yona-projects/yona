<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="commentCount(linkUrl, countNumber, showColorAlways)">
<a th:href="${linkUrl}" class="comments-count" th:classappend="${showColorAlways} ? 'comments-count-color'">
    <span class="count-groups item-icon">
        <i class="yobicon-comment2"></i>
    </span><span class="count-groups item-count" th:text="${countNumber}"></span></a>
</th:block>
