<!--/*
  이식 원본: app/views/common/markdown.scala.html
  마크다운 편집기와 렌더링에 쓰는 하이라이트, marked.js를 불러오고 클라이언트 렌더러를 초기화한다.
  매개변수: project(미리보기 요청을 보낼 프로젝트. 없으면 null)
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="markdown(project)">
<link rel="stylesheet" type="text/css" th:href="@{/assets/javascripts/lib/highlight/styles/default.css}" />
<script type="text/javascript" th:src="@{/assets/javascripts/lib/highlight/highlight.pack.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/marked.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/marked-yona.js}"></script>
<script type="text/javascript" th:inline="javascript">
$(document).ready(function(){
    hljs.configure({languages: []});
    var htOptions = {};

    /*[# th:if="${project != null}"]*/
    htOptions.sMarkdownRendererUrl = [[${'/markdown' + #paths.project(project.owner, project.name)}]];
    /*[/]*/

    // Reusable markdown renderer
    yona.Markdown.init(htOptions);

    // 옛 PHP 별칭 등록(yona.Markdown.init)이 끝난 뒤에 서버가 만든 코드 블록 전체에 색을 입힌다(v1.6의 initHighlightingOnLoad는 load 뒤에 돌았다)
    hljs.highlightAll();

});
</script>
</th:block>
