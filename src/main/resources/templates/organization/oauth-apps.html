<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW

  v1.6에 없는 추가 화면이다(X-39, decisions.md D-78). 조직 설정의 OAuth 앱 목록이다
  모델: title, orgView, apps(AppRow 목록), urls(OAuthAppUrls), userAppsEnabled
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NONE', ~{::oauthPage})}">
<th:block th:fragment="oauthPage" th:with="org=${orgView}">
<th:block th:replace="~{organization/header :: header(${org})}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap shell shell-below-banner">
        <th:block th:replace="~{organization/menu :: sidebar(${org}, 'settings')}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>
        <div class="two-factor-page org-oauth">
        <p class="text-body-secondary mb-4" th:text="#{oauth.org.description}"></p>
        <th:block th:replace="~{oauth/partial-apps :: mine(${apps}, ${urls}, ${userAppsEnabled}, 'oauth.org.apps', 'oauth.org.apps.empty', true)}"></th:block>
        </div>
        </div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
