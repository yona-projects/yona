<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(${org.name})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div id="org-issues-shell" data-turbo-permanent style="display: contents">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{organization/header :: header(${org})}"></div>
    <div th:replace="~{organization/menu :: menu(${org}, 'issue')}"></div>
    </div>

    <!-- 2단 보기(P3-75): 목록은 permanent 프레임, 상세는 Turbo-Frame: issue-detail 요청으로 갱신되는 프레임이다.
         조직 아래 여러 프로젝트의 이슈가 한 목록에 있으므로 선택 상태는 ?detail=issue:<owner>/<project>/<번호> 복합 키로 표현한다. -->
    <link rel="stylesheet" href="/stylesheets/issue-columns.css">
    <div class="page-wrap-outer issue-columns" th:classappend="${selected != null} ? 'has-detail' : ''"
         th:data-selection-clear-url="${selectionClearUrl}">
        <turbo-frame id="issue-list" data-turbo-permanent data-turbo="false" data-turbo-prefetch="false">
        <div class="page-wrap">
            <div th:replace="~{organization/issueSearch_partial :: issueSearch}"></div>
        </div>
        </turbo-frame>
        <turbo-frame th:fragment="issueDetailFrame" id="issue-detail" data-turbo-action="advance" data-turbo="false" target="_top"
                     th:hidden="${selected == null}">
            <th:block th:if="${selected != null}">
                <div th:replace="~{issue/view :: detail}"></div>
            </th:block>
        </turbo-frame>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
<!-- 프로젝트 선택(tomselect)과 상세(이슈 화면 자산: tomselect 포함)를 함께 로드한다. -->
<th:block th:replace="~{issue/view :: detailAssets}"></th:block>
<script type="module" src="/javascripts/service/yona.issue.CrossProjectTurbo.js"></script>
<script type="text/javascript" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function(){
        $yona.loadModule("issue.List");

        var elProjects = document.getElementById("projects");
        if(elProjects){
            elProjects.addEventListener("change", function(){
                var elSearch = document.getElementById("search");
                if(elSearch){
                    // yona.issue.List.js의 pjax 가로채기는 이 폼의 진짜 "submit" 이벤트만
                    // 감지한다 - elSearch.submit()을 직접 부르면 pjax를 건너뛰므로, 이벤트를
                    // 먼저 발생시켜 막히지 않을 때만 제출한다.
                    var weEvt = new Event("submit", {"bubbles": true, "cancelable": true});
                    var bNotPrevented = elSearch.dispatchEvent(weEvt);
                    if(bNotPrevented){
                        elSearch.submit();
                    }
                }
            });
        }
    });
</script>
</body>
</html>
