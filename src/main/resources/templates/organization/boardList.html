<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(${org.name})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div id="org-boards-shell" data-turbo-permanent style="display: contents">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{organization/header :: header(${org})}"></div>
    <div th:replace="~{organization/menu :: menu(${org}, 'board')}"></div>
    </div>

    <!-- 2단 보기(P3-75): 목록은 permanent 프레임, 상세는 Turbo-Frame: post-detail 요청으로 갱신되는 프레임이다.
         조직 아래 여러 프로젝트의 게시글이 한 목록에 있으므로 선택 상태는 ?detail=post:<owner>/<project>/<번호> 복합 키로 표현한다. -->
    <link rel="stylesheet" href="/stylesheets/issue-columns.css">
    <div class="page-wrap-outer board-columns" th:classappend="${selected != null} ? 'has-detail' : ''"
         th:data-selection-clear-url="${selectionClearUrl}">
        <turbo-frame id="post-list" data-turbo-permanent data-turbo="false" data-turbo-prefetch="false">
        <div class="project-page-wrap">
            <div class="search-wrap underline">
                <form id="option_form" method="get" class="pull-left">
                    <input type="hidden" name="orderBy" th:value="${orderBy}">
                    <input type="hidden" name="orderDir" th:value="${orderDir}">
                    <!-- 2단 보기 선택 키(복합). 검색/프로젝트 선택 시에도 선택 상태를 유지한다. -->
                    <input type="hidden" name="detail" th:value="${selected}" th:disabled="${selected == null}">
                    <div class="project-selects span7">
                        <select id="projects" name="projectNames[]" data-format="projects" multiple th:data-placeholder="#{organization.choose.projects}" data-toggle="tomselect" data-container-css-class="fullsize">
                            <option th:each="project : ${visibleProjects}" th:with="isSelected=${selectedProjectNames.contains(project.name)}" th:value="${project.name}" th:selected="${isSelected}" th:data-avatar-url="@{/projects/{id}/logo(id=${project.id})}" th:text="${project.name}">project</option>
                        </select>
                    </div>
                    <div class="search-bar span4">
                        <input name="filter" class="textbox group-board" type="text" th:placeholder="#{title.searchByKeyword}" th:value="${filter}">
                        <button type="submit" class="search-btn"><i class="yobicon-search"></i></button>
                    </div>
                    <div class="two-column-icon mr10 hide-in-mobile" id="two-column-mode-checkbox" th:title="#{common.two.column.mode}" th:data-content="#{common.two.column.mode.desc}">
                        <label class="checkbox">
                            <div class="two-column-icon-border">
                                <input id="two-column-mode" type="checkbox"><span class="two-column-mode-text" th:text="#{common.two.column.view}">2단 보기</span>
                            </div>
                        </label>
                    </div>
                </form>
            </div>

            <div th:if="${currentPage.totalElements == 0 and notices.isEmpty()}" class="error-wrap">
                <i class="ico ico-err1"></i>
                <p th:text="#{post.is.empty}">게시글이 없습니다.</p>
            </div>

            <th:block th:if="${currentPage.totalElements > 0 or !notices.isEmpty()}">
                <div class="filter-wrap board" th:if="${currentPage.totalElements > 1}">
                    <div class="filters">
                        <a th:href="@{/org/{orgName}/boards(orgName=${org.name}, orderBy='updatedDate', orderDir=${orderBy == 'updatedDate' && orderDir == 'desc' ? 'asc' : 'desc'})}"
                           th:class="${orderBy == 'updatedDate'} ? 'filter active' : 'filter'">
                            <i class="ico btn-gray-arrow" th:classappend="${orderBy == 'updatedDate' && orderDir == 'desc'} ? 'down'"></i><span th:text="#{common.order.updatedDate}">최근 업데이트순</span>
                        </a>
                        <a th:href="@{/org/{orgName}/boards(orgName=${org.name}, orderBy='createdDate', orderDir=${orderBy == 'createdDate' && orderDir == 'desc' ? 'asc' : 'desc'})}"
                           th:class="${orderBy == 'createdDate'} ? 'filter active' : 'filter'">
                            <i class="ico btn-gray-arrow" th:classappend="${orderBy == 'createdDate' && orderDir == 'desc'} ? 'down'"></i><span th:text="#{common.order.date}">등록일순</span>
                        </a>
                        <a th:href="@{/org/{orgName}/boards(orgName=${org.name}, orderBy='numOfComments', orderDir=${orderBy == 'numOfComments' && orderDir == 'desc' ? 'asc' : 'desc'})}"
                           th:class="${orderBy == 'numOfComments'} ? 'filter active' : 'filter'">
                            <i class="ico btn-gray-arrow" th:classappend="${orderBy == 'numOfComments' && orderDir == 'desc'} ? 'down'"></i><span th:text="#{common.order.comments}">댓글순</span>
                        </a>
                    </div>
                </div>

                <ul class="post-list-wrap notice-wrap" th:if="${!notices.isEmpty() and currentPage.number == 0}">
                    <th:block th:each="post : ${notices}">
                        <li th:replace="~{organization/boardList_partial :: postItem(${post}, ${post.project})}"></li>
                    </th:block>
                </ul>

                <ul class="post-list-wrap">
                    <th:block th:each="post : ${currentPage.content}">
                        <li th:replace="~{organization/boardList_partial :: postItem(${post}, ${post.project})}"></li>
                    </th:block>
                </ul>
            </th:block>

            <div class="write-btn-wrap"></div>

            <div id="pagination"><!-- pagination.js will fill here. --></div>
        </div>
        </turbo-frame>
        <turbo-frame th:fragment="postDetailFrame" id="post-detail" data-turbo-action="advance" data-turbo="false" target="_top"
                     th:hidden="${selected == null}">
            <th:block th:if="${selected != null}">
                <div th:replace="~{board/view :: detail}"></div>
            </th:block>
        </turbo-frame>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
<th:block th:replace="~{common/tomselect :: tomselect}"></th:block>
<th:block th:replace="~{board/view :: detailAssets}"></th:block>
<script type="module" src="/javascripts/service/yona.board.CrossProjectTurbo.js"></script>
<script type="text/javascript" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        $yona.loadModule("board.List", {
            "elPagination": document.getElementById('pagination'),
            "nTotalPages" : [[${currentPage.totalPages}]]
        });

        var elProjects = document.getElementById("projects");
        if (elProjects) {
            elProjects.addEventListener("change", function(){
                var elOptionForm = document.getElementById("option_form");
                if (elOptionForm) { elOptionForm.submit(); }
            });
        }
    });
</script>
</body>
</html>
