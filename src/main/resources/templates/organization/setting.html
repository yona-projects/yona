<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(${org.name})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{organization/header :: header(${org})}"></div>
    <div th:replace="~{organization/menu :: menu(${org}, 'setting')}"></div>

    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <div th:replace="~{organization/partial_settingmenu :: menu(${org}, 'setting')}"></div>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}">error</div>

            <form id="saveSetting" method="post" th:action="@{/organizations/{orgName}/setting(orgName=${org.name})}" enctype="multipart/form-data" class="nm" name="update-org">
                <input type="hidden" name="id" th:value="${org.id}">
                <div class="bubble-wrap gray">
                    <div class="box-wrap top clearfix frm-wrap" style="padding-top:20px;">
                        <div class="setting-box left">
                            <div class="logo-wrap" th:style="'background-image:url(' + @{/organizations/{orgId}/logo(orgId=${org.id})} + ')'"></div>
                            <div class="logo-desc">
                                <ul class="unstyled descs">
                                    <li><strong th:text="#{organization.logo}">Logo</strong></li>
                                    <li><span th:text="#{organization.logo.type}">Type</span> <span class="point">bmp, jpg, gif, png</span></li>
                                    <li><span th:text="#{organization.logo.maxFileSize}">Max size</span> <span class="point">5MB</span></li>
                                    <li>
                                        <div class="btn-wrap">
                                            <div class="nbtn medium white fake-file-wrap">
                                                <i class="yobicon-upload"></i> <span th:text="#{button.upload}">Upload</span><input id="logoPath" type="file" class="file" name="logoPath" accept="image/*">
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <dl class="setting-box right">
                            <dt>
                                <label for="project-name" th:text="#{organization.name.placeholder}">Name</label>
                            </dt>
                            <dd>
                                <input id="project-name" type="text" name="name" maxlength="250" th:value="${org.name}">
                                <div class="orange-txt">
                                    <span class="msg wrongName" style="display: none;"></span>
                                </div>
                            </dd>
                            <dt>
                                <label for="project-desc" th:text="#{organization.description.placeholder}">Description</label>
                            </dt>
                            <dd>
                                <textarea id="project-desc" name="descr" maxlength="250" class="textarea" th:text="${org.descr}"></textarea>
                            </dd>
                        </dl>
                    </div>
                </div>
                <div class="box-wrap bottom">
                    <button id="save" class="ybtn ybtn-success" th:text="#{button.save}">Save</button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>
<script language="javascript" th:inline="javascript">
    $(function() {
        $yobi.loadModule("organization.Setting")
    })
</script>
</body>
</html>
