  모델: title, orgView(OrganizationViewContext), nameWarning(이름 입력란 아래 안내. 번역 끝남)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NONE', ~{::settingPage})}">
<th:block th:fragment="settingPage" th:with="org=${orgView}">
<th:block th:replace="~{organization/header :: header(${org})}"></th:block>
<th:block th:replace="~{organization/menu :: menu(${org}, ${requestPath})}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{organization/partial-settingmenu :: settingmenu(${org}, ${requestPath})}"></th:block>

        <form id="saveSetting" method="post" th:action="@{/organizations/{name}/setting(name=${org.name})}" enctype="multipart/form-data" class="nm" name="update-org">
            <input type="hidden" name="id" th:value="${org.organization.id}">
            <div class="bubble-wrap gray">
                <div class="box-wrap top clearfix frm-wrap" style="padding-top:20px;">
                    <div class="setting-box left">
                        <div class="logo-wrap" th:style="'background-image:url(\'' + ${org.logoUrl} + '\')'"></div>
                        <div class="logo-desc">
                            <ul class="list-unstyled descs">
                                <li><strong th:text="#{organization.logo}"></strong></li>
                                <li><th:block th:text="#{organization.logo.type}"></th:block> <span class="point">bmp, jpg, gif, png</span></li>
                                <li><th:block th:text="#{organization.logo.maxFileSize}"></th:block> <span class="point">5MB</span></li>
                                <li>
                                    <div class="btn-wrap">
                                        <div class="nbtn medium white fake-file-wrap">
                                            <i class="yobicon-upload"></i> <th:block th:text="#{button.upload}"></th:block><input id="logoPath" type="file" class="file form-control" name="logoPath" accept="image/*">
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <dl class="setting-box right">
                        <dt>
                            <label for="project-name" th:text="#{organization.name.placeholder}"></label>
                        </dt>
                        <dd>
                            <input class="form-control" id="project-name" type="text" name="name" maxlength="250" th:value="${org.name}">
                            <div class="orange-txt">
                                <span th:if="${nameWarning != null}" class="warning" th:text="${nameWarning}"></span>
                                <span class="msg wrongName" style="display: none;"></span>
                            </div>
                        </dd>
                        <dt>
                            <label for="project-desc" th:text="#{organization.description.placeholder}"></label>
                        </dt>
                        <dd>
                            <textarea id="project-desc" name="descr" maxlength="250" class="textarea form-control" th:text="${org.descr}"></textarea>
                        </dd>
                    </dl>
                </div>
            </div>
            <div class="box-wrap bottom">
                <button id="save" class="ybtn ybtn-success" th:text="#{button.save}"></button>
            </div>
        </form>
    </div>
</div>
<script language="javascript">
    $(function() {
        $yobi.loadModule("organization.Setting")
    })
</script>
</th:block>
</html>
