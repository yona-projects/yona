<!--/*
  이식 원본: app/views/organization/partial_settingmenu.scala.html
  매개변수: view(OrganizationViewContext), requestPath(요청 경로)
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="settingmenu(view, requestPath)"
          th:with="base=${#paths.organization(view.name)}">
<ul class="nav nav-tabs">
    <li class="nav-item">
        <a th:href="${base + '/settingform'}" th:text="#{organization.settingFrom}" class="nav-link" th:classappend="${requestPath == base + '/settingform'} ? 'active'"></a>
    </li>
    <li class="nav-item">
        <a th:href="${base + '/members'}" th:text="#{organization.member}" class="nav-link" th:classappend="${requestPath == base + '/members'} ? 'active'"></a>
    </li>
    <li class="nav-item">
        <a th:href="${base + '/deleteForm'}" th:text="#{organization.delete}" class="nav-link" th:classappend="${requestPath == base + '/deleteForm'} ? 'active'"></a>
    </li>
</ul>
</th:block>
