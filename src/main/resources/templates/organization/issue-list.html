            group_issue_list_partial.scala.html, group_issue_list_quicksearch.scala.html
  모델: title, orgView, cond(IssueSearchCondition), items(OrganizationIssueRow 목록), pageIndex, totalPageCount, openCount, closedCount, meId, projectOptions
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/organization-layout :: organizationLayout(${orgView.name}, 'NONE', ${orgView}, ~{::issuePage})}">
<th:block th:fragment="issuePage" th:with="org=${orgView}">
<th:block th:replace="~{organization/header :: header(${org})}"></th:block>
<th:block th:replace="~{organization/menu :: menu(${org}, ${requestPath})}"></th:block>
<div class="page-wrap-outer">
    <div class="page-wrap">
        <div pjax-container class="row issue-list-wrap">
            <div class="left-menu col-lg-2 span-hard-wrap">
                <div class="inner advanced">
                    <ul class="lst-stacked list-unstyled" th:with="names=${cond.projectNames.isEmpty() ? '' : cond.projectNames}">
                        <li th:class="${cond.assigneeId == null and cond.authorId == null and cond.mentionId == null} ? 'active'">
                            <a pjax-filter href="#" data-assignee-id="" data-author-id="" data-mention-id="" data-project-names="" data-milestone-id="" th:attrappend="data-project-names=${names}, data-milestone-id=${cond.milestoneId}" th:text="#{issue.list.all}"></a>
                        </li>
                        <li th:if="${meId != null}" th:class="${cond.assigneeId == meId} ? 'active'">
                            <a pjax-filter href="#" data-author-id="" data-mention-id="" data-assignee-id="" data-project-names="" data-milestone-id="" th:attrappend="data-assignee-id=${meId}, data-project-names=${names}, data-milestone-id=${cond.milestoneId}" th:text="#{issue.list.assignedToMe}"></a>
                        </li>
                        <li th:if="${meId != null}" th:class="${cond.authorId == meId} ? 'active'">
                            <a pjax-filter href="#" data-assignee-id="" data-mention-id="" data-author-id="" data-project-names="" data-milestone-id="" th:attrappend="data-author-id=${meId}, data-project-names=${names}, data-milestone-id=${cond.milestoneId}" th:text="#{issue.list.authoredByMe}"></a>
                        </li>
                        <li th:if="${meId != null}" th:class="${cond.mentionId == meId} ? 'active'">
                            <a pjax-filter href="#" data-assignee-id="" data-author-id="" data-mention-id="" data-project-names="" data-milestone-id="" th:attrappend="data-mention-id=${meId}, data-project-names=${names}, data-milestone-id=${cond.milestoneId}" th:text="#{issue.list.mentionedOfMe}"></a>
                        </li>
                    </ul>

                    <form id="search" name="search" th:action="@{/organizations/{name}/issues(name=${org.name})}" method="get">
                        <select class="form-select" id="projects" name="projectNames[]" multiple th:attr="data-placeholder=#{organization.choose.projects}" data-toggle="select2" data-container-css-class="fullsize">
                            <option th:each="option : ${projectOptions}" th:value="${option.name}" th:selected="${option.selected}" th:attr="data-avatar-url=${option.logoUrl}" th:text="${option.name}"></option>
                        </select>
                        <hr>

                        <input type="hidden" name="orderBy" th:value="${cond.orderBy}">
                        <input type="hidden" name="orderDir" th:value="${cond.orderDir}">
                        <input type="hidden" name="state" th:value="${cond.state}">
                        <input type="hidden" name="authorId" th:value="${cond.authorId}" data-search="authorId">
                        <input type="hidden" name="assigneeId" th:value="${cond.assigneeId}" data-search="assigneeId">
                        <input type="hidden" name="mentionId" th:value="${cond.mentionId}" data-search="mentionId">

                        <div class="search">
                            <div class="search-bar">
                                <input name="filter" class="textbox full" type="text" th:value="${cond.filter}">
                                <button type="submit" class="search-btn"><i class="yobicon-search"></i></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col-lg-10 span-hard-wrap" id="span10">
                <ul class="nav nav-tabs nm mb-3">
                    <li class="nav-item">
                        <a href="#" state="open" class="nav-link" th:classappend="${cond.state == 'open'} ? 'active'"><th:block th:text="#{issue.state.open}"></th:block> <span class="num-badge" th:text="${openCount}"></span></a>
                    </li>
                    <li class="nav-item">
                        <a href="#" state="closed" class="nav-link" th:classappend="${cond.state == 'closed'} ? 'active'"><th:block th:text="#{issue.state.closed}"></th:block> <span class="num-badge" th:text="${closedCount}"></span></a>
                    </li>
                    <li><th:block th:replace="~{common/two-column-mode-checkbox-area :: twoColumnModeCheckboxArea}"></th:block></li>
                </ul>
                <th:block th:if="${!items.isEmpty()}">
                    <div class="filter-wrap small-heights">
                        <div th:if="${items.size() > 1}" class="filters float-end">
                            <th:block th:each="field : ${ {'dueDate', 'updatedDate', 'createdDate', 'numOfComments'} }"
                                      th:with="label=${field == 'dueDate' ? 'common.order.dueDate' : (field == 'updatedDate' ? 'common.order.updatedDate' : (field == 'createdDate' ? 'common.order.date' : 'common.order.comments'))}">
                                <a th:if="${cond.orderBy == field}" href="#" th:attr="orderBy=${cond.orderBy}, orderDir=${cond.orderDir == 'desc'} ? 'asc' : 'desc'" class="filter active"><i class="ico btn-gray-arrow" th:classappend="${cond.orderDir == 'desc'} ? 'down'"></i><th:block th:text="#{${label}}"></th:block></a>
                                <a th:unless="${cond.orderBy == field}" href="#" th:attr="orderBy=${field}" orderDir="desc" class="filter"><i class="ico btn-gray-arrow down"></i><th:block th:text="#{${label}}"></th:block></a>
                            </th:block>
                        </div>
                    </div>

                    <ul class="post-list-wrap">
                    <th:block th:each="row : ${items}" th:with="issue=${row.item}, base=${#paths.project(row.owner, row.project)}, url=${#paths.project(row.owner, row.project) + '/issue/' + row.item.number}">
                        <li class="post-item title row align-items-start" th:id="'issue-item-' + ${issue.id}" th:href="@{${url}}">
                            <div class="col-lg-10 span-hard-wrap">
                                <a th:if="${issue.authorLoginId != null}" th:href="@{/{u}(u=${issue.authorLoginId})}" class="avatar-wrap mlarge hide-in-mobile" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${issue.authorLoginId}">
                                    <img th:if="${helper.isDefaultAvatar(row.authorAvatarUrl)}" th:src="${row.authorAvatarUrl}"/>
                                    <img th:unless="${helper.isDefaultAvatar(row.authorAvatarUrl)}" th:src="${row.authorAvatarUrl}" th:alt="${issue.authorName}" width="32" height="32"/>
                                </a>
                                <div class="title-wrap">
                                    <a th:href="@{${url}}" class="title" th:text="${issue.title}"></a>
                                </div>
                                <div class="infos">
                                    <a th:if="${issue.authorName != null and !issue.authorName.isEmpty()}" th:href="@{/{u}(u=${issue.authorLoginId})}" class="infos-item infos-link-item" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${issue.authorLoginId}" th:text="${issue.authorDisplayName}"></a>
                                    <span th:unless="${issue.authorName != null and !issue.authorName.isEmpty()}" class="infos-item" th:text="#{issue.noAuthor}"></span>

                                    <span class="infos-item" th:title="${issue.createdTitle}" th:text="${issue.createdAgo}"></span>

                                    <span th:if="${row.milestoneVisible}" class="infos-item mileston-tag">
                                        <a th:href="@{${base + '/milestone/' + issue.milestoneId}}" data-bs-toggle="tooltip" data-bs-placement="top" th:title="#{milestone}" th:text="${issue.milestoneTitle}"></a>
                                    </span>

                                    <span th:if="${issue.commentCount > 0 or issue.voterCount > 0}" class="infos-item item-count-groups">
                                        <!--/* v1.6 `TemplateHelper.countHtml`의 마크업이다 */-->
                                        <a th:if="${issue.commentCount > 0}" th:href="@{${url + '#comments'}}"><span class="count-groups item-icon">
        <i class="yobicon-comments"></i>
      </span>
      <span class="count-groups item-count" th:text="${issue.commentCount}"></span></a>
                                        <a th:if="${issue.voterCount > 0}" th:href="@{${url + '#vote'}}"><span class="count-groups item-icon strong">
        <i class="yobicon-hearts"></i>
      </span>
      <span class="count-groups item-count strong" th:text="${issue.voterCount}"></span></a>
                                    </span>

                                    <a th:href="@{${base}}" class="infos-link-item group-project-name" th:text="${row.project}"></a>
                                    <span class="post-id margin-right-5" th:text="'#' + ${issue.number}"></span>

                                    <a th:each="label : ${issue.labels}" th:href="@{${base + '/issues?state=open&labelIds=' + label.id}}" class="badge issue-label list-label bg-secondary" th:attr="data-label-id=${label.id}" th:style="'background:' + ${label.color}" th:text="${label.name}"></a>
                                </div>
                            </div>
                            <div class="col-lg-2 hide-in-mobile">
                                <div class="mt5 float-end">
                                    <a th:if="${issue.assigneeName != null}" th:href="@{/{u}(u=${issue.assigneeLoginId})}" class="avatar-wrap assinee" data-bs-toggle="tooltip" data-bs-placement="top" th:title="#{issue.assignee} + ': ' + ${issue.assigneeName}">
                                        <img th:src="@{${issue.assigneeAvatarUrl}}" width="32" height="32" th:alt="${issue.assigneeName}">
                                    </a>
                                    <div th:unless="${issue.assigneeName != null}" class="empty-avatar-wrap">&nbsp;</div>
                                </div>
                                <div th:if="${issue.due != null}" class="mr20 mt10 float-end" th:classappend="${row.overdue} ? 'overdue'" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${row.dueDateString}">
                                    <i class="yobicon-clock2"></i>
                                    <th:block th:text="${issue.due.text}"></th:block>
                                </div>
                            </div>
                        </li>
                    </th:block>
                    </ul>

                    <div id="pagination" th:attr="data-total=${totalPageCount}"><!-- pagination.js will fill here. --></div>
                </th:block>
                <div th:if="${items.isEmpty()}" class="error-wrap">
                    <i class="ico ico-err1"></i>
                    <p th:text="#{issue.is.empty}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/jquery.pageslide.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/service/yona.twoColumnMode.js}"></script>
<script type="text/javascript">
  $(function(){
    $yobi.loadModule("issue.List");

    $("#projects" ).on("change", function(){
        $("#search" ).submit();
    });
  });
</script>
<th:block th:replace="~{common/select2 :: select2}"></th:block>
</th:block>
</html>
