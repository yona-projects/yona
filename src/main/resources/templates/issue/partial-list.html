  매개변수: list(IssueListItem 목록). 초안 목록(`draftList`)은 번호 표시만 다르다.
  하위 이슈 줄은 각 이슈 아래에 접어 두는 `child-issue-list`에 들어 있다.

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="list(list)" th:with="base=${'/' + projectView.project.owner + '/' + projectView.project.name}">
    <ul class="post-list-wrap row-fluid">
        <th:block th:each="issue : ${list}">
        <li class="post-item title" th:id="'issue-item-' + ${issue.id}" data-item="issue-item"
            th:attr="data-value=${issue.authorLoginId} + ' ' + ${issue.number} + ' ' + ${issue.title}" th:href="${base + '/issue/' + issue.number}">
            <div class="span9 span-hard-wrap">
                <label th:if="${projectView.projectMember}" th:for="'issue-' + ${issue.id}" class="mass-update-check hide-in-mobile">
                    <input th:id="'issue-' + ${issue.id}" type="checkbox" name="checked-issue" data-toggle="issue-checkbox" th:attr="data-issue-id=${issue.id}, data-issue-labels=${issue.labelsData}">
                </label>
                <div th:attr="for='issue-' + ${issue.id}" class="issue-item-row">
                    <div class="title-wrap">
                        <a th:href="${base + '/issue/' + issue.number}" class="title">
                        <span class="post-id">#<span th:if="${issue.draft}" class="draft-number" th:text="#{issue.state.draft}"></span><th:block th:unless="${issue.draft}" th:text="${issue.number}"></th:block></span>
                        </a>
                        <span th:if="${issue.weight > 0}" class="weight-up-arrow" data-toggle="tooltip" data-placement="right" th:title="#{issue.weight} + ' ' + ${issue.weight}"><i class="yobicon-angle-circled-up"></i></span>
                        <span th:if="${issue.weight < 0}" class="weight-down-arrow" data-toggle="tooltip" data-placement="right" th:title="#{issue.weight} + ' ' + ${issue.weight}"><i class="yobicon-angle-circled-down"></i></span>
                        <th:block th:utext="${issue.headerWordsHtml}"></th:block>
                        <a th:href="${base + '/issue/' + issue.number}" class="title" th:text="${issue.titleWithoutHeaders}"></a>
                    </div>
                    <div class="infos">
                        <a th:if="${issue.authorName != null and !issue.authorName.isEmpty()}" th:href="'/' + ${issue.authorLoginId}" class="infos-item infos-link-item" data-toggle="tooltip" data-placement="bottom" th:title="${issue.authorLoginId}" th:text="${issue.authorDisplayName}"></a>
                        <span th:unless="${issue.authorName != null and !issue.authorName.isEmpty()}" class="infos-item" th:text="#{issue.noAuthor}"></span>

                        <span class="infos-item" data-toggle="tooltip" data-placement="bottom" th:title="${issue.createdTitle}" th:text="${issue.createdAgo}"></span>

                        <th:block th:if="${issue.subtask != null}">
                            <div class="subtask-progress upload-progress" th:classappend="${issue.subtask.percent == 100} ? 'done-outline' : 'red-outline'">
                                <div class="bar" th:classappend="${issue.subtask.percent == 100} ? 'done' : 'red'" th:style="'width: ' + ${issue.subtask.percent} + '%;'" title="Subtask"></div>
                            </div>
                            <span class="subtask-progress completion-ratio" th:classappend="${issue.subtask.percent == 100} ? 'txt-green'"><th:block th:if="${issue.subtask.percent != 100}" th:text="${issue.subtask.closed} + '/'"></th:block><th:block th:text="${issue.subtask.total}"></th:block></span>
                        </th:block>
                        <span th:if="${issue.parent != null}" class="infos-item subtask">
                            <a th:href="'/' + ${issue.parent.owner} + '/' + ${issue.parent.project} + '/issue/' + ${issue.parent.number}" th:text="${issue.parent.label}"></a>
                        </span>

                        <span th:if="${projectView.menuSetting.milestone and issue.milestoneId != null}" class="mileston-tag">
                            <a th:href="${base + '/milestone/' + issue.milestoneId}" data-toggle="tooltip" data-placement="bottom" th:title="#{milestone}" th:text="${issue.milestoneTitle}"></a>
                        </span>

                        <span th:if="${issue.commentCount > 0 or issue.voterCount > 0 or issue.sharerCount > 0}" class="infos-item item-count-groups">
                            <th:block th:if="${issue.commentCount > 0}"><th:block th:replace="~{common/comment-count :: commentCount(${base + '/issue/' + issue.number + '#comments'}, ${issue.commentCount}, true)}"></th:block></th:block>
                            <th:block th:if="${issue.voterCount > 0}"><th:block th:replace="~{common/vote-count :: voteCount(${base + '/issue/' + issue.number + '#vote'}, ${issue.voterCount}, true)}"></th:block></th:block>
                            <th:block th:if="${issue.sharerCount > 0}"><th:block th:replace="~{common/sharer-count :: sharerCount(${issue.sharerCount}, true)}"></th:block></th:block>
                        </span>

                        <a th:each="label : ${issue.labels}" href="#" class="label issue-label list-label active" th:attr="data-category-id=${label.categoryId}, data-label-id=${label.id}" th:text="${label.name}"></a>
                        <div class="child-issue-list hide">
                            <div th:if="${!issue.children.isEmpty()}" class="child-issues">
                                <th:block th:each="child : ${issue.children}">
                                <div th:if="${!child.draft or true}" class="issue-item child-issue" th:classappend="${child.selected} ? 'selected-child'">
                                    <span class="state-label" th:classappend="${child.state}"><i th:if="${child.state == 'closed'}" class=" yobicon-checkmark"></i></span>
                                    <a class="twoColumeModeTarget" th:href="'/' + ${child.owner} + '/' + ${child.project} + '/issue/' + ${child.number}">
                                        <span class="item-name">
                                            <span class="subtask-number"><span th:if="${child.draft}" class="draft-number" th:text="'#' + #{issue.state.draft}"></span><th:block th:unless="${child.draft}" th:text="'#' + ${child.number}"></th:block></span>
                                            <span th:text="${child.title}"></span>
                                            <span th:if="${child.assigneeName != null}" th:text="'- ' + ${child.assigneeName}"></span>
                                        </span>
                                    </a>
                                    <span class="font12 no-border-at-child">
                                        <span th:if="${child.commentCount > 0 or child.voterCount > 0}" class="item-count-groups">
                                            <th:block th:if="${child.commentCount > 0}"><th:block th:replace="~{common/comment-count :: commentCount(${base + '/issue/' + child.number + '#comments'}, ${child.commentCount}, true)}"></th:block></th:block>
                                            <th:block th:if="${child.voterCount > 0}"><th:block th:replace="~{common/vote-count :: voteCount(${base + '/issue/' + child.number + '#vote'}, ${child.voterCount}, true)}"></th:block></th:block>
                                        </span>
                                    </span>
                                    <a th:each="label : ${child.labels}" th:href="${base + '/issues?state=open&labelIds=' + label.id}" class="label issue-label list-label active twoColumeModeTarget" th:attr="data-category-id=${label.categoryId}, data-label-id=${label.id}" th:style="'background:' + ${label.color}" th:text="${label.name}"></a>
                                    <span class="child-issue-date" th:title="${child.createdTitle}" th:text="${child.createdAgo}"></span>
                                </div>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="span3 hide-in-mobile">
                <div class="mt5 pull-right">
                    <a th:if="${issue.assigneeName != null}" th:href="'/' + ${issue.assigneeLoginId}" class="avatar-wrap assinee" data-toggle="tooltip" data-placement="top" th:title="#{issue.assignee} + ': ' + ${issue.assigneeName}">
                        <img th:src="${issue.assigneeAvatarUrl}" width="32" height="32" th:alt="${issue.assigneeName}">
                    </a>
                    <div th:unless="${issue.assigneeName != null}" class="empty-avatar-wrap">&nbsp;</div>
                </div>
                <div th:if="${issue.due != null}" class="mr20 mt10 pull-right" th:classappend="${issue.due.cssClass}"
                     th:attr="data-toggle=${issue.due.tooltip != null} ? 'tooltip', data-placement=${issue.due.tooltip != null} ? 'top', title=${issue.due.tooltip}">
                    <i class="yobicon-clock2 mr3 vmiddle"></i>
                    <span class="vmiddle" th:text="${issue.due.text}"></span>
                </div>
            </div>
        </li>
        </th:block>
    </ul>
</th:block>
