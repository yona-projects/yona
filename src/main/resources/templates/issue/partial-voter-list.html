<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="voterList(id, voters)">
<div th:id="${id}" class="modal voters-dialog"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <h5 class="nm" th:text="#{issue.voters}"></h5>
    </div>
    <div class="modal-body">
        <ul class="list-unstyled">
            <li th:each="voter : ${voters}">
                <a th:href="'/' + ${voter.loginId}" class="usf-group" target="_blank">
                    <span class="avatar-wrap mlarge">
                        <img th:src="${voter.avatarUrl}" width="40" height="40">
                    </span>
                    <strong class="name" th:text="${voter.name}"></strong>
                    <span class="loginid"> <strong>@</strong><th:block th:text="${voter.loginId}"></th:block></span>
                </a>
            </li>
        </ul>
    </div>
    <div class="modal-footer">
        <button th:if="${site.showUserEmail}" id="copyEmailBtn" class="ybtn ybtn-info ybtn-small"
                th:attr="data-clipboard-text=${#strings.listJoin(voters.![name + ' <' + email + '>;'], '')}" th:text="#{button.copy.email}"></button>
        <button class="ybtn ybtn-info ybtn-small" data-bs-dismiss="modal" aria-hidden="true" th:text="#{button.close}"></button>
    </div>
</div></div></div>
</th:block>
