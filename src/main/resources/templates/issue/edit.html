<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(title=${project.name} + ' - 이슈 수정')}">
</head>
<body class="theme-default prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'issue')}"></div>
    <link rel="stylesheet" th:href="@{/{owner}/{projectName}/issue/labels.css(owner=${project.owner}, projectName=${project.name})}" type="text/css" />


    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <div class="content-wrap frm-wrap">
                <form th:action="@{/{owner}/{projectName}/issue/{number}/edit(owner=${project.owner}, projectName=${project.name}, number=${issue.number})}" id="issue-form" method="post" enctype="multipart/form-data">
                    <div class="row-fluid">
                        <div class="span12">
                            <dl>
                                <dd>
                                    <div class="span12">
                                        <div class="span11">
                                            <input type="text" id="title" name="title" th:value="${issue.title}" class="text title" maxlength="250" tabindex="1" th:placeholder="#{title}" autocomplete="off" th:title="#{title.help.key}">
                                        </div>
                                        <div class="span1 subtask-message" th:classappend="${parentIssue != null} ? 'option-on' : ''" th:text="#{issue.option}">Option</div>
                                    </div>
                                    <!-- 하위 태스크 설정 영역 — yona partial_select_subtask.scala.html 대응 (그룹7 #125).
                                         legacy의 showOption = parentIssueId.isDefined || currentIssueId.isDefined 이며,
                                         수정 화면은 currentIssueId(=이 이슈 자신)가 항상 존재하므로 showOption은 항상
                                         참이다 — parentIssue 유무와 무관하게 항상 펼쳐져 있고 활성화돼 있어야 한다
                                         (이 이슈에 부모가 아직 없어도 수정 화면에서 새로 부모를 지정할 수 있어야 함). -->
                                    <div class="subtask-wrap show">
                                        <div class="span3">
                                            <select id="targetProjectId" name="targetProjectId" data-format="projects" th:data-placeholder="#{organization.choose.projects}" data-toggle="select2" data-container-css-class="fullsize">
                                                <option th:value="${project.id}" th:data-avatar-url="@{/projects/{projectId}/logo(projectId=${project.id})}" th:text="${project.name}"></option>
                                                <option th:each="movable : ${movableProjects}" th:if="${movable.id != project.id}" th:value="${movable.id}" th:data-owner="${movable.owner} + ' /'" th:data-avatar-url="@{/projects/{projectId}/logo(projectId=${movable.id})}" th:text="${movable.name}"></option>
                                            </select>
                                        </div>
                                        <div class="span6">
                                            <!-- hasChildIssue: 이 이슈가 이미 하위이슈를 갖고 있으면(=이미 부모 이슈) 다른
                                                 이슈의 하위이슈로 만들 수 없다 — placeholder만 안내 문구로 바뀌고 후보
                                                 목록은 비운다(legacy와 동일하게 매니저 이슈 그대로 재현). -->
                                            <select id="parentId" name="parentIssueId" data-format="issues" th:data-placeholder="#{organization.choose.projects}" data-toggle="select2" data-container-css-class="fullsize">
                                                <option value="" th:text="${hasChildIssue} ? '이미 부모 이슈입니다.' : #{issue.subtask.select}">부모 이슈 선택</option>
                                                <option th:if="${parentIssue != null}" th:value="${parentIssue.id}" selected th:text="'#' + ${parentIssue.number} + '. ' + ${parentIssue.title}"></option>
                                                <th:block th:unless="${hasChildIssue}">
                                                    <option th:each="parentCandidate : ${parentCandidates}" th:if="${parentIssue == null || parentCandidate.id != parentIssue.id}" th:value="${parentCandidate.id}" th:text="'#' + ${parentCandidate.number} + '. ' + ${parentCandidate.title}"></option>
                                                </th:block>
                                            </select>
                                        </div>
                                    </div>
                                </dd>
                            </dl>
                        </div>

                        <div class="row-fluid">
                            <div class="span9 span-left-pane">
                                <dl>
                                    <dd style="position: relative;">
                                        <div th:replace="~{site/layout :: markdownEditor('body', ${issue.body}, 'content-body')}"></div>
                                    </dd>
                                </dl>

                                <!-- 파일 업로더 영역 -->
                                <div class="upload-wrap content-footer" data-resource-type="ISSUE_POST" th:data-resource-id="${issue.id}" id="upload">
                                    <input type="hidden" name="temporaryUploadFiles">
                                    <div class="attach-wrap">
                                        <span class="help help-droppable" th:text="#{common.attach.drophere}">Drag &amp; Drop files to attach here or</span>
                                        <div class="btn-wrap">
                                            <div class="nbtn medium white fake-file-wrap">
                                                <i class="yobicon-upload"></i> <span th:text="#{button.upload}" th:remove="tag">File upload</span>
                                                <input type="file" class="file" name="filePath" multiple="multiple">
                                            </div>
                                        </div>
                                        <span class="plain" th:text="#{common.attach.clickbutton}">Click upload button</span>
                                        <span class="help help-pastable" style="display: block;" th:text="#{common.attach.pastehere}">Paste the clipboard image</span>
                                    </div>
                                    <ul class="attached-files unstyled"></ul>
                                </div>

                                <div class="actrow right-txt">
                                    <button type="submit" id="button-save" class="ybtn ybtn-success" th:text="#{button.save}">저장</button>
                                    <a th:href="@{/{owner}/{projectName}/issue/{number}(owner=${project.owner}, projectName=${project.name}, number=${issue.number})}" class="ybtn" th:text="#{button.cancel}">취소</a>
                                </div>
                            </div>
                            
                            <div class="span3 span-hard-wrap right-menu">
                                <dl class="issue-option">
                                    <dt th:text="#{issue.assignee}">담당자</dt>
                                    <dd>
                                        <input type="hidden" class="bigdrop" id="assignee" name="assigneeLoginId" th:value="${issue.assignee != null ? issue.assignee.user.loginId : ''}" th:placeholder="#{issue.noAssignee}" style="width: 100%" title="">
                                    </dd>
                                </dl>

                                <dl id="milestoneOption" class="issue-option" th:if="${project.isMilestoneEnabled}">
                                    <dt th:text="#{milestone}">마일스톤</dt>
                                    <dd>
                                        <div th:if="${milestones == null || milestones.isEmpty()}">
                                            <a th:href="@{/{owner}/{projectName}/newMilestoneForm(owner=${project.owner}, projectName=${project.name})}"
                                               class="ybtn ybtn-small ybtn-fullsize" target="_blank" th:text="#{milestone.menu.new}">
                                                새 마일스톤
                                            </a>
                                        </div>
                                        <div th:if="${milestones != null && !milestones.isEmpty()}">
                                            <select id="milestoneId" name="milestoneId"
                                                    data-toggle="select2" data-format="milestone" data-container-css-class="fullsize">
                                                <option value="" th:text="#{issue.noMilestone}">마일스톤 없음</option>
                                                <option th:each="milestone : ${milestones}" th:value="${milestone.id}" th:selected="${issue.milestone != null && issue.milestone.id == milestone.id}" th:text="${milestone.title}"></option>
                                            </select>
                                        </div>
                                    </dd>
                                </dl>

                                <dl class="issue-option">
                                    <dt th:text="#{issue.dueDate}">마감일</dt>
                                    <dd>
                                        <div class="search search-bar">
                                            <input type="text" id="issueDueDate" th:value="${issue.dueDate != null ? #dates.format(issue.dueDate, 'yyyy-MM-dd') : ''}" data-toggle="calendar" name="dueDate" class="textbox full">
                                            <button type="button" class="search-btn btn-calendar"><i class="yobicon-calendar2"></i></button>
                                        </div>
                                    </dd>
                                </dl>

                                <dl class="issue-option" th:if="${labels != null && !labels.isEmpty()}">
                                    <dt th:text="#{label}">라벨</dt>
                                    <dd>
                                        <select id="labelIds" name="labelIds" multiple="multiple" data-search="labelIds"
                                                data-toggle="select2" data-format="issuelabel" data-allow-clear="true"
                                                data-dropdown-css-class="issue-labels" data-container-css-class="issue-labels bordered fullsize"
                                                th:data-placeholder="#{label.select}" class="hide">
                                            <option></option>
                                            <optgroup th:each="entry : ${labelMap}" th:label="${entry.key.name}" th:data-category-id="${entry.key.id}" th:data-category-is-exclusive="${entry.key.isExclusive}">
                                                <option th:each="label : ${entry.value}" th:value="${label.id}" th:data-category-id="${entry.key.id}" th:data-category-is-exclusive="${entry.key.isExclusive}" th:selected="${issue.labels != null && #lists.contains(issue.labels.![id], label.id)}" th:text="${label.name}">Label</option>
                                            </optgroup>
                                        </select>
                                    </dd>
                                </dl>
                                <input type="hidden" id="isDraft" name="isDraft" value="false">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<th:block th:replace="~{common/select2 :: select2}"></th:block>
<th:block th:replace="~{common/calendar :: calendar}"></th:block>
<th:block th:replace="~{site/layout :: markdown(${project})}"></th:block>
<link rel="stylesheet" type="text/css" media="screen" href="/javascripts/lib/atjs/jquery.atwho.css">
<script type="text/javascript" src="/javascripts/lib/atjs/jquery.caret.min.js"></script>
<script type="text/javascript" src="/javascripts/lib/atjs/jquery.atwho.js"></script>
<script type="text/javascript" src="/javascripts/common/yona.Subtask.js"></script>
<script type="text/javascript" src="/javascripts/service/yona.issue.Assginee.js"></script>
<script type="text/javascript" src="/javascripts/common/yona.TitleHeadAutoCompletion.js"></script>
<script type="text/javascript">
    $(function(){
        $yobi.loadModule("issue.Write", {
            "sMode"		   : "edit",
            "sIssueFormURL": "/[[${project.owner}]]/[[${project.name}]]/issue/[[${issue.number}]]/editform",
            "sIssueListURL": "/[[${project.owner}]]/[[${project.name}]]/issues",
            "elTextarea"   : 'textarea[data-editor-mode="content-body"]',
            "elMilestoneRefresh": $("#milestoneOption .yobicon-refresh"),
            "elDueDate"    : $("#issueDueDate")
        });

        yobi.Mention({
            "target": 'textarea[id^=editor-]',
            "url"   : "/[[${project.owner}]]/[[${project.name}]]/mentionList"
        });

        yonaAssgineeModule(
            "/api/projects/[[${project.id}]]/assignableUsers",
            "[[${issue.assignee != null ? issue.assignee.user.id : ''}]]",
            "[[#{issue.assignee}]]"
        );

        yonaTitleHeadModule({
            "target": 'input[id=title]',
            "url"   : "/api/projects/[[${project.id}]]/titleHeads"
        });

        $('#button-save').on('click', function(){
            var $this = $(this);
            $this.prop('disabled', true);
            setTimeout(function (){
                $this.prop('disabled', false);
            }, 3000);

            $('#issue-form').submit();
        });
    });
</script>
</body>
</html>
