<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="showSelectedLabel(labels, listLink)">
<dl th:if="${!labels.isEmpty()}">
    <dt th:text="#{label}"></dt>
    <dd>
        <a th:each="label : ${labels}" th:href="${listLink} + '&labelIds=' + ${label.id}" class="label issue-label active static label-default"
           th:attr="data-label-id=${label.id}" th:style="'background:' + ${label.color}" th:text="${label.name}"></a>
    </dd>
</dl>
</th:block>
