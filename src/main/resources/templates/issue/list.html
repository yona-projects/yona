<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${projectView.project.name + ' - ' + #messages.msg(title)}, ${projectView}, 'ISSUE', ~{::listPage})}">
<th:block th:fragment="listPage" th:with="base=${#paths.project(projectView.project.owner, projectView.project.name)}">
<div class="page-wrap-outer">
  <div class="project-page-wrap shell shell-below-banner">
        <th:block th:replace="~{project/menu :: sidebar(${projectView}, 'ISSUE')}"></th:block>
        <div class="shell-main">
        <th:block th:replace="~{project/header :: header(${projectView})}"></th:block><span data-swap-safe hidden></span>
    <th:block th:replace="~{issue/partial-list-wrap :: listWrap}"></th:block>
  
        <link rel="stylesheet" th:href="@{${base + '/issue/labels.css'}}" type="text/css" />
<th:block th:replace="~{common/select2 :: select2}"></th:block>
<th:block th:replace="~{common/calendar :: calendar}"></th:block>
<script type="module" th:inline="javascript">
  import { onPageLeave } from [[@{/assets/javascripts/esm/core/page.js}]];
  /* 본문 교체 때도 모듈 등록이 끝난 뒤 초기화하도록 모듈을 먼저 불러온다(D-136) */
  await import([[@{/assets/javascripts/esm/service/twoColumnMode.js}]]);
  await import([[@{/assets/javascripts/esm/service/showSubtask.js}]]);
  await import([[@{/assets/javascripts/esm/service/issue.List.js}]]);
  $(function(){
    // issue.List
    $yona.loadModule("issue.List");
    // 사이드바 이동으로 이 화면을 떠나면 목록 후처리 처리기를 푼다
    onPageLeave(function () { $(document).off("htmx:afterSwap.issueList"); });

    // ShortcutKey
    yona.ShortcutKey.setKeymapLink({
      "N": /*[[@{${base + '/issueform'}}]]*/ ""
    });
    onPageLeave(function () { yona.ShortcutKey.setKeymapLink({ "N": "" }); });

    var $titlePrefix = $(".title-prefix");
    $titlePrefix
            .on("mouseover", function (e) {
              $(".title-prefix:contains('" + e.target.innerText + "')")
                      .addClass("title-prefix-hover");
            })
            .on("mouseleave", function (e) {
              $titlePrefix.removeClass("title-prefix-hover");
            });
  });
</script>
</div><!--/* .shell-main */-->
    </div>
</div>

</th:block>
</html>
