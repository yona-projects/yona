<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(#{issue.myIssue})}"></head>
<body class="theme-default">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    <div th:replace="~{site/layout :: breadcrumb}"></div>

    <div class="page-wrap-outer">
        <div class="page-wrap">
            <div th:replace="~{common/mySeriesMenuTab :: menu('my_issues')}"></div>
            <div th:replace="~{issue/my_partial_search :: search}"></div>
        </div>
    </div>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<!-- P3-70 라운드4: yona.twoColumnMode.js가 vanilla로 전환되며 jquery.pageslide.js
     (lib/, 미수정) 의존이 제거됨 - 더 이상 로드하지 않는다. -->
<script type="text/javascript" src="/javascripts/service/yona.twoColumnMode.js"></script>
<script type="text/javascript" src="/javascripts/service/yona.showSubtask.js"></script>
<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function(){
      $yona.loadModule("issue.List");

      var $setDefaultLoginPage = $("#setDefaultLoginPage");
      $setDefaultLoginPage.on('click', function(){
          $.post("/user/setDefaultLoginPage?path=" + $setDefaultLoginPage.data("url"))
                  .done(function (data) {
                      $yona.notify("Set to default: " + data.defaultLoginPage, 3000);
                      $setDefaultLoginPage.hide();
                  })
                  .fail(function (data) {
                      $yona.alert("set Default page failed: " + data);
                  });
      });

      $(document).on({
          "pjax:complete": labelTextColorAdjust
      });
      function labelTextColorAdjust() {
          $(".title-cell > .label").each(function () {
              var $this = $(this);
              $this.removeClass("dimgray white")
                      .addClass($yona.getContrastColor($this.css('background-color')))
          });
      }

      labelTextColorAdjust();
  });
</script>
</body>
</html>
