<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(#{issue.myIssue}, 'SITE_HOME', ~{::myListPage})}">
<th:block th:fragment="myListPage">
    <div class="page-wrap-outer">
        <div class="page-wrap">
            <th:block th:replace="~{common/my-series-menu-tab :: mySeriesMenuTab(${menuTab})}"></th:block>

            <th:block th:replace="~{issue/my-partial-search :: mySearch}"></th:block>
        </div>
    </div>
    <script type="text/javascript" th:src="@{/assets/javascripts/lib/jquery.pageslide.js}"></script>
    <script type="text/javascript" th:src="@{/assets/javascripts/service/yona.twoColumnMode.js}"></script>
    <script type="text/javascript" th:src="@{/assets/javascripts/service/yona.showSubtask.js}"></script>
    <script type="text/javascript" th:inline="javascript">
      $(function(){
          $yobi.loadModule("issue.List");

          var $setDefaultLoginPage = $("#setDefaultLoginPage");
          $setDefaultLoginPage.on('click', function(){
              $.post("/-_-api/v1/user/defultLoginPage?path=" + $setDefaultLoginPage.data("url"))
                      .done(function (data) {
                          $yobi.notify("Set to default: " + data.defaultLoginPage, 3000);
                          $setDefaultLoginPage.hide();
                      })
                      .fail(function (data) {
                          $yobi.alert("set Default page failed: " + data);
                      });
          });

          /// label text color adjustment
          $(document).on({
              "pjax:complete": labelTextColorAdjust
          });
          function labelTextColorAdjust() {
              $(".title-cell > .label").each(function () {
                  var $this = $(this);
                  $this.removeClass("dimgray white")
                          .addClass($yobi.getContrastColor($this.css('background-color')))
              });
          }

          labelTextColorAdjust();
      });
    </script>
</th:block>
</html>
