<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko"
      th:with="wikiBase=${'/' + project.owner + '/' + project.name + '/wiki'}">
<head th:replace="~{site/layout :: head(${project.name + ' - Wiki - ' + historyTitle + ' - History'})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'wiki')}"></div>

    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <div class="wiki-page-header" style="margin-bottom:10px;">
                <h2 style="display:inline-block;">
                    <a th:href="${wikiBase + '/' + #uris.escapePath(historyTitle)}" th:text="${historyTitle}">Page title</a>
                    <small th:text="#{wiki.history}">History</small>
                </h2>
            </div>

            <!-- 리비전 목록(P3-42 3번) + 두 리비전을 골라 비교(리비전 간 diff). -->
            <form th:action="${wikiBase + '/_history/' + #uris.escapePath(historyTitle)}" method="get" id="compare-form">
                <table class="table" style="width:100%;">
                    <thead>
                    <tr>
                        <th>A</th>
                        <th>B</th>
                        <th th:text="#{code.commits}">Commit</th>
                        <th th:text="#{code.author}">Author</th>
                        <th th:text="#{wiki.date}">Date</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="commit, iter : ${revisions}">
                        <td><input type="radio" name="revA" th:value="${commit.id}"/></td>
                        <td><input type="radio" name="revB" th:value="${commit.id}" th:checked="${iter.index == 0}"/></td>
                        <td>
                            <code th:text="${commit.shortId}">abcdef1</code>
                            <span th:text="${commit.shortMessage}">commit message</span>
                        </td>
                        <td th:text="${commit.authorName}">author</td>
                        <td th:text="${commit.authorDate != null ? @templateHelper.getDateString(commit.authorDate.toInstant()) : ''}">date</td>
                        <td>
                            <a th:href="${wikiBase + '/_history/' + #uris.escapePath(historyTitle) + '?rev=' + commit.id}" th:text="#{wiki.viewDiff}">Diff</a>
                        </td>
                    </tr>
                    <tr th:if="${revisions == null or revisions.isEmpty()}">
                        <td colspan="6" th:text="#{wiki.noHistory}">No history.</td>
                    </tr>
                    </tbody>
                </table>
                <button type="submit" class="ybtn" th:text="#{wiki.compare}">Compare selected</button>
            </form>

            <!-- 리비전(vs 부모) 또는 두 리비전 사이의 diff. 위키 커밋은 항상 페이지 파일 하나만
                 바꾸므로 커밋 전체 patch가 곧 이 페이지의 변경분이다(WikiServiceImpl.diff/compare). -->
            <div th:if="${diffLines != null}" class="codediff-wrap" style="margin-top:20px;">
                <h4 th:text="${diffLabel}">diff label</h4>
                <pre class="wiki-diff" style="background:#f6f8fa;border:1px solid #d1d5da;padding:10px;overflow:auto;font-family:monospace;font-size:12px;line-height:1.5;"><th:block th:each="line : ${diffLines}"><span
                        th:if="${line.startsWith('+') and not line.startsWith('+++')}" style="display:block;background:#e6ffed;color:#22863a;" th:text="${line}">+added</span><span
                        th:if="${line.startsWith('-') and not line.startsWith('---')}" style="display:block;background:#ffeef0;color:#b31d28;" th:text="${line}">-removed</span><span
                        th:if="${line.startsWith('@@')}" style="display:block;background:#e6ebf1;color:#586069;" th:text="${line}">@@ hunk @@</span><span
                        th:unless="${line.startsWith('+') or line.startsWith('-') or line.startsWith('@@')}" style="display:block;" th:text="${line}"> context</span></th:block></pre>
            </div>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>
<th:block th:replace="~{site/layout :: scripts}"></th:block>
</body>
</html>
