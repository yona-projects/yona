<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-1(decisions.md D-71): OAuth 승인(동의) 화면. 외부 앱이 계정 접근을 요청할 때 사용자가 허용 또는 거부한다
  모델: title, clientName, clientId, cimdHost(CIMD 문서에서 가져온 앱이면 클라이언트 ID의 호스트), homeUrl, ownerLoginId, ownerOrganization(조직이 소유한 앱이면 조직 이름), restrictedOrganizations(내가 속하고 이 앱을 승인하지 않은 제한 조직의 이름), redirectHost, loopback, state, scopes(범위 문자열 목록)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NONE', ~{::consentPage})}">
<th:block th:fragment="consentPage">
<div class="page full">
  <div class="center-wrap tag-line-wrap login">
    <h1 class="title" th:text="#{oauth.consent.heading(${clientName})}"></h1>
    <p class="tag-line" th:if="${ownerLoginId != null}" th:text="#{oauth.consent.by(${ownerLoginId})}"></p>
    <p class="tag-line" th:if="${ownerOrganization != null}" th:text="#{oauth.consent.byOrganization(${ownerOrganization})}"></p>
  </div>
  <div class="login-form-wrap frm-wrap oauth-consent tf-challenge">
    <div id="consent-warnings" class="alert alert-warning" th:if="${loopback or !#lists.isEmpty(restrictedOrganizations)}">
      <p id="org-policy-warning" class="mb-0" th:if="${!#lists.isEmpty(restrictedOrganizations)}" th:text="#{oauth.consent.orgRestricted(${#strings.listJoin(restrictedOrganizations, ', ')})}"></p>
      <p id="loopback-warning" th:classappend="${#lists.isEmpty(restrictedOrganizations)} ? 'mb-0' : 'mt-2 mb-0'" th:if="${loopback}" th:text="#{oauth.consent.loopback}"></p>
    </div>
    <p id="cimd-note" class="text-body-secondary" th:if="${cimdHost != null}" th:text="#{oauth.consent.cimd(${cimdHost})}"></p>
    <p th:text="#{oauth.consent.requests}"></p>
    <ul id="oauth-scopes" class="list-unstyled">
      <li th:each="s : ${scopes}" class="mb-2"><code th:text="${s}"></code> <span class="text-body-secondary" th:text="#{'apiToken.scope.' + ${s}}"></span></li>
    </ul>
    <p class="text-body-secondary" th:if="${!#strings.isEmpty(redirectHost)}" th:text="#{oauth.consent.returnsTo(${redirectHost})}"></p>
    <form id="consent-form" th:action="@{/oauth2/authorize}" method="post">
      <input type="hidden" name="client_id" th:value="${clientId}">
      <input type="hidden" name="state" th:value="${state}">
      <input type="hidden" name="scope" th:each="s : ${scopes}" th:value="${s}">
      <button id="consent-allow" type="submit" class="ybtn ybtn-primary tf-btn" th:text="#{oauth.consent.allow}"></button>
    </form>
    <form id="consent-deny-form" th:action="@{/oauth2/authorize}" method="post">
      <input type="hidden" name="client_id" th:value="${clientId}">
      <input type="hidden" name="state" th:value="${state}">
      <button id="consent-deny" type="submit" class="ybtn tf-btn" th:text="#{oauth.consent.deny}"></button>
    </form>
    <p class="text-body-secondary" th:text="#{oauth.consent.revokeNote}"></p>
  </div>
</div>
</th:block>
</html>
