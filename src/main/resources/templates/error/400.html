<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(#{error.badrequest})}">
</head>
<body class="theme-default">
<div id="main" class="main">
  <div th:replace="~{site/layout :: gnb}"></div>
  <div class="page-wrap-outer">
      <div class="project-page-wrap">
          <div class="error-wrap">
              <i class="ico ico-err2"></i>
              <!-- messageKey는 각 컨트롤러가 명시적으로 채우는 문구용이고, message는
                   ResponseStatusException(...)이 BasicErrorController의 /error 자동 포워딩을 거쳐
                   넘어오는 원인 텍스트다. spring.web.error.include-message: always로 모델에는
                   실렸지만 이 템플릿이 messageKey만 읽어 화면에 노출되지 않던 문제라, messageKey가
                   없을 때만 message로 폴백한다. -->
              <p th:text="${messageKey != null} ? #{__${messageKey}__} : (${message} != null ? ${message} : #{error.badrequest})">잘못된 요청입니다.</p>
              <a href="/" class="ybtn ybtn-info" th:text="#{menu.home}">홈</a>
          </div>
      </div>
  </div>
  <footer th:replace="~{site/layout :: footer}"></footer>
</div>
<th:block th:replace="~{site/layout :: scripts}"></th:block>
</body>
</html>
