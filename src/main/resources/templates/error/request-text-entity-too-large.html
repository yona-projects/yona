<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(#{error.tooLargeText.title}, 'SITE_HOME', ~{::tooLargePage})}">
<th:block th:fragment="tooLargePage">
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="error-wrap">
            <i class="ico ico-err2"></i>
            <p th:text="#{error.tooLargeText.title}"></p>
            <p th:text="#{error.tooLargeText.limit(${site.parsersTextMaxLength})}"></p>
            <p th:if="${currentUser.siteManager}" th:text="#{error.tooLargeText.admin}"></p>
        </div>
    </div>
</div>
</th:block>
</html>
