<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  이식 원본: app/views/project/setting.scala.html
  모델: title, projectView, branches(기본 브랜치 선택지), defaultBranchName, oldPlaceHtml, maxReviewerCount
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::settingPage})}">
<th:block th:fragment="settingPage" th:with="project=${projectView.project}, git=${projectView.git}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${requestPath})}"></th:block>

        <form id="saveSetting" method="post" th:action="@{/{owner}/{name}/setting(owner=${project.owner},name=${project.name})}" enctype="multipart/form-data" class="nm">
            <div class="bubble-wrap gray" style="overflow: visible">
                <input type="hidden" name="id" th:value="${project.id}">
                <input type="hidden" name="watchingCount" th:value="${projectView.watchingCount}">
                <div class="box-wrap top clearfix frm-wrap" style="padding-top:20px;">
                    <div class="setting-box left">
                        <div class="logo-wrap" th:style="'background-image:url(\'' + ${projectView.logoUrl} + '\')'"></div>
                        <div class="logo-desc">
                            <ul class="unstyled descs">
                                <li><strong th:text="#{project.logo}"></strong></li>
                                <li><th:block th:text="#{project.logo.type}"></th:block> <span class="point">bmp, jpg, gif, png</span></li>
                                <li><th:block th:text="#{project.logo.maxFileSize}"></th:block> <span class="point">5MB</span></li>
                                <li>
                                    <div class="btn-wrap">
                                        <div class="nbtn medium white fake-file-wrap">
                                            <i class="yobicon-upload"></i> <th:block th:text="#{button.upload}"></th:block><!--
                                        --> <input id="logoPath" type="file" class="file" name="logoPath" accept="image/*">
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <dl class="setting-box right">
                        <dt>
                            <label for="project-name" th:text="#{project.name.placeholder}"></label>
                        </dt>
                        <dd>
                            <input id="project-name" type="text" name="name" data-trigger="popover" th:attr="data-content=#{project.transfer.description6}" data-placement="left" maxlength="250" th:value="${project.name}">
                            <th:block th:if="${oldPlaceHtml != null}" th:utext="${oldPlaceHtml}"></th:block><br/>
                        </dd>
                        <dt>
                            <label for="project-desc" th:text="#{project.description.placeholder}"></label>
                        </dt>
                        <dd>
                            <textarea id="project-desc" name="overview" maxlength="250" class="textarea" th:text="${project.overview}"></textarea>
                        </dd>
                    </dl>
                </div>

                <div class="box-wrap middle">
                    <div class="cu-label" th:text="#{project.shareOption}"></div>
                    <div class="cu-desc">
                        <input name="projectScope" type="radio" class="radio-btn" id="public" value="PUBLIC" th:checked="${project.isPublic()}"><label for="public" class="bg-radiobtn label-public" th:text="#{project.public}"></label>
                        <th:block th:if="${project.hasGroup()}">
                        <input name="projectScope" type="radio" class="radio-btn" id="protected" value="PROTECTED" th:checked="${project.isProtected()}"><label for="protected" class="bg-radiobtn label-protected" th:text="#{project.protected}"></label>
                        </th:block>
                        <input name="projectScope" type="radio" class="radio-btn" id="private" value="PRIVATE" th:checked="${project.isPrivate()}"><label for="private" class="bg-radiobtn label-private" th:text="#{project.private}"></label>
                        <span class="note" th:text="#{project.private.notice}"></span>
                    </div>
                </div>
            <th:block th:if="${git}">
                <div class="box-wrap middle">
                    <div class="cu-label" th:text="#{issue.template}"></div>
                    <div class="cu-desc">
                        <a th:href="@{/{owner}/{name}/postform(owner=${project.owner},name=${project.name},issueTemplate=true)}" class="ybtn" target="_blank" th:text="#{issue.template.edit}"></a>
                    </div>
                </div>
            </th:block>
                <div class="box-wrap middle">
                    <div class="cu-label" th:text="#{project.codeAccessible}"></div>
                    <div class="cu-desc">
                        <input name="isCodeAccessibleMemberOnly" type="radio" id="codeAccessibleMemberOnly" class="radio-btn" value="true" th:checked="${project.isCodeAccessibleMemberOnly == true}"><label for="codeAccessibleMemberOnly" class="bg-radiobtn label-public" th:text="#{button.yes}"></label>
                        <input name="isCodeAccessibleMemberOnly" type="radio" id="codeAccessibleAnyone" class="radio-btn" value="false" th:checked="${project.isCodeAccessibleMemberOnly != true}"><label for="codeAccessibleAnyone" class="bg-radiobtn label-private" th:text="#{button.no}"></label>
                        <span class="note"></span>
                    </div>
                </div>

                <th:block th:if="${git}">
                <div class="box-wrap middle reviewer-count-wrap" id="reviewerCountSettingPanel" style="" th:styleappend="${projectView.menuSetting.code != true} ? 'display:none;'">
                    <div class="cu-label vmiddle" th:text="#{project.reviewer.count}"></div>
                    <div class="cu-desc">
                        <!--/* 새 커밋이 올라오면 오래된 승인을 해제할지(추가 항목 X-12, decisions.md D-35 5번). v1.6은 항상 해제했으므로 기본은 켬이다 */-->
                        <div class="mt10">
                            <span class="note" th:text="#{project.reviewer.dismiss.stale}"></span>
                            <input name="isDismissingStaleApprovals" type="radio" class="radio-btn" id="dismissStaleEnable" value="true" th:checked="${project.isDismissingStaleApprovals != false}">
                            <label for="dismissStaleEnable" class="bg-radiobtn label-public" th:text="#{project.reviewer.count.enable}"></label>
                            <input name="isDismissingStaleApprovals" type="radio" class="radio-btn" id="dismissStaleDisable" value="false" th:checked="${project.isDismissingStaleApprovals == false}">
                            <label for="dismissStaleDisable" class="bg-radiobtn label-private" th:text="#{project.reviewer.count.disable}"></label>
                        </div>
                    </div>
                </div>

                <!--/* 풀 리퀘스트 병합 방식(추가 항목 X-28, decisions.md D-41): 허용할 방식과 기본 방식. 체크하지 않은 방식은 `false`로 보낸다 */-->
                <div class="box-wrap middle" id="mergeMethodSettingPanel">
                    <div class="cu-label vmiddle" th:text="#{project.merge.title}"></div>
                    <div class="cu-desc">
                        <th:block th:each="m : ${ {'allowMergeCommit', 'allowSquashMerge', 'allowRebaseMerge'} }">
                            <label class="checkbox inline">
                                <input type="checkbox" th:name="${m}" value="true"
                                       th:checked="${m == 'allowMergeCommit' ? project.allowMergeCommit != false : (m == 'allowSquashMerge' ? project.allowSquashMerge == true : project.allowRebaseMerge == true)}">
                                <th:block th:text="#{'project.merge.' + ${m}}"></th:block>
                            </label>
                            <!--/* 요청 파라미터는 첫 값을 읽으므로 체크하면 `true`가 앞서도록 숨은 값은 체크박스 뒤에 둔다 */-->
                            <input type="hidden" th:name="${m}" value="false">
                        </th:block>
                        <div class="mt10">
                            <span class="note" th:text="#{project.merge.default}"></span>
                            <th:block th:each="m : ${ {'merge', 'squash', 'rebase'} }">
                                <input name="defaultMergeMethod" type="radio" class="radio-btn" th:id="'defaultMergeMethod-' + ${m}" th:value="${m}" th:checked="${project.defaultMergeMethodOrFirst().code == m}">
                                <label th:for="'defaultMergeMethod-' + ${m}" class="bg-radiobtn label-public" th:text="#{'project.merge.' + ${m}}"></label>
                            </th:block>
                        </div>
                        <span class="note" th:text="#{project.merge.description}"></span>
                    </div>
                </div>

                <div class="box-wrap middle" id="defaultBranceSettingPanel" style="" th:styleappend="${projectView.menuSetting.code != true} ? 'display:none;'">
                    <div class="cu-label vmiddle" th:text="#{code.branches.defaultBranch}"></div>
                    <div class="cu-desc">
                        <select id="project-default-branch" name="defaultBranch"
                                data-toggle="select2" data-format="branch" data-dropdown-css-class="branches" style="min-width: 220px;">
                            <option th:each="branchName : ${branches}" th:value="${branchName}"
                                    th:selected="${branchItemNames.get(branchName) == defaultBranchName}"
                                    th:text="${branchName}">
                            </option>
                        </select>
                    </div>
                </div>
                </th:block>

                <div class="box-wrap middle">
                    <div class="cu-label vmiddle" th:text="#{project.menu.setting}"></div>
                    <div class="cu-desc">
                        <label for="menuSettingCode" class="bg-radiobtn label-public inline-list">
                            <input type="checkbox" class="radio-btn" id="menuSettingCode" name="code" value="true" th:checked="${projectView.menuSetting.code == true}">
                            <th:block th:text="#{menu.code}"></th:block>
                        </label>
                        <label for="menuSettingIssue" class="bg-radiobtn label-public inline-list">
                            <input type="checkbox" class="radio-btn" id="menuSettingIssue" name="issue" value="true" th:checked="${projectView.menuSetting.issue == true}">
                            <th:block th:text="#{menu.issue}"></th:block>
                        </label>
                        <label th:if="${git}" for="menuSettingPullRequest" class="bg-radiobtn label-public inline-list">
                            <input type="checkbox" class="radio-btn" id="menuSettingPullRequest" name="pullRequest" value="true" th:checked="${projectView.menuSetting.pullRequest == true}">
                            <th:block th:text="#{menu.pullRequest}"></th:block>
                        </label>
                        <label for="menuSettingReview" class="bg-radiobtn label-public inline-list">
                            <input type="checkbox" class="radio-btn" id="menuSettingReview" name="review" value="true" th:checked="${projectView.menuSetting.review == true}">
                            <th:block th:text="#{menu.review}"></th:block>
                        </label>
                        <label for="menuSettingMilestone" class="bg-radiobtn label-public inline-list">
                            <input type="checkbox" class="radio-btn" id="menuSettingMilestone" name="milestone" value="true" th:checked="${projectView.menuSetting.milestone == true}">
                            <th:block th:text="#{milestone}"></th:block>
                        </label>
                        <label for="menuSettingBoard" class="bg-radiobtn label-public inline-list">
                            <input type="checkbox" class="radio-btn" id="menuSettingBoard" name="board" value="true" th:checked="${projectView.menuSetting.board == true}">
                            <th:block th:text="#{menu.board}"></th:block>
                        </label>
                    </div>
                </div>
            </div>

            <div class="box-wrap bottom">
                <button id="save" type="submit" class="ybtn ybtn-success" th:text="#{button.save}"></button>
            </div>
        </form>

    <!--/* 브랜치 보호 규칙(추가 항목 X-32, decisions.md D-42). 규칙을 만든 브랜치로 가는 풀 리퀘스트만 승인 수로 막는다. 설정 폼과 별개의 요청이라 폼 밖에 둔다 */-->
    <div class="box-wrap middle" id="branchProtectionPanel" th:if="${git}" style="margin-top:20px;">
        <div class="cu-label vmiddle" th:text="#{project.protection.title}"></div>
        <div class="cu-desc">
            <p class="note" th:text="#{project.protection.description}"></p>
            <p class="note" th:if="${#lists.isEmpty(protectionRules)}" th:text="#{project.protection.none}"></p>
            <ul class="unstyled" th:unless="${#lists.isEmpty(protectionRules)}">
                <li th:each="rule : ${protectionRules}" style="margin-bottom:6px;">
                    <strong th:text="${rule.pattern}"></strong>
                    <span class="note ml10" th:text="#{project.protection.approvals.count(${rule.requiredApprovals})}"></span>
                    <span class="note ml10" th:if="${rule.enforceAdmins == true}" th:text="#{project.protection.enforce.admins}"></span>
                    <form class="protection-delete" method="post" style="display:inline; margin-left:10px;" th:action="@{/{owner}/{name}/setting/protections/{id}/delete(owner=${project.owner},name=${project.name},id=${rule.id})}">
                        <button type="submit" class="ybtn ybtn-small" th:text="#{project.protection.delete}"></button>
                    </form>
                </li>
            </ul>
            <form id="branchProtectionForm" method="post" th:action="@{/{owner}/{name}/setting/protections(owner=${project.owner},name=${project.name})}">
                <input type="text" name="pattern" maxlength="255" style="width:220px;" th:placeholder="#{project.protection.pattern}">
                <input type="number" name="requiredApprovals" min="1" max="100" value="1" style="width:70px;" th:title="#{project.protection.approvals}">
                <label class="checkbox inline"><input type="checkbox" name="enforceAdmins" value="true"> <th:block th:text="#{project.protection.enforce.admins}"></th:block></label>
                <button type="submit" class="ybtn ybtn-success" th:text="#{project.protection.save}"></button>
            </form>
        </div>
    </div>
    </div>
</div>

<th:block th:replace="~{common/select2 :: select2}"></th:block>

<script type="text/javascript">
    $(document).ready(function(){
        $yobi.loadModule("project.Setting");

        $("#project-name").popover();
    });
</script>
</th:block>
</html>
