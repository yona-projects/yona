<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(${project.name} + ' - ' + #{menu.admin})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    
    <!-- Yona 원본 프로젝트 헤더 및 프로젝트 메뉴 탑재 -->
    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'setting')}"></div>

    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <!-- 설정 서브 메뉴 탭 -->
            <div th:replace="~{project/setting_menu :: menu(${project}, 'setting')}"></div>

            <form id="saveSetting" method="post" th:action="@{/api/projects/{id}(id=${project.id})}" enctype="multipart/form-data" class="nm" onsubmit="return false">
                <div class="bubble-wrap gray" style="overflow: visible">
                    <input type="hidden" name="id" th:value="${project.id}">
                    
                    <div class="box-wrap top clearfix frm-wrap" style="padding-top:20px;">
                        <div class="setting-box left">
                            <div class="logo-wrap" th:style="'background-image:url(/projects/' + ${project.id} + '/logo)'"></div>
                            <div class="logo-desc">
                                <ul class="unstyled descs">
                                    <li><strong th:text="#{project.logo}">Project Logo</strong></li>
                                    <li><span th:text="#{project.logo.type}">Type</span> <span class="point">bmp, jpg, gif, png</span></li>
                                    <li><span th:text="#{project.logo.maxFileSize}">Max File Size</span> <span class="point">5MB</span></li>
                                    <li>
                                        <div class="btn-wrap">
                                            <div class="nbtn medium white fake-file-wrap">
                                                <i class="yobicon-upload"></i> <span th:text="#{button.upload}">Upload</span>
                                                <input id="logoPath" type="file" class="file" name="logoPath" accept="image/*">
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <dl class="setting-box right">
                            <dt>
                                <label for="project-name" th:text="#{project.name.placeholder}">Project Name</label>
                            </dt>
                            <dd>
                                <input id="project-name" type="text" name="name" data-trigger="popover" th:data-content="#{project.transfer.description6}" data-placement="left" maxlength="250" th:value="${project.name}">
                            </dd>
                            <dt>
                                <label for="project-desc" th:text="#{project.description.placeholder}">Description</label>
                            </dt>
                            <dd>
                                <textarea id="project-desc" name="overview" maxlength="250" class="textarea" th:text="${project.overview}"></textarea>
                            </dd>
                        </dl>
                    </div>

                    <div class="box-wrap middle">
                        <div class="cu-label" th:text="#{project.shareOption}">Share Option</div>
                        <div class="cu-desc">
                            <input name="projectScope" type="radio" class="radio-btn" id="public" value="PUBLIC" th:checked="${project.projectScope == T(com.github.yonaprojects.yona.domain.project.ProjectScope).PUBLIC}">
                            <label for="public" class="bg-radiobtn label-public" th:text="#{project.public}">Public</label>
                            
                            <input name="projectScope" type="radio" class="radio-btn" id="private" value="PRIVATE" th:checked="${project.projectScope == T(com.github.yonaprojects.yona.domain.project.ProjectScope).PRIVATE}">
                            <label for="private" class="bg-radiobtn label-private" th:text="#{project.private}">Private</label>
                            
                            <span class="note" th:text="#{project.private.notice}">Notice</span>
                        </div>
                    </div>

                    <div class="box-wrap middle">
                        <div class="cu-label" th:text="#{project.codeAccessible}">Code Accessible</div>
                        <div class="cu-desc">
                            <input name="isCodeAccessibleMemberOnly" type="radio" id="codeAccessibleMemberOnly" class="radio-btn" value="true" th:checked="${project.isCodeAccessibleMemberOnly}">
                            <label for="codeAccessibleMemberOnly" class="bg-radiobtn label-public" th:text="#{button.yes}">Yes</label>
                            
                            <input name="isCodeAccessibleMemberOnly" type="radio" id="codeAccessibleAnyone" class="radio-btn" value="false" th:checked="${!project.isCodeAccessibleMemberOnly}">
                            <label for="codeAccessibleAnyone" class="bg-radiobtn label-private" th:text="#{button.no}">No</label>
                        </div>
                    </div>

                    <!-- legacy project/setting.scala.html:95의 style="@if(!project.menuSetting.code){display:none;}"
                         대응 - "코드" 메뉴가 꺼져있으면 이 패널 자체가 처음부터 숨겨져 있어야 한다. -->
                    <div th:if="${(project.vcs ?: 'GIT').toUpperCase() == 'GIT'}" class="box-wrap middle reviewer-count-wrap" id="reviewerCountSettingPanel" th:style="${!project.isCodeEnabled} ? 'display:none;' : ''">
                        <div class="cu-label vmiddle" th:text="#{project.reviewer.count}">Reviewer Count</div>
                        <div class="cu-desc">
                            <input name="isUsingReviewerCount" data-toggle="reviewer-count" data-action="show" type="radio" class="radio-btn" id="reviewerCountEnable" value="true" th:checked="${project.isUsingReviewerCount}">
                            <label for="reviewerCountEnable" class="bg-radiobtn label-public" th:text="#{project.reviewer.count.enable}">Enable</label>

                            <input name="isUsingReviewerCount" data-toggle="reviewer-count" data-action="hide" type="radio" class="radio-btn" id="reviewerCountDisable" value="false" th:checked="${!project.isUsingReviewerCount}">
                            <label for="reviewerCountDisable" class="bg-radiobtn label-private" th:text="#{project.reviewer.count.disable}">Disable</label>

                            <!-- legacy project/setting.scala.html:102의 class="hide"+data-value 대응 -
                                 초기 표시 여부는 project.isUsingReviewerCount를 따르고, 이후는 위
                                 라디오 버튼 클릭(data-toggle="reviewer-count")이 show()/hide()로 토글한다. -->
                            <div id="welReviewerCount" th:data-value="${project.isUsingReviewerCount}" th:class="${project.isUsingReviewerCount} ? '' : 'hide'" style="margin-top: 10px;">
                                <label for="defaultReviewerCount" style="font-weight: normal; margin-right: 10px;" th:text="#{project.reviewer.count.description}">Reviewer Count:</label>
                                <select id="defaultReviewerCount" name="defaultReviewerCount" class="form-control" style="display: inline-block; width: 100px;">
                                    <option th:each="num : ${#numbers.sequence(1, 10)}" th:value="${num}" th:text="${num}" th:selected="${project.defaultReviewerCount == num}"></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- id의 오타(Brance)는 legacy 그대로 유지 - yona.project.Setting.js가
                         getElementById("defaultBranceSettingPanel")로 이 오타를 그대로 참조하므로,
                         "정상 철자"로 고치면 패널이 항상 안 숨겨지는 버그가 생긴다. -->
                    <div th:if="${(project.vcs ?: 'GIT').toUpperCase() == 'GIT' and branches != null and !branches.isEmpty()}" class="box-wrap middle" id="defaultBranceSettingPanel">
                        <div class="cu-label vmiddle" th:text="#{code.branches.defaultBranch}">Default Branch</div>
                        <div class="cu-desc">
                            <select id="project-default-branch" name="defaultBranch" style="min-width: 220px;">
                                <option th:each="branch : ${branches}" th:value="${branch}" th:text="${branch}" th:selected="${branch == defaultBranch}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="box-wrap middle">
                        <div class="cu-label vmiddle" th:text="#{project.menu.setting}">Menu Setting</div>
                        <div class="cu-desc">
                            <label for="menuSettingCode" class="bg-radiobtn label-public inline-list" style="margin-right: 15px;">
                                <input type="checkbox" class="radio-btn" id="menuSettingCode" name="code" value="true" th:checked="${project.isCodeEnabled}">
                                <span th:text="#{menu.code}">Code</span>
                            </label>
                            <label for="menuSettingIssue" class="bg-radiobtn label-public inline-list" style="margin-right: 15px;">
                                <input type="checkbox" class="radio-btn" id="menuSettingIssue" name="issue" value="true" th:checked="${project.isIssueEnabled}">
                                <span th:text="#{menu.issue}">Issue</span>
                            </label>
                            <label th:if="${(project.vcs ?: 'GIT').toUpperCase() == 'GIT'}" for="menuSettingPullRequest" class="bg-radiobtn label-public inline-list" style="margin-right: 15px;">
                                <input type="checkbox" class="radio-btn" id="menuSettingPullRequest" name="pullRequest" value="true" th:checked="${project.isPullRequestEnabled}">
                                <span th:text="#{menu.pullRequest}">Pull Request</span>
                            </label>
                            <label for="menuSettingReview" class="bg-radiobtn label-public inline-list" style="margin-right: 15px;">
                                <input type="checkbox" class="radio-btn" id="menuSettingReview" name="review" value="true" th:checked="${project.isReviewEnabled}">
                                <span th:text="#{menu.review}">Review</span>
                            </label>
                            <label for="menuSettingMilestone" class="bg-radiobtn label-public inline-list" style="margin-right: 15px;">
                                <input type="checkbox" class="radio-btn" id="menuSettingMilestone" name="milestone" value="true" th:checked="${project.isMilestoneEnabled}">
                                <span th:text="#{milestone}">Milestone</span>
                            </label>
                            <label for="menuSettingBoard" class="bg-radiobtn label-public inline-list" style="margin-right: 15px;">
                                <input type="checkbox" class="radio-btn" id="menuSettingBoard" name="board" value="true" th:checked="${project.isBoardEnabled}">
                                <span th:text="#{menu.board}">Board</span>
                            </label>
                            <label for="menuSettingWiki" class="bg-radiobtn label-public inline-list" style="margin-right: 15px;">
                                <input type="checkbox" class="radio-btn" id="menuSettingWiki" name="wiki" value="true" th:checked="${project.isWikiEnabled}">
                                <span th:text="#{menu.wiki}">Wiki</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="box-wrap bottom">
                    <button id="save" type="submit" class="ybtn ybtn-success" th:text="#{button.save}">Save</button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
    <div th:replace="~{site/layout :: scripts}"></div>
</div>

<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", function() {
      // legacy yobi.project.Setting.js._initVar()의 이름 검증 규칙 - 클라이언트 사이드에만
      // 있던 검증이라(서버는 예약어만 별도로 재검사) 그대로 재현한다.
      var rxPrjName = /^[0-9A-Za-z-_\.가-힣]+$/;
      var aReservedWords = [".", "..", ".git"];

      // legacy yobi.project.Setting.js._onChangeLogoPath() 대응 - 이미지 파일 검증 후 업로드.
      // 원래 로고를 받는 컨트롤러가 없어 완전히 먹통이었으므로 /api/projects/{id}/logo를 신설.
      var elLogoPath = document.getElementById("logoPath");
      if (elLogoPath) {
          elLogoPath.addEventListener("change", function(){
              if ($yona.isImageFile(elLogoPath) === false) {
                  $yona.showAlert(Messages("project.logo.alert"));
                  elLogoPath.value = "";
                  return;
              }

              var formData = new FormData();
              formData.append("logoPath", elLogoPath.files[0]);
              fetch("/api/projects/" + [[${project.id}]] + "/logo", {
                  method: "POST",
                  body: formData
              }).then(function(response) {
                  if (response.ok) {
                      window.location.reload();
                  } else {
                      return response.text().then(function(text) {
                          $yona.showAlert("로고 업로드 실패: " + text);
                          elLogoPath.value = "";
                      });
                  }
              });
          });
      }

      // legacy yobi.project.Setting.js._onClickMenuSettingCode/_onClickMenuSettingPullRequest/
      // _onClickMenuSettingReview의 메뉴 종속관계 - "코드"를 끄면 PR/코드리뷰도 강제로
      // 꺼지고 관련 패널이 숨겨지며, PR/코드리뷰를 켜면 "코드"가 강제로 켜진다.
      var elMenuSettingCode = document.getElementById("menuSettingCode");
      var elMenuSettingPullRequest = document.getElementById("menuSettingPullRequest");
      var elMenuSettingReview = document.getElementById("menuSettingReview");
      var elReviewerCountDisable = document.getElementById("reviewerCountDisable");
      var elReviewerCountSettingPanel = document.getElementById("reviewerCountSettingPanel");
      var elDefaultBranceSettingPanel = document.getElementById("defaultBranceSettingPanel");
      var elSubMenuProjectChangeVCS = document.getElementById("subMenuProjectChangeVCS");

      if (elMenuSettingCode) {
          elMenuSettingCode.addEventListener("click", function(){
              if (!elMenuSettingCode.checked) {
                  elMenuSettingCode.checked = false;
                  if (elMenuSettingPullRequest) { elMenuSettingPullRequest.checked = false; }
                  if (elMenuSettingReview) { elMenuSettingReview.checked = false; }
                  if (elReviewerCountDisable) { elReviewerCountDisable.click(); }

                  if (elReviewerCountSettingPanel) { elReviewerCountSettingPanel.style.display = "none"; }
                  if (elDefaultBranceSettingPanel) { elDefaultBranceSettingPanel.style.display = "none"; }
                  if (elSubMenuProjectChangeVCS) { elSubMenuProjectChangeVCS.style.display = "none"; }
              }
          });
      }
      if (elMenuSettingPullRequest) {
          elMenuSettingPullRequest.addEventListener("click", function(){
              if (elMenuSettingPullRequest.checked) {
                  if (elMenuSettingCode) { elMenuSettingCode.checked = true; }
                  if (elReviewerCountSettingPanel) { elReviewerCountSettingPanel.style.display = "block"; }
              } else {
                  if (elReviewerCountSettingPanel) { elReviewerCountSettingPanel.style.display = "none"; }
                  if (elReviewerCountDisable) { elReviewerCountDisable.click(); }
              }
          });
      }
      if (elMenuSettingReview) {
          elMenuSettingReview.addEventListener("click", function(){
              if (elMenuSettingReview.checked) {
                  if (elMenuSettingCode) { elMenuSettingCode.checked = true; }
              }
          });
      }

      // legacy yobi.project.Setting.js._toggleReviewerCount() 대응 - Enable/Disable 라디오에
      // 따라 리뷰어 수 select를 보이거나 숨긴다.
      var elReviewerCountWrap = document.querySelector(".reviewer-count-wrap");
      var elWelReviewerCount = document.getElementById("welReviewerCount");
      if (elReviewerCountWrap) {
          elReviewerCountWrap.addEventListener("click", function(event){
              var matched = event.target.closest("[data-toggle='reviewer-count']");
              if (!matched || !elReviewerCountWrap.contains(matched)) { return; }
              var sAction = matched.dataset.action;
              if (!elWelReviewerCount) { return; }
              if (sAction === "show") { elWelReviewerCount.style.display = "block"; }
              else if (sAction === "hide") { elWelReviewerCount.style.display = "none"; }
          });
      }
      if (elWelReviewerCount && elWelReviewerCount.dataset.value === "true") {
          elWelReviewerCount.style.display = "block";
      }

      var elSaveSetting = document.getElementById("saveSetting");
      if (elSaveSetting) {
          elSaveSetting.addEventListener("submit", function(e) {
              e.preventDefault();
              var projectId = [[${project.id}]];
              var elProjectDesc = document.getElementById("project-desc");
              var elProjectName = document.getElementById("project-name");
              var overview = elProjectDesc ? elProjectDesc.value : undefined;
              var name = elProjectName ? elProjectName.value : undefined;

              // legacy yobi.project.Setting.js._onClickBtnSave() 대응 - 형식/예약어 검증.
              if (!rxPrjName.test(name)) {
                  $yona.showAlert(Messages("project.name.alert"));
                  return;
              }
              if (aReservedWords.indexOf(name) >= 0) {
                  $yona.showAlert(Messages("project.name.reserved.alert"));
                  return;
              }
              var elProjectScopeChecked = document.querySelector("input[name='projectScope']:checked");
              var elCodeAccessibleChecked = document.querySelector("input[name='isCodeAccessibleMemberOnly']:checked");
              var projectScope = elProjectScopeChecked ? elProjectScopeChecked.value : undefined;
              var isCodeAccessibleMemberOnly = (elCodeAccessibleChecked ? elCodeAccessibleChecked.value : undefined) === "true";

              var isUsingReviewerCount = false;
              var defaultReviewerCount = 1;
              if (document.getElementById("reviewerCountEnable")) {
                  var elUsingReviewerCountChecked = document.querySelector("input[name='isUsingReviewerCount']:checked");
                  var elDefaultReviewerCount = document.getElementById("defaultReviewerCount");
                  isUsingReviewerCount = (elUsingReviewerCountChecked ? elUsingReviewerCountChecked.value : undefined) === "true";
                  defaultReviewerCount = parseInt(elDefaultReviewerCount ? elDefaultReviewerCount.value : undefined);
              }
              var elProjectDefaultBranch = document.getElementById("project-default-branch");
              var defaultBranch = elProjectDefaultBranch ? elProjectDefaultBranch.value : undefined;

              var isCodeEnabled = !!(elMenuSettingCode && elMenuSettingCode.checked);
              var elMenuSettingIssue = document.getElementById("menuSettingIssue");
              var isIssueEnabled = !!(elMenuSettingIssue && elMenuSettingIssue.checked);
              var isPullRequestEnabled = !!(elMenuSettingPullRequest && elMenuSettingPullRequest.checked);
              var isReviewEnabled = !!(elMenuSettingReview && elMenuSettingReview.checked);
              var elMenuSettingMilestone = document.getElementById("menuSettingMilestone");
              var isMilestoneEnabled = !!(elMenuSettingMilestone && elMenuSettingMilestone.checked);
              var elMenuSettingBoard = document.getElementById("menuSettingBoard");
              var isBoardEnabled = !!(elMenuSettingBoard && elMenuSettingBoard.checked);
              var elMenuSettingWiki = document.getElementById("menuSettingWiki");
              var isWikiEnabled = !!(elMenuSettingWiki && elMenuSettingWiki.checked);

              var requestData = {
                  name: name,
                  overview: overview,
                  projectScope: projectScope,
                  isCodeAccessibleMemberOnly: isCodeAccessibleMemberOnly,
                  isUsingReviewerCount: isUsingReviewerCount,
                  defaultReviewerCount: defaultReviewerCount,
                  defaultBranch: defaultBranch,
                  isCodeEnabled: isCodeEnabled,
                  isIssueEnabled: isIssueEnabled,
                  isPullRequestEnabled: isPullRequestEnabled,
                  isReviewEnabled: isReviewEnabled,
                  isMilestoneEnabled: isMilestoneEnabled,
                  isBoardEnabled: isBoardEnabled,
                  isWikiEnabled: isWikiEnabled
              };

              fetch('/api/projects/' + projectId, {
                  method: 'PUT',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(requestData)
              }).then(function(response) {
                  if (response.ok) {
                      alert("설정이 성공적으로 저장되었습니다.");
                      window.location.reload();
                  } else {
                      return response.text().then(function(text) {
                          alert("저장 실패: " + text);
                      });
                  }
              });
          });
      }
  });
</script>
</body>
</html>
