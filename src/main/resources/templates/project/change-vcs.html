<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::changeVcsPage})}">
<th:block th:fragment="changeVcsPage" th:with="project=${projectView.project}, nextVcs=${projectView.project.nextVcs()}, projectBase=${#paths.project(projectView.project.owner, projectView.project.name)}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${projectBase + '/changeVCS'})}"></th:block>
        <div class="bubble-wrap gray wp">
            <div class="">
                <h3><th:block th:text="${project.vcs}"></th:block> <i class="yobicon-right-2 vmiddle"></i> <span class="next-vcs" th:text="${nextVcs}"></span></h3>
                <div class="cu-desc">
                    <!--/* 바꿀 수 있는 종류가 둘 이상일 때만 보인다(Mercurial 도입, D-86 6번). 기본 선택은 v1.6처럼 번갈아 바꾸는 종류이다 */-->
                    <p th:if="${#lists.size(targets) > 1}">
                        <label for="targetVcs" th:text="#{project.changeVCS.target}"></label>
                        <select id="targetVcs" name="targetVcs" class="form-select d-inline-block w-auto ms-2">
                            <option th:each="t : ${targets}" th:value="${t}" th:text="${t}" th:selected="${t == nextVcs}"></option>
                        </select>
                    </p>
                    <ul>
                        <li class="notice"><strong class="vcs-description" th:text="#{project.changeVCS.description1(${nextVcs})}"></strong></li>
                        <li class="notice"><strong th:text="#{project.changeVCS.description2}"></strong></li>
                    </ul>
                    <p>
                        <input id="acceptChangeVCS" type="checkbox" class="checkbox form-check-input" autocomplete="off">
                        <label for="acceptChangeVCS" class="bg-checkbox label-agreement" th:text="#{project.changeVCS.accept}"></label>
                    </p>
                </div>
            </div>
        </div>
        <div class="box-wrap bottom">
            <a id="btnChangeVCS" href="#alertChangeVCS" class="ybtn ybtn-danger" data-bs-toggle="modal">
                <i class="yobicon-database"></i> <th:block th:text="#{project.changeVCS.this}"></th:block>
            </a>
        </div>

        <!--/* Confirm to transfer project */-->
        <div id="alertChangeVCS" class="modal"><div class="modal-dialog"><div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <h3 class="vcs-requestion" th:text="#{project.changeVCS.requestion(${nextVcs})}"></h3>
            </div>
            <div class="modal-body">
                <p th:text="#{project.changeVCS.description2}"></p>
                <p th:text="#{project.changeVCS.reaccept}"></p>
            </div>
            <div class="modal-footer">
                <button id="btnChangeVCSExec" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}"></button>
                <button type="button" class="ybtn" data-bs-dismiss="modal" th:text="#{button.no}"></button>
            </div>
        </div></div></div>
        <!--/* // -- // */-->
    </div>
</div>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        $yona.loadModule("project.ChangeVCS", {
            "sTransferURL": [[${projectBase + '/changeVCS'}]],
            "oTexts": [[${texts}]]
        });
    });
</script>
</th:block>
</html>
