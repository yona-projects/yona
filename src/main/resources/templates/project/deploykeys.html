<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-3(decisions.md D-66): 배포 키 목록 화면. 행 동작은 삭제 버튼 하나뿐이다(편집과 상세 없음). 추가는 별도 화면(deploykey-new.html)에서 한다
  모델: title, projectView, keys(DeployKeyRow 목록)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::deployKeysPage})}">
<th:block th:fragment="deployKeysPage" th:with="base=${#paths.project(projectView.project.owner, projectView.project.name)}">
<div class="page-wrap-outer">
    <div class="project-page-wrap shell shell-below-banner" id="deployKeysPage">
        <th:block th:replace="~{project/menu :: settingsSidebar(${projectView})}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>
        <div class="clearfix mt10 mb10">
            <a th:href="@{${base + '/setting/deploykeys/new'}}" id="deploy-key-new" th:unless="${#lists.isEmpty(keys)}" class="ybtn ybtn-success float-end" th:text="#{deployKey.add}"></a>
            <p class="form-text" th:text="#{deployKey.description}"></p>
        </div>

        <!--/* 키가 없으면 배포 키가 무엇이고 어떻게 시작하는지 보여 주는 빈 상태 카드이다(A-548) */-->
        <section id="deployKeyEmpty" class="empty-state" th:if="${#lists.isEmpty(keys)}">
            <i class="yobicon-key empty-state-icon" aria-hidden="true"></i>
            <h4 class="empty-state-title" th:text="#{deployKey.empty.title}"></h4>
            <p class="empty-state-lead" th:text="#{deployKey.empty.lead}"></p>
            <ol class="deploy-key-steps">
                <li>
                    <span th:text="#{deployKey.empty.step1}"></span>
                    <pre class="deploy-key-command"><code>ssh-keygen -t ed25519 -C "deploy@your-server"</code></pre>
                </li>
                <li th:text="#{deployKey.empty.step2}"></li>
                <li th:text="#{deployKey.empty.step3}"></li>
            </ol>
            <p class="deploy-key-types" th:text="#{deployKey.empty.types}"></p>
            <p class="deploy-key-write-note" th:text="#{deployKey.empty.write}"></p>
            <a th:href="@{${base + '/setting/deploykeys/new'}}" id="deploy-key-new-empty" class="ybtn ybtn-success" th:text="#{deployKey.add}"></a>
        </section>

        <th:block th:if="${!#lists.isEmpty(keys)}" th:with="readOnlyCount=${#lists.size(keys.?[readOnly])}">
        <p id="deployKeySummary" class="form-text mb-2"
           th:text="#{deployKey.summary(${#lists.size(keys)}, ${readOnlyCount}, ${#lists.size(keys) - readOnlyCount})}"></p>
        <div id="deployKeyWriteWarning" class="alert alert-warning py-2" th:if="${#lists.size(keys) > readOnlyCount}" th:text="#{deployKey.writable.warning}"></div>
        <table id="deploy-key-list" class="table table-striped">
            <thead>
            <tr>
                <th th:text="#{deployKey.name}"></th><th th:text="#{deployKey.fingerprint}"></th><th th:text="#{deployKey.access}"></th><th th:text="#{deployKey.createdDate}"></th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="k : ${keys}" class="deploy-key-row" th:classappend="${k.readOnly} ? 'deploy-key-read-only'" th:attr="data-id=${k.id}">
                <td class="deploy-key-name" th:text="${k.name}"></td>
                <td><code class="deploy-key-fingerprint" th:text="${k.fingerprint}"></code></td>
                <td><span class="badge" th:classappend="${k.readOnly} ? 'bg-secondary' : 'text-bg-warning'" th:text="${k.readOnly} ? #{deployKey.access.readOnly} : #{deployKey.access.readWrite}"></span></td>
                <td th:text="${k.createdText}"></td>
                <td>
                    <form method="post" th:action="@{${base + '/setting/deploykeys/' + k.id + '/delete'}}" th:attr="onsubmit='return confirm(\'' + #{deployKey.delete.confirm} + '\');'">
                        <button type="submit" class="btn btn-danger btn-sm" th:text="#{deployKey.delete}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        </th:block>
    
        </div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
