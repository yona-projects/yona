<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(${project.name} + ' - ' + #{issue.label})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'setting')}"></div>

    <div class="page-wrap-outer">
        <div class="project-page-wrap label-editor-wrap">
          <div th:replace="~{project/setting_menu :: menu(${project}, 'labels')}"></div>

          <form id="copyLabel" th:action="@{/{owner}/{name}/copyLabels(owner=${project.owner}, name=${project.name})}" method="post" class="new-label-wrap">
            <strong class="form-legend" th:text="#{label.copy.append}">다른 프로젝트에서 라벨 복사</strong>
            <div class="form-wrap">
              <input type="text" name="owner" class="input-label mr5" th:placeholder="#{project.owner}">
              <input type="text" name="projectName" class="input-label" th:placeholder="#{project.name}">
            </div>
            <button type="submit" class="ybtn ybtn-info btn-submit" th:text="#{label.copy}">복사</button>
            <div th:text="#{label.copy.description}">설명</div>
            <div th:text="#{label.copy.description2}">설명2</div>
          </form>
          <!-- Vue 3 SFC 위젯(components/vue-widgets)로 대체, yona.issue.LabelEditor.js 미사용 -->
          <yona-new-label-form th:attr="data-action=@{/{owner}/{name}/issue/labels(owner=${project.owner}, name=${project.name})}"></yona-new-label-form>

          <div id="labelsList" class="issue-label-list-wrap">
            <div th:replace="~{project/partial_issuelabels_list :: list(${project}, ${labelsByCategory})}"></div>
          </div>
        </div>
    </div>

    <yona-category-edit-dialog></yona-category-edit-dialog>
    <yona-label-edit-dialog></yona-label-edit-dialog>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<th:block th:replace="~{common/tomselect :: tomselect}"></th:block>
<script type="module" src="/lib/yona-vue-widgets/yona-new-label-form-element.js"></script>
<script type="module" src="/lib/yona-vue-widgets/yona-category-edit-dialog-element.js"></script>
<script type="module" src="/lib/yona-vue-widgets/yona-label-edit-dialog-element.js"></script>
<script type="module">
  import { attachLabelListAdapter } from "/lib/yona-vue-widgets/yona-label-list-adapter.js";
  attachLabelListAdapter(document.getElementById("labelsList"));
</script>
</body>
</html>
