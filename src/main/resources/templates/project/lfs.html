<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW

  v1.6에 없는 추가 화면이다(X-8, decisions.md D-79). 프로젝트 설정의 Git LFS: 저장 사용량과 현재 잠금 목록, 잠금 강제 풀기
  모델: title, projectView, enabled(LFS 사용 여부), objectCount, usageText, quotaText(없으면 한도 없음), maxObjectText, locks(LockRow 목록: id, path, owner, lockedText)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::lfsPage})}">
<th:block th:fragment="lfsPage" th:with="base=${#paths.project(projectView.project.owner, projectView.project.name)}">
<div class="page-wrap-outer">
    <div class="project-page-wrap shell shell-below-banner" id="lfsPage">
        <th:block th:replace="~{project/menu :: settingsSidebar(${projectView})}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>
        <p class="form-text mt10" th:text="#{lfs.description}"></p>
        <div class="alert alert-warning" th:unless="${enabled}" th:text="#{lfs.disabled}"></div>

        <!--/* A-534: 저장 사용량은 통계 카드 셋(객체 수, 사용량, 객체 하나의 최대 크기)으로, 파일 잠금은 카드 하나로 보인다. */-->
        <h4 class="lfs-title mt-3" th:text="#{lfs.usage.title}"></h4>
        <div id="lfs-usage" class="lfs-stats row g-3 mb-4">
            <div class="col-lg-4"><div class="lfs-stat">
                <div class="lfs-stat-label" th:text="#{lfs.stat.objects}"></div>
                <div class="lfs-stat-value" th:text="${objectCount}"></div>
            </div></div>
            <div class="col-lg-4"><div class="lfs-stat">
                <div class="lfs-stat-label" th:text="#{lfs.stat.usage}"></div>
                <div class="lfs-stat-value" th:text="${usageText}"></div>
                <div class="lfs-stat-note text-body-secondary" th:if="${quotaText != null}" th:text="#{lfs.usage.quota(${quotaText})}"></div>
            </div></div>
            <div class="col-lg-4"><div class="lfs-stat">
                <div class="lfs-stat-label" th:text="#{lfs.stat.maxObject}"></div>
                <div class="lfs-stat-value" th:text="${maxObjectText}"></div>
            </div></div>
        </div>

        <h4 class="lfs-title" th:text="#{lfs.locks.title}"></h4>
        <div class="lfs-locks-card">
            <p class="form-text mb-2" th:text="#{lfs.locks.description}"></p>
            <p id="lfs-locks-empty" class="empty mb-0" th:if="${#lists.isEmpty(locks)}" th:text="#{lfs.locks.empty}"></p>
            <table id="lfs-locks" class="table table-striped mb-0" th:if="${!#lists.isEmpty(locks)}">
                <thead><tr><th th:text="#{lfs.locks.path}"></th><th th:text="#{lfs.locks.owner}"></th><th th:text="#{lfs.locks.date}"></th><th></th></tr></thead>
                <tbody>
                <tr th:each="l : ${locks}" class="lfs-lock-row">
                    <td><code th:text="${l.path}"></code></td>
                    <td th:text="${l.owner}"></td>
                    <td th:text="${l.lockedText}"></td>
                    <td class="text-end">
                        <form method="post" th:action="@{${base + '/setting/lfs/locks/' + l.id + '/delete'}}" th:attr="onsubmit='return confirm(\'' + #{lfs.locks.release.confirm} + '\');'">
                            <button type="submit" class="btn btn-danger btn-sm" th:text="#{lfs.locks.release}"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    
        </div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
