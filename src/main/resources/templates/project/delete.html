<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(${project.name} + ' - ' + #{project.delete})}">
</head>
<body class="prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'setting')}"></div>

    <div class="page-wrap-outer">
        <div class="project-page-wrap">
          <div th:replace="~{project/setting_menu :: menu(${project}, 'delete')}"></div>
          <h3 th:text="#{project.delete}">프로젝트 삭제</h3>

          <div class="bubble-wrap gray wp">
              <div class="cu-label" th:text="#{project.delete}">프로젝트 삭제</div>
              <div class="cu-desc">
                  <p><strong class="notice" th:text="#{project.delete.description}">프로젝트를 삭제하면 이슈, 위키, 저장소 등 프로젝트에 기록된 모든 데이터가 삭제되며, 복구할 수 없습니다.</strong></p>
                  <p>
                      <input type="checkbox" class="checkbox" autocomplete="off" id="accept">
                      <label for="accept" class="bg-checkbox label-agreement" th:text="#{project.delete.accept}">프로젝트를 삭제하는데 동의합니다.</label>
                  </p>
              </div>
          </div>
          <div class="box-wrap bottom">
              <a id="btnDelete" href="#alertDeletion" class="ybtn ybtn-danger" data-toggle="modal">
                  <i class="yobicon-database-remove"></i> <span th:text="#{project.delete.this}">프로젝트를 삭제합니다.</span></a>
          </div>

          <div id="alertDeletion" class="modal hide">
              <div class="modal-header">
                  <button type="button" class="close" data-dismiss="modal">&times;</button>
                  <h3 th:text="#{project.delete.requestion}">프로젝트를 삭제하시겠습니까?</h3>
              </div>
              <div class="modal-body">
                  <p th:text="#{project.delete.description}">프로젝트를 삭제하면 이슈, 위키, 저장소 등 프로젝트에 기록된 모든 데이터가 삭제되며, 복구할 수 없습니다.</p>
                  <p th:text="#{project.delete.reaccept}">정말로 이관하시겠습니까?</p>
              </div>
              <div class="modal-footer">
                  <button id="btnDeleteExec" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}">예</button>
                  <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}">아니오</button>
              </div>
          </div>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script type="text/javascript" src="/javascripts/service/yobi.project.Delete.js"></script>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        $yobi.loadModule("project.Delete", {
            "sDeleteURL": /*[[ @{/{owner}/{name}/delete(owner=${project.owner}, name=${project.name})} ]]*/ ''
        });
    });
</script>
</body>
</html>
