<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::deletePage})}">
<th:block th:fragment="deletePage" th:with="project=${projectView.project}">
<div class="page-wrap-outer">
    <div class="project-page-wrap shell shell-below-banner">
        <th:block th:replace="~{project/menu :: settingsSidebar(${projectView})}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>

        <div class="bubble-wrap gray wp">
            <div class="cu-label" th:text="#{project.delete}"></div>
            <div class="cu-desc">
                <p><strong class="notice" th:text="#{project.delete.description}"></strong></p>
                <p>
                    <input type="checkbox" class="checkbox form-check-input" autocomplete="off" id="accept"><!--
                 --><label for="accept" class="bg-checkbox label-agreement" th:text="#{project.delete.accept}"></label>
                </p>
            </div>
        </div>
        <div class="box-wrap bottom">
            <a id="btnDelete" href="#alertDeletion" class="ybtn ybtn-danger" data-bs-toggle="modal" ><!--
             --><i class="yobicon-database-remove"></i> <th:block th:text="#{project.delete.this}"></th:block></a>
        </div>

        <!--/* Confirm to delete project */-->
        <div id="alertDeletion" class="modal"><div class="modal-dialog"><div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <h3 th:text="#{project.delete.requestion}"></h3>
            </div>
            <div class="modal-body">
                <p> <th:block th:text="#{project.delete.description}"></th:block></p>
                <p> <th:block th:text="#{project.delete.reaccept}"></th:block> </p>
            </div>
            <div class="modal-footer">
                <button id="btnDeleteExec" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}"></button>
                <button type="button" class="ybtn" data-bs-dismiss="modal" th:text="#{button.no}"></button>
            </div>
        </div></div></div>
        <!--/* // -- // */-->
    
        <script type="module" th:inline="javascript">
/* 본문 교체 때도 모듈 등록이 끝난 뒤 초기화하도록 모듈을 먼저 불러온다(D-136) */
await import([[@{/assets/javascripts/esm/service/project.Delete.js}]]);
    $(document).ready(function(){
        $yona.loadModule("project.Delete", {
            "sDeleteURL": [[@{${#paths.project(project.owner, project.name) + '/delete'}}]]
        });
    });
</script>
</div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
