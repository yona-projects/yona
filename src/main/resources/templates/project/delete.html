<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::deletePage})}">
<th:block th:fragment="deletePage" th:with="project=${projectView.project}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${requestPath})}"></th:block>

        <div class="bubble-wrap gray wp">
            <div class="cu-label" th:text="#{project.delete}"></div>
            <div class="cu-desc">
                <p><strong class="notice" th:text="#{project.delete.description}"></strong></p>
                <p>
                    <input type="checkbox" class="checkbox" autocomplete="off" id="accept"><!--
                 --><label for="accept" class="bg-checkbox label-agreement" th:text="#{project.delete.accept}"></label>
                </p>
            </div>
        </div>
        <div class="box-wrap bottom">
            <a id="btnDelete" href="#alertDeletion" class="ybtn ybtn-danger" data-toggle="modal" ><!--
             --><i class="yobicon-database-remove"></i> <th:block th:text="#{project.delete.this}"></th:block></a>
        </div>

        <!--/* Confirm to delete project */-->
        <div id="alertDeletion" class="modal hide">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">×</button>
                <h3 th:text="#{project.delete.requestion}"></h3>
            </div>
            <div class="modal-body">
                <p> <th:block th:text="#{project.delete.description}"></th:block></p>
                <p> <th:block th:text="#{project.delete.reaccept}"></th:block> </p>
            </div>
            <div class="modal-footer">
                <button id="btnDeleteExec" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}"></button>
                <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}"></button>
            </div>
        </div>
        <!--/* // -- // */-->
    </div>
</div>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        $yobi.loadModule("project.Delete", {
            "sDeleteURL": [[${#paths.project(project.owner, project.name) + '/delete'}]]
        });
    });
</script>
</th:block>
</html>
