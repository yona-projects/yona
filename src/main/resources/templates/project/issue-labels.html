  모델: title, projectView, canCreate, groups, editableCategories
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::labelsPage})}">
<th:block th:fragment="labelsPage" th:with="project=${projectView.project}, base=${'/' + projectView.project.owner + '/' + projectView.project.name}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap label-editor-wrap">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${requestPath})}"></th:block>

        <th:block th:if="${canCreate}">
        <form id="copyLabel" th:action="${base + '/copyLabels'}" method="post" class="new-label-wrap">
            <strong class="form-legend" th:text="#{label.copy.append}"></strong>
            <div class="form-wrap">
            <input type="text" name="owner" class="input-label mr5" th:placeholder="#{project.owner}">
            <input type="text" name="projectName" class="input-label" th:placeholder="#{project.name}">
            </div>
            <button type="submit" class="ybtn ybtn-info btn-submit" th:text="#{label.copy}"></button>
            <div th:text="#{label.copy.description}"></div>
            <div th:text="#{label.copy.description2}"></div>
        </form>
        <form id="frmNewLabel" th:action="${base + '/issue/labels'}" method="post" class="new-label-wrap">
            <strong class="form-legend" th:text="#{label.new}"></strong>
            <div class="form-wrap">
                <div>
                    <input type="text" name="category" class="input-label mr5" maxlength="250" data-provider="typeahead" autocomplete="off" th:placeholder="#{label.category}">
                    <input type="text" name="name" class="input-label" maxlength="250" autocomplete="off" th:placeholder="#{label.name}">
                </div>
                <div class="label-preset-colors">
            <button type="button" class="issue-label btn-preset-color" style="background-color:#f44336;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#e91e63;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#9c27b0;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#3f51b5;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#2196f3;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#03a9f4;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#00bcd4;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#009688;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#4caf50;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#8bc34a;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#cddc39;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#ffeb3b;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#ffc107;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#ff9800;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#ff5722;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#795548;"></button>
            <button type="button" class="issue-label btn-preset-color" style="background-color:#9e9e9e;"></button>
                    <input type="text" name="color" class="input-small input-label-color" th:placeholder="#{label.customColor}">
                </div>
            </div>
            <button type="submit" class="ybtn ybtn-primary btn-submit" th:text="#{label.add}"></button>
        </form>
        </th:block>

        <div id="labelsList" class="issue-label-list-wrap">
            <th:block th:replace="~{project/partial-issue-labels-list :: labelList(${projectView}, ${groups})}"></th:block>
        </div>
    </div>
</div>

<div id="editCategory" class="modal hide yobiDialog" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="btn-dismiss"><button type="button" class="btn-transparent" data-dismiss="modal">&times;</button></div>
  <div class="message edit-label-category-form">
    <div class="center-txt">
      <input type="text" name="name" class="text category-name" th:placeholder="#{label.category}">

      <div class="desc">
        <th:block th:text="#{label.category.option}"></th:block>

        <select name="isExclusive" data-toggle="select2" data-dropdown-css-class="select2-without-searchbox">
          <option value="false" th:text="#{label.category.option.multiple}"></option>
          <option value="true" th:text="#{label.category.option.single}"></option>
        </select>
      </div>
    </div>

    <div class="center-txt buttons mt20 mb20">
      <button type="button" class="ybtn ybtn-info btnSubmit" th:text="#{button.save}"></button>
      <button type="button" class="ybtn ybtn-default" data-dismiss="modal" th:text="#{button.cancel}"></button>
    </div>
  </div>
</div>

<div id="editLabel" class="modal hide yobiDialog" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="btn-dismiss"><button type="button" class="btn-transparent" data-dismiss="modal">&times;</button></div>
  <div class="message edit-label-form">
    <div class="center-txt">
      <select name="category.id" data-toggle="select2">
        <option th:each="category : ${editableCategories}" th:value="${category.id}" th:text="${category.name}"></option>
      </select>

      <input type="text" name="name" class="text input-label-name" maxlength="250" th:placeholder="#{label.name}">

      <div class="label-preset-colors edit">
        <button type="button" class="issue-label btn-preset-color" style="background-color:#FF7770;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#F18CA7;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#FFB399;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#F1D55C;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#A5D870;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#32CDA1;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#9985D8;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#40A0EB;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#6BC4E9;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#DCBD98;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#8C8C9C;"></button>
        <button type="button" class="issue-label btn-preset-color" style="background-color:#7A9CB4;"></button>
        <input type="text" name="color" class="input-small input-label-color" th:placeholder="#{label.customColor}">
      </div>
    </div>
    <div class="center-txt buttons mt20 mb20">
      <button type="button" class="ybtn ybtn-info btnSubmit" th:text="#{button.save}"></button>
      <button type="button" class="ybtn ybtn-default" data-dismiss="modal" th:text="#{button.cancel}"></button>
    </div>
  </div>
</div>

<th:block th:replace="~{common/select2 :: select2}"></th:block>

<script type="text/javascript" th:inline="javascript">
    $(function(){
        $yobi.loadModule("issue.LabelEditor", {
            "form": "#frmNewLabel",
            "list": "#labelsList",
            "editCategoryForm": "#editCategory",
            "editLabelForm"   : "#editLabel",
            "listURL": /*[[${base + '/issue/labels'}]]*/ ""
        });
    });
</script>
</th:block>
</html>
