<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::webhooksPage})}">
<th:block th:fragment="webhooksPage" th:with="project=${projectView.project}, projectBase=${#paths.project(projectView.project.owner, projectView.project.name)}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap webhook-editor-wrap">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${projectBase + '/webhooks'})}"></th:block>

        <form th:if="${creatable}" id="formNewWebhook" th:action="${action}" method="post" class="new-webhook-wrap">
            <strong class="form-legend" th:text="#{project.webhook.new}"></strong>
            <div class="form-wrap">
                <div class="d-flex flex-wrap gap-2 align-items-start">
                    <input type="text" name="payloadUrl" class="input-webhook-payload form-control" maxlength="2000" autocomplete="off" th:placeholder="#{project.webhook.payloadUrl}">
                    <input type="text" name="secret" class="input-webhook-secret form-control" maxlength="250" autocomplete="off" th:placeholder="#{project.webhook.secret}">
                    <button type="submit" class="ybtn ybtn-primary btn-submit" th:text="#{project.webhook.add}"></button>
                </div>
                <div>
                    <div class="form-check form-check-radio form-check-inline"><label class="form-check-label">
                        <input type="radio" name="webhookType" value="SIMPLE" checked class="form-check-input"> Messenger (Only text)
                    </label></div>
                    <div class="form-check form-check-radio form-check-inline"><label class="form-check-label">
                        <input type="radio" name="webhookType" value="DETAIL_SLACK" class="form-check-input"> Slack (Meta)
                    </label></div>
                    <div class="form-check form-check-radio form-check-inline"><label class="form-check-label">
                        <input type="radio" name="webhookType" value="DETAIL_HANGOUT_CHAT" class="form-check-input"> Google Chat (Thread)
                    </label></div>
                    <div class="form-check form-check-radio form-check-inline"><label class="form-check-label">
                        <input type="radio" name="webhookType" value="JSON" class="form-check-input"> Continuous Integration tool (Only push event)
                    </label></div>
                    <div class="form-check form-check-inline"><label class="form-check-label"> | </label></div><div class="form-check form-check-inline"><label class="form-check-label"></label></div>
                    <div class="form-check form-check-inline"><label for="gitPush" class="form-check-label">
                        <input type="checkbox" id="gitPush" name="gitPush" class="form-check-input"> <th:block th:text="#{project.webhook.includeGitPush}"></th:block>
                    </label></div>
                </div>
            </div>
            <div th:utext="#{project.webhook.help}"></div>
        </form>
        <div id="webhooksList" class="webhook-list-wrap">
            <div th:if="${#lists.isEmpty(webhooks)}" class="error-wrap">
                <i class="ico ico-err1"></i>
                <p th:text="#{project.webhook.list.empty}"></p>
            </div>
            <th:block th:if="${!#lists.isEmpty(webhooks)}">
                <div class="row list-head">
                    <div class="col-lg-5 payload-url"><strong th:text="#{project.webhook.payloadUrl}"></strong></div>
                    <div class="col-lg-2 secret text-center"><strong th:text="#{project.webhook.secret}"></strong></div>
                    <div class="col-lg-2 secret text-center"><strong>Type of message</strong></div>
                    <div class="col-lg-2 secret text-center"><strong>Include git push events</strong></div>
                    <div class="col-lg-1 secret text-center"></div>
                </div>
                <div th:each="w : ${webhooks}" class="row list-item vertical-align" th:attr="data-webhook-id=${w.id}">
                    <div class="col-lg-5"><h6 class="mr20 truncate" th:text="${w.payloadUrl}"></h6></div>
                    <div class="col-lg-2 text-center"><h6 th:text="${#strings.isEmpty(w.secret)} ? 'NONE' : ${w.secret}"></h6></div>
                    <div class="col-lg-2 text-center"><h6 th:text="${w.type}"></h6></div>
                    <div class="col-lg-2 text-center"><input class="form-check-input" type="checkbox" th:checked="${w.gitPush}" onclick="return false;" /></div>
                    <div class="col-lg-1 text-center">
                        <button type="button" class="ybtn ybtn-danger ybtn-small" data-request-method="delete" th:attr="data-request-uri=${w.deleteUrl}" th:text="#{button.delete}"></button>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(function(){
        $yobi.loadModule("project.Webhook", {
            "form": "#formNewWebhook",
            "list": "#webhooksList"
        });
        $('input[type=radio][name=webhookType]').change(function() {
            if (this.value == 'JSON') {
                $("input:checkbox[name=gitPush]").attr('checked', true);
                $("input:checkbox[name=gitPush]").attr('onclick', 'return false;');
            } else {
                $("input:checkbox[name=gitPush]").attr('onclick', '');
                $("input:checkbox[name=gitPush]").attr('checked', false);
            }
        });
    });
</script>
</th:block>
</html>
