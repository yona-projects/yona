<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-34(decisions.md D-46)의 규칙 묶음 목록이다. GitHub의 Rules > Rulesets 목록에 해당한다.
  모델: title, projectView, rulesets(Ruleset 목록, 이름순), migrated(v1.6 리뷰어 설정을 옮긴 규칙 묶음이 있는지)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::rulesetsPage})}">
<th:block th:fragment="rulesetsPage" th:with="project=${projectView.project}, base=${#paths.project(projectView.project.owner, projectView.project.name)}">
<div class="page-wrap-outer">
    <div class="project-page-wrap shell shell-below-banner" id="rulesetPage">
        <th:block th:replace="~{project/menu :: settingsSidebar(${projectView})}"></th:block>
        <div class="shell-main"><span data-swap-safe hidden></span>

        <div class="clearfix mt10 mb10">
            <a id="newRuleset" th:unless="${#lists.isEmpty(rulesets)}" class="ybtn ybtn-success float-end" th:href="@{${base + '/setting/rulesets/new'}}" th:text="#{project.ruleset.new}"></a>
            <p class="form-text" th:text="#{project.ruleset.description}"></p>
        </div>
        <div id="rulesetMigrated" class="alert alert-info" th:if="${migrated}" th:text="#{project.ruleset.legacy}"></div>

        <!--/* 규칙 묶음이 없으면 무엇이고 어떻게 시작하는지 보여 주는 빈 상태 카드이다(A-548) */-->
        <section id="rulesetEmpty" class="empty-state" th:if="${#lists.isEmpty(rulesets)}">
            <i class="yobicon-lock empty-state-icon" aria-hidden="true"></i>
            <h4 class="empty-state-title" th:text="#{project.ruleset.empty.title}"></h4>
            <p class="empty-state-lead" th:text="#{project.ruleset.empty.lead}"></p>
            <ul class="empty-state-list">
                <li th:text="#{project.ruleset.empty.item.pr}"></li>
                <li th:text="#{project.ruleset.empty.item.review}"></li>
                <li th:text="#{project.ruleset.empty.item.history}"></li>
                <li th:text="#{project.ruleset.empty.item.push}"></li>
            </ul>
            <p class="empty-state-example" th:text="#{project.ruleset.empty.example}"></p>
            <a id="newRulesetEmpty" class="ybtn ybtn-success" th:href="@{${base + '/setting/rulesets/new'}}" th:text="#{project.ruleset.new}"></a>
        </section>

        <th:block th:if="${!#lists.isEmpty(rulesets)}">
        <p id="rulesetSummary" class="form-text mb-2" th:with="activeCount=${#lists.size(rulesets.?[active])}"
           th:text="#{project.ruleset.summary(${#lists.size(rulesets)}, ${activeCount}, ${#lists.size(rulesets) - activeCount})}"></p>
        <table class="table table-striped table-hover" id="rulesetList">
            <thead>
            <tr>
                <th th:text="#{project.ruleset.name}"></th>
                <th th:text="#{project.ruleset.col.target}"></th>
                <th th:text="#{project.ruleset.enforcement}"></th>
                <th th:text="#{project.ruleset.col.rules}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rulesets}" class="ruleset-row">
                <td class="ruleset-name"><a th:href="@{${base + '/setting/rulesets/' + r.id}}" th:text="${r.name}"></a></td>
                <td class="ruleset-target"><code th:text="${r.pattern}"></code></td>
                <td class="ruleset-enforcement">
                    <span class="badge bg-secondary" th:classappend="${r.active} ? 'bg-success'"
                          th:text="${r.active} ? #{project.ruleset.enforcement.active} : #{project.ruleset.enforcement.disabled}"></span>
                </td>
                <td class="ruleset-rules">
                    <span class="badge text-bg-info" th:if="${r.requiredApprovals > 0}" th:text="#{project.ruleset.summary.approvals(${r.requiredApprovals})}"></span>
                    <span class="badge bg-secondary" th:if="${r.requirePullRequest == true}" th:text="#{project.ruleset.rule.pr.short}"></span>
                    <span class="badge bg-secondary" th:if="${r.requireNoChangesRequested == true}" th:text="#{project.ruleset.rule.changes.short}"></span>
                    <span class="badge bg-secondary" th:if="${r.requireConversationResolution == true}" th:text="#{project.ruleset.rule.conversation.short}"></span>
                    <span class="badge bg-secondary" th:if="${r.requireLinearHistory == true}" th:text="#{project.ruleset.rule.linear.short}"></span>
                    <span class="badge bg-secondary" th:if="${r.requireSignedCommits == true}" th:text="#{project.ruleset.rule.signed.short}"></span>
                    <span class="badge text-bg-warning" th:if="${r.restrictUpdates == true}" th:text="#{project.ruleset.rule.updates.short}"></span>
                    <span class="badge bg-secondary" th:if="${r.restrictDeletions == true}" th:text="#{project.ruleset.rule.deletions.short}"></span>
                    <span class="badge bg-secondary" th:if="${r.blockForcePushes == true}" th:text="#{project.ruleset.rule.force.short}"></span>
                </td>
            </tr>
            </tbody>
        </table>
        </th:block>
    
        </div><!--/* .shell-main */-->
    </div>
</div>
</th:block>
</html>
