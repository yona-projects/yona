<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  이식 원본: app/views/project/create.scala.html
  모델: title, form(ProjectForm), fieldErrors(필드별 번역된 오류), errorsJson(오류 JSON), ownerAvatarUrl,
        organizations(관리하는 조직), ownerIsOrganization, privateIsDefault, defaultMenus, vcsTypes
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NEW_PROJECT', ~{::createPage})}">
<th:block th:fragment="createPage">
<div class="page-wrap-outer">
  <div class="project-page-wrap">
    <div class="form-wrap new-project">
      <form id="newProjectForm" th:action="@{/projects}" method="post" class="frm-wrap">
        <legend>
          <th:block th:text="#{title.newProject}"></th:block>
          <span>
            <small><th:block th:text="#{project.import.or}"></th:block> &nbsp; </small>
            <a th:href="'/_import?owner=' + ${form.owner ?: ''}" class="ybtn ybtn-small nm">
              <strong th:text="#{project.import.from.git}"></strong>
            </a>
          </span>
        </legend>

        <dl>
          <!-- ProjectOwner -->
          <dt>
            <label for="project-owner">
              <th:block th:text="#{project.owner}"></th:block>
              <strong class="orange-txt">*</strong>
            </label>
          </dt>
          <dd>
            <select id="project-owner" name="owner" data-toggle="select2" data-format="user" class="mb10 form-select" style="min-width: 220px;">
                <option data-type="user"
                        th:data-avatar-url="${ownerAvatarUrl}"
                        th:value="${currentUser.loginId}"
                        th:text="${currentUser.loginId}">
                </option>

                <option th:each="org : ${organizations}" data-type="group"
                        th:data-avatar-url="${org.logoUrl}"
                        th:value="${org.name}"
                        th:selected="${form.owner == org.name}"
                        th:text="${org.name}">
                </option>
            </select>
            <span th:if="${fieldErrors['owner'] != null}" class="orange-text" th:text="${fieldErrors['owner'][0]}"></span>
          </dd>
          <!-- // -->

          <!-- ProjectName -->
          <dt>
            <label for="project-name">
              <th:block th:text="#{project.name}"></th:block>
              <strong class="orange-txt">*</strong>
            </label>
          </dt>
          <dd>
            <input id="project-name" type="text" name="name" class="text form-control" maxlength="250"
                   th:value="${form.name}" th:placeholder="#{project.name.placeholder}"  >
          </dd>
          <!-- // -->

          <!-- Description -->
          <dt>
            <label for="description" th:text="#{project.description}"></label>
          </dt>
          <dd>
            <textarea id="description" name="overview" class="text form-control" th:text="${form.overview}"></textarea>
          </dd>
          <!-- // -->
        </dl>

        <div class="advanced-options">
          <!-- Access Scope -->
          <div class="row">
            <div class="col-lg-2 right-txt mt10" th:text="#{project.shareOption}">
            </div>
            <div class="col-lg-10">
              <ul class="list-unstyled project-scopes mt10">
                <li>
                  <input type="radio" id="public" name="projectScope" value="PUBLIC" class="radio-btn float-start form-check-input" th:attr="checked=${form.projectScope == 'PUBLIC' or form.projectScope == null} ? 'checked'">
                  <label for="public">
                    <strong class="ml5" th:text="#{project.public}"></strong>
                    <p class="note" th:utext="#{project.public.notice}">
                    </p>
                  </label>
                </li>

                <li id="opt-protected" class="mt10" th:style="${ownerIsOrganization} ? '' : 'display:none;'">
                  <input type="radio" id="protected" name="projectScope" value="PROTECTED" class="radio-btn float-start form-check-input" th:attr="checked=${form.projectScope == 'PROTECTED'} ? 'checked'">
                  <label for="protected">
                    <strong class="ml5" th:text="#{project.protected}"></strong>
                    <p class="note" th:utext="#{project.protected.notice}">
                    </p>
                  </label>
                </li>

                <li class="mt10">
                  <input type="radio" id="private" name="projectScope" value="PRIVATE" class="radio-btn float-start form-check-input" th:attr="checked=${form.projectScope == 'PRIVATE' or privateIsDefault} ? 'checked'">
                  <label for="private">
                    <strong class="ml5" th:text="#{project.private}"></strong>
                    <p class="note" th:utext="#{project.private.notice}">
                    </p>
                  </label>
                </li>
              </ul>
            </div>
          </div>
          <!-- // -->
          <hr>
          <!-- VCS -->
          <div class="row">
            <div class="col-lg-2 right-txt mt10">
              <label for="vcs" th:text="#{project.vcs}">
              </label>
            </div>
            <div class="col-lg-10 cu-desc">
              <select id="vcs" name="vcs" data-toggle="select2" data-dropdown-css-class="select2-without-searchbox" class="mb10 mt5 form-select" style="min-width: 220px;">
                <option th:each="vcsType : ${vcsTypes}" th:value="${vcsType.value}"
                        th:selected="${(form.vcs == null and vcsType.value == 'GIT') or form.vcs == vcsType.value}"
                        th:text="#{${vcsType.labelKey}}">
                </option>
              </select>

              <span id="svn" class="ml10 notice"
                    th:style="${form.vcs == null or form.vcs == 'GIT'} ? 'display: none;' : ''"
                    th:text="#{project.svn.warning}">
              </span>
            </div>
          </div>
          <hr>
          <!-- Menu Setting -->
          <div class="row">
            <div class="col-lg-2 right-txt" th:text="#{project.menu.setting}">
            </div>
            <div class="col-lg-10">
                <label for="menuSettingCode" class="bg-radiobtn label-public inline-list">
                  <input type="checkbox" class="radio-btn form-check-input" id="menuSettingCode" name="code" th:attr="value=${defaultMenus.contains('code')} ? 'true', checked=${defaultMenus.contains('code')} ? 'checked'" >
                  <th:block th:text="#{menu.code}"></th:block>
                </label>
                <label for="menuSettingIssue" class="bg-radiobtn label-public inline-list">
                  <input type="checkbox" class="radio-btn form-check-input" id="menuSettingIssue" name="issue" th:attr="value=${defaultMenus.contains('issue')} ? 'true', checked=${defaultMenus.contains('issue')} ? 'checked'" >
                  <th:block th:text="#{menu.issue}"></th:block>
                </label>
                <label for="menuSettingPullRequest" class="bg-radiobtn label-public inline-list">
                  <input type="checkbox" class="radio-btn form-check-input" id="menuSettingPullRequest" name="pullRequest" th:attr="value=${defaultMenus.contains('pullRequest')} ? 'true', checked=${defaultMenus.contains('pullRequest')} ? 'checked'" >
                  <th:block th:text="#{menu.pullRequest}"></th:block>
                </label>
                <label for="menuSettingReview" class="bg-radiobtn label-public inline-list">
                  <input type="checkbox" class="radio-btn form-check-input" id="menuSettingReview" name="review" th:attr="value=${defaultMenus.contains('review')} ? 'true', checked=${defaultMenus.contains('review')} ? 'checked'" >
                  <th:block th:text="#{menu.review}"></th:block>
                </label>
                <label for="menuSettingMilestone" class="bg-radiobtn label-public inline-list">
                  <input type="checkbox" class="radio-btn form-check-input" id="menuSettingMilestone" name="milestone" th:attr="value=${defaultMenus.contains('milestone')} ? 'true', checked=${defaultMenus.contains('milestone')} ? 'checked'" >
                  <th:block th:text="#{milestone}"></th:block>
                </label>
                <label for="menuSettingBoard" class="bg-radiobtn label-public inline-list">
                  <input type="checkbox" class="radio-btn form-check-input" id="menuSettingBoard" name="board" th:attr="value=${defaultMenus.contains('board')} ? 'true', checked=${defaultMenus.contains('board')} ? 'checked'" >
                  <th:block th:text="#{menu.board}"></th:block>
                </label>
                <label for="menuSettingWiki" class="bg-radiobtn label-public inline-list">
                  <input type="checkbox" class="radio-btn form-check-input" id="menuSettingWiki" name="wiki" th:attr="value=${defaultMenus.contains('wiki')} ? 'true', checked=${defaultMenus.contains('wiki')} ? 'checked'" >
                  <th:block th:text="#{menu.wiki}"></th:block>
                </label>
            </div>
          </div>
          <!-- // -->
        </div>

        <div class="actions mt20">
          <button class="ybtn ybtn-success" th:text="#{project.create}">
          </button>
          <a href="/" class="ybtn" th:text="#{button.cancel}"></a>
        </div>
      </form>
    </div>
  </div>
</div>

<th:block th:replace="~{common/select2 :: select2}"></th:block>
<script type="text/javascript" th:inline="javascript">
    $(function() {
        $yobi.loadModule("project.New", {
            "sFormId": "#newProjectForm",
            "htError": [(${errorsJson})]
        });
    });
</script>
</th:block>
</html>
