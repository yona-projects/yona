  모델: title, projectView, memberItems, roles, enrolled
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::membersPage})}">
<th:block th:fragment="membersPage" th:with="project=${projectView.project}, projectBase=${#paths.project(projectView.project.owner, projectView.project.name)}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${requestPath})}"></th:block>

        <div class="inner-bubble">
            <form class="nm" th:action="@{/{owner}/{name}/members(owner=${project.owner},name=${project.name})}" method="post" id="addNewMember">
                <input type="text" class="text uname" id="loginId" name="loginId" required="required"
                       data-provider="typeahead" autocomplete="off"
                       th:placeholder="#{project.members.addMember}"
                       pattern="^[a-zA-Z0-9-]+([_.][a-zA-Z0-9-]+)*$" th:title="#{user.wrongloginId.alert}" /><!--
             --><button type="submit" class="ybtn ybtn-success"><i class="yobicon-addfriend"></i> <th:block th:text="#{button.add}"></th:block></button>
            </form>
        </div>

        <ul class="members project row">
            <li th:each="member : ${memberItems}" class="member col-lg-6 span-hard-wrap">
                <a th:href="@{/{user}(user=${member.loginId})}" class="avatar-wrap mlarge float-left mr10">
                    <img th:src="${member.avatarUrl}" width="64" height="64">
                </a>
                <div class="member-name" th:text="${member.displayName}"></div>
                <div class="member-id"><th:block th:text="'@' + ${member.loginId}"></th:block> <span th:if="${member.guest}" class="guest">GUEST</span></div>
                <div class="member-setting">
                <th:block th:if="${!member.owner}">
                     <div class="btn-group" th:attr="data-name='roleof-' + ${member.loginId}">
                        <button class="btn dropdown-toggle large" data-toggle="dropdown">
                            <span class="d-label" th:text="#{'user.role.' + ${member.roleName}}"></span>
                            <span class="d-caret"><span class="caret"></span></span>
                        </button>
                        <ul class="dropdown-menu"><th:block th:each="role : ${roles}"><li th:attr="data-value=${role.id}" th:classappend="${role.name == member.roleName} ? 'active'" th:data-selected="${role.name == member.roleName} ? 'true'"><a href="javascript:void(0)" data-action="apply" th:data-href="${projectBase} + '/member/' + ${member.userId} + '/edit'" th:data-loginId="${member.loginId}" th:text="#{'user.role.' + ${role.name}}" class="dropdown-item"></a></li></th:block></ul>
                    </div>
                    <a href="javascript:void(0)" data-action="delete" th:data-href="${projectBase} + '/member/' + ${member.userId} + '/delete'" class="ybtn ybtn-danger ybtn-small">
                        <th:block th:text="#{button.delete}"></th:block>
                    </a>
                </th:block>
                <span th:if="${member.owner}" class="badge owner badge-secondary" th:text="#{user.role.owner}"></span>
                </div>
            </li>
        </ul>

        <!--/* Enrolled Users */-->
        <th:block th:if="${!enrolled.isEmpty()}">
        <legend>
            <h3><th:block th:text="#{project.member.enrollment.request}"></th:block> (<th:block th:text="${enrolled.size()}"></th:block>)</h3>
        </legend>
        <div class="row">
            <div th:each="user : ${enrolled}" class="col-lg-2">
                <div class="float-left mr10">
                    <a th:href="@{/{user}(user=${user.loginId})}">
                        <img th:src="${user.avatarUrl}" height="65" width="65" class="rounded-circle"/>
                    </a>
                </div>
                <div class="float-left" style="width: 60px;">
                    <span><a th:href="@{/{user}(user=${user.loginId})}"><strong th:text="${user.displayName}"></strong></a></span>
                    <span>(<th:block th:text="${user.loginId}"></th:block>)</span>
                    <button type="button" class="ybtn ybtn-info ybtn-mini blue enrollAcceptBtn" th:attr="data-loginId=${user.loginId}"><i class="yobicon-addfriend"></i> <th:block th:text="#{button.add}"></th:block></button>
                </div>
            </div>
        </div>
        </th:block>
    </div>
</div>
<link rel="stylesheet" type="text/css" media="screen" href="/assets/javascripts/lib/mentionjs/mention.css">
<script type="text/javascript" th:inline="javascript">
   $(document).ready(function(){
       $yobi.loadModule("project.Member", {
           "sActionURL": "/users"
       });
   });
</script>
</th:block>
</html>
