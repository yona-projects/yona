<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::transferPage})}">
<th:block th:fragment="transferPage" th:with="project=${projectView.project}, projectBase=${#paths.project(projectView.project.owner, projectView.project.name)}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${projectBase + '/transfer'})}"></th:block>
        <div class="bubble-wrap gray wp">
            <div class="row">
                <div class="cu-label" th:text="#{project.transfer.new.owner}"></div>
                <div class="cu-desc">
                    <p>
                        <input type="text" id="owner" name="owner" />
                    </p>
                </div>
            </div>
            <div class="row">
                <div class="cu-label" th:text="#{project.transfer}"></div>
                <div class="cu-desc">
                    <ul>
                        <li class="notice"><strong th:text="#{project.transfer.description1}"></strong></li>
                        <li class="notice"><strong th:text="#{project.transfer.description2}"></strong></li>
                        <li class="notice"><strong th:text="#{project.transfer.description3}"></strong></li>
                        <li class="notice"><strong th:text="#{project.transfer.description4}"></strong></li>
                        <li class="notice"><strong th:text="#{project.transfer.description5}"></strong></li>
                    </ul>
                    <p>
                        <input type="checkbox" class="checkbox" autocomplete="off" id="accept"><!--
                 --><label for="accept" class="bg-checkbox label-agreement" th:text="#{project.transfer.accept}"></label>
                    </p>
                </div>
            </div>
        </div>
        <div class="box-wrap bottom">
            <a id="btnTransfer" href="#alertTransfer" class="ybtn ybtn-danger" data-bs-toggle="modal" ><!--
             --><i class="yobicon-database"></i> <th:block th:text="#{project.transfer.this}"></th:block></a>
        </div>

        <!--/* Confirm to transfer project */-->
        <div id="alertTransfer" class="modal"><div class="modal-dialog"><div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <h3 th:text="#{project.transfer.requestion}"></h3>
            </div>
            <div class="modal-body">
                <p> <th:block th:text="#{project.transfer.description}"></th:block></p>
                <p> <th:block th:text="#{project.transfer.reaccept}"></th:block> </p>
            </div>
            <div class="modal-footer">
                <button id="btnTransferExec" type="button" class="ybtn ybtn-danger" th:text="#{button.yes}"></button>
                <button type="button" class="ybtn" data-bs-dismiss="modal" th:text="#{button.no}"></button>
            </div>
        </div></div></div>
        <!--/* // -- // */-->
    </div>
</div>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        $yobi.loadModule("project.Transfer", {
            "sTransferURL": [[${projectBase + '/transfer'}]]
        });
    });
</script>
</th:block>
</html>
