<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-34(decisions.md D-46)의 규칙 묶음 편집 화면이다. GitHub의 룰셋 편집 화면(이름, 적용 상태, 바이패스 목록, 대상 브랜치, 규칙)에 해당한다.
  다른 설정 화면(setting.html)과 같은 카드 구조(bubble-wrap, box-wrap, cu-label, cu-desc)에 부트스트랩 폼 요소(checkbox, help-block, input-*)를 쓴다.
  지금은 바이패스(프로젝트 관리자와 사이트 관리자)와 대상(패턴 하나)이 현재 수준이다(◐, 완성은 X-35).
  모델: title, projectView, ruleset(편집할 규칙 묶음. 새로 만들 때는 id가 없고, 입력 오류면 입력값을 담은 저장하지 않는 규칙 묶음), errors(오류 항목 이름 목록)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::rulesetFormPage})}">
<th:block th:fragment="rulesetFormPage" th:with="project=${projectView.project}, base=${#paths.project(projectView.project.owner, projectView.project.name)}, isNew=${ruleset.id == null}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'PROJECT_SETTING', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap" id="rulesetFormPage">
        <th:block th:replace="~{project/partial-settingmenu :: settingmenu(${projectView}, ${base + '/setting/rulesets'})}"></th:block>

        <nav aria-label="breadcrumb" class="mt10"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="${base + '/setting/rulesets'}" th:text="#{project.ruleset}"></a></li>
            <li class="breadcrumb-item active" aria-current="page">
                <th:block th:text="${isNew} ? #{project.ruleset.new} : ${ruleset.name}"></th:block>
                <span class="badge ml10 badge-secondary" th:if="${!isNew}" th:classappend="${ruleset.active} ? 'badge-success'"
                      th:text="${ruleset.active} ? #{project.ruleset.enforcement.active} : #{project.ruleset.enforcement.disabled}"></span>
            </li>
        </ol></nav>

        <div class="alert alert-danger" id="rulesetErrors" th:if="${!#lists.isEmpty(errors)}" th:text="#{project.ruleset.error}"></div>

        <form id="rulesetForm" method="post" class="nm"
              th:action="${isNew} ? ${base + '/setting/rulesets'} : ${base + '/setting/rulesets/' + ruleset.id}">
            <div class="bubble-wrap gray" style="overflow: visible">
                <div class="box-wrap top">
                    <div class="cu-label vmiddle"><label for="rulesetName" th:text="#{project.ruleset.name}"></label></div>
                    <div class="cu-desc">
                        <input type="text" id="rulesetName" name="name" maxlength="255" class="input-xlarge" th:value="${ruleset.name}">
                        <span class="d-inline-block align-middle pl-1 text-muted text-danger" th:if="${#lists.contains(errors, 'name')}" th:text="#{project.ruleset.error.name}"></span>
                    </div>
                </div>

                <div class="box-wrap middle">
                    <div class="cu-label vmiddle" th:text="#{project.ruleset.enforcement}"></div>
                    <div class="cu-desc">
                        <input name="enforcement" type="radio" class="radio-btn" id="enforcementActive" value="active" th:checked="${ruleset.active}">
                        <label for="enforcementActive" class="bg-radiobtn label-public" th:text="#{project.ruleset.enforcement.active}"></label>
                        <input name="enforcement" type="radio" class="radio-btn" id="enforcementDisabled" value="disabled" th:checked="${!ruleset.active}">
                        <label for="enforcementDisabled" class="bg-radiobtn label-private" th:text="#{project.ruleset.enforcement.disabled}"></label>
                    </div>
                </div>

                <div class="box-wrap middle" id="rulesetBypass">
                    <div class="cu-label" th:text="#{project.ruleset.bypass}"></div>
                    <div class="cu-desc">
                        <div class="form-check"><label class="form-check-label">
                            <input type="checkbox" name="bypassAdmins" value="true" th:checked="${ruleset.bypassAdmins == true}" class="form-check-input">
                            <th:block th:text="#{project.ruleset.bypass.admins}"></th:block>
                        </label></div>
                        <span class="form-text" th:text="#{project.ruleset.bypass.description}"></span>
                    </div>
                </div>

                <div class="box-wrap middle" id="rulesetTarget">
                    <div class="cu-label vmiddle"><label for="rulesetPattern" th:text="#{project.ruleset.target}"></label></div>
                    <div class="cu-desc">
                        <input type="text" id="rulesetPattern" name="pattern" maxlength="255" class="input-large" th:value="${ruleset.pattern}">
                        <span class="d-inline-block align-middle pl-1 text-muted text-danger" th:if="${#lists.contains(errors, 'pattern')}" th:text="#{project.ruleset.error.pattern}"></span>
                        <span class="form-text" th:text="#{project.ruleset.target.description}"></span>
                    </div>
                </div>

                <div class="box-wrap middle" id="rulesetRules">
                    <div class="cu-label" th:text="#{project.ruleset.rules}"></div>
                    <div class="cu-desc">
                        <div class="form-check"><label class="form-check-label"><input type="checkbox" name="restrictUpdates" value="true" th:checked="${ruleset.restrictUpdates == true}" class="form-check-input">
                            <strong th:text="#{project.ruleset.rule.updates}"></strong></label></div>
                        <span class="form-text" th:text="#{project.ruleset.rule.updates.desc}"></span>

                        <div class="form-check"><label class="form-check-label"><input type="checkbox" name="restrictDeletions" value="true" th:checked="${ruleset.restrictDeletions == true}" class="form-check-input">
                            <strong th:text="#{project.ruleset.rule.deletions}"></strong></label></div>
                        <span class="form-text" th:text="#{project.ruleset.rule.deletions.desc}"></span>

                        <div class="form-check"><label class="form-check-label"><input type="checkbox" name="requireLinearHistory" value="true" th:checked="${ruleset.requireLinearHistory == true}" class="form-check-input">
                            <strong th:text="#{project.ruleset.rule.linear}"></strong></label></div>
                        <span class="form-text" th:text="#{project.ruleset.rule.linear.desc}"></span>

                        <div class="form-check"><label class="form-check-label"><input type="checkbox" name="requirePullRequest" value="true" th:checked="${ruleset.requirePullRequest == true}" class="form-check-input">
                            <strong th:text="#{project.ruleset.rule.pr}"></strong></label></div>
                        <span class="form-text" th:text="#{project.ruleset.rule.pr.desc}"></span>
                        <!--/* GitHub처럼 "풀 리퀘스트 필요"를 켰을 때만 하위 항목을 펼친다. 승인 수나 병합 조건이 이미 켜져 있으면(v1.6에서 옮긴 값 등) 적용 중인 값이 숨지 않게 펼쳐 둔다 */-->
                        <div id="rulesetPullRequestOptions" class="card card-body card-body-small ml10"
                             th:style="${ruleset.requirePullRequest == true or ruleset.requiredApprovals > 0 or ruleset.requireNoChangesRequested == true or ruleset.requireConversationResolution == true} ? '' : 'display:none;'">
                            <label for="rulesetApprovals" th:text="#{project.ruleset.rule.approvals}"></label>
                            <input type="number" id="rulesetApprovals" name="approvals" min="0" max="100" class="input-mini" th:value="${ruleset.requiredApprovals}">
                            <span class="d-inline-block align-middle pl-1 text-muted text-danger" th:if="${#lists.contains(errors, 'approvals')}" th:text="#{project.ruleset.error}"></span>
                            <span class="form-text" th:text="#{project.ruleset.rule.approvals.desc}"></span>
                            <div class="form-check"><label class="form-check-label"><input type="checkbox" name="requireNoChangesRequested" value="true" th:checked="${ruleset.requireNoChangesRequested == true}" class="form-check-input">
                                <th:block th:text="#{project.ruleset.rule.changes}"></th:block></label></div>
                            <div class="form-check"><label class="form-check-label"><input type="checkbox" name="requireConversationResolution" value="true" th:checked="${ruleset.requireConversationResolution == true}" class="form-check-input">
                                <th:block th:text="#{project.ruleset.rule.conversation}"></th:block></label></div>
                        </div>

                        <div class="form-check"><label class="form-check-label"><input type="checkbox" name="blockForcePushes" value="true" th:checked="${ruleset.blockForcePushes == true}" class="form-check-input">
                            <strong th:text="#{project.ruleset.rule.force}"></strong></label></div>
                        <span class="form-text" th:text="#{project.ruleset.rule.force.desc}"></span>
                    </div>
                </div>

                <div class="box-wrap bottom">
                    <button id="saveRuleset" type="submit" class="ybtn ybtn-success" th:text="#{project.ruleset.save}"></button>
                    <a class="ybtn" th:href="${base + '/setting/rulesets'}" th:text="#{project.ruleset.cancel}"></a>
                </div>
            </div>
        </form>

        <form th:if="${!isNew}" id="rulesetDeleteForm" method="post" class="mt10" th:action="${base + '/setting/rulesets/' + ruleset.id + '/delete'}">
            <button type="submit" class="ybtn ybtn-danger" th:text="#{project.ruleset.delete}"></button>
        </form>
    </div>
</div>

<script type="text/javascript">
    (function () {
        var toggle = document.querySelector("#rulesetForm input[name=requirePullRequest]");
        var options = document.getElementById("rulesetPullRequestOptions");
        if (!toggle || !options) { return; }
        // 풀 리퀘스트 필요를 켜면 하위 항목을 펼치고, 끄면 하위 항목이 모두 기본값일 때만 접는다(켜진 값이 숨지 않게)
        function untouched() {
            var approvals = document.getElementById("rulesetApprovals");
            return (!approvals || parseInt(approvals.value || "0", 10) === 0) &&
                !options.querySelector("input[type=checkbox]:checked");
        }
        toggle.addEventListener("change", function () {
            options.style.display = (toggle.checked || !untouched()) ? "" : "none";
        });
    })();
</script>
</th:block>
</html>
