<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  추가 개발 항목 X-34(decisions.md D-46)의 규칙 묶음 편집 화면이다. GitHub의 룰셋 편집 화면(이름, 적용 상태, 바이패스 목록, 대상 브랜치, 규칙)에 해당한다.
  다른 설정 화면(setting.html)과 같은 카드 구조(bubble-wrap, box-wrap, cu-label, cu-desc)에 부트스트랩 폼 요소(checkbox, help-block, input-*)를 쓴다.
  지금은 바이패스(프로젝트 관리자와 사이트 관리자)와 대상(패턴 하나)이 현재 수준이다(◐, 완성은 X-35).
  모델: title, projectView, ruleset(편집할 규칙 묶음. 새로 만들 때는 id가 없고, 입력 오류면 입력값을 담은 저장하지 않는 규칙 묶음), errors(오류 항목 이름 목록)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'PROJECT_SETTING', ~{::rulesetFormPage})}">
<th:block th:fragment="rulesetFormPage" th:with="project=${projectView.project}, base=${#paths.project(projectView.project.owner, projectView.project.name)}, isNew=${ruleset.id == null}">
<div class="page-wrap-outer">
    <div class="project-page-wrap shell shell-below-banner" id="rulesetFormPage">
        <th:block th:replace="~{project/menu :: settingsSidebar(${projectView})}"></th:block>
        <div class="shell-main">

        <nav aria-label="breadcrumb" class="mt10"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{${base + '/setting/rulesets'}}" th:text="#{project.ruleset}"></a></li>
            <li class="breadcrumb-item active" aria-current="page">
                <th:block th:text="${isNew} ? #{project.ruleset.new} : ${ruleset.name}"></th:block>
                <span class="badge ml10 bg-secondary" th:if="${!isNew}" th:classappend="${ruleset.active} ? 'bg-success'"
                      th:text="${ruleset.active} ? #{project.ruleset.enforcement.active} : #{project.ruleset.enforcement.disabled}"></span>
            </li>
        </ol></nav>

        <div class="alert alert-danger" id="rulesetErrors" th:if="${!#lists.isEmpty(errors)}" th:text="#{project.ruleset.error}"></div>

        <form id="rulesetForm" method="post" class="ruleset-form nm"
              th:action="${isNew} ? ${base + '/setting/rulesets'} : ${base + '/setting/rulesets/' + ruleset.id}">
            <!--/* 구역 카드(A-550): 레이블은 입력란 위에 쌓고, 규칙은 제목과 설명이 있는 선택 칸으로 둔다 */-->
            <section class="ruleset-section" id="rulesetBasics">
                <h4 class="ruleset-section-title" th:text="#{project.ruleset.section.basics}"></h4>
                <div class="mb-3">
                    <label for="rulesetName" class="form-label" th:text="#{project.ruleset.name}"></label>
                    <input type="text" id="rulesetName" name="name" maxlength="255" class="form-control" th:value="${ruleset.name}">
                    <div class="text-danger small mt-1" th:if="${#lists.contains(errors, 'name')}" th:text="#{project.ruleset.error.name}"></div>
                </div>
                <div class="ruleset-enforcement">
                    <span class="form-label d-block" th:text="#{project.ruleset.enforcement}"></span>
                    <div class="form-check form-check-inline">
                        <input name="enforcement" type="radio" class="form-check-input" id="enforcementActive" value="active" th:checked="${ruleset.active}">
                        <label for="enforcementActive" class="form-check-label" th:text="#{project.ruleset.enforcement.active}"></label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input name="enforcement" type="radio" class="form-check-input" id="enforcementDisabled" value="disabled" th:checked="${!ruleset.active}">
                        <label for="enforcementDisabled" class="form-check-label" th:text="#{project.ruleset.enforcement.disabled}"></label>
                    </div>
                </div>
            </section>

            <section class="ruleset-section" id="rulesetBypass">
                <h4 class="ruleset-section-title" th:text="#{project.ruleset.bypass}"></h4>
                <label class="rule-option">
                    <input type="checkbox" name="bypassAdmins" value="true" th:checked="${ruleset.bypassAdmins == true}" class="form-check-input">
                    <span class="rule-option-text"><strong class="rule-option-title" th:text="#{project.ruleset.bypass.admins}"></strong><span class="rule-option-desc" th:text="#{project.ruleset.bypass.description}"></span></span>
                </label>
            </section>

            <section class="ruleset-section" id="rulesetTarget">
                <h4 class="ruleset-section-title" th:text="#{project.ruleset.target}"></h4>
                <label for="rulesetPattern" class="visually-hidden" th:text="#{project.ruleset.target}"></label>
                <input type="text" id="rulesetPattern" name="pattern" maxlength="255" class="form-control" th:value="${ruleset.pattern}">
                <div class="text-danger small mt-1" th:if="${#lists.contains(errors, 'pattern')}" th:text="#{project.ruleset.error.pattern}"></div>
                <div class="form-text" th:text="#{project.ruleset.target.description}"></div>
            </section>

            <section class="ruleset-section" id="rulesetRules">
                <h4 class="ruleset-section-title" th:text="#{project.ruleset.rules}"></h4>
                <label class="rule-option">
                    <input type="checkbox" name="restrictUpdates" value="true" th:checked="${ruleset.restrictUpdates == true}" class="form-check-input">
                    <span class="rule-option-text"><strong class="rule-option-title" th:text="#{project.ruleset.rule.updates}"></strong><span class="rule-option-desc" th:text="#{project.ruleset.rule.updates.desc}"></span></span>
                </label>
                <label class="rule-option">
                    <input type="checkbox" name="restrictDeletions" value="true" th:checked="${ruleset.restrictDeletions == true}" class="form-check-input">
                    <span class="rule-option-text"><strong class="rule-option-title" th:text="#{project.ruleset.rule.deletions}"></strong><span class="rule-option-desc" th:text="#{project.ruleset.rule.deletions.desc}"></span></span>
                </label>
                <label class="rule-option">
                    <input type="checkbox" name="requireLinearHistory" value="true" th:checked="${ruleset.requireLinearHistory == true}" class="form-check-input">
                    <span class="rule-option-text"><strong class="rule-option-title" th:text="#{project.ruleset.rule.linear}"></strong><span class="rule-option-desc" th:text="#{project.ruleset.rule.linear.desc}"></span></span>
                </label>
                <label class="rule-option">
                    <input type="checkbox" name="requireSignedCommits" value="true" th:checked="${ruleset.requireSignedCommits == true}" class="form-check-input">
                    <span class="rule-option-text"><strong class="rule-option-title" th:text="#{project.ruleset.rule.signed}"></strong><span class="rule-option-desc" th:text="#{project.ruleset.rule.signed.desc}"></span></span>
                </label>
                <label class="rule-option">
                    <input type="checkbox" name="requirePullRequest" value="true" th:checked="${ruleset.requirePullRequest == true}" class="form-check-input">
                    <span class="rule-option-text"><strong class="rule-option-title" th:text="#{project.ruleset.rule.pr}"></strong><span class="rule-option-desc" th:text="#{project.ruleset.rule.pr.desc}"></span></span>
                </label>
                <!--/* GitHub처럼 "풀 리퀘스트 필요"를 켰을 때만 하위 항목을 펼친다. 승인 수나 병합 조건이 이미 켜져 있으면(v1.6에서 옮긴 값 등) 적용 중인 값이 숨지 않게 펼쳐 둔다 */-->
                <div id="rulesetPullRequestOptions" class="ruleset-pr-options"
                     th:style="${ruleset.requirePullRequest == true or ruleset.requiredApprovals > 0 or ruleset.requireNoChangesRequested == true or ruleset.requireConversationResolution == true} ? '' : 'display:none;'">
                    <label for="rulesetApprovals" th:text="#{project.ruleset.rule.approvals}"></label>
                    <input type="number" id="rulesetApprovals" name="approvals" min="0" max="100" class="input-mini form-control" th:value="${ruleset.requiredApprovals}">
                    <span class="d-inline-block align-middle ps-1 text-body-secondary text-danger" th:if="${#lists.contains(errors, 'approvals')}" th:text="#{project.ruleset.error}"></span>
                    <span class="form-text" th:text="#{project.ruleset.rule.approvals.desc}"></span>
                    <div class="form-check"><label class="form-check-label"><input type="checkbox" name="requireNoChangesRequested" value="true" th:checked="${ruleset.requireNoChangesRequested == true}" class="form-check-input">
                        <th:block th:text="#{project.ruleset.rule.changes}"></th:block></label></div>
                    <div class="form-check"><label class="form-check-label"><input type="checkbox" name="requireConversationResolution" value="true" th:checked="${ruleset.requireConversationResolution == true}" class="form-check-input">
                        <th:block th:text="#{project.ruleset.rule.conversation}"></th:block></label></div>
                </div>

                <label class="rule-option">
                    <input type="checkbox" name="blockForcePushes" value="true" th:checked="${ruleset.blockForcePushes == true}" class="form-check-input">
                    <span class="rule-option-text"><strong class="rule-option-title" th:text="#{project.ruleset.rule.force}"></strong><span class="rule-option-desc" th:text="#{project.ruleset.rule.force.desc}"></span></span>
                </label>
            </section>

            <div class="ruleset-actions">
                <button id="saveRuleset" type="submit" class="ybtn ybtn-success" th:text="#{project.ruleset.save}"></button>
                <a class="ybtn" th:href="@{${base + '/setting/rulesets'}}" th:text="#{project.ruleset.cancel}"></a>
            </div>
        </form>

        <form th:if="${!isNew}" id="rulesetDeleteForm" method="post" class="mt10" th:action="@{${base + '/setting/rulesets/' + ruleset.id + '/delete'}}">
            <button type="submit" class="ybtn ybtn-danger" th:text="#{project.ruleset.delete}"></button>
        </form>
    
        </div><!--/* .shell-main */-->
    </div>
</div>

<script type="text/javascript">
    (function () {
        var toggle = document.querySelector("#rulesetForm input[name=requirePullRequest]");
        var options = document.getElementById("rulesetPullRequestOptions");
        if (!toggle || !options) { return; }
        // 풀 리퀘스트 필요를 켜면 하위 항목을 펼치고, 끄면 하위 항목이 모두 기본값일 때만 접는다(켜진 값이 숨지 않게)
        function untouched() {
            var approvals = document.getElementById("rulesetApprovals");
            return (!approvals || parseInt(approvals.value || "0", 10) === 0) &&
                !options.querySelector("input[type=checkbox]:checked");
        }
        toggle.addEventListener("change", function () {
            options.style.display = (toggle.checked || !untouched()) ? "" : "none";
        });
    })();
</script>
</th:block>
</html>
