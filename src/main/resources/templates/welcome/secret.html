<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title th:text="#{app.welcome(${siteName})}"></title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<link rel="shortcut icon" type="image/png" th:href="@{/favicon.ico}">
<link rel="stylesheet" type="text/css" media="screen" th:href="@{/assets/stylesheets/bootstrap.css}">
<link rel="stylesheet" type="text/css" media="screen" th:href="@{/assets/stylesheets/yobi.css}">
<link rel="stylesheet" type="text/css" media="screen" th:href="@{/assets/stylesheets/yobicon/style.css}">

<script type="text/javascript" th:src="@{/assets/javascripts/lib/jquery/jquery-1.9.0.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/jquery/jquery.pjax.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/common/yobi.Common.js}"></script>
<style type="text/css">
    .secret-box { width:50%; margin:20px auto; }
    .secret-wrap { text-align:center; }
    .logo {
        display: block; text-align: center; overflow: hidden;
        width: 123px; height: 55px; line-height: 55px; font-size: 2em;
        color: #fff; background-color: #f36c22; margin:50px auto;
    }
    .logo:hover { color:#fff; }
</style>
</head>

<body>
<div class="page-wrap-outer">
    <div class="container page-wrap">
        <div class="page">
            <div class="secret-wrap">
                <a th:href="@{/}" class="logo"><span th:text="${siteName}"></span></a>

                <h3 th:text="#{app.welcome(${siteName})}"></h3>

                <div class="alert alert-block secret-box alert-warning">
                    <h4 th:text="#{app.welcome.warning.title}"></h4>
                    <th:block th:text="#{app.welcome.warning.desc}"></th:block>
                </div>
            </div>
            <div class="signup-form-wrap frm-wrap">
                <form th:action="@{/}" method="post" class="secret-form">
                    <dl>
                        <dt>
                            <label for="loginId" th:text="#{user.signupId}"></label>
                            <span th:each="error : ${errors['loginId']}" class="badge bg-danger" th:text="#{__${error}__}"></span>
                        </dt>
                        <dd>
                            <input id="loginId" type="text" name="loginId" class="text password" placeholder="" autocomplete="off" readonly th:value="${loginId}">
                        </dd>
                        <dt>
                            <label for="uname" th:text="#{user.name}"></label>
                        </dt>
                        <dd>
                            <input id="uname" type="text" name="name" class="text password" placeholder="" autocomplete="off" th:value="${name}">
                        </dd>
                        <dt>
                            <label for="email" th:text="#{user.email}"></label>
                            <span th:each="error : ${errors['email']}" class="badge bg-danger" th:text="#{__${error}__}"></span>
                        </dt>
                        <dd>
                            <input id="email" type="text" name="email" class="text password" placeholder="" autocomplete="off" th:value="${email}">
                        </dd>
                        <dt>
                            <label for="password" th:text="#{user.password}"></label>
                            <span th:each="error : ${errors['password']}" class="badge bg-danger" th:text="#{__${error}__}"></span>
                        </dt>
                        <dd>
                            <input id="password" type="password" name="password" class="text password" placeholder="" autocomplete="off">
                        </dd>
                        <dt>
                            <label for="retypedPassword" th:text="#{validation.retypePassword}"></label>
                            <span th:each="error : ${errors['retypedPassword']}" class="badge bg-danger" th:text="#{__${error}__}"></span>
                        </dt>
                        <dd>
                            <input id="retypedPassword" type="password" name="retypedPassword" class="text password" placeholder="" autocomplete="off">
                        </dd>
                    </dl>
                    <div class="btns-row">
                        <button type="submit" class="ybtn ybtn-success" th:text="#{app.welcome.submit}"></button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
<footer class="page-footer-outer">
    <div class="page-footer">
        <span class="provider">Powered by <strong th:text="${siteName}"></strong></span>
    </div>
</footer>
<script type="text/javascript">
    $(document).ready(function(){
        $("input[name=seed]").focus();
    });
</script>
</body>
</html>
