<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko" th:with="pageTitle=${post.title + ' |:| ' + @templateHelper.ogDescriptionPreview(post.body)}">
<head th:replace="~{site/layout :: head(title=${pageTitle})}">
</head>
<body class="theme-default prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'board')}"></div>
    <link rel="stylesheet" th:href="@{/{owner}/{projectName}/issue/labels.css(owner=${project.owner}, projectName=${project.name})}" type="text/css" />


    <div class="page-wrap-outer">
        <div class="project-page-wrap board-view">
            <!-- Post Info -->
            <div class="board-header issue">
                <div class="pull-right mr10 mt10 hide-in-mobile">
                    <div class="date" th:title="${templateHelper.getDateString(post.createdDate)}" th:text="${templateHelper.agoOrDateString(post.createdDate)}">
                        작성일
                    </div>
                </div>
                <div class="title">
                    <strong class="board-id" th:text="'#' + ${post.number}">#1</strong>
                    <span th:text="${post.title}">게시글 제목</span>
                </div>
            </div>

            <!-- Content body -->
            <div class="board-body row-fluid">
                <div class="span9 span-left-pane">
                    <div class="author-info">
                        <a href="javascript:void(0);" class="usf-group">
                            <span class="avatar-wrap smaller">
                                <img src="/images/default-avatar-128.png" width="20" height="20">
                            </span>
                            <strong class="name" th:text="${post.authorName != null ? post.authorName : post.authorLoginId}">작성자</strong>
                            <span class="loginid"> <strong>@</strong><span th:text="${post.authorLoginId}">loginId</span></span>
                        </a>
                    </div>

                    <!-- legacy board/view.scala.html "@if(StringUtils.isNotEmpty(post.history))" 블록 대응 -->
                    <div class="posting-history" th:if="${post.history != null and !#strings.isEmpty(post.history)}">
                        <a th:if="${currentUser == null}" th:href="@{/users/loginform}" th:text="#{change.history}">변경 이력</a>
                        <th:block th:if="${currentUser != null}">
                            <a href="#-yona-posting-history" data-toggle="modal" th:text="#{change.history}">변경 이력</a>
                            <div th:replace="~{common/partial_history :: partial_history(${post})}"></div>
                        </th:block>
                    </div>

                    <div th:id="'post-' + ${post.number}" class="hide">
                        <form th:action="@{/api/projects/{projectId}/posts/{postId}/content(projectId=${project.id}, postId=${post.number})}">
                            <textarea th:text="${post.body}"></textarea>
                        </form>
                    </div>
                    <div th:id="'post-body-' + ${post.number}">
                        <div class="tasklist">
                            <div class="task-title">Tasks<span class="done-counter"></span></div>
                            <div class="task-progress">
                                <div class="bar red" style="width: 0;" title="Tasklist"></div>
                            </div>
                        </div>
                        <div class="content markdown-wrap" th:data-allowed-update="${isAllowedUpdate}" th:utext="${markdownService.render(post.body, true, project)}">본문 내용</div>
                    </div>
                    
                    <div class="attachments" id="attachments" th:data-attachments="${attachmentsJson}"></div>
                    
                    <div class="board-actrow right-txt">
                        <div class="pull-left">
                            <div>
                                <button id="watch-button" type="button" class="ybtn" th:classappend="${isWatching ? 'ybtn-watching' : ''}"
                                        data-toggle="tooltip" data-placement="top" th:title="#{issue.watch.description}" th:data-watching="${isWatching}"
                                        th:text="${isWatching ? #messages.msg('post.unwatch') : #messages.msg('post.watch')}">
                                    지켜보기
                                </button>
                            </div>
                        </div>

                        <button type="button" id="translate" class="icon btn-transparent-with-fontsize-lineheight ml10" data-toggle="tooltip" th:title="#{button.translation}"><i class="yobicon-lang"></i></button>
                        <div class="watcher-list" style="margin-top: 10px;"></div>

                        <span class="act-row">
                            <!-- issue/view.html과 동일한 이유로 th:onclick 대신 data-* + 정적 onclick으로
                                 우회한다 — th:onclick으로 쓰면 TemplateProcessingException이 발생했다. -->
                            <button th:if="${isAllowedUpdate}" type="button" class="icon btn-transparent-with-fontsize-lineheight ml10 pt5px" data-toggle="tooltip" th:title="#{button.edit}" th:data-edit-url="@{/{owner}/{projectName}/post/{number}/editform(owner=${project.owner}, projectName=${project.name}, number=${post.number})}" onclick="window.location=this.getAttribute('data-edit-url')"><i class="yobicon-edit-2"></i></button>
                            <a th:if="${!isAllowedUpdate}" th:href="@{/{owner}/{projectName}/post/{number}/editform(owner=${project.owner}, projectName=${project.name}, number=${post.number})}">
                                <button type="button" class="icon btn-transparent-with-fontsize-lineheight ml10 pt5px" data-toggle="tooltip" th:title="#{button.show.original}"><i class="yobicon-edit-2"></i></button>
                            </a>
                            <th:block th:if="${isAllowedUpdate}">
                                <a href="#deleteConfirm" data-toggle="modal">
                                    <button type="button" class="icon btn-transparent-with-fontsize-lineheight ml6" data-toggle="tooltip" th:title="#{button.delete}"><i class="yobicon-trash"></i></button>
                                </a>
                            </th:block>
                        </span>
                    </div>

                    <div id="comments" class="board-comment-wrap">
                        <div id="timeline">
                            <!-- P3-53 항목2: legacy board/partial_comments.scala.html의 <ul class="comments"> 대응.
                                 yobi.css의 숨김 규칙(.board-comment-wrap .comments .comment .add-a-comment 등)이
                                 .board-comment-wrap과 .comment 사이에 .comments 조상 클래스를 요구하는데,
                                 이 클래스가 없으면 그 선택자가 매치되지 않아 대댓글 입력창이 상시 펼쳐진 채로
                                 보인다(브라우저 기본값 display:block). -->
                            <div class="timeline-list comments">
                                <div th:each="comment : ${comments}"
                                     th:with="children=${childCommentsByParentId != null ? childCommentsByParentId.get(comment.id) : null}, canEditThisComment=${currentUser != null and (comment.authorId == currentUser.id or isProjectManager)}, postingCommentResourceType=${T(com.github.yonaprojects.yona.domain.enumeration.ResourceType).NONISSUE_COMMENT}"
                                     class="comment" th:classappend="${currentUser != null and comment.authorLoginId == currentUser.loginId} ? ' author'" th:id="'comment-' + ${comment.id}">
                                    <div th:replace="~{common/childCommentsAnchorDiv :: anchorDiv(${children})}"></div>
                                    <div class="comment-avatar">
                                        <span class="avatar-wrap"><img src="/images/default-avatar-128.png" width="32" height="32"></span>
                                    </div>
                                    <div class="media-body">
                                    <div class="comment-body">
                                        <div class="author-info meta-info">
                                            <strong class="name" th:text="${comment.authorName != null ? comment.authorName : comment.authorLoginId}">댓글작성자</strong>
                                            <span class="date" th:text="${templateHelper.agoOrDateString(comment.createdDate)}">작성일</span>
                                            <span class="act-row pull-right">
                                                <!-- 댓글 인라인 수정/삭제 버튼 -->
                                                <button th:if="${currentUser != null}" type="button" class="btn-transparent-with-fontsize-lineheight ml10" data-toggle="comment-edit" th:data-comment-id="${comment.id}" th:title="#{common.comment.edit}"><i class="yobicon-edit-2"></i></button>
                                                <button th:if="${currentUser != null and (comment.authorId == currentUser.id or isProjectManager)}" type="button" class="btn-transparent-with-fontsize-lineheight ml6" data-toggle="comment-delete" th:data-request-uri="${commentApiBase} + '/' + ${comment.id}" th:title="#{common.comment.delete}"><i class="yobicon-trash"></i></button>
                                            </span>
                                        </div>
                                        <div th:replace="~{common/commentUpdateForm :: updateForm(${comment}, ${commentApiBase}, ${canEditThisComment}, ${postingCommentResourceType}, ${commentAttachmentsByCommentId != null ? commentAttachmentsByCommentId.get(comment.id) : null}, @{/{owner}/{projectName}/post/{number}/comment/{commentId}(owner=${project.owner}, projectName=${project.name}, number=${post.number}, commentId=${comment.id})})}"></div>
                                        <div th:id="'comment-body-' + ${comment.id}">
                                            <!-- P3-60: legacy board/partial_comments.scala.html:67-70 대응 —
                                                 본문(56-62행)에는 이미 있던 .tasklist 셸/data-allowed-update가
                                                 댓글 쪽엔 빠져 있었다(issue/view.html과 동일한 대칭적 격차). -->
                                            <div class="tasklist">
                                                <div class="task-title">Tasks<span class="done-counter"></span></div>
                                                <div class="task-progress">
                                                    <div class="bar red" style="width: 0;" title="Tasklist"></div>
                                                </div>
                                            </div>
                                            <div class="content markdown-wrap" th:data-allowed-update="${canEditThisComment}" th:utext="${markdownService.render(comment.contents, true, project)}">댓글내용</div>
                                        </div>
                                    </div>
                                    <div th:replace="~{common/childComments :: childComments(${comment}, ${children}, ${project}, ${commentApiBase}, ${currentUser}, ${isProjectManager})}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 댓글 등록 폼 영역 -->
                        <th:block sec:authorize="isAuthenticated()">
                            <form id="comment-form" th:data-api-base="${commentApiBase}" th:action="@{/{owner}/{projectName}/post/{postNumber}/comment(owner=${project.owner}, projectName=${project.name}, postNumber=${post.number})}" method="post" enctype="multipart/form-data">
                                <div class="write-comment-box">
                                    <div th:replace="~{site/layout :: markdownEditor('contents', '', 'comment-body')}"></div>

                                    <div th:replace="~{common/uploadForm :: uploadForm('NONISSUE_COMMENT', null, 'upload')}"></div>

                                    <div class="write-comment-wrap">
                                        <div class="right-txt">
                                            <button type="submit" class="ybtn ybtn-success" th:text="#{button.comment.new}">댓글 등록</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </th:block>

                        <!-- 비로그인 사용자용 안내 영역 -->
                        <th:block sec:authorize="isAnonymous()">
                            <div class="write-comment-box mt20" th:title="#{error.auth.unauthorized.comment}" data-login="required">
                                <div class="write-comment-wrap">
                                    <div class="textarea-box">
                                        <textarea class="comment disabled" disabled="disabled" style="cursor:text;" th:placeholder="#{error.auth.unauthorized.comment}"></textarea>
                                    </div>
                                    <div class="right-txt mt10">
                                        <span class="ybtn ybtn-disabled" th:text="#{button.comment.new}">댓글 등록</span>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                    </div>
                </div>

                <!-- Right Pane -->
                <div class="span3 span-right-pane mb20">
                    <div class="issue-info board-labels">
                        <dl>
                            <dd class="project-btn-item">
                                <a th:href="@{/{owner}/{projectName}/post/new(owner=${project.owner}, projectName=${project.name})}" class="ybtn ybtn-success" th:text="#{post.write}">글쓰기</a>
                            </dd>
                        </dl>

                        <!-- labels -->
                        <th:block th:with="projectLabels=${@templateHelper.getProjectLabels(project)}">
                            <div th:if="${projectLabels != null and !projectLabels.isEmpty()}">
                                <div th:if="${isAllowedUpdate}">
                                    <div th:replace="~{issue/partial_select_label :: selectLabel(${projectLabels}, ${post.labels}, '', '', ${project})}"></div>
                                </div>
                                <div th:unless="${isAllowedUpdate}">
                                    <div th:replace="~{issue/partial_show_selected_label :: showLabel(${post.labels}, '')}"></div>
                                </div>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>

            <div class="board-footer" style="margin-top: 15px; margin-bottom: 15px;">
                <div th:replace="~{help/keymap :: keymap('boardDetail', ${project})}"></div>
            </div>
        </div>
    </div>

    <!-- Confirm to delete post -->
    <div id="deleteConfirm" class="modal hide fade">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">×</button>
            <h3 th:text="#{post.delete}">글 삭제</h3>
        </div>
        <div class="modal-body">
            <p th:text="#{post.delete.confirm}">정말 이 글을 삭제하시겠습니까?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="ybtn ybtn-danger" data-request-method="delete" th:data-request-uri="@{/api/projects/{projectId}/posts/{number}(projectId=${project.id}, number=${post.number})}" th:text="#{button.yes}">예</button>
            <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}">아니요</button>
        </div>
    </div>

    <div th:replace="~{common/commentDeleteModal :: commentDeleteModal('#comments')}"></div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script type="text/javascript" src="/javascripts/common/yona.Tasklist.js"></script>
<!-- P3-50: 댓글 수정 폼(common/commentUpdateForm)의 기존 첨부파일 목록 클릭/드래그드롭/붙여넣기/
     삭제를 담당 — legacy와 동일하게 issue/board view 두 화면에서만 로드한다. -->
<script type="text/javascript" src="/javascripts/common/yona.CommentAttachmentsUpdate.js"></script>
<!-- P3-53 항목2: 대댓글 입력창(.add-a-comment/.child-comment-input-form) hover 노출/클릭 토글 담당.
     제출은 이미 아래 인라인 스크립트의 delegated .child-comment-form submit 핸들러가 AJAX로 처리하므로
     이 파일은 순수 표시/토글 UI만 담당해 충돌하지 않는다. -->
<script type="text/javascript" src="/javascripts/common/yona.SubComment.js"></script>
<script type="text/javascript">
    $(function(){
        $yobi.loadModule("board.View", {
            "postId"  : "[[${post.id}]]",
            "urls"     : {
                "watch"     : "/watch",
                "unwatch"   : "/unwatch"
            }
        });

        $('[data-request-method="delete"]').click(function(){
            var uri = $(this).data("requestUri");
            $.ajax({
                url: uri,
                type: "DELETE",
                success: function() {
                    window.location = "[[@{/{owner}/{projectName}/posts(owner=${project.owner}, projectName=${project.name})}]]";
                }
            });
        });

        // ===== 댓글 인라인 수정/대댓글 AJAX 배선 =====
        $(document).on('click', '[data-toggle="comment-edit"]', function(){
            var id = $(this).data('commentId');
            $('#comment-body-' + id).hide();
            $('#comment-editform-' + id).show();
        });
        $(document).on('click', '.ybtn-cancel', function(){
            var id = $(this).data('commentId');
            $('#comment-editform-' + id).hide();
            $('#comment-body-' + id).show();
        });
        // P3-48 화면별 재현 세션에서 발견: issue/view.html과 동일하게, 새 댓글 등록 폼
        // (#comment-form)의 th:action이 가리키는 "/{owner}/{projectName}/post/{postNumber}/comment"
        // 경로가 어느 컨트롤러에도 매핑돼 있지 않았다(Playwright로 실제 등록 시 항상 404 —
        // CSRF와는 무관한 별도 결함). 형제 폼들과 동일하게 REST(POST .../comments)로 전환한다.
        //
        // P3-52 항목3 — yobi.CommentForm.js 대응(빈 값 제출 방지/Ctrl+Shift+Enter 단축 제출/
        // beforeunload 이탈 경고/localStorage 임시저장). issue/view.html과 동일한 이유(legacy
        // 원본의 네이티브 form.submit() 재스케줄링이 이미 검증된 AJAX 핸들러와 공존 불가)로
        // 원본 파일을 로드하지 않고 이 AJAX 핸들러에 직접 재구현한다.
        var $commentForm = $('#comment-form');
        var $commentTextarea = $commentForm.find('textarea[name="contents"]');
        function isCommentFormBodyEmpty(){
            return !($commentTextarea.val() || '').trim().length;
        }
        if ($commentTextarea.length) {
            temporarySaveHandler($commentTextarea);

            // issue/view.html과 동일한 이유(EasyMDE/CodeMirror가 원본 textarea를 숨기고 실제
            // 입력은 별도 DOM에서 일어남)로 document 레벨에서 활성 엘리먼트가 이 폼 안에 있을 때만
            // 반응하도록 한다.
            $(document).on('keydown', function(e){
                var isSubmitCombo = (e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 13 || e.key === 'Enter');
                if (isSubmitCombo && document.activeElement && $.contains($commentForm[0], document.activeElement)) {
                    e.preventDefault();
                    $commentForm.trigger('submit');
                }
            });

            $(window).on('beforeunload', function(){
                if (!isCommentFormBodyEmpty() && !$commentForm.data('onsubmit')) {
                    return '[[#{common.comment.beforeunload.confirm}]]';
                }
            });
        }

        $(document).on('submit', '#comment-form', function(e){
            e.preventDefault();
            var $form = $(this);
            if (isCommentFormBodyEmpty()) {
                $yobi.notify('[[#{post.comment.empty}]]', 3000);
                $commentTextarea.focus();
                return;
            }
            var apiBase = $form.data('apiBase');
            var contents = $commentTextarea.val();
            $form.data('onsubmit', true);
            $.ajax({
                url: apiBase,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ contents: contents }),
                success: function(){
                    removeCurrentPageTemprarySavedContent();
                    window.location.reload();
                },
                error: function(xhr){
                    $form.data('onsubmit', false);
                    alert('[[#{button.comment.new}]] failed: ' + (xhr.responseJSON && xhr.responseJSON.message || xhr.responseText || ''));
                }
            });
        });
        $(document).on('submit', '.comment-update-form form', function(e){
            e.preventDefault();
            var $form = $(this);
            var apiBase = $form.data('apiBase');
            var commentId = $form.data('commentId');
            var contents = $form.find('textarea[data-editor-mode="update-comment-body"]').val();
            // P3-50: "알림 메일 받기" 체크박스(작성자 본인에게만 노출) 상태를 함께 보낸다.
            var sendNotificationMail = $form.find('.send-notification-checkbox').is(':checked');
            $.ajax({
                url: apiBase + '/' + commentId,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ contents: contents, sendNotificationMail: sendNotificationMail }),
                success: function(){ window.location.reload(); },
                error: function(xhr){ alert('[[#{common.comment.edit}]] failed: ' + (xhr.responseJSON && xhr.responseJSON.message || xhr.responseText || '')); }
            });
        });
        $(document).on('submit', '.child-comment-form', function(e){
            e.preventDefault();
            var $form = $(this);
            var apiBase = $form.data('apiBase');
            var parentCommentId = $form.data('parentCommentId');
            var contents = $form.find('textarea[name="contents"]').val();
            $.ajax({
                url: apiBase,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ contents: contents, parentCommentId: parentCommentId }),
                success: function(){ window.location.reload(); },
                error: function(xhr){ alert('[[#{button.comment.new}]] failed: ' + (xhr.responseJSON && xhr.responseJSON.message || xhr.responseText || '')); }
            });
        });
    });
</script>
</body>
</html>
