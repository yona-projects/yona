<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(title=${project.name} + ' - 글 수정')}">
</head>
<body class="theme-default prj" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>
    <div th:replace="~{project/header :: header(${project})}"></div>
    <div th:replace="~{project/menu :: menu(${project}, 'board')}"></div>

    <div class="page-wrap-outer">
        <div class="project-page-wrap">
            <form id="post-form" method="post" enctype="multipart/form-data" class="nm">
                <div class="content-wrap frm-wrap">
                    <dl>
                        <dt>
                            <label for="title" th:text="#{title}">제목</label>
                        </dt>
                        <dd>
                            <input type="text" id="title" name="title" th:value="${post.title}" class="zen-mode text title" maxlength="250" tabindex="1" autocomplete="off"/>
                        </dd>
                        <dd style="position: relative;">
                            <div th:replace="~{site/layout :: markdownEditor('body', ${post.body}, 'content-body')}"></div>
                        </dd>
                    </dl>

                    <!-- 파일 업로더 영역 -->
                    <!-- Vue 3 SFC(components/vue-widgets, 2026-09-17 적용) - <yona-attachments>가
                         드롭존/업로드 버튼/카드 목록/temporaryUploadFiles 히든 필드를 전부 자체
                         소유한다. -->
                    <yona-attachments data-resource-type="BOARD_POST" th:data-resource-id="${post.id}" id="upload"></yona-attachments>

                    <div class="right-txt mt10 mb10">
                        <label class="checkbox" th:if="${isAllowedToNotice}">
                            <input type="checkbox" id="notice" name="notice" th:checked="${post.notice}"/>
                            <span th:text="#{post.notice.label}">공지로 등록</span>
                        </label>

                        <label class="checkbox" th:if="${canReadmefy}">
                            <input type="checkbox" id="readme" name="readme" th:checked="${post.readme}"/>
                            <span th:text="#{post.readmefy}">README로 지정</span>
                        </label>
                    </div>

                    <div class="actions">
                        <span class="send-notification-check" th:if="${currentUser != null && post.authorId == currentUser.id && !post.readme}">
                            <label class="checkbox inline">
                                <input type="checkbox" name="sendNotificationMail" id="sendNotificationMail" checked="checked"/>
                                <strong th:text="#{notification.send.mail}">수정 알림 메일 발송</strong>
                            </label>
                        </span>
                        <button type="submit" class="ybtn ybtn-info" tabindex="3" th:text="#{button.save}">저장</button>
                        <a href="javascript:history.back();" class="ybtn" tabindex="4" th:text="#{button.cancel}">취소</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function(){
        $yona.loadModule("board.Write", {
            "sMode"     : "edit",
            "elTextarea": 'textarea[data-editor-mode="content-body"]'
        });

        var elPostForm = document.getElementById("post-form");
        if (elPostForm) {
            elPostForm.addEventListener("submit", function(e) {
                e.preventDefault();

                var projectId = [[${project.id}]];
                var postId = [[${post.number}]];
                var owner = /*[[${project.owner}]]*/ '';
                var projectName = /*[[${project.name}]]*/ '';

                var elTitle = document.getElementById("title");
                var elBody = document.querySelector('textarea[id^=editor-]');
                var elNotice = document.getElementById("notice");
                var elSendNotificationMail = document.getElementById("sendNotificationMail");
                // legacy board/edit.scala.html:59-64 대응 — readme 체크박스가 없으면(권한/VCS 조건
                // 불충족) legacy도 posting.readme가 항상 false로 바인딩된다(폼에 필드 자체가 없으므로).
                var elReadme = document.getElementById("readme");

                var title = elTitle ? elTitle.value : undefined;
                var body = elBody ? elBody.value : undefined;
                var notice = !!(elNotice && elNotice.checked);
                var sendNotificationMail = !!(elSendNotificationMail && elSendNotificationMail.checked);
                var readme = !!(elReadme && elReadme.checked);

                var requestData = {
                    title: title,
                    body: body,
                    notice: notice,
                    readme: readme,
                    sendNotificationMail: sendNotificationMail
                };

                fetch('/api/projects/' + projectId + '/posts/' + postId, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(requestData)
                }).then(function(response) {
                    if (response.ok) {
                        alert("글이 성공적으로 수정되었습니다.");
                        window.location.href = '/' + owner + '/' + projectName + '/post/' + postId;
                    } else {
                        return response.text().then(function(text) {
                            alert("수정 실패: " + text);
                        });
                    }
                });
            });
        }
    });
</script>
</body>
</html>
