<!DOCTYPE html>

  이식 원본: app/views/milestone/create.scala.html
  모델: title, projectView, input(title, contents, dueDate, state), errors(필드 → 메시지 키 목록), titleValue, contentsValue, signedIn
  만들기 폼은 상태를 항상 열림으로 표시한다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'MILESTONE', ~{::createPage})}">
<th:block th:fragment="createPage" th:with="project=${projectView.project}, base=${#paths.project(projectView.project.owner, projectView.project.name)}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'MILESTONE', '')}"></th:block>

<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="content-wrap frm-wrap">
            <form th:action="${base + '/milestones'}" method="post" id="milestone-form">
                <div class="row">
                    <div class="col-lg-12">
                        <dl>
                            <dd>
                                <input type="text" id="title" name="title" th:value="${titleValue}" class="zen-mode text title" th:classappend="${errors['title'] != null} ? 'error'" maxlength="250" tabindex="1" th:placeholder="#{title.text}">
                                <div th:if="${errors['title'] != null}" class="message">
                                    <div th:each="error : ${errors['title']}" th:text="#{${error}}"></div>
                                </div>
                            </dd>
                        </dl>
                    </div>

                    <div class="row">
                        <div class="col-lg-9 span-left-pane">
                            <dl>
                                <dd style="position: relative;">
                                    <th:block th:replace="~{common/editor :: editor('contents', ${contentsValue}, 'tabindex=2', 'content-body', false)}"></th:block>
                                </dd>
                            </dl>

                            <th:block th:if="${signedIn}">
                                <th:block th:replace="~{common/file-uploader :: fileUploader('MILESTONE', null)}"></th:block>
                            </th:block>

                            <div class=" actrow right-txt">
                                <button type="submit" class="ybtn ybtn-info" th:text="#{button.save}"></button><!--
                            --><a th:href="${base + '/milestones'}" class="ybtn" th:text="#{button.cancel}"></a>
                            </div>
                        </div>
                        <div class="col-lg-3 span-hard-wrap">
                            <dl class="issue-option">
                                <dt th:text="#{milestone.form.state}"></dt>
                                <dd>
                                    <div>
                                        <input type="radio" name="state" value="OPEN" id="milestone-open" class="radio-btn" th:attr="checked=${openChecked} ? 'checked'"><label for="milestone-open" class="bold" th:text="#{milestone.state.open}"></label>&nbsp;
                                        <input type="radio" name="state" value="CLOSED" id="milestone-close" class="radio-btn"><label for="milestone-close" class="bold" th:text="#{milestone.state.closed}"></label>
                                    </div>
                                </dd>
                            </dl>
                            <dl class="issue-option">
                                <dt th:text="#{milestone.form.dueDate}"></dt>
                                <dd>
                                    <div>
                                        <label for="dueDate">
                                            <input type="text" name="dueDate" id="dueDate" class="validate due-date" autocomplete="off" th:value="${input.dueDate}">
                                        </label>
                                        <div id="datepicker" class="date-picker"></div>
                                    </div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<th:block th:replace="~{common/markdown :: markdown(${projectView.project})}"></th:block>

<link rel="stylesheet" type="text/css" media="screen" th:href="@{/assets/javascripts/lib/atjs/jquery.atwho.css}">
<script type="text/javascript" th:src="@{/assets/javascripts/lib/atjs/jquery.caret.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/atjs/jquery.atwho.js}"></script>
<link rel="stylesheet" type="text/css" th:href="@{/assets/javascripts/lib/pikaday/pikaday.css}" />
<script type="text/javascript" th:src="@{/assets/javascripts/lib/moment-with-langs.min.js}"></script>
<script type="text/javascript" th:src="@{/assets/javascripts/lib/pikaday/pikaday.js}"></script>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function() {
        // yobi.milestone.Write
        $yobi.loadModule("milestone.Write", {
            "elDueDate"   : $("#dueDate"),
            "elDatePicker": $("#datepicker")
        });

        // yobi.Mention
        yobi.Mention({
            "target": "textarea[id^=editor-]",
            "url"   : /*[[${#paths.project(projectView.project.owner, projectView.project.name) + '/mentionList'}]]*/ ""
        });
    });
</script>
</th:block>
</html>
