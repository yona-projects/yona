  이식 원본: app/views/milestone/view.scala.html
  모델: title, projectView, milestone, status(MilestoneStatus), issueState, contentsHtml, attachmentsJson, canDelete, canUpdate
  이슈 탭과 이슈 목록(`#issues`)은 이슈 화면을 옮길 때 더한다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'MILESTONE', ~{::viewPage})}">
<th:block th:fragment="viewPage" th:with="project=${projectView.project}, base=${'/' + projectView.project.owner + '/' + projectView.project.name}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'MILESTONE', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="milesion-wrap">
            <h4>
                <a th:href="${base + '/milestone/' + milestone.id}" class="title" th:text="${milestone.title}"></a>
                <small class="ml10">
                    <th:block th:if="${status.dueDateString != null}">
                        <span class="due-date"><th:block th:text="#{label.dueDate}"></th:block> <strong th:text="${status.dueDateString}"></strong></span>
                        <span th:if="${milestone.state.name() != 'CLOSED'}" class="date">(<th:block th:text="${status.until}"></th:block>)</span>
                    </th:block>
                    <span class="badge margin-left-5" th:classappend="'badge-issue-' + ${milestone.state.state.toLowerCase()}" th:text="#{'milestone.state.' + ${milestone.state.state}}"></span>
                </small>
            </h4>

            <div class="progress progress-success">
                <div class="bar" th:style="'width: ' + ${status.completionRate} + '%;'"></div>
            </div>
            <div th:if="${contentsHtml == null}" class="content empty-content"></div>
            <div th:unless="${contentsHtml == null}" class="milestone-desc">
                <div class="markdown-wrap" th:utext="${contentsHtml}"></div>
                <div class="attachments" th:attr="data-attachments=${attachmentsJson}"></div>
            </div>

            <div class="actrow right-txt row-fluid" style="padding: 15px 0; clear:both;">
                <a th:href="${base + '/milestones'}" class="ybtn pull-left" th:text="#{button.list}"></a>

                <a th:if="${canDelete}" href="#deleteConfirm" data-toggle="modal" class="ybtn ybtn-danger" th:text="#{button.delete}"></a>

                <th:block th:if="${canUpdate}">
                    <a th:href="${base + '/milestone/' + milestone.id + '/editform'}" class="ybtn" th:text="#{button.edit}"></a>

                    <button th:if="${milestone.state.name() == 'OPEN'}" type="button" data-request-method="post" th:attr="data-request-uri=${base + '/milestone/' + milestone.id + '/close'}" class="ybtn" th:text="#{milestone.close}"></button>
                    <button th:if="${milestone.state.name() == 'CLOSED'}" type="button" data-request-method="post" th:attr="data-request-uri=${base + '/milestone/' + milestone.id + '/open'}" class="ybtn" th:text="#{milestone.open}"></button>
                </th:block>
            </div>
        </div>
    </div>
</div>

<!--/* Confirm to delete milestone */-->
<div id="deleteConfirm" class="modal hide fade">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">×</button>
        <h3 th:text="#{milestone.delete}"></h3>
    </div>
    <div class="modal-body">
        <p th:text="#{post.delete.confirm}"></p>
    </div>
    <div class="modal-footer">
        <button type="button" class="ybtn ybtn-danger" data-request-method="delete" th:attr="data-request-uri=${base + '/milestone/' + milestone.id + '/delete'}" th:text="#{button.yes}"></button>
        <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}"></button>
    </div>
</div>

<th:block th:replace="~{common/markdown :: markdown(${projectView.project})}"></th:block>
<link rel="stylesheet" th:href="${base + '/issue/labels.css'}" type="text/css" />
</th:block>
</html>
