<!DOCTYPE html>

  이식 원본: app/views/milestone/view.scala.html
  모델: title, projectView, milestone, status(MilestoneStatus), issueState, contentsHtml, attachmentsJson, canDelete, canUpdate
  모델에 issueCounts(열림, 닫힘, 전체 이슈 수), items(보여 줄 이슈), massUpdate가 더해진다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'MILESTONE', ~{::viewPage})}">
<th:block th:fragment="viewPage" th:with="project=${projectView.project}, base=${#paths.project(projectView.project.owner, projectView.project.name)}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'MILESTONE', '')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="milesion-wrap">
            <h4>
                <a th:href="${base + '/milestone/' + milestone.id}" class="title" th:text="${milestone.title}"></a>
                <small class="ml10">
                    <th:block th:if="${status.dueDateString != null}">
                        <span class="due-date"><th:block th:text="#{label.dueDate}"></th:block> <strong th:text="${status.dueDateString}"></strong></span>
                        <span th:if="${milestone.state.name() != 'CLOSED'}" class="date">(<th:block th:text="${status.until}"></th:block>)</span>
                    </th:block>
                    <span class="badge rounded-pill margin-left-5" th:classappend="'badge-issue-' + ${milestone.state.state.toLowerCase()}" th:text="#{'milestone.state.' + ${milestone.state.state}}"></span>
                </small>
            </h4>

            <div class="progress">
                <div class="progress-bar bg-success" th:style="'width: ' + ${status.completionRate} + '%;'"></div>
            </div>
            <div th:if="${contentsHtml == null}" class="content empty-content"></div>
            <div th:unless="${contentsHtml == null}" class="milestone-desc">
                <div class="markdown-wrap" th:utext="${contentsHtml}"></div>
                <div class="attachments" th:attr="data-attachments=${attachmentsJson}"></div>
            </div>

            <div class="actrow right-txt" style="padding: 15px 0; clear:both;">
                <a th:href="${base + '/milestones'}" class="ybtn float-start" th:text="#{button.list}"></a>

                <a th:if="${canDelete}" href="#deleteConfirm" data-bs-toggle="modal" class="ybtn ybtn-danger" th:text="#{button.delete}"></a>

                <th:block th:if="${canUpdate}">
                    <a th:href="${base + '/milestone/' + milestone.id + '/editform'}" class="ybtn" th:text="#{button.edit}"></a>

                    <button th:if="${milestone.state.name() == 'OPEN'}" type="button" data-request-method="post" th:attr="data-request-uri=${base + '/milestone/' + milestone.id + '/close'}" class="ybtn" th:text="#{milestone.close}"></button>
                    <button th:if="${milestone.state.name() == 'CLOSED'}" type="button" data-request-method="post" th:attr="data-request-uri=${base + '/milestone/' + milestone.id + '/open'}" class="ybtn" th:text="#{milestone.open}"></button>
                </th:block>
            </div>

            <div id="issues">
                <ul class="nav nav-tabs mb-3">
                    <li th:each="tab : ${ {'open', 'closed', 'all'} }" class="nav-item">
                        <a th:href="${base + '/milestone/' + milestone.id + '?state=' + tab + '#issues'}" class="nav-link" th:classappend="${issueState.state == tab} ? 'active'">
                            <th:block th:text="#{'issue.state.' + ${tab}}"></th:block>
                            <span class="num-badge" th:text="${issueCounts.get(tab)}"></span>
                        </a>
                    </li>
                </ul>

                <div class="issues">
                    <div class="filter-wrap mass-update-sticky">
                        <th:block th:replace="~{issue/partial-massupdate :: massupdate}"></th:block>
                        <div class="float-end search search-bar">
                            <input name="filter" class="textbox" type="text" th:placeholder="#{milestone.searchPlaceholder}" value="" data-toggle="item-search" data-items="issue-item">
                            <button type="submit" class="search-btn"><i class="yobicon-search"></i></button>
                        </div>
                    </div>
                    <th:block th:replace="~{issue/partial-list :: list(${items})}"></th:block>
                </div>
            </div>
        </div>
    </div>
</div>

<!--/* Confirm to delete milestone */-->
<div id="deleteConfirm" class="modal fade"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <h3 th:text="#{milestone.delete}"></h3>
    </div>
    <div class="modal-body">
        <p th:text="#{post.delete.confirm}"></p>
    </div>
    <div class="modal-footer">
        <button type="button" class="ybtn ybtn-danger" data-request-method="delete" th:attr="data-request-uri=${base + '/milestone/' + milestone.id + '/delete'}" th:text="#{button.yes}"></button>
        <button type="button" class="ybtn" data-bs-dismiss="modal" th:text="#{button.no}"></button>
    </div>
</div></div></div>

<th:block th:replace="~{common/markdown :: markdown(${projectView.project})}"></th:block>
<link rel="stylesheet" th:href="${base + '/issue/labels.css'}" type="text/css" />
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        // when a user click head of title, it works like issue filter
        $(".title-prefix").on('click', function () {
            $(".textbox").val($(this).text());
            $(".post-item").hide();
            $("li[data-value*='"+$(".textbox").val() + "']").show();
            $(".textbox").focus();
        });
        $yobi.loadModule("milestone.View", {
            "sMilestoneId" : /*[[${#strings.toString(milestone.id)}]]*/ "",
            "sURLLabels"   : /*[[${base + '/issues'}]]*/ ""
        });

        // detect links contains mention at me
        $(".user-link:contains('[(${helper.escape(currentUser.pureName)})]')").addClass("me");
    });
</script>
</th:block>
</html>
