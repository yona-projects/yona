<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(#{title.login})}">
</head>
<body class="" id="html-body">
<div id="main" class="main">
    <div th:replace="~{site/layout :: gnb}"></div>

    <div class="page full">
      <div class="center-wrap tag-line-wrap login">
        <h1 class="title">
          <span class="highlight">Yona</span> 로그인
        </h1>
        <p class="tag-line" th:text="#{app.description}">21세기 소프트웨어 개발 플랫폼</p>
      </div>
      
      <div class="login-form-wrap frm-wrap">
        <div class="email-verification-help" th:text="#{notification.confirm.mail.will.be.sent}">최초 로그인일 경우 확인 메일이 발송됩니다.</div>
        <!-- 에러 및 성공 메시지 -->
        <div class="alert alert-danger" th:if="${loginError}" th:text="${loginError}" style="margin: 10px 0; color: #b94a48; background-color: #f2dede; border: 1px solid #eed3d7; padding: 8px 14px; border-radius: 4px; text-align: left;"></div>
        <div class="alert alert-success" th:if="${param.signupSuccess}" style="margin: 10px 0; color: #468847; background-color: #dff0d8; border: 1px solid #d6e9c6; padding: 8px 14px; border-radius: 4px; text-align: left;" th:text="#{title.signUpSuccess}">회원가입이 완료되었습니다. 로그인해 주세요.</div>
        <div class="alert alert-success" th:if="${logoutMessage}" th:text="${logoutMessage}" style="margin: 10px 0; color: #468847; background-color: #dff0d8; border: 1px solid #d6e9c6; padding: 8px 14px; border-radius: 4px; text-align: left;"></div>

        <form th:action="@{/users/login}" method="POST">
          <input type="hidden" name="redirectUrl" th:value="${param.redirectUrl}">
          
          <div class="btns-row nm" th:if="${useSocialLoginOnly}" th:text="#{app.warn.support.social.login.only}">소셜 로그인을 통한 로그인만 가능합니다.</div>
          <th:block th:unless="${useSocialLoginOnly}">
          <dl>
            <dd>
              <input id="loginIdOrEmailD" name="loginIdOrEmail" type="text" class="text email" autocomplete="off" th:placeholder="#{user.login.key}" required autofocus>
            </dd>
            <dd>
              <input id="password" name="password" type="password" class="text password" autocomplete="off" th:placeholder="#{user.password}" required>
            </dd>
          </dl>

          <div class="btns-row">
            <button type="submit" class="ybtn ybtn-primary ybtn-large ybtn-fullsize" th:text="#{button.login}">로그인</button>
          </div>
          </th:block>

          <div class="btns-row nm">
            <div class="social-login-title-line" th:unless="${useSocialLoginOnly}" th:text="#{title.or}"> or </div>
            <a th:href="@{/oauth2/authorization/github}" class="ybtn oauth-login-btn">
              <span class="auth-provider-logo">
                <span class="github">
                  <svg aria-hidden="true" height="24" version="1.1" viewBox="0 0 16 16" width="19">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59 0.4 0.07 0.55-0.17 0.55-0.38 0-0.19-0.01-0.82-0.01-1.49-2.01 0.37-2.53-0.49-2.69-0.94-0.09-0.23-0.48-0.94-0.82-1.13-0.28-0.15-0.68-0.52-0.01-0.53 0.63-0.01 1.08 0.58 1.23 0.82 0.72 1.21 1.87 0.87 2.33 0.66 0.07-0.52 0.28-0.87 0.51-1.07-1.78-0.2-3.64-0.89-3.64-3.95 0-0.87 0.31-1.59 0.82-2.15-0.08-0.2-0.36-1.02 0.08-2.12 0 0 0.67-0.21 2.2 0.82 0.64-0.18 1.32-0.27 2-0.27 0.68 0 1.36 0.09 2 0.27 1.53-1.04 2.2-0.82 2.2-0.82 0.44 1.1 0.16 1.92 0.08 2.12 0.51 0.56 0.82 1.27 0.82 2.15 0 3.07-1.87 3.75-3.65 3.95 0.29 0.25 0.54 0.73 0.54 1.48 0 1.07-0.01 1.93-0.01 2.2 0 0.21 0.15 0.46 0.55 0.38C13.71 14.53 16 11.53 16 8 16 3.58 12.42 0 8 0z"></path>
                  </svg>
                </span>
                <span class="provider-name">Sign in with github</span>
              </span>
            </a>
            <a th:href="@{/oauth2/authorization/google}" class="ybtn oauth-login-btn">
              <span class="auth-provider-logo">
                <img src="/images/provider-logo/btn_google_light_normal_ios.svg" alt="login with Google"> Sign in with Google
              </span>
            </a>
          </div>

          <div class="act-row mt5" th:unless="${useSocialLoginOnly}">
            <div class="remember-me-wrap pull-left">
              <input id="remember-me" type="checkbox" name="rememberMe" class="checkbox" checked>
              <label for="remember-me" class="bg-checkbox" th:text="#{title.rememberMe}">로그인 상태 유지</label>
            </div>

            <div class="links-wrap pull-right">
              <a href="/lostPassword" th:text="#{title.forgotpassword}">비밀번호를 잊으셨나요?</a>
            </div>
          </div>
        </form>
      </div>
    </div>
    
    <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script type="text/javascript">
    $(function() {
        $('#loginIdOrEmailD').focus();
    });
</script>
</body>
</html>
