<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::diagnosticPage})}">
<th:block th:fragment="diagnosticPage">
    <div class="title_area">
        <h2 class="float-left" th:text="#{site.sidebar.diagnostics}"></h2>
    </div>

    <p th:if="${errors.isEmpty()}" th:text="#{site.diagnostic.errorNotFound}"></p>
    <th:block th:unless="${errors.isEmpty()}">
        <p th:text="#{site.diagnostic.errorFound(${errors.size()})}"></p>
        <ul>
            <li th:each="error : ${errors}"><pre th:text="${error}"></pre></li>
        </ul>
    </th:block>
</th:block>
</html>
