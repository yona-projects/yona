<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::massMailPage})}">
<th:block th:fragment="massMailPage">
<div class="title_area">
    <h2 class="float-start" th:text="#{__${title}__}"></h2>
</div>
<div class="mess-mail-wrap">
  <div class="site-card">
    <h3 th:text="#{site.massMail.recipients}"></h3>
    <div class="mail-type-options">
        <label for="mailtoAll" class="mail-type-option">
            <input type="radio" name="mailingType" id="mailtoAll" value="all" checked="checked" data-toggle="mail-type" data-action="hide" class="form-check-input">
            <span th:text="#{site.massMail.toAll}"></span>
        </label>
        <label for="mailtoPrj" class="mail-type-option">
            <input type="radio" name="mailingType" id="mailtoPrj" value="projects" data-toggle="mail-type" data-action="show" class="form-check-input">
            <span th:text="#{site.massMail.toProjects}"></span>
        </label>
    </div>
    <div class="form-field hide" id="project-list-wrap">
        <div class="project-picker">
            <input id="input-project" type="text" class="form-control" autocomplete="off" th:placeholder="#{site.massMail.projectSearch}" />
            <button id="select-project" type="submit" class="ybtn" th:attr="data-loading-text=#{site.massMail.loading}">
                <strong th:text="#{button.add}"></strong>
            </button>
        </div>
        <div id="selected-projects"></div>
        <p class="mail-help"><span id="selected-count">0</span> <span th:text="#{site.massMail.selectedCount}"></span></p>
    </div>
  </div>
  <button id="write-email" type="submit" class="ybtn ybtn-primary">
      <strong th:text="#{site.mail.write}"></strong>
  </button>
  <p class="mail-help mt-2" th:text="#{site.massMail.opensMailProgram}"></p>
</div>
<script type="module" th:src="@{/assets/javascripts/esm/service/site.MassMail.js}"></script>
<script type="text/javascript" th:inline="javascript">
  $(document).ready(function(){
    $yona.loadModule("site.MassMail", {
        "sURLMailList": /*[[@{/sites/mailList}]]*/ "",
        "sURLProjects": /*[[@{/projects}]]*/ ""
    });
  });
</script>
</th:block>
</html>
