<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::massMailPage})}">
<th:block th:fragment="massMailPage">
<div class="title_area">
    <h2 class="pull-left" th:text="#{__${title}__}"></h2>
</div>
<div class="mess-mail-wrap">
    <label class="radio" for="mailtoAll">
        <input type="radio" name="mailingType" id="mailtoAll" value="all" checked="checked" data-toggle="mail-type" data-action="hide">
        <th:block th:text="#{site.massMail.toAll}"></th:block>
    </label>
    <label class="radio" for="mailtoPrj">
        <input type="radio" name="mailingType" id="mailtoPrj" value="projects" data-toggle="mail-type" data-action="show">
        <th:block th:text="#{site.massMail.toProjects}"></th:block>
    </label>
    <div class="form-group hide" id="project-list-wrap">
        <div>
            <input id="input-project" type="text" class="col-md-3" data-provider="typeahead" autocomplete="off" th:placeholder="#{project.name}" />
            <button id="select-project" type="submit" class="ybtn" th:attr="data-loading-text=#{site.massMail.loading}">
                <strong th:text="#{button.add}"></strong>
            </button>
        </div>

        <div id="selected-projects"></div>
    </div>

    <button id="write-email" type="submit" class="ybtn ybtn-primary">
        <strong th:text="#{site.mail.write}"></strong>
    </button>
</div>
<script type="text/javascript" th:inline="javascript">
  $(document).ready(function(){
    $yobi.loadModule("site.MassMail", {
        "sURLMailList": /*[[@{/sites/mailList}]]*/ "",
        "sURLProjects": /*[[@{/projects}]]*/ ""
    });
  });
</script>
</th:block>
</html>
