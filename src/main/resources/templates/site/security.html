  모델: title, enforcement(OFF, ADMINS, ALL)

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::securityPage})}">
<th:block th:fragment="securityPage">
<h3 th:text="#{site.security.title}"></h3>
<form id="security-form" class="security-settings" method="post" th:action="@{/sites/security}">
    <h4 th:text="#{site.security.twoFactor}"></h4>
    <p class="text-body-secondary" th:text="#{site.security.twoFactor.description}"></p>
    <label class="option" th:each="mode : ${T(dev.yona.domain.site.TwoFactorEnforcement).values()}" th:for="'enforce-' + ${mode.name()}">
        <input class="form-check-input" type="radio" name="twoFactorEnforcement" th:id="'enforce-' + ${mode.name()}" th:value="${mode.name()}" th:checked="${mode.name() == enforcement}">
        <span class="option-text">
            <strong th:text="#{'site.security.twoFactor.' + ${mode.name()}}"></strong>
            <small th:text="#{'site.security.twoFactor.' + ${mode.name()} + '.help'}"></small>
        </span>
    </label>
    <div class="tf-actions">
        <button type="submit" class="btn btn-success" th:text="#{button.save}"></button>
    </div>
</form>

<form id="oauth-settings-form" class="security-settings mt-4" method="post" th:action="@{/sites/security/oauth}">
    <h4 th:text="#{site.security.oauth}"></h4>
    <p class="text-body-secondary" th:text="#{site.security.oauth.description}"></p>
    <label class="option" for="oauth-cimd">
        <input class="form-check-input" type="checkbox" name="cimd" id="oauth-cimd" value="true" th:checked="${oauthCimd}">
        <span class="option-text"><strong th:text="#{site.security.oauth.cimd}"></strong><small th:text="#{site.security.oauth.cimd.help}"></small></span>
    </label>
    <label class="option" for="oauth-user-apps">
        <input class="form-check-input" type="checkbox" name="userApps" id="oauth-user-apps" value="true" th:checked="${oauthUserApps}">
        <span class="option-text"><strong th:text="#{site.security.oauth.userApps}"></strong><small th:text="#{site.security.oauth.userApps.help}"></small></span>
    </label>
    <div class="tf-actions">
        <button type="submit" class="btn btn-success" th:text="#{button.save}"></button>
    </div>
</form>
</th:block>
</html>
