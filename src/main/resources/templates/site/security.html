  모델: title, enforcement(OFF, ADMINS, ALL)

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::securityPage})}">
<th:block th:fragment="securityPage">
<h3 th:text="#{site.security.title}"></h3>
<form id="security-form" class="security-settings" method="post" th:action="@{/sites/security}">
    <h4 th:text="#{site.security.twoFactor}"></h4>
    <p class="text-body-secondary" th:text="#{site.security.twoFactor.description}"></p>
    <label class="option" th:each="mode : ${T(dev.yona.domain.site.TwoFactorEnforcement).values()}" th:for="'enforce-' + ${mode.name()}">
        <input class="form-check-input" type="radio" name="twoFactorEnforcement" th:id="'enforce-' + ${mode.name()}" th:value="${mode.name()}" th:checked="${mode.name() == enforcement}">
        <span class="option-text">
            <strong th:text="#{'site.security.twoFactor.' + ${mode.name()}}"></strong>
            <small th:text="#{'site.security.twoFactor.' + ${mode.name()} + '.help'}"></small>
        </span>
    </label>
    <div class="tf-actions">
        <button type="submit" class="btn btn-success" th:text="#{button.save}"></button>
    </div>
</form>

<form id="oauth-settings-form" class="security-settings mt-4" method="post" th:action="@{/sites/security/oauth}">
    <h4 th:text="#{site.security.oauth}"></h4>
    <p class="text-body-secondary" th:text="#{site.security.oauth.description}"></p>
    <label class="option" for="oauth-cimd">
        <input class="form-check-input" type="checkbox" name="cimd" id="oauth-cimd" value="true" th:checked="${oauthCimd}">
        <span class="option-text"><strong th:text="#{site.security.oauth.cimd}"></strong><small th:text="#{site.security.oauth.cimd.help}"></small></span>
    </label>
    <label class="option" for="oauth-user-apps">
        <input class="form-check-input" type="checkbox" name="userApps" id="oauth-user-apps" value="true" th:checked="${oauthUserApps}">
        <span class="option-text"><strong th:text="#{site.security.oauth.userApps}"></strong><small th:text="#{site.security.oauth.userApps.help}"></small></span>
    </label>
    <div class="tf-actions">
        <button type="submit" class="btn btn-success" th:text="#{button.save}"></button>
    </div>
</form>

<section id="oidc-status" class="security-settings mt-4" th:attr="data-state=${oidc.enabled} ? 'enabled' : 'disabled'">
    <h4 th:text="#{site.security.oidc}"></h4>
    <p class="text-body-secondary" th:text="#{site.security.oidc.description}"></p>
    <th:block th:if="${oidc.enabled}">
        <p><span class="badge bg-success" th:text="#{site.security.oidc.enabled}"></span></p>
        <dl class="row">
            <dt class="col-sm-3" th:text="#{site.security.oidc.issuer}"></dt><dd class="col-sm-9"><code th:text="${oidc.issuer}"></code></dd>
            <dt class="col-sm-3" th:text="#{site.security.oidc.discovery}"></dt><dd class="col-sm-9"><code th:text="${oidc.discovery}"></code></dd>
            <dt class="col-sm-3" th:text="#{site.security.oidc.jwks}"></dt><dd class="col-sm-9"><code th:text="${oidc.jwks}"></code></dd>
            <dt class="col-sm-3" th:text="#{site.security.oidc.algorithm}"></dt><dd class="col-sm-9"><code th:text="${oidc.algorithm}"></code></dd>
            <dt class="col-sm-3" th:text="#{site.security.oidc.kid}"></dt><dd class="col-sm-9"><code th:text="${oidc.kid}"></code></dd>
        </dl>
        <p class="text-body-secondary" th:text="#{site.security.oidc.keyHelp}"></p>
    </th:block>
    <th:block th:unless="${oidc.enabled}">
        <p><span class="badge bg-secondary" th:text="#{site.security.oidc.disabled}"></span></p>
        <p th:utext="#{site.security.oidc.howto}"></p>
    </th:block>
</section>

<form id="mcp-settings-form" class="security-settings mt-4" method="post" th:action="@{/sites/security/mcp}">
    <h4 th:text="#{site.security.mcp}"></h4>
    <p class="text-body-secondary" th:text="#{site.security.mcp.description}"></p>
    <label class="option" for="mcp-enabled">
        <input class="form-check-input" type="checkbox" name="enabled" id="mcp-enabled" value="true" th:checked="${mcpEnabled}">
        <span class="option-text"><strong th:text="#{site.security.mcp.enabled}"></strong><small th:text="#{site.security.mcp.enabled.help}"></small></span>
    </label>
    <label class="option" for="mcp-write">
        <input class="form-check-input" type="checkbox" name="write" id="mcp-write" value="true" th:checked="${mcpWrite}">
        <span class="option-text"><strong th:text="#{site.security.mcp.write}"></strong><small th:text="#{site.security.mcp.write.help}"></small></span>
    </label>
    <div class="tf-actions">
        <button type="submit" class="btn btn-success" th:text="#{button.save}"></button>
    </div>
</form>
</th:block>
</html>
