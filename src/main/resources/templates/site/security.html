  추가 개발 항목 X-2(decisions.md D-69): 사이트 관리의 보안 설정. 2단계 인증 강제 방식(끔, 사이트 관리자만, 모두)
  모델: title, enforcement(OFF, ADMINS, ALL)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::securityPage})}">
<th:block th:fragment="securityPage">
<h3 th:text="#{site.security.title}"></h3>
<form id="security-form" method="post" th:action="@{/sites/security}">
    <h4 th:text="#{site.security.twoFactor}"></h4>
    <p class="text-body-secondary" th:text="#{site.security.twoFactor.description}"></p>
    <div class="form-check mb-2" th:each="mode : ${T(dev.yona.domain.site.TwoFactorEnforcement).values()}">
        <input class="form-check-input" type="radio" name="twoFactorEnforcement" th:id="'enforce-' + ${mode.name()}" th:value="${mode.name()}" th:checked="${mode.name() == enforcement}">
        <label class="form-check-label" th:for="'enforce-' + ${mode.name()}" th:text="#{'site.security.twoFactor.' + ${mode.name()}}"></label>
    </div>
    <button type="submit" class="btn btn-success mt-2" th:text="#{button.save}"></button>
</form>
</th:block>
</html>
