<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(#{${message}})}"></head>
<body class="theme-default">
<div id="main" class="main">
  <!-- GNB -->
  <div th:replace="~{site/layout :: gnb}"></div>

  <!-- Breadcrumb -->
  <div th:replace="~{site/layout :: breadcrumb}"></div>

  <div class="page-wrap-outer">
    <div class="site-setting-wrap">
      <div class="row-fluid">
        <!-- Sidebar -->
        <div th:replace="~{site/layout :: sidebar('massmail')}"></div>

        <!-- Content Area -->
        <div class="span10">
          <div class="title_area">
            <h2 class="pull-left" th:text="#{${message}}">단체 메일 발송</h2>
          </div>
          
          <div class="mess-mail-wrap">
            <label class="radio" for="mailtoAll">
              <input type="radio" name="mailingType" id="mailtoAll" value="all" checked="checked" data-toggle="mail-type" data-action="hide">
              [[#{site.massMail.toAll}]]
            </label>
            <label class="radio" for="mailtoPrj">
              <input type="radio" name="mailingType" id="mailtoPrj" value="projects" data-toggle="mail-type" data-action="show">
              [[#{site.massMail.toProjects}]]
            </label>
            
            <div class="control-group hide" id="project-list-wrap">
              <div class="controls">
                <input id="input-project" type="text" class="span3" data-provider="typeahead" autocomplete="off" th:placeholder="#{project.name}" />
                <button id="select-project" type="submit" class="ybtn" th:data-loading-text="#{site.massMail.loading}">
                  <strong th:text="#{button.add}">추가</strong>
                </button>
              </div>
              <div id="selected-projects"></div>
            </div>
            
            <button id="write-email" type="submit" class="ybtn ybtn-primary">
              <strong th:text="#{site.mail.write}">메일 작성하기</strong>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{site/layout :: footer}"></footer>

<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script src="/javascripts/common/yobi.Common.js"></script>
<script src="/javascripts/common/yobi.ui.Typeahead.js"></script>
<script src="/javascripts/service/yobi.site.MassMail.js"></script>
<script th:inline="javascript">
  $(document).ready(function(){
    $yobi.loadModule("site.MassMail", {
        "sURLMailList": "/sites/mailList",
        "sURLProjects": "/projects"
    });
  });
</script>
</body>
</html>
