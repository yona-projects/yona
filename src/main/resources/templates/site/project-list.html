  이식 원본: app/views/site/projectList.scala.html
  모델: title, rows(SiteContentController.ProjectRow), filter, totalPageCount
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::projectListPage})}">
<th:block th:fragment="projectListPage">
    <div class="title_area">
        <h2 class="float-start" th:text="#{site.sidebar.projectList}"></h2>
        <form class="float-end" th:action="@{/sites/projectList}">
            <div class="search-bar">
                <input type="text" class="textbox" name="filter" th:placeholder="#{site.project.filter}" th:value="${filter}">
                <button type="submit" class="search-btn"><i class="yobicon-search"></i></button>
            </div>
        </form>
    </div>
    <div class="row listhead">
        <div class="col-lg-5 listhead-title"><strong th:text="#{project.name}"></strong></div>
        <div class="col-lg-4 listhead-title"><strong th:text="#{project.description}"></strong></div>
        <div class="col-lg-2 listhead-title"><strong th:text="#{project.created}"></strong></div>
        <div class="col-lg-1 listhead-title"><strong>&nbsp;</strong></div>
    </div>
    <ul class="project-list-wrap">
        <li th:each="row : ${rows}" class="row listitem">
            <div class="col-lg-5 listitem-col">
                <a th:href="@{/{o}/{n}(o=${row.owner},n=${row.name})}" class="avatar-wrap list-avatar">
                    <img th:src="@{${row.logoUrl}}" th:alt="${row.name}"/> <th:block th:text="${row.owner} + '/' + ${row.name}"></th:block>
                </a>
                <a th:href="@{/{o}/{n}(o=${row.owner},n=${row.name})}" class="project-name" th:text="${row.owner} + '/' + ${row.name}"></a>
            </div>
            <div class="col-lg-4 listitem-col" th:text="${row.overview}"></div>
            <div class="col-lg-2 listitem-col" th:text="${row.createdText}"></div>
            <div class="col-lg-1 listitem-col">
                <button class="ybtn ybtn-danger" th:attr="data-project-name=${row.owner} + '/' + ${row.name}, data-href=@{/sites/project/delete/{id}(id=${row.id})}" data-toggle="delete-project" th:text="#{button.delete}"></button>
            </div>
        </li>
    </ul>

    <div id="pagination"></div>

    <div id="alertDeletionWrap" class="modal fade"><div class="modal-dialog"><div class="modal-content">
        <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            <span id="project-name"></span><th:block th:text="#{site.project.delete}"></th:block>
        </div>
        <div class="modal-body">
            <p th:text="#{site.project.deleteConfirm}"></p>
        </div>
        <div class="modal-footer">
            <button type="button" id="projectDeleteBtn" class="ybtn ybtn-danger" th:text="#{button.yes}"></button>
            <button type="button" class="ybtn" data-bs-dismiss="modal" th:text="#{button.no}"></button>
        </div>
    </div></div></div>

    <script type="text/javascript" th:inline="javascript">
    $(function(){
        // 삭제 확인창의 "예" 단추가 보낼 주소: 삭제 단추를 누를 때마다 바뀐다
        var deleteUrl = null;

        $('.project-list-wrap').on('click','[data-toggle="delete-project"]',function(){
            deleteUrl = $(this).data('href');

            $('#project-name').html($(this).data('projectName'));

            bootstrap.Modal.getOrCreateInstance(document.getElementById('alertDeletionWrap')).show();

            console.log($(this).data('href'));
        });

        document.getElementById('projectDeleteBtn').addEventListener('click', function(e){
            e.preventDefault();
            e.stopPropagation();
            // site-F5 시작
            // v1.6은 이미 지워졌거나 지울 수 없어서 실패해도 확인창이 그대로 남고 안내가 없었다.
            // 확인창을 닫고, 없어진 프로젝트(404)와 거절(403)은 화면을 다시 열어 목록을 맞추고, 그 밖의 실패는 알린다.
            yona.Request.send('delete', deleteUrl).then(function(result){
                if (result.ok) { return; }
                bootstrap.Modal.getOrCreateInstance(document.getElementById('alertDeletionWrap')).hide();
                if (result.status === 404 || result.status === 403) {
                    yona.Request.navigation.reload();
                } else {
                    $yona.alert(Messages('error.internalServerError'));
                }
            });
            // site-F5 끝
        });

        yona.Pagination.update($("#pagination"), [[${totalPageCount}]]);
    });
    </script>
</th:block>
</html>
