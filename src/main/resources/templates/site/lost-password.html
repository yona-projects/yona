<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-layout :: siteLayout(${title}, 'NONE', ~{::lostPasswordPage})}">
<th:block th:fragment="lostPasswordPage">
<div class="page full">
  <div class="center-wrap tag-line-wrap reset-password">
    <h1 class="title" th:utext="#{title.resetPasswordFor(${site.siteName})}">
    </h1>
    <p class="tag-line" th:text="#{app.description}"></p>
  </div>

  <div class="login-form-wrap frm-wrap">
    <div th:if="${isSent}" class="alert alert-success">
      <button type="button" class="close" data-dismiss="alert">&times;</button>
      <h4 th:text="#{site.mail.sended}"></h4>
    </div>

    <div th:if="${errorKey != null}" class="alert alert-danger">
      <button type="button" class="close" data-dismiss="alert">&times;</button>
      <h4 th:text="#{site.mail.fail}"></h4>
      <th:block th:utext="#{${errorKey}}"></th:block>
    </div>

    <form method="post" th:action="@{/lostPassword}">
      <dl>
        <dd>
          <input type="text" id="loginId" name="loginId" required="required" th:placeholder="#{user.loginId}" class="text" th:value="${!currentUser.anonymous} ? ${currentUser.loginId}">
        </dd>
        <dd>
          <input type="text" id="emailAddress" name="emailAddress" required="" th:placeholder="#{user.email}" class="text" th:value="${!currentUser.anonymous} ? ${currentUser.email}">
        </dd>
      </dl>

      <div class="btns-row">
        <button type="submit" class="ybtn ybtn-primary ybtn-large ybtn-fullsize" th:text="#{button.confirm}"></button>
      </div>
    </form>
  </div>
</div>
</th:block>
</html>
