<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(#{${message}})}"></head>
<body class="theme-default">
<div id="main" class="main">
  <!-- GNB -->
  <div th:replace="~{site/layout :: gnb}"></div>

  <!-- Breadcrumb -->
  <div th:replace="~{site/layout :: breadcrumb}"></div>

  <div class="page-wrap-outer">
    <div class="site-setting-wrap">
      <div class="row-fluid">
        <!-- Sidebar -->
        <div th:replace="~{site/layout :: sidebar('projects')}"></div>

        <!-- Content Area -->
        <div class="span10">
          <div class="title_area">
            <h2 class="pull-left" th:text="#{site.sidebar.projectList}">프로젝트</h2>
            <form class="form-search pull-right" th:action="@{/sites/projectList}" method="get">
              <div class="search-bar">
                <input type="text" class="textbox" name="projectName" th:placeholder="#{site.project.filter}" th:value="${projectName}">
                <button type="submit" class="search-btn"><i class="yobicon-search"></i></button>
              </div>
            </form>
          </div>
          
          <div class="row-fluid listhead">
            <div class="span5 listhead-title">
              <strong th:text="#{project.name}">프로젝트 이름</strong>
            </div>
            <div class="span4 listhead-title">
              <strong th:text="#{project.description}">프로젝트 설명</strong>
            </div>
            <div class="span2 listhead-title">
              <strong th:text="#{project.created}">생성일</strong>
            </div>
            <div class="span1 listhead-title">
              <strong>&nbsp;</strong>
            </div>
          </div>
          
          <ul class="project-list-wrap">
            <li class="row-fluid listitem" th:each="project : ${projects.content}">
              <div class="span5 listitem-col">
                <a th:href="@{'/' + ${project.owner} + '/' + ${project.name}}" class="avatar-wrap list-avatar">
                  <img th:src="@{/projects/{projectId}/logo(projectId=${project.id})}" th:alt="${project.name}"/>
                </a>
                <a th:href="@{'/' + ${project.owner} + '/' + ${project.name}}" class="project-name" th:text="${project.owner} + '/' + ${project.name}">
                  owner/name
                </a>
              </div>
              <div class="span4 listitem-col" th:text="${project.overview}">
                프로젝트 설명
              </div>
              <div class="span2 listitem-col" th:text="${project.createdDate != null ? #temporals.format(project.createdDate, 'yyyy-MM-dd') : ''}">
                생성일
              </div>
              <div class="span1 listitem-col">
                <button class="ybtn ybtn-danger" th:data-project-name="${project.owner} + '/' + ${project.name}" data-toggle="delete-project" th:data-href="@{/sites/project/delete/{projectId}(projectId=${project.id})}" th:text="#{button.delete}">삭제</button>
              </div>
            </li>
          </ul>

          <div id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<!-- Confirm to delete project - 네이티브 <dialog>(P3-70 라운드9). 트리거가
     data-toggle="delete-project"(bootstrap.js의 data-toggle="modal" 대상이 아님,
     project-name/requestAs 데이터를 먼저 채워야 해서 아래 스크립트가 직접 showModal()을
     호출한다). -->
<dialog id="alertDeletionWrap" class="modal">
  <div class="modal-header">
    <button type="button" class="close" data-dismiss="modal">×</button>
    <span id="project-name"></span><span th:text="#{site.project.delete}">프로젝트 삭제</span>
  </div>
  <div class="modal-body">
    <p th:text="#{site.project.deleteConfirm}">정말로 프로젝트를 삭제하시겠습니까?</p>
  </div>
  <div class="modal-footer">
    <button type="button" id="projectDeleteBtn" class="ybtn ybtn-danger" th:text="#{button.yes}">예</button>
    <button type="button" class="ybtn" data-dismiss="modal" th:text="#{button.no}">아니요</button>
  </div>
</dialog>


<th:block th:replace="~{site/layout :: scripts}"></th:block>
<script type="text/javascript" th:inline="javascript">
document.addEventListener("DOMContentLoaded", function(){
    var elAlertDeletionWrap = document.getElementById('alertDeletionWrap');
    $yona.attachDialogDismiss(elAlertDeletionWrap);

    var elProjectListWrap = document.querySelector('.project-list-wrap');
    if (elProjectListWrap) {
        elProjectListWrap.addEventListener('click', function(event) {
            var matched = event.target.closest('[data-toggle="delete-project"]');
            if (!matched || !elProjectListWrap.contains(matched)) { return; }

            // .requestAs()는 jquery.requestAs.js 플러그인 호출부라 라운드10(코어 라이브러리 제거)까지
            // 의도적으로 jQuery 객체를 유지한다(project.Delete.js/Comment.js/issue.View.js/code.Diff.js와
            // 동일한 판단).
            $('#projectDeleteBtn')
              .data('requestUri', matched.dataset.href)
              .data("requestMethod","delete")
              .requestAs();

            var elProjectName = document.getElementById('project-name');
            if (elProjectName) { elProjectName.innerHTML = matched.dataset.projectName; }
            elAlertDeletionWrap.showModal();

            console.log(matched.dataset.href);
        });
    }

    yona.Pagination.update(document.getElementById("pagination"), /*[[${projects.totalPages}]]*/ 1, {"paramNameForPage": "page"});
});
</script>
</body>
</html>
