<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(#{${message}})}"></head>
<body class="theme-default">
<div id="main" class="main">
  <!-- GNB -->
  <div th:replace="~{site/layout :: gnb}"></div>

  <!-- Breadcrumb -->
  <div th:replace="~{site/layout :: breadcrumb}"></div>

  <div class="page-wrap-outer">
    <div class="site-setting-wrap">
      <div class="row-fluid">
        <!-- Sidebar -->
        <div th:replace="~{site/layout :: sidebar('data')}"></div>

        <!-- Content Area -->
        <div class="span10">
          <div class="title_area">
            <h2 class="pull-left" th:text="#{site.sidebar.data}">데이터 관리</h2>
          </div>

          <div class="cu-desc">
            <ul>
              <li class="notice"><strong th:text="#{site.data.warning1}"></strong></li>
              <li class="notice"><strong th:text="#{site.data.warning2}"></strong></li>
              <li class="notice"><strong th:text="#{site.data.warning3}"></strong></li>
            </ul>
          </div>

          <h3 th:text="#{site.data.export}"></h3>
          <p th:text="#{site.data.export.info}"></p>

          <a th:href="@{/sites/export}" class="ybtn ybtn-primary">
            <strong th:text="#{site.data.export}"></strong>
          </a>

          <h3 th:text="#{site.data.import}"></h3>
          <p th:text="#{site.data.import.info}"></p>

          <form th:action="@{/sites/import}" method="post" enctype="multipart/form-data">
            <input type="file" name="data">
            <p>
              <input type="submit">
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{site/layout :: footer}"></footer>
<th:block th:replace="~{site/layout :: scripts}"></th:block>
</body>
</html>
