<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::dataPage})}">
<th:block th:fragment="dataPage">
<span data-swap-safe hidden></span>
    <div class="title_area">
        <h2 class="float-start" th:text="#{site.sidebar.data}"></h2>
    </div>

    <div class="alert-soft">
        <ul>
            <li><strong th:text="#{site.data.warning1}"></strong></li>
            <li><strong th:text="#{site.data.warning2}"></strong></li>
            <li><strong th:text="#{site.data.warning3}"></strong></li>
            <li><strong th:text="#{site.data.warning4}"></strong></li>
        </ul>
    </div>

    <div class="site-card">
        <h3 th:text="#{site.data.export}"></h3>
        <p th:text="#{site.data.export.info}"></p>
        <a th:href="@{/sites/export}" class="ybtn ybtn-primary"><strong th:text="#{site.data.export}"></strong></a>
    </div>

    <!--/* A-594: 가져오기는 기존 데이터를 교체하므로 위험 카드로 보인다 */-->
    <div class="site-card danger">
        <h3 th:text="#{site.data.import}"></h3>
        <p th:text="#{site.data.import.info}"></p>
        <form id="importForm" th:action="@{/sites/import}" method="post" enctype="multipart/form-data">
            <div class="site-card-row">
                <input class="form-control" type="file" name="data">
                <button type="submit" class="btn btn-outline-danger" th:text="#{site.data.import}"></button>
            </div>
            <div id="import-progress" class="import-progress" hidden><div class="import-progress-track"><div id="import-bar" class="import-progress-bar"></div></div></div>
            <p id="import-status" class="import-status" aria-live="polite"></p>
        </form>
    </div>
    <!--/* 가져오기는 병합이 아니라 교체이므로 올리기 전에 한 번 확인한다(R-56-3, v1.6은 확인이 없었다). 파일은 TUS로 조각 올려 끊겨도 이어 올린다(X-53, D-144) */-->
    <script th:src="@{/assets/javascripts/lib/tus/tus.min.js}"></script>
    <script type="module" th:inline="javascript">
    await import([[@{/assets/javascripts/esm/service/site.DataImport.js}]]);
    $yona.loadModule("site.DataImport", {
        "sURLTus": [[@{/sites/tus}]],
        "sURLImport": [[@{/sites/import/tus}]],
        "sConfirm": [[#{site.data.import.confirm}]]
    });
    </script>
</th:block>
</html>
