<!DOCTYPE html>

  이식 원본: app/views/site/userList.scala.html
  모델: title, rows(SiteUserController.UserRow), userState, query, totalPageCount, siteAdminCount
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::userListPage})}">
<th:block th:fragment="userListPage">
    <div class="title_area">

        <h2 class="float-start" th:text="#{site.sidebar.userList}"></h2>
        <form class="float-end" th:action="@{/sites/userList}">
            <input type="hidden" name="state" th:value="${userState}" />
            <div class="search-bar">
                <input class="textbox" name="query" type="text" th:placeholder="#{site.userList.search}" th:value="${query}">
                <button type="submit" class="search-btn"><i class="yobicon-search"></i></button>
            </div>
        </form>
    </div>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a th:href="@{/sites/userList(state='ACTIVE')}" th:text="#{site.userList.unlocked}" class="nav-link" th:classappend="${userState == 'ACTIVE'} ? 'active'"></a></li>
      <li class="nav-item"><a th:href="@{/sites/userList(state='LOCKED')}" th:text="#{site.userList.locked}" class="nav-link" th:classappend="${userState == 'LOCKED'} ? 'active'"></a></li>
      <li class="nav-item"><a th:href="@{/sites/userList(state='DELETED')}" th:text="#{site.userList.deleted}" class="nav-link" th:classappend="${userState == 'DELETED'} ? 'active'"></a></li>
      <li class="nav-item"><a th:href="@{/sites/userList(state='GUEST')}" th:text="#{site.userList.guest}" class="nav-link" th:classappend="${userState == 'GUEST'} ? 'active'"></a></li>
      <li class="nav-item"><a th:href="@{/sites/userList(state='SITE_ADMIN')}" class="nav-link" th:classappend="${userState == 'SITE_ADMIN'} ? 'active'"><th:block th:text="#{site.userList.siteAdmin}"></th:block><span class="num-badge" th:text="${siteAdminCount}"></span></a></li>
    </ul>
    <div class="row listhead">
        <div class="col-lg-3 listhead-title">
            <strong th:text="#{user.name}"></strong>
        </div>
        <div class="col-lg-3 listhead-title">
            <strong th:text="#{user.email}"></strong>
        </div>
        <div class="col-lg-2 listhead-title">
            <strong th:text="#{userinfo.since}"></strong>
        </div>
        <div th:if="${userState != 'DELETED'}" class="col-lg-4 listhead-title">
            <strong>&nbsp;</strong>
        </div>
        <div th:if="${userState == 'DELETED'}" class="col-lg-4 listhead-title">
            <strong th:text="#{userinfo.leave}"></strong>
        </div>
    </div>
    <ul class="user-list-wrap">
        <li th:each="row : ${rows}" class="row listitem">
            <div class="col-lg-3 listitem-col">
                <a th:href="@{/{u}(u=${row.loginId})}" class="avatar-wrap list-avatar">
                    <img th:if="${row.defaultAvatar}" th:src="@{${row.avatarUrl}}"/>
                    <img th:unless="${row.defaultAvatar}" th:src="@{${row.avatarUrl}}" th:alt="${row.name}" width="32" height="32"/>
                </a>
                <a th:href="@{/{u}(u=${row.loginId})}" class="user-name" th:text="${row.name}"></a>
                <a th:href="@{/{u}(u=${row.loginId})}" class="user-id" th:text="'@' + ${row.loginId}"></a>
            </div>
            <div class="col-lg-3 listitem-col">
                <span class="email" th:text="${row.email}"></span>
            </div>
            <div class="col-lg-2 listitem-col created-date">
                <span th:text="${row.createdText}"></span>
            </div>
            <!--/* v1.6의 단추 열은 `span5`라 한 줄의 열 합(3+3+2+5)이 12를 넘어 가입일 열 아래로 내려갔다. 같은 자리에 오도록 `offset-lg-6`을 준다 */-->
            <div th:if="${userState != 'DELETED'}" class="col-lg-5 offset-lg-6 listitem-col action-buttons">
                <a class="ybtn ybtn-small" th:classappend="${row.guest} ? 'ybtn-success'" data-request-method="post" th:attr="data-request-uri=@{${row.guestUrl}}"
                   th:text="${row.guest} ? #{button.user.make.normal.mode} : #{button.user.make.guest.mode}"></a>
                <a class="ybtn ybtn-small" data-request-method="post" th:attr="data-request-uri=@{${row.lockUrl}}"
                   th:text="#{'button.user.makeAccountUnlock.' + ${row.state == 'LOCKED'}}"></a>
                <button th:id="${row.loginId}" class="ybtn ybtn-small" data-toggle="reset-password" th:attr="data-href=@{${row.resetPasswordUrl}}"> <th:block th:text="#{title.resetPassword}"></th:block></button>
                <a th:if="${row.twoFactorEnabled}" class="ybtn ybtn-small" data-request-method="post" th:attr="data-request-uri=@{${row.twoFactorResetUrl}}" th:text="#{button.user.resetTwoFactor}"></a>
                <a th:if="${row.ssoLinked}" class="ybtn ybtn-small" data-request-method="post" th:attr="data-request-uri=@{${row.ssoUnlinkUrl}}" th:text="#{button.user.unlinkSso}"></a>
                <a class="ybtn ybtn-small site-admin-toggle" th:classappend="${row.siteManager} ? 'ybtn-info'" data-request-method="post" th:attr="data-request-uri=@{${row.siteAdminUrl}}"
                   th:text="${row.siteManager} ? #{button.user.revoke.site.admin.role} : #{button.user.upgrade.to.site.admin}"></a>
                <button class="ybtn ybtn-small ybtn-danger" data-toggle="account-delete" th:attr="data-href=@{${row.deleteUrl}}, data-user-id=${row.loginId}, data-user-name=${row.name}" th:text="#{button.delete}"></button>
            </div>
            <div th:if="${userState == 'DELETED'}" class="col-lg-4 listitem-col" th:text="${row.lastStateModified}"></div>
        </li>
    </ul>

    <div id="pagination"></div>

    <div id="alertDeletionWrap" class="modal fade"><div class="modal-dialog"><div class="modal-content">
        <div class="modal-header">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            <span id="userInfo"></span>
            <span th:text="#{site.user.delete}"></span>
        </div>
        <div class="modal-body">
            <p th:text="#{site.user.deleteConfirm}"></p>
        </div>
        <div class="modal-footer">
            <a id="accountToggleBtn" class="ybtn ybtn-danger" th:text="#{button.yes}"></a>
            <button type="button" class="ybtn" data-bs-dismiss="modal" th:text="#{button.no}"></button>
        </div>
    </div></div></div>

    <script type="text/javascript" th:inline="javascript">
    $(function(){
        function _showRequestWaitingMessage(that){
            $(".alert").remove();
            $yona.render(document.getElementById("dismissable-alerts-request").text, {}).appendTo(that.parent());
        }

        // 계정 삭제 확인창의 "예" 단추가 보낼 주소: 삭제 단추를 누를 때마다 바뀐다
        var accountDeleteUrl = null;

        document.getElementById('accountToggleBtn').addEventListener('click', function(e){
            e.preventDefault();
            e.stopPropagation();
            yona.Request.send('delete', accountDeleteUrl).then(function(result){
                if (result.status === 403) {
                    document.location.reload();
                }
            });
        });

        $('.user-list-wrap').on('click','[data-toggle="account-delete"]',function(){
            accountDeleteUrl = $(this).data('href');
            $('#userInfo').html($(this).data('userName')+'('+$(this).data('userId')+')');
            bootstrap.Modal.getOrCreateInstance(document.getElementById('alertDeletionWrap')).show();
        })
        .on('click','[data-toggle="reset-password"]',function(){
            var that = $(this);
            _showRequestWaitingMessage(that);
            yona.http.post(that.data("href"))
                .done(function(data){
                    $(".alert").remove();
                    if(data && data.isSuccess === true){
                        $yona.render($('#dismissable-alerts').text(), data).appendTo(that.parent());
                    } else {
                        $yona.alert("password change failed: " + data.reason);
                    }
                })
                .fail(function(data){
                    $yona.alert("password change failed: " + JSON.parse(data.responseText).reason);
                });

        });

        yona.Pagination.update($("#pagination"), [[${totalPageCount}]]);
    });
    </script>
    <script type="text/x-mustache" id="dismissable-alerts">
        <div class="alert alert-success alert-dismissible">
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <h4>[[#{user.newPassword}]]: {{newPassword}}</h4>
        </div>
    </script>
    <script type="text/x-mustache" id="dismissable-alerts-request">
        <div class="alert alert-fail alert-warning alert-dismissible">
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            <h4>sending requestHeader...</h4>
        </div>
    </script>
<script type="text/javascript">
    // 보호 규칙(자기 자신, 기본 관리자, 마지막 관리자)에 걸려 서버가 403으로 거부하면 안내가 다음 화면에 실려 있으므로 다시 읽어 보인다(site-F3)
    document.querySelectorAll(".site-admin-toggle").forEach(function (el) {
        el.addEventListener("request:error", function (e) { if (e.detail.status === 403) { e.preventDefault(); window.location.reload(); } });
    });
</script>
</th:block>
</html>
