  추가 개발 항목 X-1(decisions.md D-71): 사이트 관리의 OAuth 앱 목록. 사용자가 만든 앱과 CIMD 문서에서 가져온 앱을 보고 지운다
  모델: title, rows(Row 목록)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/site-mng-layout :: siteMngLayout(#{__${title}__}, ~{::oauthAppsPage})}">
<th:block th:fragment="oauthAppsPage">
<span data-swap-safe hidden></span>
<div class="two-factor-page oauth-screen">
<h3 th:text="#{site.oauthApps.title}"></h3>
<p class="text-body-secondary" th:text="#{site.oauthApps.description}"></p>
<div id="all-apps-empty" class="tf-empty" th:if="${#lists.isEmpty(rows)}" th:text="#{site.oauthApps.empty}"></div>
<ul id="all-apps" class="item-cards list-unstyled" th:if="${!#lists.isEmpty(rows)}">
    <li th:each="r : ${rows}" class="item-card app-row">
        <div class="item-card-head"><span class="item-card-name" th:text="${r.name}"></span></div>
        <dl class="item-card-meta">
            <dt th:text="#{oauth.apps.clientId}"></dt><dd><code th:text="${r.clientId}"></code></dd>
            <dt th:text="#{site.oauthApps.owner}"></dt><dd th:text="${r.ownerOrganization} ? #{oauth.apps.byOrganization(${r.owner})} : ${r.owner}"></dd>
            <dt th:text="#{site.oauthApps.registration}"></dt><dd th:text="#{'site.oauthApps.registration.' + ${r.registration}}"></dd>
            <dt th:text="#{site.oauthApps.users}"></dt><dd th:text="${r.users}"></dd>
        </dl>
        <div class="item-card-actions">
            <form method="post" th:action="@{/sites/oauth-apps/{id}/delete(id=${r.id})}" th:attr="onsubmit='return confirm(\'' + #{site.oauthApps.delete.confirm} + '\');'">
                <button type="submit" class="btn btn-danger btn-sm" th:text="#{oauth.apps.delete}"></button>
            </form>
        </div>
    </li>
</ul>
</div>
</th:block>
</html>
