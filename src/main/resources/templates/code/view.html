<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<!-- th:replace는 호스트 <head> 태그와 그 자식을 전부 프래그먼트 결과로 치환하므로, 페이지 전용
     <style>를 <head> 안에 두면 절대 렌더링되지 않는다(이 저장소의 다른 모든 템플릿은
     `<head th:replace="..."></head>`처럼 안을 비워둔다) — <body> 최상단으로 옮겨서 실제로
     렌더링되게 한다. -->
<head th:replace="~{site/layout :: head(${project.name} + ' - 코드 브라우저')}"></head>
<body class="prj" id="html-body">
<style>
  .code-browse-wrap {
      background: #fff;
      border: 1px solid #d8dee2;
      border-radius: 3px;
      padding: 20px;
      margin-bottom: 25px;
  }
  /* 공용 stylesheets/yona.css에 더 구체적인(specificity 2클래스) legacy 선택자
     `.code-browse-wrap .code-browse-header`/`.code-breadcrumb-wrap`이 이미 있어(select2 위젯
     기준 display:block+고정 height:34px 등), 스코프 없는 1클래스 선택자로는 소스 순서와 무관하게
     항상 밀린다 — 명시도를 맞춰 이 파일이 실제 의도한 flex 레이아웃/여백이 적용되게 한다. */
  .code-browse-wrap .code-browse-header {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
  }
  .code-browse-wrap .code-breadcrumb-wrap {
      font-size: 16px;
      font-weight: bold;
  }
  .code-browse-wrap .code-breadcrumb-wrap a {
      margin: 0 5px;
      text-decoration: none;
  }
  .list-wrap {
      border: 1px solid #eaecef;
      border-radius: 3px;
      margin-bottom: 15px;
  }
  /* 아래 전부(.listhead/.listitem/.filename/.commitMsg/.commitDate/.file-wrap/.file-header/
     .file-info/.code-wrap) 역시 위 `.code-browse-header`와 동일한 이유로 `.code-browse-wrap`
     프리픽스가 필요하다 — 전수 감사(사용자 요청)에서 발견: 공용 yona.css에
     `.code-browse-wrap .listhead`/`.code-browse-wrap .listitem .commitDate`/
     `.code-browse-wrap .file-header` 등 더 구체적인 legacy 선택자가 이미 있어, 스코프 없이 두면
     파일 목록 정렬/줄바꿈과 단일 파일 뷰 헤더 레이아웃이 소스 순서와 무관하게 그쪽으로 밀린다. */
  .code-browse-wrap .listhead {
      background-color: #f6f8fa;
      padding: 10px;
      border-bottom: 1px solid #eaecef;
      font-weight: bold;
      display: flex;
  }
  .code-browse-wrap .listitem {
      padding: 10px;
      border-bottom: 1px solid #eaecef;
      display: flex;
      align-items: center;
  }
  .code-browse-wrap .listitem:last-child {
      border-bottom: none;
  }
  .code-browse-wrap .filename {
      flex: 3;
      display: flex;
      align-items: center;
  }
  .code-browse-wrap .commitMsg {
      flex: 5;
      color: #586069;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
  }
  .code-browse-wrap .commitDate {
      flex: 2;
      text-align: right;
      color: #6a737d;
  }
  .code-browse-wrap .file-wrap {
      border: 1px solid #d1d5da;
      border-radius: 3px;
      background: #fff;
  }
  .code-browse-wrap .file-header {
      background-color: #f6f8fa;
      border-bottom: 1px solid #d1d5da;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
  }
  .code-browse-wrap .file-info {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 15px;
  }
  .code-browse-wrap .code-wrap {
      margin: 0;
      border: none;
      background-color: #fafbfc;
      min-height: 300px;
      font-family: monospace;
  }
  .markdown-wrap {
      padding: 30px;
  }
  /* legacy yona.css의 `.code-browse-wrap .list-wrap { display: none; }`를 그대로 되살렸다 -
     "죽은 코드" 감사 중 code.Browser.js의 AJAX 폴더 트리(hash 기반 expand-in-place)가 이식되지
     않았던 것을 발견해 legacy와 동일하게 복원(아래 스크립트 참고). 이 규칙은 다시 legacy처럼
     $(".list-wrap").show()/그 JS가 명시적으로 보여주는 것을 전제로 한다 - 이전 세션(P3-63)에서
     "AJAX 트리는 포팅하지 않고 일반 페이지 이동으로 단순화했다"는 이유로 여기서 display:block으로
     강제 오버라이드했었으나, 이번 세션에 legacy 완전 동치화 방침에 따라 되돌린다. -->
</style>
<div id="main" class="main">
  <div th:replace="~{site/layout :: gnb}"></div>
  <div th:replace="~{project/header :: header(${project})}"></div>
  <div th:replace="~{project/menu :: menu(${project}, 'code')}"></div>

  <!-- 메인 컨텐츠 영역 -->
  <div class="page-wrap-outer">
    <div class="project-page-wrap">
      <!-- code.Browser.js의 AJAX 폴더 트리(hash 기반 expand-in-place)가 쓰는 컨텍스트 값들.
           legacy는 $yobi.loadModule("code.Browser", {sProjectName, sMetaInfoURL, sBasePathURL, ...})로
           서버 렌더링 값을 JS에 넘겼다 - 이 템플릿은 th:inline="javascript"를 안 쓰므로 이 프로젝트의
           다른 화면들과 동일하게 data-* 속성으로 노출한다. -->
      <div class="code-browse-wrap" id="code-browse-wrap"
           th:data-project-name="${project.name}"
           th:data-base-path-url="@{/{owner}/{name}/code/{branch}(owner=${project.owner}, name=${project.name}, branch=${branch})}"
           th:data-meta-info-url="@{/{owner}/{name}/code/{branch}/!(owner=${project.owner}, name=${project.name}, branch=${branch})}"
           th:data-initial-path="${path}">
      <!-- 상단 탭 메뉴 (yona code/view.scala.html:62-76 대응 — recursiveData의 루트(경로 "")가 폴더일 때만 노출) -->
      <ul class="nav nav-tabs" th:if="${recursiveData[0].get('type').asText() == 'folder'}" style="margin-bottom:20px;">
        <li class="active">
          <a th:href="@{/{owner}/{name}/code/{branch}/{subPath}(owner=${project.owner}, name=${project.name}, branch=${branch}, subPath=${filesTabPath})}" th:text="#{code.files}">파일</a>
        </li>
        <li th:if="${branch == 'HEAD'}">
          <a th:href="@{/{owner}/{name}/commits(owner=${project.owner}, name=${project.name})}" th:text="#{code.commits}">커밋</a>
        </li>
        <li th:unless="${branch == 'HEAD'}">
          <a th:href="@{/{owner}/{name}/commits/{branch}(owner=${project.owner}, name=${project.name}, branch=${branch})}" th:text="#{code.commits}">커밋</a>
        </li>
        <li th:if="${project.vcs == 'GIT'}">
          <a th:href="@{/{owner}/{name}/branches(owner=${project.owner}, name=${project.name})}" th:text="#{title.branches}">브랜치</a>
        </li>
        <li th:if="${project.vcs == 'GIT'}">
          <a th:href="@{/{owner}/{name}/tags(owner=${project.owner}, name=${project.name})}" th:text="#{title.tags}">태그</a>
        </li>
      </ul>

      <!-- 브라우저 헤더 (브랜치 선택 및 브레드크럼) -->
      <div class="code-browse-header">
        <div style="display: flex; align-items: center; gap: 15px;">
          <!-- 브랜치 선택 셀렉트 박스 (legacy code/view.scala.html 대응) -->
          <select id="branches" class="form-control pull-left"
                  th:classappend="${recursiveData[recursiveData.size() - 1].get('type').asText() == 'file'} ? 'mb10' : ''">
            <!-- GitHub의 브랜치/태그 통합 ref 셀렉터(그룹 헤더로 구분) 대응. Mercurial 프로젝트는
                 이 그룹이 실제로는 bookmark 목록이라(설계 결정) 옛 Bitbucket 방식대로 "Bookmarks"로
                 라벨링하고, named branch를 별도 그룹으로 아래에 덧붙인다 — Git/SVN은 항상 기존
                 라벨("Branches")과 빈 named branch 그룹(미노출). -->
            <optgroup th:if="${!branches.isEmpty()}" th:label="${project.vcs == 'MERCURIAL'} ? #{title.bookmarks} : #{title.branches}">
              <option th:each="branchName : ${branches}"
                      th:value="@{/{owner}/{name}/code/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${templateHelper.branchItemName(branchName)}, path=${path})}"
                      th:selected="${templateHelper.branchItemName(branchName) == templateHelper.branchItemName(branch)}"
                      th:text="${templateHelper.branchItemName(branchName)}"></option>
            </optgroup>
            <optgroup th:if="${namedBranches != null and !namedBranches.isEmpty()}" th:label="#{title.namedBranches}">
              <option th:each="branchName : ${namedBranches}"
                      th:value="@{/{owner}/{name}/code/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${templateHelper.branchItemName(branchName)}, path=${path})}"
                      th:selected="${templateHelper.branchItemName(branchName) == templateHelper.branchItemName(branch)}"
                      th:text="${templateHelper.branchItemName(branchName)}"></option>
            </optgroup>
            <optgroup th:if="${!tags.isEmpty()}" th:label="#{title.tags}">
              <option th:each="tagName : ${tags}"
                      th:value="@{/{owner}/{name}/code/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${templateHelper.branchItemName(tagName)}, path=${path})}"
                      th:selected="${templateHelper.branchItemName(tagName) == templateHelper.branchItemName(branch)}"
                      th:text="${templateHelper.branchItemName(tagName)}"></option>
            </optgroup>
          </select>

          <!-- 브레드크럼 (legacy code/view.scala.html의 makeBreadCrumbs() 대응, 세그먼트 사이에 구분자 없음) -->
          <div class="code-breadcrumb-wrap" id="breadcrumbs">
            <a th:href="@{/{owner}/{name}/code/{branch}(owner=${project.owner}, name=${project.name}, branch=${branch})}" th:text="${project.name}">project</a><th:block
               th:each="crumb : ${breadcrumbs}"><a th:href="@{/{owner}/{name}/code/{branch}/{subPath}(owner=${project.owner}, name=${project.name}, branch=${branch}, subPath=${crumb.second})}" th:text="${crumb.first}">segment</a></th:block>
          </div>
        </div>

        <!-- Mercurial 저장소도 실제로 zip 아카이브를 만들 수 있으므로(hg4j ArchiveCommand) Git
             전용 게이트를 풀어 노출한다. SVN은 여전히 미구현이라 제외. -->
        <th:block th:if="${project.vcs == 'GIT' or project.vcs == 'MERCURIAL'}">
          <div class="pull-right">
            <a th:href="@{/{owner}/{name}/code/download/{branch}(owner=${project.owner}, name=${project.name}, branch=${branch})}" class="ybtn" th:text="#{code.download}">ZIP 다운로드</a>
          </div>
          <div class="pull-right" th:if="${currentUser != null}">
            <a id="new-file-link" th:href="@{/{owner}/{name}/post/new(owner=${project.owner}, name=${project.name}, path=${currentDir}, branch=${templateHelper.branchItemName(branch)})}" class="ybtn" th:text="#{code.new.file}">새 파일</a>
          </div>
        </th:block>
      </div>

      <!-- 리포지토리 파일/폴더/파일내용 뷰어 영역 -->
      <div class="code-viewer-wrap">
        <div id="spin" style="position:fixed; top:50%; left:50%"></div>
        <th:block th:each="fileInfo : ${recursiveData}">

          <!-- Case 1: Folder View (yona code/partial_view_folder.scala.html 대응).
               data-listpath/data-path/data-targetpath/data-type/id는 legacy
               partial_view_folder.scala.html의 마크업 계약을 그대로 재현한 것 - 아래
               code.Browser.js(AJAX 폴더 트리, hash 기반 expand-in-place)가 이 속성들로
               이미 펼쳐진 조상 목록을 찾고, 새로 받아온 하위 목록을 같은 모양으로 만들어
               끼워 넣는다("죽은 코드" 감사 중 이 트리 기능 자체가 이식되지 않았던 것을
               발견해 legacy와 동일하게 복원). fileInfo.get('path')는
               RepositoryService.getMetaDataFromAncestorDirectories()가 각 단계마다
               채워 넣는 누적 경로(listPath)다. -->
          <div th:if="${fileInfo.get('type').asText() == 'folder'}" class="list-wrap" data-type="folder"
               th:with="listPath=${fileInfo.get('path').asText()}"
               th:data-listpath="${listPath != ''} ? ${listPath} : null">
            <div class="listhead">
              <div class="filename" th:text="#{code.filename}">파일명</div>
              <div class="commitMsg" th:text="#{code.commitMsg}">최신 커밋 메시지</div>
              <div class="commitDate" th:text="#{code.commitDate}">작성일</div>
            </div>

            <div class="alert alert-warning nm" th:if="${fileInfo.get('data').propertyNames().isEmpty()}" th:text="#{code.nofiles}">
               폴더 내 파일이 존재하지 않습니다.
            </div>

            <!-- 폴더 먼저, 그 다음 파일 순서로 렌더링 (legacy가 fieldNames()를 두 번 순회하는 것과 동일) -->
            <div class="listitem" th:each="fileName : ${#lists.sort(#lists.toList(fileInfo.get('data').propertyNames()))}"
                 th:if="${fileInfo.get('data').get(fileName).get('type').asText() == 'folder'}"
                 th:with="file=${fileInfo.get('data').get(fileName)}, targetPath=${listPath == '' ? fileName : listPath + '/' + fileName}"
                 th:id="'cb-' + ${listPath} + ${fileName}" th:data-path="${targetPath}">
              <div class="filename">
                <span class="dynatree-icon vmiddle"></span>
                <a th:href="@{/{owner}/{name}/code/{branch}/{subPath}(owner=${project.owner}, name=${project.name}, branch=${branch}, subPath=${targetPath})} + '#cb-' + ${listPath} + ${fileName}"
                   data-type="folder" th:data-targetpath="${targetPath}"
                   th:text="${fileName}">fileName</a>
              </div>
              <div class="commitMsg">
                <a th:href="@{/user/{loginId}(loginId=${file.get('userLoginId').asText()})}" class="avatar-wrap smaller"><img th:src="${file.get('avatar').asText()}"></a>
                <span class="ml5"><a th:href="${file.get('commitUrl').asText()}" th:text="${file.get('msg').asText()}">Commit message</a></span>
              </div>
              <div class="commitDate" th:text="${templateHelper.agoOrDateString(T(java.time.Instant).ofEpochMilli(file.get('createdDate').asLong()))}">Date</div>
            </div>
            <div class="listitem" th:each="fileName : ${#lists.sort(#lists.toList(fileInfo.get('data').propertyNames()))}"
                 th:if="${fileInfo.get('data').get(fileName).get('type').asText() != 'folder'}"
                 th:with="file=${fileInfo.get('data').get(fileName)}, targetPath=${listPath == '' ? fileName : listPath + '/' + fileName}"
                 th:id="'cb-' + ${listPath} + ${fileName}" th:data-path="${targetPath}">
              <div class="filename">
                <span class="dynatree-icon vmiddle"></span>
                <a th:href="@{/{owner}/{name}/code/{branch}/{subPath}(owner=${project.owner}, name=${project.name}, branch=${branch}, subPath=${targetPath})}"
                   th:data-targetpath="${targetPath}"
                   th:text="${fileName}">fileName</a>
              </div>
              <div class="commitMsg">
                <a th:href="@{/user/{loginId}(loginId=${file.get('userLoginId').asText()})}" class="avatar-wrap smaller"><img th:src="${file.get('avatar').asText()}"></a>
                <span class="ml5"><a th:href="${file.get('commitUrl').asText()}" th:text="${file.get('msg').asText()}">Commit message</a></span>
              </div>
              <div class="commitDate" th:text="${templateHelper.agoOrDateString(T(java.time.Instant).ofEpochMilli(file.get('createdDate').asLong()))}">Date</div>
            </div>
          </div>

          <!-- Case 2: File View (yona code/partial_view_file.scala.html 대응) -->
          <div th:if="${fileInfo.get('type').asText() == 'file'}" class="file-wrap" data-type="file">
            <div class="file-header nm">
              <div id="fileInfo" class="file-info">
                <span id="commiter" class="commiter">
                  <a th:href="@{/user/{loginId}(loginId=${fileInfo.get('userLoginId').asText()})}" class="avatar-wrap smaller"><img th:src="${fileInfo.get('avatar').asText()}"></a>
                  <a th:href="@{/user/{loginId}(loginId=${fileInfo.get('userLoginId').asText()})}" class="ml5" th:text="${fileInfo.get('author').asText()}">Author</a>
                </span>
                <span id="commitDate" class="commitDate" th:text="${templateHelper.agoOrDateString(T(java.time.Instant).ofEpochMilli(fileInfo.get('createdDate').asLong()))}">Date</span>
                <span id="revisionNo" class="revision">
                  <a th:href="@{/{owner}/{name}/commit/{commitId}(owner=${project.owner}, name=${project.name}, commitId=${fileInfo.get('revisionNo').asText()}, branch=${branch}, path=${path})} + '#' + ${path}"
                     th:text="${#strings.substring(fileInfo.get('revisionNo').asText(), 0, 7)}">commitId</a>
                  <span class="number-of-comments ml5" th:if="${fileCommentCount != null and fileCommentCount > 0}"><i class="yobicon-comments"></i> <span th:text="${fileCommentCount}">0</span></span>
                </span>
                <span id="commitMessage" class="commitMsg" th:text="${fileInfo.get('commitMessage').asText()}">Commit message</span>
              </div>
              <div class="pull-right">
                <a th:unless="${fileInfo.get('isBinary').asBoolean()}" th:href="@{/{owner}/{name}/rawcode/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${branch}, path=${path})}" class="ybtn" target="_blank">
                  <i class="yobicon-download-alt yobicon-white vmiddle"></i> Raw
                </a>
                <a th:unless="${fileInfo.get('isBinary').asBoolean()}" th:if="${currentUser != null}"
                   th:href="@{/{owner}/{name}/post/new(owner=${project.owner}, name=${project.name}, path=${path}, branch=${templateHelper.branchItemName(branch)}, edit=true)}" class="ybtn">
                  Edit
                </a>
                <a id="open-in-browser" th:href="@{/{owner}/{name}/files/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${branch}, path=${path})}" class="ybtn" target="_blank" th:data-content="#{code.open.desc}">
                  <i class="yobicon-download-alt yobicon-white vmiddle"></i> <span th:text="#{code.open}">브라우저로 열기</span>
                </a>
                <a th:href="@{/{owner}/{name}/commits/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${branch}, path=${path})}" class="ybtn" th:text="#{code.history}">변경이력</a>
              </div>
            </div>

            <!-- Binary File -->
            <th:block th:if="${fileInfo.get('isBinary').asBoolean()}">
              <div th:if="${fileInfo.get('mimeType') != null and fileInfo.get('mimeType').asText().indexOf('image/') == 0}" id="showImage" class="image-wrap">
                <img th:src="@{/{owner}/{name}/rawcode/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${branch}, path=${path})}">
              </div>
              <div th:unless="${fileInfo.get('mimeType') != null and fileInfo.get('mimeType').asText().indexOf('image/') == 0}" id="showFile" class="file-wrap">
                <p>
                  <strong class="filename" th:text="${#strings.substring(path, path.lastIndexOf('/') + 1)}">fileName</strong><br>
                  <span class="filesize" th:text="${fileInfo.get('size').asText()}">size</span><br>
                  <a th:href="@{/{owner}/{name}/rawcode/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${branch}, path=${path})}" class="filehref ybtn"><i class="yobicon-download-alt yobicon-white vmiddle"></i> <span th:text="#{button.download}">다운로드</span></a>
                </p>
              </div>
            </th:block>

            <!-- Text(Code) -->
            <th:block th:unless="${fileInfo.get('isBinary').asBoolean()}">
              <div th:if="${markdownHtml != null}" id="codeVal" class="markdown-wrap codebrowser-markdown">
                <div th:utext="${markdownHtml}">Rendered markdown</div>
              </div>
              <th:block th:if="${markdownHtml == null}">
                <pre id="showCode" class="code-wrap" th:data-mimetype="${fileInfo.get('mimeType').asText()}" th:data-path="${path}"><code th:text="${fileInfo.get('data').asText()}"></code></pre>
              </th:block>
            </th:block>
          </div>

        </th:block>
      </div>

      <!-- legacy code/partial_view_folder.scala.html의 #tplFileListItem(type="text/x-jquery-tmpl")
           대응 - AJAX로 받아온 하위 폴더 목록 항목을 렌더링하는 템플릿. jQuery.tmpl 플러그인은
           tmpl 카테고리에서 이미 걷어냈으므로 ${key} 치환 문법이 100% 호환되는 $yona.tmpl()로
           그대로 재사용한다(문법은 legacy와 동일, 실행 엔진만 다르다). -->
      <script id="tplFileListItem" type="text/plain">
<div id="cb-${listPath}${fileName}" class="listitem" data-path="${targetPath}">
    <div class="filename">
        <span class="dynatree-icon vmiddle"></span>
        <a href="${path}" data-targetpath="${targetPath}" data-type="${type}">${fileName}</a>
    </div>
    <div class="commitMsg">
        ${avatarImg}
        <span class="ml5"><a href="${commitUrl}">${commitMsg}</a></span>
    </div>
    <div class="commitDate">${commitDate}</div>
</div>
      </script>
      </div>
    </div>
  </div>

  <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<!-- P3-63(후속): 파일 내용 보기 전용 진짜 Ace 에디터. 이 화면에서만 필요하므로 전역
     site/layout.html이 아니라 이 템플릿에만 로드한다(legacy service/yona.code.Browser.js와
     동치). Ace의 모드/테마 파일은 이 <script> 태그의 src 경로를 기준으로 자기 자신이 비동기로
     추론/로드하므로 별도 basePath 설정은 필요 없다. -->
<script src="/javascripts/lib/ace/ace.js"></script>
<script type="text/javascript">
  $(document).ready(function(){
      $("#branches").on("change", function(){
          location.href = $(this).val();
      });

      // help popover at open with browser button
      $("#open-in-browser").popover({trigger: "hover", placement: "top"});

      // P3-63: 일반 텍스트/소스 코드 파일 뷰(마크다운/바이너리 제외)에 진짜 Ace 에디터를 붙인다
      // (legacy service/yona.code.Browser.js의 _getEditor(400~412행)/_initCodeView(369~394행)/
      // ext2mode(432~480행)와 동치). Ace 로딩에 실패하면(스크립트 404 등) hljs 문법강조로
      // 폴백한다(완전 대체가 아니라 이중 안전장치). 마크다운/바이너리 케이스에는 #showCode 자체가
      // 없어 querySelector가 null을 반환하므로 안전하게 건너뛴다.
      var showCodeCodeEl = document.querySelector("#showCode code");
      if (showCodeCodeEl) {
          if (typeof ace !== "undefined") {
              // ace.edit()는 대상 엘리먼트(#showCode)의 자식을 지우고 자기 DOM으로 교체하므로,
              // 원본 텍스트는 반드시 그 전에 읽어둬야 한다.
              var sourceText = showCodeCodeEl.textContent;
              var showCodeContainerEl = document.getElementById("showCode");
              var sMimeType = showCodeContainerEl.getAttribute("data-mimetype") || "";
              var sPath = showCodeContainerEl.getAttribute("data-path") || "";

              // legacy htVar.rxSub: 서버가 명시적으로 "text/x-<lang>-source" 형태의 MIME
              // 타입을 알려준 경우 우선 사용하고, 아니면 파일 경로(확장자)로 추론한다.
              var rxSub = /text\/x-(.+)-source/;

              // legacy ext2mode()의 확장자 -> Ace 모드 매핑 테이블을 그대로(동치로) 포팅.
              var htExtMap = {
                  "actionscript": ["as", "actionscript"],
                  "assembly_x86": ["a", "a86"],
                  "ada": ["ada"],
                  "batchfile": ["bat"],
                  "coffee": ["coffee"],
                  "c_cpp": ["c", "cp", "cpp", "c__", "cxx"],
                  "csharp": ["cs"],
                  "css": ["css"],
                  "d": ["d"],
                  "diff": ["diff"],
                  "dart": ["dart"],
                  "erlang": ["erl"],
                  "html": ["html", "htm"],
                  "ini": ["ini", "config"],
                  "jade": ["jade"],
                  "java": ["java"],
                  "javascript": ["js"],
                  "json": ["json"],
                  "jsp": ["jsp"],
                  "latex": ["dtx", "tex"],
                  "less": ["less"],
                  "makefile": ["mk", "emakrfile", "emakerfile"],
                  "markdown": ["md", "readme", "license"],
                  "php": ["php", "php3", "php4", "php5", "php6", "phps", "inc"],
                  "python": ["py"],
                  "r": ["r"],
                  "ruby": ["rb", "ruby"],
                  "sh": ["sh"],
                  "svg": ["svg"],
                  "scala": ["scala"],
                  "sql": ["sql"],
                  "text": ["txt", "gitignore", "sbt"],
                  "vbscript": ["vbs"],
                  "xml": ["xml"],
                  "yaml": ["yaml", "yml"]
              };

              var basename = function (sPathArg) {
                  return sPathArg.split("/").pop();
              };
              // legacy getExt(): "*.scala.html" 파일명은 확장자를 "scala"로 취급한다.
              var getExt = function (sFilename) {
                  return (/\.scala\.html$/i).test(sFilename) ? "scala" : sFilename.split(".").pop();
              };
              var ext2mode = function (sExt) {
                  sExt = (sExt || "").toLowerCase();
                  for (var sMode in htExtMap) {
                      if (htExtMap[sMode].indexOf(sExt) > -1) {
                          return sMode;
                      }
                  }
                  return false;
              };
              var getEditorModeByPath = function (sPathArg) {
                  return ext2mode(getExt(basename(sPathArg || "")));
              };

              var aMatch = sMimeType.match(rxSub);
              var sMode = (aMatch ? aMatch[1] : getEditorModeByPath(sPath)) || "text";

              // legacy _getEditor("showCode")와 동치.
              var editor = ace.edit("showCode");
              editor.setTheme("ace/theme/clouds");
              editor.setHighlightActiveLine(false);
              editor.setReadOnly(true);
              editor.setFontSize(12); // legacy htVar.nFontSize 기본값(_initVar)
              editor.setShowPrintMargin(false);

              var session = editor.getSession();
              session.setMode("ace/mode/" + sMode);
              session.setValue(sourceText);
          } else if (typeof hljs !== "undefined") {
              hljs.highlightElement(showCodeCodeEl);
          }
      }
  });
</script>

<!-- legacy service/yobi.code.Browser.js의 AJAX 폴더 트리(hash 기반 expand-in-place) 복원.
     "죽은 코드" 감사 중 이 기능 자체가 이식되지 않았던 것을 발견 - 이전 세션(P3-63)엔
     "페이지 이동 방식으로 충분하다"며 포팅을 보류했으나, legacy 완전 동치화 방침에 따라
     이번에 되돌린다. 파일보기(Ace 에디터) 쪽은 이미 위에서 별도로 이식돼 있어 손대지 않는다. -->
<script src="/javascripts/lib/moment-with-langs.min.js"></script>
<script type="text/javascript">
(function(){
    var welBrowseWrap = document.getElementById("code-browse-wrap");
    // 파일 보기 화면(showCode/showFile)에는 애초에 폴더 목록(.list-wrap[data-listpath])이
    // 없으므로 이 초기화 자체가 필요 없다 - legacy _init()의 `if(htElement.welFileView.length > 0)`
    // 분기와 동일하게 여기서 걸러낸다.
    if (!welBrowseWrap || $(".file-wrap[data-type=file]").length > 0) {
        return;
    }

    var sProjectName = welBrowseWrap.getAttribute("data-project-name");
    var sBasePathURL = welBrowseWrap.getAttribute("data-base-path-url");
    var sMetaInfoURL = welBrowseWrap.getAttribute("data-meta-info-url");
    var sInitialPath = welBrowseWrap.getAttribute("data-initial-path") || "";
    var sTplListItem = document.getElementById("tplFileListItem").textContent;
    var elStyle = document.styleSheets[0];
    var aAddedDepth = [];
    var aPathQueue = [];
    var aWelList = [];

    function getCorrectedPath(sPath, sFileName){
        return sPath + (sPath.substr(-1) === "/" ? "" : "/") + sFileName;
    }

    function addCSSRule(sSelector, sRule){
        if (elStyle.insertRule) {
            elStyle.insertRule(sSelector + " { " + sRule + " }", elStyle.cssRules.length);
        } else if (elStyle.addRule) {
            elStyle.addRule(sSelector, sRule);
        }
    }

    function setIndentByDepth(nDepth){
        nDepth = parseInt(nDepth, 10);
        if (aAddedDepth.indexOf(nDepth) === -1) {
            aAddedDepth.push(nDepth);
            addCSSRule(".depth-" + nDepth + " .filename", "padding-left:" + (20 * nDepth) + "px");
        }
    }

    function setCurrentPathBold(sPath){
        var welCurrent = $('[data-path="' + sPath + '"]');
        if (welCurrent.length > 0) {
            $(".currentPath").removeClass("currentPath");
            welCurrent.addClass("currentPath");
        }
    }

    function isListExistsByPath(sTargetPath){
        return $('[data-listpath="' + sTargetPath + '"]').length > 0;
    }

    function getSortedList(htData){
        var htListByType = {};
        for (var sFileName in htData) {
            var htFileInfo = htData[sFileName];
            htFileInfo.fileName = sFileName;
            var sType = htFileInfo.type;
            htListByType[sType] = htListByType[sType] || [];
            htListByType[sType].push(htFileInfo);
        }
        return htListByType;
    }

    function getFileInfoForTpl(htFile, sTargetPath){
        var sAuthorURL = htFile.userLoginId ? ("/" + htFile.userLoginId) : "javascript:void(0);";
        htFile.commitDate = (typeof htFile.createdDate !== "undefined") ? moment(new Date(htFile.createdDate)).fromNow() : "";
        htFile.avatarImg = (typeof htFile.avatar !== "undefined")
            ? ('<a href="' + sAuthorURL + '" class="avatar-wrap smaller"><img src="' + htFile.avatar + '"></a>')
            : "";
        htFile.commitMsg = $yona.htmlspecialchars(htFile.msg || "");
        htFile.listPath = sTargetPath;
        htFile.targetPath = getCorrectedPath(sTargetPath, htFile.fileName);
        htFile.path = getCorrectedPath(sBasePathURL, htFile.targetPath);
        if (htFile.type === "folder") {
            htFile.path += ("#cb-" + sTargetPath + htFile.fileName);
        }
        return htFile;
    }

    function getListHTML(htData, sTargetPath){
        var aHTML = [];
        var htSortedData = getSortedList(htData);
        ["folder", "file"].forEach(function(sType){
            if (htSortedData[sType] instanceof Array) {
                htSortedData[sType].forEach(function(htFile){
                    htFile = getFileInfoForTpl(htFile, sTargetPath);
                    aHTML.push($yona.tmpl(sTplListItem, htFile));
                });
            }
        });
        return aHTML;
    }

    function appendFolderList(welTarget, sTargetPath){
        // legacy _appendFolderList()의 _getCorrectedPath(htVar.sMetaInfoURL, sTargetPath)와
        // 동일하게 단순 문자열 접합 - sMetaInfoURL 자체가 이미 "/owner/name/code/branch/!"
        // 형태(끝에 슬래시 없음)라 여기 붙는 sTargetPath와 합쳐 컨트롤러의
        // "/code/{branch}/!/{*path}" 매핑과 정확히 맞아떨어진다.
        var sURL = getCorrectedPath(sMetaInfoURL, sTargetPath);
        var nParentDepth = welTarget.closest(".list-wrap").data("depth") || 0;
        var nNewDepth = nParentDepth + 1;
        setIndentByDepth(nNewDepth);

        NProgress.start();
        $.ajax(sURL, {
            "success": function(oRes){
                if (isListExistsByPath(sTargetPath)) {
                    NProgress.done();
                    return;
                }

                var aHTML = getListHTML(oRes.data, sTargetPath);
                var welTargetItem = $('.listitem[data-path="' + sTargetPath + '"]');
                var welList = $('<div class="list-wrap" data-listpath="' + sTargetPath + '"></div>');

                welList.data("depth", nNewDepth);
                welList.addClass("depth-" + nNewDepth);
                welList.css("display", "none");
                welList.html(aHTML.join(""));
                welTargetItem.after(welList);
                aWelList.push(welList);

                if (aPathQueue.length > 0) {
                    requestFolderList();
                } else {
                    setCurrentPathBold(sTargetPath);
                    aWelList.forEach(function(welList){ welList.css("display", "block"); });
                }
                NProgress.done();
            },
            "error": function(){
                NProgress.done();
            }
        });
    }

    function requestFolderList(){
        if (aPathQueue.length === 0) {
            NProgress.done();
            aWelList.forEach(function(welList){ welList.css("display", "block"); });
            return;
        }

        var sTargetPath = decodeURI(aPathQueue.shift());
        var welTarget = $('[data-targetpath="' + sTargetPath + '"]');

        if (isListExistsByPath(sTargetPath)) {
            requestFolderList();
        } else {
            appendFolderList(welTarget, sTargetPath);
        }
    }

    function updateQueryStringParameter(sUri, sKey, sValue){
        var rx = new RegExp("([?&])" + sKey + "=.*?(&|$)", "i");
        var separator = sUri.indexOf("?") !== -1 ? "&" : "?";
        if (sUri.match(rx)) {
            return sUri.replace(rx, "$1" + sKey + "=" + sValue + "$2");
        }
        return sUri + separator + sKey + "=" + sValue;
    }

    function updateBreadcrumbs(aQueue){
        var aCrumbs = ['<a href="' + sBasePathURL + '">' + sProjectName + "</a>"];
        aQueue.forEach(function(sPath){
            sPath = decodeURI(sPath);
            var sLink = getCorrectedPath(sBasePathURL, sPath);
            var sName = sPath.split("/").pop();
            aCrumbs.push('<a href="' + sLink + '">' + sName + "</a>");
        });

        document.getElementById("breadcrumbs").innerHTML = $yona.xssClean(aCrumbs.join(""));

        var welNewFileLink = $("#new-file-link");
        if (welNewFileLink[0]) {
            var sPath = document.location.hash.substr(1);
            welNewFileLink.attr("href", updateQueryStringParameter(welNewFileLink.attr("href"), "path", sPath + "/"));
        }
    }

    function onHashChange(){
        if (document.location.hash.length < 1) {
            return;
        }

        var sTargetPath = document.location.hash.substr(1);
        var welList = $('[data-listpath="' + sTargetPath + '"]');
        var sCheckPath = "";
        aPathQueue = [];
        aWelList = [];

        sTargetPath.split("/").forEach(function(sPath){
            sCheckPath = (sCheckPath === "") ? sPath : (sCheckPath + "/" + sPath);
            aPathQueue.push(sCheckPath);
        });
        updateBreadcrumbs(aPathQueue);

        if (welList.length > 0) {
            welList.toggle();
            setCurrentPathBold(sTargetPath);
        } else {
            requestFolderList();
        }
    }

    function onClickWrap(weEvt){
        var elTarget = weEvt.target;
        var welTarget = $(elTarget);

        if (elTarget.tagName.toLowerCase() === "a" && welTarget.data("type") === "folder") {
            var sPreviousHash = document.location.hash;
            document.location.hash = welTarget.data("targetpath");

            if (document.location.hash === sPreviousHash) {
                $(window).trigger("hashchange");
            }

            weEvt.preventDefault();
            weEvt.stopPropagation();
            return false;
        }
    }

    function initDepthedList(){
        var waFileWrap = $("div.list-wrap[data-listpath]");
        waFileWrap.each(function(i, elList){
            var welList = $(elList);
            var sListPath = welList.data("listpath");
            var welTarget = $('[data-path="' + sListPath + '"]');

            welList.data("depth", i + 1);
            welList.addClass("depth-" + (i + 1));
            setIndentByDepth(i + 1);
            welTarget.after(welList);
        });
        $(".list-wrap").show();
        setCurrentPathBold(sInitialPath);
    }

    initDepthedList();
    $(".code-viewer-wrap").on("click", onClickWrap);
    $(window).on("hashchange", onHashChange);
    $(window).trigger("hashchange");
})();
</script>
</body>
