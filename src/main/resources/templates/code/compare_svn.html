<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<!-- th:replace는 호스트 <head> 태그와 그 자식을 전부 프래그먼트 결과로 치환하므로, 페이지 전용
     <style>를 <head> 안에 두면 절대 렌더링되지 않는다(code/view.html P0-27과 동일 유형, 전수 감사로
     발견) — <body> 최상단으로 옮겨서 실제로 렌더링되게 한다. -->
<head th:replace="~{site/layout :: head(${commitA.id} + '..' + ${commitB.id})}"></head>
<body class="theme-default">
<style>
  .code-browse-wrap {
      background: #fff;
      border: 1px solid #d8dee2;
      border-radius: 3px;
      padding: 20px;
      margin-bottom: 25px;
  }
  .commitInfo {
      background-color: #f6f8fa;
      padding: 10px 15px;
      border-radius: 3px;
      border: 1px solid #e1e4e8;
      font-size: 14px;
      margin-bottom: 20px;
  }
  /* 공용 yobi.css에 더 구체적인 `.code-browse-wrap .commitId { color: #51AACC; font-family:
     Consolas, ...; }`가 이미 있어 스코프 없이 두면 색상/폰트가 밀린다. */
  .code-browse-wrap .commitId {
      font-family: monospace;
      font-weight: bold;
      color: #0366d6;
  }
</style>
<div id="main" class="main">
  <div th:replace="~{site/layout :: gnb}"></div>
  <div th:replace="~{project/header :: header(${project})}"></div>
  <div th:replace="~{project/menu :: menu(${project}, 'code')}"></div>

  <!-- 메인 컨텐츠 영역 (yona code/compare_svn.scala.html — page-wrap-outer 없이 project-page-wrap 바로 시작) -->
  <div class="project-page-wrap">
    <div class="code-browse-wrap">
      <p class="commitInfo">
        <strong class="commitId" th:text="'@' + ${commitA.id} + '..' + ${commitB.id}">commitA..commitB</strong>
      </p>

      <!-- 변경 사항이 없는 경우 -->
      <div class="alert" th:if="${#strings.isEmpty(patch)}" th:text="#{code.noChanges}">
        변경된 내역이 없습니다.
      </div>

      <!-- 변경 사항이 있는 경우 raw patch 데이터 출력 -->
      <div class="diff-wrap" th:if="${not #strings.isEmpty(patch)}">
        <div id="commit" data-commit-origin="true" class="diff-body hide" th:text="${patch}"></div>
      </div>
    </div>
  </div>

  <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<div th:replace="~{site/layout :: scripts}"></div>
<script type="text/javascript" src="/javascripts/lib/diff.js"></script>
</body>
</html>
