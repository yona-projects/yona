  모델: title, projectView, commitA, commitB, patch, filesUrl, tplFileUrl, tplRawUrl

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'CODE', ~{::compareSvnPage})}">
<th:block th:fragment="compareSvnPage" th:with="project=${projectView.project}">
<div class="page-wrap-outer">
<div class="project-page-wrap shell shell-below-banner">
        <th:block th:replace="~{project/menu :: sidebar(${projectView}, 'CODE')}"></th:block>
        <div class="shell-main">
    <div class="code-browse-wrap">
        <div class="compare-back mb-2"><a class="code-back-link" th:href="${backUrl}">&larr; <th:block th:text="#{code.compare.back}"></th:block></a></div>
        <p class="commitInfo compare-range">
            <span class="compare-from"><strong class="compare-name" th:text="${fromName}"></strong> <code th:if="${!#strings.isEmpty(fromId)}" class="compare-id" th:text="${fromId}"></code></span>
            <span class="compare-arrow">&rarr;</span>
            <span class="compare-to"><strong class="compare-name" th:text="${toName}"></strong> <code th:if="${!#strings.isEmpty(toId)}" class="compare-id" th:text="${toId}"></code></span>
        </p>
        <div class="compare-summary" th:if="${stat != null and stat.files > 0}">
            <span class="summary-files" th:text="#{code.compare.files(${stat.files})}"></span>
            <span><b class="summary-added" th:text="'+' + ${stat.added}"></b> <b class="summary-deleted" th:text="'&minus;' + ${stat.deleted}"></b></span>
        </div>
        <div class="alert alert-warning" th:if="${#strings.isEmpty(patch)}" th:text="#{code.noChanges}"></div>
        <div class="diff-wrap" th:unless="${#strings.isEmpty(patch)}">
            <div id="commit" data-commit-origin="true" class="diff-body discommentable hide" th:text="${patch}"></div>
        </div>
    </div>

        </div><!--/* .shell-main */-->
    </div>
</div>
<script type="module" th:src="@{/assets/javascripts/esm/service/code.SvnDiff.js}"></script>
<script type="module" th:src="@{/assets/javascripts/esm/service/code.DiffTree.js}"></script>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        $yona.loadModule("code.SvnDiff", {
            "bCommentable"   : false,
            "sParentCommitId": /*[[${commitA}]]*/ "",
            "sCommitId"      : /*[[${commitB}]]*/ "",
            "sCodeURL"       : /*[[${filesUrl}]]*/ "",
            "sTplFileURL"    : /*[[${tplFileUrl}]]*/ "",
            "sTplRawURL"     : /*[[${tplRawUrl}]]*/ ""
        });
        // 변경 파일이 둘 이상이면 diff 왼쪽에 파일 트리를 보인다(추가 기능, A-571). diff를 그리는 모듈 뒤에 부른다
        $yona.loadModule("code.DiffTree", {"sContainer": ".diff-body"});
    });
</script>
</th:block>
</html>
