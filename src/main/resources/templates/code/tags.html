<!DOCTYPE html>
<!--/*
  Yona, 21st Century Project Hosting SW
  Copyright Yona & Yobi Authors & NAVER Corp.
  https://yona.io

  v1.6에 없는 추가 화면이다(로드맵 X-18, decisions.md D-30). 브랜치 화면(branches.html)을 바탕으로 한다.
  모델: title, projectView, filesTabUrl, commitsTabUrl, showActions, rows(TagRow 목록. 태그 시각이 최근인 순서)
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/project-layout :: projectLayout(${title}, ${projectView}, 'CODE', ~{::tagsPage})}">
<th:block th:fragment="tagsPage" th:with="project=${projectView.project}">
<th:block th:replace="~{project/menu :: projectMenu(${projectView}, 'CODE', 'main-menu-only')}"></th:block>
<div class="page-wrap-outer">
    <div class="project-page-wrap">
        <div class="bubble-wrap dark-gray repo-wrap">
            <div class="code-browse-wrap">
                <ul class="nav nav-tabs" style="margin-bottom:20px;">
                    <li><a th:href="${filesTabUrl}" th:text="#{code.files}"></a></li>
                    <li><a th:href="${commitsTabUrl}" th:text="#{code.commits}"></a></li>
                    <li><a th:href="@{/{owner}/{name}/branches(owner=${project.owner},name=${project.name})}" th:text="#{title.branches}"></a></li>
                    <li class="active"><a th:href="@{/{owner}/{name}/tags(owner=${project.owner},name=${project.name})}" th:text="#{title.tags}"></a></li>
                </ul>

                <table class="table tag-list-wrap">
                    <thead class="thead">
                        <tr>
                            <th th:text="#{title.tags}"></th>
                            <th th:text="#{code.branches.commit}"></th>
                            <th th:if="${showActions}"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${rows}">
                            <td class="tagName">
                                <!--/* 커밋이 아닌 대상을 가리키는 태그는 코드 화면이 열리지 않으므로(404) 링크 없이 이름만 보인다 */-->
                                <a th:if="${t.commitUrl != null}" class="tag-name" th:href="${t.codeUrl}" th:text="${t.shortName}"></a>
                                <span th:if="${t.commitUrl == null}" class="tag-name" th:text="${t.shortName}"></span>
                                <strong th:if="${t.annotated}" class="branch-label tag tag-type annotated ml10" th:text="#{code.tags.annotated}"></strong>
                                <strong th:unless="${t.annotated}" class="branch-label tag tag-type lightweight ml10" th:text="#{code.tags.lightweight}"></strong>
                                <div th:if="${t.shortMessage != null}" class="tag-message disabled" th:title="${t.message}" th:text="${t.shortMessage}"></div>
                                <div th:if="${t.tagger != null}" class="tagger disabled" th:text="${t.tagger}"></div>
                            </td>
                            <td class="commit">
                                <th:block th:if="${t.commitUrl != null}">
                                    <a th:href="${t.commitUrl}" class="commitId" th:title="${t.commitId}" th:text="${t.commitShortId}"></a>
                                    <span class="date" data-toggle="tooltip" data-placement="top" th:title="${t.dateTitle}" th:text="${t.date}"></span>
                                </th:block>
                                <span th:if="${t.commitUrl == null}" class="not-commit disabled" th:text="#{code.tags.notCommit}"></span>
                            </td>
                            <td class="actions" th:if="${showActions}">
                                <a th:if="${t.deleteUrl != null}" th:href="${t.deleteUrl}" class="ybtn ybtn-danger ybtn-small tag-delete" data-request-method="delete"
                                   th:attr="data-confirm=#{code.tags.deleteConfirm(${t.shortName})}" th:text="#{button.delete}"></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <p th:if="${#lists.isEmpty(rows)}" class="no-tags disabled" th:text="#{code.tags.empty}"></p>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    // 삭제 확인: 요청을 보내는 data-request-method 처리보다 먼저(캡처 단계) 확인하고, 취소하면 요청을 막는다
    document.addEventListener("click", function(event){
        var link = event.target.closest ? event.target.closest("a.tag-delete[data-confirm]") : null;
        if (link && !window.confirm(link.getAttribute("data-confirm"))) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }
    }, true);
</script>
</th:block>
</html>
