<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head th:replace="~{site/layout :: head(|${project.name} - 커밋 상세|)}">
</head>
<body class="theme-default">
<div id="main" class="main">
  <div th:replace="~{site/layout :: gnb}"></div>
  <div th:replace="~{project/header :: header(${project})}"></div>
  <div th:replace="~{project/menu :: menu(${project}, 'code')}"></div>

  <div class="page-wrap-outer">
    <div class="project-page-wrap">
      <div id="code-browse-wrap" class="code-browse-wrap">
        <!-- 브랜치 선택 드롭다운 (yona code/svnDiff.scala.html:37-50, common/branchItem.scala.html 대응 — 그룹2 #39) -->
        <div id="branches" class="btn-group branches pull-right" data-name="branch" data-activate="manual">
          <button class="btn dropdown-toggle large" type="button" data-toggle="dropdown">
            <span class="d-label" th:text="${#strings.isEmpty(selectedBranch)} ? 'HEAD' : ${selectedBranch}">HEAD</span>
            <span class="d-caret"><span class="caret"></span></span>
          </button>
          <ul class="dropdown-menu">
            <th:block th:each="branchName : ${branches}">
              <div th:replace="~{common/branchItem :: branchItem(${project}, ${branchName}, ${branchName == selectedBranch})}"></div>
            </th:block>
          </ul>
        </div>

        <ul class="nav nav-tabs" style="margin-bottom:20px;">
          <li>
            <a th:href="@{/{owner}/{name}/code(owner=${project.owner}, name=${project.name})}" th:text="#{code.files}">Files</a>
          </li>
          <li class="active">
            <a th:href="@{/{owner}/{name}/commits(owner=${project.owner}, name=${project.name})}" th:text="#{code.commits}">Commits</a>
          </li>
        </ul>

        <p class="commitInfo" style="background-color: #fafbfc; border: 1px solid #d1d5da; padding: 15px; border-radius: 3px;">
          <span class="avatar-wrap smaller">
            <img src="/images/default-avatar-128.png" width="32" height="32">
          </span>
          <strong th:text="${commit.authorName}">Author Name</strong>
          <span class="ago" th:title="${commit.authorDate != null ? templateHelper.getDateString(commit.authorDate.toInstant()) : ''}"
                th:text="${commit.authorDate != null ? templateHelper.agoOrDateString(commit.authorDate.toInstant()) : ''}">Date</span>
          <strong class="commitId pull-right" th:text="'@' + ${commit.id}">Commit ID</strong>
        </p>

        <pre class="commitMsg" style="margin-top: 10px; font-family: inherit; font-size: inherit; white-space: pre-wrap;" th:text="${commit.message}">Commit Message</pre>

        <div class="diff-wrap">
          <div id="commit" data-commit-origin="true" class="diff-body hide" th:text="${patch}">Patch Content</div>
        </div>

        <!-- SVN 커밋 댓글 (legacy code/svnDiff.scala.html:100-138 board-comment-wrap 대응. Git 쪽
             code/partial_nonrange_codecomment_thread.html과 동일한 컴포넌트 구성으로 통일한다:
             마크다운 렌더링, 아바타, 권한기반 삭제+확인모달, 첨부파일, markdownEditor+uploadForm
             폼(#24/#25/#26 그룹 프래그먼트 재사용) — TEMPLATE_BACKLOG 감사에서 발견된 격차(P3-56)
             복구. -->
        <div class="board-comment-wrap" style="margin-top: 30px;">
          <ul class="comments" th:if="${comments != null && !comments.isEmpty()}">
            <li th:each="comment : ${comments}" th:id="'comment-' + ${comment.id}" class="comment"
                th:with="commentAuthorUser=${comment.author?.loginId != null} ? ${@userRepository.findByLoginId(comment.author.loginId).orElse(null)} : null">
              <div class="comment-avatar">
                <a th:if="${comment.author?.loginId != null}" th:href="@{/user/{loginId}(loginId=${comment.author.loginId})}" class="avatar-wrap"
                   data-toggle="tooltip" data-placement="top" th:title="${comment.author.name}">
                  <img th:src="${commentAuthorUser != null ? commentAuthorUser.avatarUrl : '/images/default-avatar-32.png'}" width="32" height="32" th:alt="${comment.author?.loginId}">
                </a>
                <span th:unless="${comment.author?.loginId != null}" class="avatar-wrap">
                  <img src="/images/default-avatar-32.png" width="32" height="32">
                </span>
              </div>
              <div class="media-body">
                <div class="meta-info">
                  <span class="comment_author pull-left">
                    <a th:if="${comment.author?.loginId != null}" th:href="@{/user/{loginId}(loginId=${comment.author.loginId})}">
                      <strong th:text="${comment.author.loginId}">작성자</strong>
                    </a>
                  </span>
                  <span class="ago" th:title="${templateHelper.getDateString(comment.createdDate)}" th:text="${templateHelper.agoOrDateString(comment.createdDate)}">방금 전</span>
                  <span class="edit pull-right" th:if="${@accessControl.isAllowed(currentUser, project, comment, T(com.github.yonaprojects.yona.domain.enumeration.Operation).DELETE)}">
                    <button class="btn-transparent pull-right close" data-toggle="comment-delete"
                            th:data-request-uri="@{/comments/COMMIT_COMMENT/{id}(id=${comment.id})}"><i class="yobicon-trash"></i></button>
                  </span>
                </div>
                <div class="comment-body markdown-wrap" th:utext="${markdownService.render(comment.contents, true, project)}">댓글 내용</div>
                <div class="attachments" th:data-attachments="${commentAttachmentsJsonByCommentId != null ? commentAttachmentsJsonByCommentId.get(comment.id) : '{}'}"></div>
              </div>
            </li>
          </ul>

          <!-- SVN 커밋 댓글 작성 폼: Git 쪽 code/diff.html(범위 없는 커밋 댓글)과 동일하게
               markdownEditor(에디터+멘션)/uploadForm(첨부) 프래그먼트를 재사용한다. -->
          <div class="write-comment-form" th:if="${currentUser != null}">
            <form th:action="@{/{owner}/{projectName}/commit/{commitId}/comments(owner=${project.owner}, projectName=${project.name}, commitId=${commit.id})}" method="post" enctype="multipart/form-data">
              <div class="write-comment-box">
                <div th:replace="~{site/layout :: markdownEditor('contents', '', 'comment-body')}"></div>

                <div th:replace="~{common/uploadForm :: uploadForm('COMMIT_COMMENT', null, 'upload')}"></div>

                <div class="write-comment-wrap">
                  <div class="right-txt">
                    <button type="submit" class="ybtn ybtn-success" th:text="#{button.comment.new}">댓글 등록</button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div th:replace="~{common/commentDeleteModal :: commentDeleteModal('.board-comment-wrap')}"></div>

        <button th:if="${currentUser != null}" id="watch-button" type="button" class="ybtn" th:classappend="${isWatching} ? 'active' : ''"
                data-toggle="button" th:text="#{notification.watch}">지켜보기</button>
        <a th:href="@{/{owner}/{name}/commits/{branch}/{path}(owner=${project.owner}, name=${project.name}, branch=${selectedBranch}, path=${path})}" class="ybtn pull-right" th:text="#{button.list}">목록</a>

      </div>
    </div>
  </div>

  <footer th:replace="~{site/layout :: footer}"></footer>
</div>

<div th:replace="~{site/layout :: scripts}"></div>
<script type="text/javascript" src="/javascripts/lib/diff.js"></script>
<script type="text/javascript" th:inline="javascript">
    $(document).ready(function(){
        /*[<![CDATA[*/
        var parentCommitId = /*[[${parentCommit != null ? parentCommit.id : ''}]]*/ '';
        var commitId = /*[[${commit.id}]]*/ '';
        var codeUrl = /*[[@{/{owner}/{name}/code(owner=${project.owner}, name=${project.name})}]]*/ '';
        // yona commit.asResource(project) 대응 — WatchController 범용 /watch,/unwatch 엔드포인트가
        // 기대하는 resource.type=COMMIT + resource.id="{project.id}:{commitId}" 합성 키.
        var sWatchUrl = /*[[${'/watch?resource.type=COMMIT&resource.id=' + commitResourceId}]]*/ '';
        var sUnwatchUrl = /*[[${'/unwatch?resource.type=COMMIT&resource.id=' + commitResourceId}]]*/ '';
        /*]]>*/

        if (typeof $yobi !== 'undefined' && $yobi.loadModule) {
            $yobi.loadModule("code.SvnDiff", {
                "bCommentable"   : /*[[${currentUser != null}]]*/ false,
                "sWatchUrl"      : sWatchUrl,
                "sUnwatchUrl"    : sUnwatchUrl,
                "sParentCommitId": parentCommitId,
                "sCommitId"      : commitId,
                "sCodeURL"       : codeUrl
            });
        }
        // 댓글 삭제는 이제 common/commentDeleteModal 프래그먼트(data-toggle="comment-delete" +
        // data-request-uri 위임)가 처리한다 — 다른 댓글 화면들과 동일한 삭제 UX로 통일(P3-56).
    });
</script>
</body>
</html>
