  매개변수: thread(ThreadView). 스레드 하나를 그린다. diff 화면이 `DiffHtmlRenderer`를 거쳐 줄 사이에 끼워 넣는다.
*/-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="thread(thread)">
<div th:id="'thread-' + ${thread.id}" th:class="'comment-thread-wrap ' + ${thread.state} + (${thread.fold} ? ' fold' : '') + (${thread.pending} ? ' thread-pending' : '')"
     th:attr="data-state=${thread.state}, data-toggle=${thread.range != null} ? 'CodeCommentThread', data-range-path=${thread.range?.get('path')},
              data-range-startSide=${thread.range?.get('startSide')}, data-range-startLine=${thread.range?.get('startLine')}, data-range-startColumn=${thread.range?.get('startColumn')},
              data-range-endSide=${thread.range?.get('endSide')}, data-range-endLine=${thread.range?.get('endLine')}, data-range-endColumn=${thread.range?.get('endColumn')}">
    <div class="btn-thread-here btn-thread-minimize">
        <button type="button" class="ybtn ybtn-default ybtn-small"><i class="yobicon-post2"></i></button>
    </div>

    <div class="thread-header">
        <span th:class="'badge rounded-pill state ' + ${thread.state}" th:text="#{'issue.state.' + ${thread.state}}"></span>
        <span th:if="${thread.pending}" class="badge bg-warning pending-badge" th:text="#{pullRequest.review.pending.badge}"></span>
        <button type="button" class="ybtn ybtn-default ybtn-small btn-thread-minimize"><i class="yobicon-maximize"></i></button>
    </div>

    <ul class="comments">
        <li th:each="c : ${thread.comments}" th:id="'comment-' + ${c.id}" th:class="'comment' + (${c.pending} ? ' comment-pending' : '')">
            <div class="comment-avatar">
                <a th:href="${c.userHref}" class="avatar-wrap" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${c.name}">
                    <img th:src="${c.avatarUrl}" width="32" height="32" th:alt="${c.loginId}">
                </a>
            </div>
            <div class="media-body">
                <div class="meta-info">
                    <span class="comment_author float-start">
                        <a th:href="${c.userHref}" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${c.name}"><strong th:text="${c.loginId} + ' '"></strong></a>
                    </span>
                    <span class="ago"><a th:href="'#comment-' + ${c.id}" th:title="${c.agoTitle}" th:text="${c.ago}"></a></span>
                    <span th:if="${c.edited}" class="comment-edited ago" th:text="'(' + #{reviewComment.edited} + ')'"></span>
                    <span th:if="${c.pending and !thread.pending}" class="badge bg-warning pending-badge" th:text="#{pullRequest.review.pending.badge}"></span>
                    <!--/* 댓글 고치기(GitHub 기준, D-38 7번): 작성자와 수정 권한자에게만 보인다. 원문은 숨긴 입력란에 있고 yona.review.CommentEdit.js가 그 자리에서 고친다 */-->
                    <span class="edit float-end" th:if="${c.editUrl != null}">
                        <button type="button" class="btn-transparent float-end btn-icon-close comment-edit" th:attr="data-url=${c.editUrl}" th:title="#{common.comment.edit}"><i class="yobicon-edit"></i></button>
                    </span>
                    <span class="edit float-end" th:if="${c.deleteUrl != null and !c.pending}">
                        <button class="btn-transparent float-end btn-icon-close" data-toggle="comment-delete" th:attr="data-request-uri=${c.deleteUrl}" th:title="#{common.comment.delete}"><i class="yobicon-trash"></i></button>
                    </span>
                    <!--/* 임시 댓글은 본인만 지우며 POST로 보낸다(공개 댓글의 삭제 경로는 숨겨진 행을 찾지 못한다) */-->
                    <span class="edit float-end" th:if="${c.deleteUrl != null and c.pending}">
                        <button type="button" class="btn-transparent float-end btn-icon-close" data-request-method="post" th:attr="data-request-uri=${c.deleteUrl}" th:title="#{pullRequest.review.pending.delete}"><i class="yobicon-trash"></i></button>
                    </span>
                </div>
                <div class="comment-body markdown-wrap" th:attr="data-via-email=${c.viaEmail}" th:utext="${c.bodyHtml}"></div>
                <textarea th:if="${c.editUrl != null}" class="comment-raw" style="display:none;" th:text="${c.rawContents}"></textarea>
                <div class="attachments" th:attr="data-attachments=${c.attachments}"></div>
            </div>
        </li>
    </ul>

    <th:block th:replace="~{::replyArea(${thread})}"></th:block>
</div>
</th:block>

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="nonRanged(thread)">
<div th:id="'thread-' + ${thread.id}" th:class="'comment-thread-wrap ' + ${thread.state}">
    <div class="btn-thread-here btn-thread-minimize">
        <button type="button" class="ybtn ybtn-default ybtn-small"><i class="yobicon-comments"></i></button>
    </div>
    <ul class="comments">
        <li th:each="c : ${thread.comments}" th:id="'comment-' + ${c.id}" class="comment">
            <div class="comment-avatar">
                <a th:href="${c.userHref}" class="avatar-wrap" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${c.name}">
                    <img th:src="${c.avatarUrl}" width="32" height="32" th:alt="${c.loginId}">
                </a>
            </div>
            <div class="media-body">
                <div class="meta-info">
                    <span class="comment_author float-start">
                        <a th:href="${c.userHref}" data-bs-toggle="tooltip" data-bs-placement="top" th:title="${c.name}"><strong th:text="${c.loginId} + ' '"></strong></a>
                    </span>
                    <span class="ago"><a th:href="'#comment-' + ${c.id}" th:title="${c.agoTitle}" th:text="${c.ago}"></a></span>
                    <span class="edit float-end" th:if="${c.deleteUrl != null}">
                        <button class="btn-transparent float-end btn-icon-close" data-request-method="delete" th:attr="data-request-uri=${c.deleteUrl}"><i class="yobicon-trash"></i></button>
                    </span>
                </div>
                <div class="comment-body markdown-wrap" th:attr="data-via-email=${c.viaEmail}" th:utext="${c.bodyHtml}"></div>
                <div class="attachments" th:attr="data-attachments=${c.attachments}"></div>
            </div>
        </li>
    </ul>
    <th:block th:replace="~{::replyArea(${thread})}"></th:block>
</div>
</th:block>

<!--/* 스레드 아래의 답글 입력 영역이다. 댓글을 만들 수 없으면 상태 바꾸기 단추만 남는다 (v1.6 partial_comment_form_on_thread). */-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="replyArea(thread)">
    <th:block th:if="${thread.form != null}" th:with="f=${thread.form}">
    <div class="write-comment-form">
        <form th:action="${f.action}" method="post" enctype="multipart/form-data" class="review-form" style="display:block;">
            <input type="hidden" name="thread.id" th:value="${f.threadId}">
            <div class="author-info-wrap float-start hide-in-mobile">
                <div class="author-info">
                    <a th:href="${f.userHref}" class="avatar-wrap medium" th:title="${f.userName}" data-bs-toggle="tooltip" data-bs-placement="top"><img th:src="${f.avatarUrl}" width="32" height="32"></a>
                </div>
            </div>
            <div class="write-comment-box">
                <div class="write-comment-wrap">
                    <th:block th:replace="~{common/editor :: editor('contents', '', 'style=height:100px', 'code-review-body', false)}"></th:block>
                    <th:block th:if="${!f.anonymous}">
                        <th:block th:replace="~{common/upload-form :: uploadForm(${f.resourceType}, null, null)}"></th:block>
                    </th:block>
                    <div class="right-txt">
                        <button th:if="${thread.stateUrl != null}" type="button" data-request-method="post" th:attr="data-request-uri=${thread.stateUrl}" class="ybtn ybtn-default ybtn-small"
                                th:text="${thread.state == 'open'} ? #{commentThread.close} : #{commentThread.open}"></button>
                        <button th:if="${f.pendingButton}" type="submit" name="pending" value="true" class="ybtn ybtn-default ybtn-small" th:text="#{pullRequest.review.pending.add}"></button>
                        <button type="submit" class="ybtn ybtn-success ybtn-small" th:text="${f.pendingButton} ? #{pullRequest.review.pending.single} : #{button.comment.new}"></button>
                    </div>
                </div>
            </div>
        </form>
    </div>
    </th:block>
    <p class="thread-actrow" th:if="${thread.form == null}">
        <button th:if="${thread.stateUrl != null}" type="button" data-request-method="post" th:attr="data-request-uri=${thread.stateUrl}" class="ybtn ybtn-default ybtn-small"
                th:text="${thread.state == 'open'} ? #{commentThread.close} : #{commentThread.open}"></button>
    </p>
</th:block>
