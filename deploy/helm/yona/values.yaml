# Yona 차트 값(X-66). 서버는 한 개만 띄운다: 데이터 폴더(저장소, 첨부, 비밀 키, SSH 호스트 키)가 하나이고 내장 검색이 단일 노드 전용이다.
# 업데이트 때는 기존 파드를 내린 뒤 새 파드를 올리므로 시작하는 동안 서비스가 잠깐 끊긴다(받아들이기로 한 결정).

image:
  repository: ghcr.io/yona-projects/yona
  # 비우면 차트의 appVersion을 쓴다.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# 데이터베이스는 차트가 운영하지 않는다(외부 DB가 기본). H2는 개발과 시험용이다.
database:
  # postgresql(권장), mariadb, mssql, cubrid, h2
  type: postgresql
  # 필수(h2가 아니면): 예) jdbc:postgresql://db.example.com:5432/yona
  url: ""
  username: yona
  # 비밀번호가 든 Secret(권장). passwordKey는 Secret 안의 키 이름이다. 비우고 password를 주면 차트가 Secret을 만든다(시험용).
  existingSecret: ""
  passwordKey: password
  password: ""

yona:
  hostname: ""
  # http 또는 https
  scheme: http
  # HTTPS 프록시(인그레스) 뒤에서 운영하면 true: 접속자 주소를 프록시 헤더로 구분한다.
  behindHttpsProxy: false
  # 추가 설정(스프링의 환경 변수 규칙). 예) { YONA_SMTP_MOCK: "true" }
  extraEnv: {}
  timezone: UTC

# 내장 SSH 서버(Apache MINA). 시스템 sshd 연동은 컨테이너에서 쓰지 않는다.
ssh:
  enabled: false
  port: 2222
  # 포트 전달 뒤라서 바깥 포트가 다르면 복제 주소에 보일 포트(0이면 사용 안 함)
  publicPort: 0

service:
  type: ClusterIP
  port: 80
  ssh:
    type: ClusterIP
    port: 2222

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: yona.example.com
      path: /
  tls: []

persistence:
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  # 이미 만든 PVC를 쓰려면 이름을 준다(이때는 volumeClaimTemplates를 만들지 않는다).
  existingClaim: ""

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

# 힙은 컨테이너 메모리 한도의 비율이다.
javaMaxRamPercentage: 75

# 비루트로 돌고 루트 파일 시스템은 읽기 전용이다. 쓰는 곳은 데이터 볼륨과 /tmp뿐이다.
# fsGroup이 맞지 않으면 시작할 때 로그 폴더를 만들지 못한다.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
