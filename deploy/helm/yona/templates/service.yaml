apiVersion: v1
kind: Service
metadata:
  name: {{ include "yona.fullname" . }}
  labels:
    {{- include "yona.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "yona.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.ssh.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yona.fullname" . }}-ssh
  labels:
    {{- include "yona.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.ssh.type }}
  selector:
    {{- include "yona.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.service.ssh.port }}
      targetPort: ssh
{{- end }}
