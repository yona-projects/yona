{{- if and (ne .Values.database.type "h2") (not .Values.database.existingSecret) .Values.database.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yona.fullname" . }}-db
  labels:
    {{- include "yona.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.passwordKey }}: {{ .Values.database.password | quote }}
{{- end }}
