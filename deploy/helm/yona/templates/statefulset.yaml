# 복제본은 1개로 고정한다(데이터 폴더가 하나이고 내장 검색이 단일 노드 전용이다). 두 서버가 같은 데이터 폴더에 쓰면 안 된다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "yona.fullname" . }}
  labels:
    {{- include "yona.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "yona.fullname" . }}
  selector:
    matchLabels:
      {{- include "yona.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yona.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: yona
          image: {{ include "yona.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: YONA_DATA_DIR
              value: /data
            - name: SPRING_DATASOURCE_URL
              value: {{ include "yona.databaseUrl" . | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ if eq .Values.database.type "h2" }}"sa"{{ else }}{{ .Values.database.username | quote }}{{ end }}
            {{- if ne .Values.database.type "h2" }}
            # 비밀번호는 Secret의 파일을 스프링의 configtree로 읽는다(환경 변수에 두지 않는다).
            - name: SPRING_CONFIG_IMPORT
              value: optional:configtree:/run/secrets/
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ printf "-XX:MaxRAMPercentage=%v" .Values.javaMaxRamPercentage | quote }}
            - name: TZ
              value: {{ .Values.yona.timezone | quote }}
            {{- if .Values.yona.hostname }}
            - name: YONA_HOSTNAME
              value: {{ .Values.yona.hostname | quote }}
            {{- end }}
            - name: YONA_SCHEME
              value: {{ .Values.yona.scheme | quote }}
            {{- if .Values.yona.behindHttpsProxy }}
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            {{- end }}
            {{- if .Values.ssh.enabled }}
            - name: YONA_SSH_MINA_ENABLED
              value: "true"
            - name: YONA_SSH_MINA_PORT
              value: {{ .Values.ssh.port | quote }}
            {{- if .Values.ssh.publicPort }}
            - name: YONA_SSH_PUBLIC_PORT
              value: {{ .Values.ssh.publicPort | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.yona.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.ssh.enabled }}
            - name: ssh
              containerPort: {{ .Values.ssh.port }}
            {{- end }}
          # 첫 시작은 스키마를 만드느라 오래 걸릴 수 있어 시작 프로브를 넉넉히 둔다(5초 x 60 = 5분).
          startupProbe:
            httpGet: { path: /-_-actuator/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /-_-actuator/health/liveness, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          # readiness는 DB와 데이터 디렉터리만 본다(메일이나 LDAP이 죽었다고 트래픽에서 빼지 않는다).
          readinessProbe:
            httpGet: { path: /-_-actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if ne .Values.database.type "h2" }}
            - name: db-secret
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
      volumes:
        # 읽기 전용 루트에서 Tomcat이 /tmp에 작업 폴더를 만든다.
        - name: tmp
          emptyDir: {}
        {{- if ne .Values.database.type "h2" }}
        - name: db-secret
          secret:
            secretName: {{ include "yona.dbSecretName" . }}
            items:
              - key: {{ .Values.database.passwordKey }}
                path: spring.datasource.password
        {{- end }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if not .Values.persistence.existingClaim }}
  # helm uninstall로 지워지지 않는다(StatefulSet의 볼륨은 직접 지울 때까지 남는다).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.accessMode | quote }}]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
