# Yona v2 운영용 docker compose(X-65): Yona와 데이터베이스를 한 번에 띄운다. 저장소 루트의 docker-compose.yml은 개발용이다.
# 사용법: env/<postgres|mariadb|h2>.env를 .env로 복사해 값을 정하고, secrets/ 아래 비밀번호 파일을 만든 뒤 `docker compose up -d`.
#         podman은 `podman compose up -d`(같은 파일을 쓴다. 호환은 확인하지 못했다).
# 비밀번호는 파일로 전달한다(환경 변수나 명령줄에 남기지 않는다). Yona는 스프링의 configtree로 /run/secrets/의 파일을 설정 값으로 읽는다.
name: yona

services:
  yona:
    # latest 태그는 쓰지 않는다(운영에서 우연히 올라가는 것을 막는다). YONA_VERSION을 .env에 적는다.
    image: "${YONA_IMAGE:-ghcr.io/yona-projects/yona}:${YONA_VERSION:?.env에 YONA_VERSION을 적으세요 (예 2.0.0)}"
    restart: unless-stopped
    environment:
      YONA_DATA_DIR: /data
      SPRING_DATASOURCE_URL: "${YONA_DB_URL:?.env에 YONA_DB_URL을 적으세요}"
      SPRING_DATASOURCE_USERNAME: ${YONA_DB_USER:-yona}
      # /run/secrets 아래 파일 이름이 설정 키가 된다(spring.datasource.password 파일의 내용이 비밀번호)
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      TZ: ${TZ:-UTC}
      YONA_HOSTNAME: ${YONA_HOSTNAME:-}
      YONA_SCHEME: ${YONA_SCHEME:-http}
      SERVER_FORWARD_HEADERS_STRATEGY: ${YONA_FORWARD_HEADERS:-none}
    secrets:
      - source: db_password
        target: spring.datasource.password
    ports:
      - "${YONA_HTTP_PORT:-8080}:8080"
    volumes:
      - yona-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mariadb:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/-_-actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${YONA_DB_NAME:-yona}
      POSTGRES_USER: ${YONA_DB_USER:-yona}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - yona-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${YONA_DB_USER:-yona} -d ${YONA_DB_NAME:-yona}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb:
    profiles: ["mariadb"]
    image: mariadb:12.3.3
    restart: unless-stopped
    # 데이터베이스를 utf8mb4_bin으로 만든다(v1.6과 같은 정렬 규칙).
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    environment:
      MARIADB_DATABASE: ${YONA_DB_NAME:-yona}
      MARIADB_USER: ${YONA_DB_USER:-yona}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_password
      - db_admin_password
    volumes:
      - yona-maria-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

secrets:
  db_password:
    file: ./secrets/db_password
  db_admin_password:
    file: ./secrets/db_admin_password

volumes:
  yona-data:
  yona-pg-data:
  yona-maria-data:
