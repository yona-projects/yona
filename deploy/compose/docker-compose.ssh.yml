# 내장 SSH 서버(MINA)를 켜는 덧붙임 파일: docker compose -f docker-compose.yml -f docker-compose.ssh.yml up -d
# 시스템 sshd 연동은 컨테이너에서 쓰지 않는다. 호스트의 22번을 내장 서버로 보내려면 YONA_SSH_PORT=22와 YONA_SSH_PUBLIC_PORT=22를 준다(22번은 root 권한이 필요할 수 있다).
services:
  yona:
    environment:
      YONA_SSH_MINA_ENABLED: "true"
      YONA_SSH_MINA_PORT: "2222"
      YONA_SSH_PUBLIC_PORT: ${YONA_SSH_PUBLIC_PORT:-0}
    ports:
      - "${YONA_SSH_PORT:-2222}:2222"
