name: CI

on:
  push:
    branches: [next, next2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build shared application and test classes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/next' && github.ref != 'refs/heads/next2' }}
      - name: Build application and test classes
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process bootJar testClasses
      - name: Upload shared build outputs
        uses: actions/upload-artifact@v7
        with:
          name: shared-build
          path: build/
          if-no-files-found: error
  unit:
    name: Kotest / suite
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/next' && github.ref != 'refs/heads/next2' }}
      - name: Download shared build outputs
        uses: actions/download-artifact@v7
        with:
          name: shared-build
          path: build/
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y git gnupg mercurial subversion openssh-client python3
      - name: Run existing Kotest suite
        run: |
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process test \
            -x classes -x testClasses -x compileKotlin -x compileJava -x processResources -x jar \
            -x compileTestKotlin -x compileTestJava -x processTestResources \
            -Dyona.it.db=h2
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/

  database:
    name: Database / ${{ matrix.db }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 시험용 DB 선택지(TestDatabase)는 h2, postgres, mariadb, mssql, cubrid이다. mysql은 아직 시험 DB가 없다
        db: [mariadb, postgres, mssql, cubrid]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/next' && github.ref != 'refs/heads/next2' }}
      - name: Download shared build outputs
        uses: actions/download-artifact@v7
        with:
          name: shared-build
          path: build/
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y git gnupg mercurial subversion openssh-client python3
      - name: Run existing tests against database
        run: |
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process test \
            -x classes -x testClasses -x compileKotlin -x compileJava -x processResources -x jar \
            -x compileTestKotlin -x compileTestJava -x processTestResources \
            -Dyona.it.db=${{ matrix.db }}
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-${{ matrix.db }}-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/

  boot:
    name: Application boot / H2
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download shared build outputs
        uses: actions/download-artifact@v7
        with:
          name: shared-build
          path: build/
      - name: Locate shared application JAR
        run: |
          jar=$(find build/libs -maxdepth 1 -name 'yona-*.jar' ! -name '*-plain.jar' -print -quit)
          test -n "$jar"
          echo "YONA_JAR=$jar" >> "$GITHUB_ENV"
      - name: Start the application on in-memory H2
        run: |
          mkdir -p build/boot/data
          java -Xmx2048m -jar "$YONA_JAR" \
            --yona.data-dir=./build/boot/data \
            --yona.send-yona-usage=false \
            --logging.file.name=./build/boot/application.log \
            > build/boot/stdout.log 2>&1 &
          echo $! > build/boot/app.pid
      - name: Wait until the health check is UP
        run: |
          for _ in $(seq 1 300); do
            if curl --fail --silent http://127.0.0.1:8080/-_-actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 1
          done
          cat build/boot/stdout.log
          exit 1
      - name: Check that the login page renders
        run: curl --fail --silent --output /dev/null http://127.0.0.1:8080/users/loginform
      - name: Stop the application
        if: always()
        run: |
          if [ -f build/boot/app.pid ]; then
            kill "$(cat build/boot/app.pid)" || true
          fi
      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs
          path: |
            build/boot/stdout.log
            build/boot/application.log
