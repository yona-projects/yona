name: Kotlin full compilation comparison

on:
  push:
    branches: [perf/kotlin-compilation]
    paths:
      - build.gradle.kts
      - scripts/perf/kotlin-compile/**
      - .github/workflows/kotlin-compile-performance.yml
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit with the same dependency and toolchain versions
        required: true
        default: 96aeaba398f070d1b3b588b021c47262aef55826
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: /tmp/yona-kotlin-compile-gradle
      PERF_RESULTS: /tmp/yona-kotlin-compile-results
      BASELINE_REF: ${{ inputs.baseline || '96aeaba398f070d1b3b588b021c47262aef55826' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Record runner environment
        run: |
          mkdir -p "$PERF_RESULTS"
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          record = {'platform': platform.platform(), 'cpu_count': os.cpu_count()}
          for name, command in [('cpu', ['lscpu']), ('memory', ['free', '-b']), ('jdk', ['java', '-version'])]:
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              record[name] = result.stdout
          for name in ['cpu.max', 'memory.max']:
              path = Path('/sys/fs/cgroup') / name
              record[name] = path.read_text() if path.exists() else None
          (Path(os.environ['PERF_RESULTS']) / 'environment.json').write_text(json.dumps(record, indent=2))
          PY
      - name: Prepare dependencies and measure five alternating pairs
        run: |
          python3 scripts/perf/kotlin-compile/compare.py \
            --repo "$GITHUB_WORKSPACE" --baseline "$BASELINE_REF" --candidate "$GITHUB_SHA" \
            --gradle-user-home "$GRADLE_USER_HOME" --results "$PERF_RESULTS" \
            --java-home "$JAVA_HOME" --pairs 5
      - name: Upload all measurements including unsuccessful runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-full-compilation
          path: ${{ env.PERF_RESULTS }}/
          if-no-files-found: error
