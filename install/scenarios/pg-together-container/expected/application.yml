# Yona 설정: 설치 스크립트가 만들었다. 비밀 값은 secrets.properties에 있다.
spring:
  config:
    import: 'optional:file:/opt/yona/conf/secrets.properties'
  datasource:
    url: 'jdbc:postgresql://127.0.0.1:5432/yona'
    username: 'yona'
  mail:
    host: 'smtp.example.com'
    port: 587
    username: 'bot'
    properties:
      mail.smtp.ssl.enable: false
server:
  port: 8080
  forward-headers-strategy: framework
yona:
  data-dir: '/var/lib/yona'
  hostname: 'git.example.com'
  scheme: 'https'
  smtp:
    user: 'yona'
    domain: 'example.com'
    mock: false
  ssh:
    mina:
      enabled: true
      port: 2222
    public-port: 22
