# Yona 설정: 설치 스크립트가 만들었다. 비밀 값은 secrets.properties에 있다.
spring:
  config:
    import: 'optional:file:/opt/yona/conf/secrets.properties'
  datasource:
    url: 'jdbc:mariadb://db.internal:3306/yona'
    username: 'yona'
  mail:
    host: 'smtp.example.com'
    port: 25
    properties:
      mail.smtp.ssl.enable: true
server:
  port: 8080
yona:
  data-dir: '/var/lib/yona'
  smtp:
    mock: true
