            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              refId: "B"
              settings:
                mode: "dropNN"
              datasource:
                type: "__expr__"
                uid: "__expr__"
          - refId: "C"
