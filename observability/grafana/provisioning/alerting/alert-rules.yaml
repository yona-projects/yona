      - uid: "yona-job-stalled-notification-mail"
        title: "알림 메일 스케줄러 작업이 멈춤"
        condition: "C"
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        annotations:
          summary: "알림 메일 스케줄러(notification_mail)의 마지막 성공이 3600초를 넘었다. 작업이 조용히 멈췄다."
        labels:
          severity: "warning"
          app: "yona"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              expr: "time() - yona_job_last_success_seconds{job=\"yona\",task=\"notification_mail\"} and yona_job_last_success_seconds{job=\"yona\",task=\"notification_mail\"} > 0"
              instant: true
              refId: "A"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              type: "reduce"
              expression: "A"
              reducer: "last"
              refId: "B"
