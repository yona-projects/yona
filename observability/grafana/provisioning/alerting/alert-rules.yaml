              datasource:
                type: "__expr__"
                uid: "__expr__"
      - uid: "yona-job-stalled-notification-cleanup"
        title: "알림 정리 작업이 멈춤"
        condition: "C"
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        annotations:
          summary: "알림 정리(notification_cleanup)의 마지막 성공이 172800초를 넘었다. 작업이 조용히 멈췄다."
        labels:
